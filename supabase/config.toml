# Configuración de las funciones del servidor.
# ═══════════════════════════════════════════════════════════════════════════
#
# Este archivo existe por una razón concreta, y conviene entenderla antes de
# tocarlo: `verify_jwt`.
#
# Cuando se sube una función desde el panel de Supabase, esa casilla se marca
# a mano y se queda como se dejó. Cuando se sube con la CLI, la CLI decide — y
# si no se le dice nada, la pone en `true` para todas.
#
# Para `cem-whatsapp` eso la rompe en silencio. WhatsApp no manda sesiones de
# Supabase: manda un webhook de Meta. Con `verify_jwt = true`, Meta recibe un
# 401, el webhook deja de llegar, y no hay ningún error visible en ningún
# sitio — simplemente el bot no contesta por WhatsApp y nadie sabe por qué.
#
# Escribirlo aquí es lo que impide que un despliegue automático deshaga a
# ciegas una casilla que alguien marcó a conciencia.

project_id = "vajbsfgojtunamhrzrpf"

[functions.cem-asistente]
# Habla con quien ya entró a la plataforma: siempre trae su sesión.
verify_jwt = true

[functions.cem-whatsapp]
# El webhook de Meta. No trae sesión y no puede traerla: quien lo llama es
# WhatsApp, no una persona con cuenta. Lo que sí comprueba la función es el
# `hub.verify_token` que Meta y nosotros compartimos, y que quien escribe es
# un número — y a partir de ahí manda la base de datos, no esta casilla.
verify_jwt = false

[functions.cem-comprar]
# Comprar sin tener cuenta. Va abierta A PROPÓSITO: quien la llama es alguien
# que acaba de ver un programa en la web y todavía no es nadie en la
# plataforma. Exigirle sesión aquí sería volver a poner justo la puerta que
# esta función existe para quitar.
#
# Lo que la protege no es una casilla, es lo que NO hace: no crea cuentas, no
# inscribe a nadie y no se cree el precio que le manden. Sólo guarda una
# intención de compra y abre el cobro con el importe que calcula la base. Todo
# lo demás pasa después, en el webhook, y sólo si el dinero entró.
verify_jwt = false

[functions.cem-stripe-webhook]
# Quien llama es Stripe, que no tiene sesión de Supabase. Su seguridad es la
# firma que trae cada aviso, comprobada dentro de la función contra el secreto
# del webhook. Poner esto en `true` haría que Stripe recibiera un 401 y los
# pagos dejaran de abrir cursos, en silencio.
verify_jwt = false

[functions.cem-stripe-checkout]
# El cobro de una cuota de alguien que YA es alumno. Esta sí trae sesión: se
# llama desde el aula, con la persona dentro.
verify_jwt = true
