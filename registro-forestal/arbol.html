<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de árbol · Registro Forestal Beta</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
  :root{ --primary:#003629; --primary-container:#1b4d3e; --border:#c0c9c3; --muted:#404945; --bg:#f8f9fa; --verde:#15803d; --verde-bg:#dcfce7; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Public Sans',sans-serif;background:var(--bg);color:#191c1d;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;}
  .material-symbols-outlined{vertical-align:middle;}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;max-width:480px;width:100%;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.06);}
  header{background:var(--primary-container);color:#fff;padding:22px;text-align:center;}
  header .material-symbols-outlined{font-size:28px;}
  header h1{font-size:17px;margin:8px 0 2px;}
  header p{margin:0;font-size:12.5px;opacity:.85;}
  .badge-ok{display:inline-flex;align-items:center;gap:6px;background:var(--verde-bg);color:var(--verde);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;margin:14px 20px 0;}
  .content{padding:18px 22px 24px;}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .row:last-child{border-bottom:none;}
  .row span:first-child{color:var(--muted);}
  .codigo{font-size:26px;font-weight:700;color:var(--primary);margin:0 0 4px;}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;}
  .photos img{width:100%;height:110px;object-fit:cover;border-radius:8px;}
  footer{padding:12px 22px;background:#f3f4f5;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);text-align:center;}
  .err{padding:24px;text-align:center;color:#b91c1c;}
</style>
</head>
<body>
<div class="card" id="card">
  <header>
    <span class="material-symbols-outlined" style="font-size:32px;">forest</span>
    <h1>Registro Forestal Beta</h1>
    <p>Ficha digital de espécimen</p>
  </header>
  <div id="cardBody"><div class="content"><p class="hint">Cargando…</p></div></div>
  <footer>Esta es una ficha digital del programa piloto Registro Forestal Beta — Parque del Este.</footer>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://vajbsfgojtunamhrzrpf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Xljd7Ep1GxBXSPp5F4A1hg_Qg-iESzl';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function main(){
  const codigo = new URLSearchParams(location.search).get('codigo');
  const body = document.getElementById('cardBody');
  if(!codigo){ body.innerHTML = '<div class="err">Falta el código del árbol en el enlace.</div>'; return; }
  const { data, error } = await supabase.rpc('forest_get_arbol_publico', { p_codigo: codigo });
  if(error || !data || !data.codigo_visible){
    body.innerHTML = '<div class="err">No existe un árbol aprobado con ese código, o el enlace es incorrecto.</div>';
    return;
  }
  const fotos = (data.fotos || []);
  let fotosHtml = '';
  if(fotos.length){
    const urls = await Promise.all(fotos.map(async (path) => {
      const { data: signed } = await supabase.storage.from('forest-photos').createSignedUrl(path, 3600);
      return signed?.signedUrl;
    }));
    fotosHtml = `<div class="photos">${urls.filter(Boolean).map(u => `<img src="${u}" alt="Foto del árbol">`).join('')}</div>`;
  }
  body.innerHTML = `
    <div class="badge-ok"><span class="material-symbols-outlined" style="font-size:16px;">check_circle</span>Aprobado — registro oficial del piloto</div>
    <div class="content">
      <p class="codigo">${escapeHtml(data.codigo_visible)}</p>
      ${fotosHtml}
      <div class="row"><span>Especie</span><b>${escapeHtml(data.especie || 'No identificada')}</b></div>
      ${data.nombre_cientifico ? `<div class="row"><span>Nombre científico</span><b><i>${escapeHtml(data.nombre_cientifico)}</i></b></div>` : ''}
      <div class="row"><span>Altura estimada</span><b>${data.altura_m ?? '—'} m</b></div>
      <div class="row"><span>DAP</span><b>${data.dap_cm ?? '—'} cm</b></div>
      <div class="row"><span>Condición</span><b>${escapeHtml(data.condicion || '—')}</b></div>
      <div class="row"><span>Ubicación aproximada</span><b>${data.lat_aprox}, ${data.lng_aprox}</b></div>
      <div class="row"><span>Fecha de registro</span><b>${new Date(data.creado).toLocaleDateString('es-ES')}</b></div>
    </div>
  `;
}
main();
</script>
</body>
</html>
