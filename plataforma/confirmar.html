<!doctype html>
<html lang="es" data-publico="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM International · Confirmar tu cuenta</title>
<!-- El logotipo, para cada quien lo pida: .ico para Google y lo viejo,
     PNG para todo lo demás, SVG para quien prefiera un vector, y el de 180
     para el iPhone. Ver herramientas/iconos.mjs. -->
<link rel="icon" href="/favicon.ico?v=2026-09-03" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96.png?v=2026-09-03">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2026-09-03">
<link rel="apple-touch-icon" href="assets/icono-180.png?v=2026-09-03">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d2440">
<!-- Los cuatro servidores de fuera, avisados de golpe y no en fila.
     Sin esto el navegador descubre cada uno cuando le toca, y paga el
     DNS y el saludo TLS de cada cual por separado, con la pantalla en
     blanco mientras tanto. Ver herramientas/acelerar-cabeceras.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://vajbsfgojtunamhrzrpf.supabase.co" crossorigin>
<link rel="modulepreload" href="assets/app.js?v=2026-09-03-3">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=2026-09-03-3">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" id="card">
    <div class="brand-badge"><span class="material-symbols-outlined" id="ico">mark_email_read</span></div>
    <h1 id="titulo">Confirmando tu cuenta…</h1>
    <div class="sub" id="sub">Un momento, estamos comprobando el enlace.</div>

    <div id="msg"></div>

    <!-- Pedir otro enlace. Es la única salida real cuando el de antes caducó, y
         no estaba en ninguna parte: había que volver a registrarse, que falla
         porque el correo ya existe, y ahí se acababa. -->
    <form id="formOtro" class="hidden">
      <div class="field"><label for="cEmail">Tu correo</label>
        <input type="email" id="cEmail" name="email" required autocomplete="username"></div>
      <button class="btn block" type="submit">
        <span class="material-symbols-outlined" aria-hidden="true">forward_to_inbox</span> Enviarme otro enlace</button>
    </form>

    <div id="acciones" class="row sep hidden" style="justify-content:center"></div>

    <div style="margin-top:14px;text-align:center">
      <a class="btn ghost sm" href="index.html">Ir a la pantalla de entrada</a>
    </div>
  </div>
</div>

<script type="module">
/* A dónde cae el enlace del correo de confirmación.
   ==========================================================================
   Antes no existía esta pantalla: el enlace apuntaba al «Site URL» del
   proyecto —que estaba en localhost:3000— y quien se registraba acababa en una
   dirección muerta con la cola del error pegada:

     localhost:3000/#error=access_denied&error_code=otp_expired

   Eso no le dice nada a nadie. Ahora el enlace apunta aquí, y aquí hay tres
   caminos posibles, los tres con palabras:

   · Salió bien → la librería canjeó el token y hay sesión: se entra directo.
   · El enlace caducó o ya se usó → se explica y se ofrece otro.
   · No hay nada en la dirección → alguien llegó de más, se le manda a entrar.

   Un enlace de correo sirve UNA vez. Es normal que caduque: hay clientes de
   correo que lo abren solos para revisar si es peligroso, y con eso lo gastan.
   Por eso lo importante de esta pantalla no es la felicitación, es el botón de
   pedir otro. */
import { sb, $, esc, mensajeError, homeForRoot, rutaSegura, recogerRumbo }
  from './assets/app.js?v=2026-09-03-3';

const titulo = $('#titulo'), sub = $('#sub'), msg = $('#msg'), ico = $('#ico');
const formOtro = $('#formOtro'), acciones = $('#acciones');
const AQUI = location.href.replace(/[^/?#]*(\?.*)?(#.*)?$/, '');
const aviso = (t, clase = 'err') => msg.innerHTML = `<div class="nota ${clase} sep">${t}</div>`;

const params = new URLSearchParams(location.search);
const hash = new URLSearchParams(location.hash.replace(/^#/, ''));

/* ¿Viene algo en la dirección que pueda convertirse en sesión? Importa para no
   quedarse tres segundos diciendo «confirmando tu cuenta…» a quien llegó aquí
   sin nada: eso es mentira y además parece que la página se colgó.
   Se lee ahora, antes de esperar nada, porque la librería limpia el fragmento
   en cuanto lo canjea. */
const traeAlgo = ['access_token', 'refresh_token'].some((k) => hash.get(k))
  || ['token_hash', 'code', 'type'].some((k) => params.get(k));

function pedirOtro(correoSugerido = '') {
  formOtro.classList.remove('hidden');
  if (correoSugerido) $('#cEmail').value = correoSugerido;
}

/* A dónde va quien acaba de confirmar.
   ═══════════════════════════════════════════════════════════════════════════
   Si venía de pulsar «Inscribirme» en un programa, vuelve ahí y no a su panel.
   Se mira primero la dirección —que aguanta que el correo se abra en otro
   navegador— y después lo guardado, que cubre el caso de la pestaña de al lado.
   Si no hay nada, su panel de siempre, como antes. */
function aDondeIba() {
  return rutaSegura(params.get('next')) || recogerRumbo() || null;
}

async function entrar() {
  const vuelta = aDondeIba();
  if (vuelta) return vuelta;
  const { data } = await sb.rpc('cem_my_profile');
  const perfil = Array.isArray(data) ? data[0] : data;
  return (perfil && perfil.id) ? homeForRoot(perfil.rol) : 'index.html';
}

async function haySesion(intentos = 12) {
  for (let i = 0; i < intentos; i++) {
    const { data: { session } } = await sb.auth.getSession();
    if (session) return session;
    await new Promise(r => setTimeout(r, 250));
  }
  return null;
}

(async () => {
  /* 1 · el enlace vino con una queja */
  const codigo = hash.get('error_code') || hash.get('error') || params.get('error_code');
  if (codigo) {
    const caducado = /otp_expired|expired/i.test(codigo);
    ico.textContent = 'link_off';
    titulo.textContent = caducado ? 'Este enlace ya no sirve' : 'No pudimos confirmar la cuenta';
    sub.textContent = caducado
      ? 'Los enlaces de confirmación valen una sola vez y caducan. Te mandamos otro y listo.'
      : 'El enlace no se pudo validar.';
    if (!caducado) {
      const detalle = hash.get('error_description') || params.get('error_description') || codigo;
      aviso(esc(String(detalle).replace(/\+/g, ' ')));
    }
    pedirOtro(params.get('email') || '');
    return;
  }

  /* 2 · el enlace nuevo de Supabase trae token_hash y hay que canjearlo aquí */
  const tokenHash = params.get('token_hash');
  const tipo = params.get('type') || 'signup';
  if (tokenHash) {
    const { error } = await sb.auth.verifyOtp({ type: tipo, token_hash: tokenHash });
    if (error) {
      ico.textContent = 'link_off';
      titulo.textContent = 'Este enlace ya no sirve';
      sub.textContent = 'Se usó una vez o caducó. Pide otro y entra desde el nuevo.';
      pedirOtro(params.get('email') || '');
      return;
    }
  }

  /* 3 · con sesión, la cuenta quedó confirmada. Se espera a que la librería
     canjee el fragmento sólo si hay fragmento que canjear. */
  const sesion = await haySesion(traeAlgo ? (tokenHash ? 4 : 12) : 1);
  if (sesion) {
    const correo = sesion.user?.email || 'tu cuenta';
    ico.textContent = 'check_circle';
    titulo.textContent = '¡Cuenta confirmada!';
    sub.innerHTML = `Ya puedes entrar con <b>${esc(correo)}</b>.`;
    const destino = await entrar();
    const volviendo = /inscripcion\.html/.test(destino);
    aviso(volviendo
      ? 'Te devolvemos a completar tu inscripción…'
      : 'Te llevamos a tu panel…', 'ok');
    acciones.classList.remove('hidden');
    acciones.innerHTML = `<a class="btn" href="${esc(destino)}">${
      volviendo ? 'Seguir con mi inscripción' : 'Entrar ahora'}</a>
      <a class="btn outline" href="catalogo.html">Ver los programas</a>`;
    setTimeout(() => { location.href = destino; }, 1800);
    return;
  }

  /* 4 · nadie llegó con nada: se llegó a esta dirección de más */
  ico.textContent = 'mark_email_unread';
  titulo.textContent = 'Confirma tu cuenta desde el correo';
  sub.textContent = 'Abre el mensaje que te enviamos y pulsa el enlace. Si no te llegó o ya caducó, pide otro aquí.';
  pedirOtro();
})();

formOtro.onsubmit = async (e) => {
  e.preventDefault();
  msg.innerHTML = '';
  const correo = $('#cEmail').value.trim();
  const btn = formOtro.querySelector('button[type=submit]');
  btn.disabled = true;
  const { error } = await sb.auth.resend({
    type: 'signup', email: correo,
    options: { emailRedirectTo: AQUI + 'confirmar.html' },
  });
  btn.disabled = false;

  if (error && /rate|seconds|limit/i.test(error.message)) {
    aviso('Espera un momento antes de pedir otro: el servidor de correo limita los envíos seguidos.', 'warn');
    return;
  }
  if (error && /already|confirm/i.test(error.message)) {
    aviso('Esa cuenta ya está confirmada. Entra con tu correo y contraseña.', 'ok');
    return;
  }
  /* Cualquier otro tropiezo se responde igual que el caso bueno: decir «ese
     correo no existe» sería regalar qué direcciones están registradas. */
  aviso(`Si <b>${esc(correo)}</b> tiene una cuenta sin confirmar, ya salió el enlace nuevo.
    Mira también en correo no deseado.`, 'ok');
};
</script>
</body>
</html>
