<style>body.ini-oscura{--fondo:#050a14;--papel:#0b1426;--hueco:#101c33;--tinta:#eaf1fb;--tinta-2:#a3b3cb;--filete:rgba(148,190,255,.14);--primary:#9fc1ff;--on-primary:#06101f;--secondary:#3ee6d2;background:#050a14;color:#eaf1fb;}body.ini-clara{--fondo:#f4f7fc;--papel:#ffffff;--hueco:#edf2fa;--tinta:#0b1630;--tinta-2:#46546e;--filete:rgba(13,36,64,.1);--primary:#0d2440;--on-primary:#fff;--secondary:#087a6f;background:#f4f7fc;color:#0b1630;}::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal;}</style>

<style>
  .regalo{font-family:var(--n-display);font-weight:600;font-size:22px;line-height:1.25;margin:var(--e2) 0 var(--e1)}
  .mensaje-beca{margin:var(--e2) 0;padding:var(--e2);border-radius:12px;background:var(--n-panel-2);
    color:var(--tinta-2);font-size:15px;line-height:1.6}
  .pasos-beca{margin:var(--e2) 0;padding-left:20px;color:var(--tinta-2);line-height:1.7;text-align:left}

<body class="ini-portada ini-clara">
<script>try{var t=localStorage.getItem('cemPortadaTema');if(t==='clara'||t==='oscura'){document.body.classList.remove('ini-oscura','ini-clara');document.body.classList.add('ini-'+t);}}catch(e){}</script>
<header class="auth-arriba" id="autArriba">
  <a class="marca" href="../"><img src="assets/favicon.svg" alt="" width="28" height="28"> CEM International</a>
</header>
<main class="auth-wrap">
  <div class="auth-card" id="tarjeta">
    <div class="brand-badge"><img src="assets/favicon.svg" alt="" width="26" height="26"></div>
    <div id="contenido"><span class="cargando"></span></div>
  </div>
</main>

<script type="module">
/* Activar una beca desde su enlace.
   ═══════════════════════════════════════════════════════════════════════════
   NO llama a mount(), y es a propósito: mount({pub:true}) carga la medición
   (Google, Meta), Cemi y la promoción, y el enlace de esta página ES la llave
   de la beca. Lo que la abre es el enlace, y no se le enseña a nadie más.

   Por eso también: el enlace se quita de la barra de direcciones en cuanto se
   lee (se guarda sólo en esta pestaña), y la página no manda la dirección a
   ningún sitio (`referrer` no-referrer).

   Aquí no se crea ninguna cuenta. Quien no la tiene se registra con la
   pantalla de siempre, que confirma que el correo es suyo, y al volver
   estudiante/beca.html termina de activar la beca con su sesión. */
import { sb, $, esc, fdate, ponerBotonDeVersion } from './assets/app.js?v=2026-11-06-2';

ponerBotonDeVersion($('#autArriba'));

const LLAVE = 'cemBecaEnlace';
let token = new URLSearchParams(location.search).get('t') || '';
if (token) {
  try { sessionStorage.setItem(LLAVE, token); } catch {}
  history.replaceState(null, '', location.pathname);
} else {
  try { token = sessionStorage.getItem(LLAVE) || ''; } catch {}
}

const caja = $('#contenido');
const POR_QUE = {
  no_existe: ['Este enlace no sirve', 'Puede que esté incompleto (a veces el correo lo corta) o que ya se haya cambiado por otro. Pide a quien te lo dio que te lo mande de nuevo.'],
  usada: ['Esta beca ya está activada', 'Entra con tu cuenta y la encontrarás en tu panel.'],
  anulada: ['Esta beca ya no está disponible', 'Si crees que es un error, escríbenos desde la web.'],
  caducada: ['Este enlace venció', 'Pide a quien te lo dio que te mande uno nuevo: la beca te sigue esperando.'],
};

if (!token) {
  pintarNo('no_existe');
} else {
  const { data, error } = await sb.rpc('cem_beca_enlace_ver', { p_token: token });
  if (error) {
    caja.innerHTML = `<div class="nota err">No pudimos comprobar el enlace. Prueba otra vez en un momento.</div>`;
  } else if (!data?.ok) {
    pintarNo(data?.motivo, data?.programa);
  } else {
    pintarBeca(data);
  }
}

function pintarNo(motivo, programa) {
  const [titulo, texto] = POR_QUE[motivo] || POR_QUE.no_existe;
  caja.innerHTML = `<h1 style="font-size:24px">${esc(titulo)}</h1>
    ${programa ? `<p class="muted">${esc(programa)}</p>` : ''}
    <p class="muted">${esc(texto)}</p>
    <div class="auth-acciones"><a class="btn" href="index.html">Entrar</a></div>`;
}

function pintarBeca(b) {
  const siguiente = 'estudiante/beca.html?t=' + token;
  const conNext = (extra) => 'index.html?' + new URLSearchParams({ ...extra, next: siguiente }).toString();
  const entrar = conNext(b.email ? { correo: b.email } : {});
  const crear = conNext(b.email ? { registro: '1', correo: b.email } : { registro: '1' });

  let pasos, botones;
  if (b.email && b.tiene_cuenta) {
    pasos = `<ol class="pasos-beca"><li>Entra con tu cuenta (<b>${esc(b.email)}</b>).</li><li>La beca se activa sola y el programa aparece en tu panel.</li></ol>`;
    botones = `<a class="btn ancho" href="${esc(entrar)}">Entrar y activar mi beca</a>`;
  } else if (b.email) {
    pasos = `<ol class="pasos-beca"><li>Crea tu cuenta con <b>${esc(b.email)}</b>.</li><li>Confirma el correo que te llega.</li><li>Al entrar, la beca se activa sola.</li></ol>`;
    botones = `<a class="btn ancho" href="${esc(crear)}">Crear mi cuenta</a>
      <a class="btn outline ancho" href="${esc(entrar)}" style="margin-top:8px">Ya tengo cuenta: entrar</a>`;
  } else {
    pasos = `<ol class="pasos-beca"><li>Entra con tu cuenta, o créala si todavía no tienes.</li><li>La beca se activa sola en esa cuenta.</li></ol>`;
    botones = `<a class="btn ancho" href="${esc(crear)}">Crear mi cuenta</a>
      <a class="btn outline ancho" href="${esc(entrar)}" style="margin-top:8px">Ya tengo cuenta: entrar</a>`;
  }

  caja.innerHTML = `
    <p class="ini-rotulo" style="justify-content:center">Becas CEM</p>
    <h1 style="font-size:26px">${b.nombre ? `¡${esc(b.nombre)}, tienes una beca!` : '¡Tienes una beca!'}</h1>
    <p class="regalo">${esc(b.programa || 'Un programa del CEM')}</p>
    <p class="muted" style="margin:0">Completa: el programa entero, sin pagar nada.</p>
    ${b.mensaje ? `<div class="mensaje-beca">${esc(b.mensaje)}</div>` : ''}
    ${pasos}
    <div class="auth-acciones" style="flex-direction:column">${botones}</div>
    ${b.vence ? `<p class="tiny muted" style="margin-top:var(--e2)">El enlace vale hasta el ${esc(fdate(b.vence))}.</p>` : ''}`;
}
</script>
</body>
</html>
