<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM International · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" id="cardLogin">
    <div class="brand-badge"><span class="material-symbols-outlined">account_balance</span></div>
    <h1>CEM International</h1>
    <div class="sub">Ecosistema de aprendizaje digital — acceso a la plataforma</div>
    <form id="formLogin">
      <div class="field"><label for="email">Correo</label><input type="email" id="email" required autocomplete="username"></div>
      <div class="field"><label for="pass">Contraseña</label><input type="password" id="pass" required autocomplete="current-password"></div>
      <button class="btn block" type="submit">Ingresar <span class="material-symbols-outlined">login</span></button>
      <div id="loginMsg"></div>
    </form>
    <div style="margin-top:14px;text-align:center">
      <button class="btn ghost sm" id="toReg">¿No tienes cuenta? Regístrate</button>
      <a class="btn ghost sm" href="estudiante/catalogo.html">Ver catálogo público</a>
    </div>
    <div class="demo-list">
      Cuentas de prueba (contraseña <b>CemDemo2026!</b>):
      <div style="margin-top:6px">
        <button class="btn outline sm" data-demo="admin@cem.demo">Administrador</button>
        <button class="btn outline sm" data-demo="coordinador@cem.demo">Coordinador</button>
        <button class="btn outline sm" data-demo="profesor@cem.demo">Profesor</button>
        <button class="btn outline sm" data-demo="estudiante@cem.demo">Estudiante</button>
        <button class="btn outline sm" data-demo="auditor@cem.demo">Auditor</button>
      </div>
    </div>
  </div>

  <div class="auth-card hidden" id="cardReg">
    <div class="brand-badge"><span class="material-symbols-outlined">person_add</span></div>
    <h1>Crear cuenta</h1>
    <div class="sub">Regístrate como estudiante para inscribirte en nuestros programas.</div>
    <form id="formReg">
      <div class="row">
        <div class="field" style="flex:1;min-width:130px"><label>Nombre</label><input type="text" id="rNombre" required></div>
        <div class="field" style="flex:1;min-width:130px"><label>Apellido</label><input type="text" id="rApellido" required></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1;min-width:130px"><label>Tipo de documento</label>
          <select id="rDocTipo"><option>Cédula</option><option>DNI</option><option>Pasaporte</option></select></div>
        <div class="field" style="flex:1;min-width:130px"><label>Número</label><input type="text" id="rDoc" required></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1;min-width:130px"><label>Teléfono</label><input type="tel" id="rTel"></div>
        <div class="field" style="flex:1;min-width:130px"><label>País</label><input type="text" id="rPais"></div>
      </div>
      <div class="field"><label>Correo</label><input type="email" id="rEmail" required autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="rPass" required minlength="6" autocomplete="new-password"></div>
      <button class="btn gold block" type="submit">Crear mi cuenta</button>
      <div id="regMsg"></div>
    </form>
    <div style="margin-top:12px;text-align:center">
      <button class="btn ghost sm" id="toLogin">Volver a iniciar sesión</button>
    </div>
  </div>
</div>

<script type="module">
import { sb, $, esc, ok, fail, profile, homeForRoot, qs } from './assets/app.js';

const loginMsg = $('#loginMsg'), regMsg = $('#regMsg');

// Si ya hay sesión activa, ir directo al panel del rol
(async () => {
  const p = await profile();
  if (p) location.replace(homeForRoot(p.rol));
})();

if (qs('registro')) { $('#cardLogin').classList.add('hidden'); $('#cardReg').classList.remove('hidden'); }
$('#toReg').onclick = () => { $('#cardLogin').classList.add('hidden'); $('#cardReg').classList.remove('hidden'); };
$('#toLogin').onclick = () => { $('#cardReg').classList.add('hidden'); $('#cardLogin').classList.remove('hidden'); };

document.querySelectorAll('[data-demo]').forEach(b => b.onclick = () => {
  $('#email').value = b.dataset.demo; $('#pass').value = 'CemDemo2026!';
});

$('#formLogin').onsubmit = async (e) => {
  e.preventDefault();
  loginMsg.innerHTML = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pass').value });
  if (error) { loginMsg.innerHTML = `<div class="chip err" style="margin-top:10px">${esc(error.message)}</div>`; return; }
  const p = await (async () => { const { data } = await sb.rpc('cem_my_profile'); return Array.isArray(data) ? data[0] : data; })();
  if (!p) { loginMsg.innerHTML = '<div class="chip err" style="margin-top:10px">Tu usuario no tiene perfil asignado.</div>'; await sb.auth.signOut(); return; }
  if (!p.activo) { loginMsg.innerHTML = '<div class="chip err" style="margin-top:10px">Cuenta desactivada.</div>'; await sb.auth.signOut(); return; }
  location.href = homeForRoot(p.rol);
};

$('#formReg').onsubmit = async (e) => {
  e.preventDefault();
  regMsg.innerHTML = '';
  const { error } = await sb.auth.signUp({
    email: $('#rEmail').value.trim(), password: $('#rPass').value,
    options: { data: {
      cem_signup: 'true', nombre: $('#rNombre').value.trim(), apellido: $('#rApellido').value.trim(),
      documento_tipo: $('#rDocTipo').value, documento: $('#rDoc').value.trim(),
      telefono: $('#rTel').value.trim(), pais: $('#rPais').value.trim(),
    }},
  });
  if (error) { regMsg.innerHTML = `<div class="chip err" style="margin-top:10px">${esc(error.message)}</div>`; return; }
  $('#formReg').reset();
  regMsg.innerHTML = '<div class="chip ok" style="margin-top:10px">Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.</div>';
};
</script>
</body>
</html>
