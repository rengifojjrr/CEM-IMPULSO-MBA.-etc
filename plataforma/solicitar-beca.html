<style>
  .solicitud{max-width:780px;margin:0 auto;padding:var(--e4) var(--e3) clamp(56px, 8vw, 96px)}
  .solicitud h1{font-family:var(--n-display);font-weight:600;font-size:clamp(30px, 4vw, 46px);line-height:1.05;
    letter-spacing:-.03em;margin:0 0 var(--e2);text-wrap:balance}
  .solicitud .ini-lema{margin-bottom:var(--e3)}
  .datos-conv{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 var(--e3);padding:0;list-style:none;
    color:var(--tinta-2);font-size:14px}
  .datos-conv li{display:flex;align-items:center;gap:6px}
  .datos-conv .material-symbols-outlined{font-size:18px;color:var(--n-cian)}
  .solicitud form h2{font-family:var(--n-display);font-weight:600;font-size:20px;margin:var(--e3) 0 var(--e2)}
  .solicitud form h2:first-child{margin-top:0}
  .fila{display:grid;gap:var(--e2);grid-template-columns:repeat(2,minmax(0,1fr))}

    .solicitud{padding:var(--e3) var(--e2) 64px}
    .fila,.fila3{grid-template-columns:minmax(0,1fr)}
  }

<body class="ini-portada ini-clara">
<script>try{var t=localStorage.getItem('cemPortadaTema');if(t==='clara'||t==='oscura'){document.body.classList.remove('ini-oscura','ini-clara');document.body.classList.add('ini-'+t);}}catch(e){}</script>
<main class="solicitud">
  <p class="ini-rotulo">Becas CEM</p>
  <h1 id="titulo">Solicita tu beca</h1>
  <p class="ini-lema" id="descripcion">Hay personas que quieren pagarle los estudios a quien no puede. Si ese es tu caso, cuéntanos quién eres y por qué quieres estudiar: el equipo lee cada solicitud.</p>
  <ul class="datos-conv" id="datosConv">
    <li><span class="material-symbols-outlined" aria-hidden="true">workspace_premium</span>Beca completa: el programa entero, sin pagar nada</li>
    <li><span class="material-symbols-outlined" aria-hidden="true">schedule</span>Tardas unos 5 minutos</li>
  </ul>

  <div class="card" id="caja"><span class="cargando"></span></div>
</main>

<script type="module">
import { sb, mount, $, esc, qs, fdate, medir } from './assets/app.js?v=2026-11-06';
import { opcionesDePais, paisNombre } from './assets/paises.js?v=2026-11-06';

await mount({ pub: true });

const codigo = (qs('c') || '').trim().toLowerCase();
const { data: conv, error } = await sb.rpc('cem_beca_convocatoria', { p_codigo: codigo || null });

const POR_QUE_NO = {
  cerrada: 'Esta convocatoria ya no está recibiendo solicitudes.',
  aun_no: 'Esta convocatoria todavía no ha abierto.',
  terminada: 'Esta convocatoria ya cerró.',
  sin_cupos: 'Ya se dieron todas las becas de esta convocatoria.',
};

if (error || !conv?.existe) {
  $('#caja').innerHTML = `<div class="nota err">No encontramos esa convocatoria. Puede que el enlace esté
    incompleto.</div><p style="margin:var(--e2) 0 0"><a class="btn" href="solicitar-beca.html">Ver la convocatoria abierta</a></p>`;
} else {
  pintarConvocatoria(conv);
  if (!conv.abierta) {
    $('#caja').innerHTML = `<div class="nota warn">${esc(POR_QUE_NO[conv.motivo] || POR_QUE_NO.cerrada)}</div>
      <p class="muted" style="margin:var(--e2) 0">Abrimos convocatorias nuevas cada cierto tiempo. Mientras tanto,
        puedes conocer los programas o dejarnos tus datos en «¿Tienes dudas?».</p>
      <div class="row"><a class="btn" href="../programas/">Ver los programas</a>
        ${codigo && codigo !== 'becas-cem' ? '<a class="btn outline" href="solicitar-beca.html">Ver la convocatoria general</a>' : ''}</div>`;
  } else {
    pintarFormulario(conv);
  }
}

function pintarConvocatoria(c) {
  if (c.codigo !== 'becas-cem') {
    $('#titulo').textContent = c.titulo;
    document.title = `${c.titulo} · Becas CEM`;
  }
  if (c.descripcion) $('#descripcion').textContent = c.descripcion;
  const extra = [];
  if (c.cierra_en) extra.push(`<li><span class="material-symbols-outlined" aria-hidden="true">event</span>Cierra el ${esc(fdate(c.cierra_en))}</li>`);
  if (c.quedan != null) extra.push(`<li><span class="material-symbols-outlined" aria-hidden="true">group</span>${c.quedan === 1 ? 'Queda 1 beca' : `Quedan ${Number(c.quedan)} becas`}</li>`);
  $('#datosConv').insertAdjacentHTML('beforeend', extra.join(''));
}

function opciones(lista, vacio) {
  return `<option value="">${esc(vacio)}</option>` + lista.map((x) => `<option>${esc(x)}</option>`).join('');
}

function pintarFormulario(c) {
  const cursos = c.cursos || [];
  const elegidoAntes = qs('curso');
  $('#caja').innerHTML = `
  <form id="f" novalidate>
    <h2>Qué quieres estudiar</h2>
    ${cursos.length ? `
      <div class="field"><label for="fCurso">Programa</label>
        <select id="fCurso" required>
          <option value="">Elige el programa</option>
          ${cursos.map((k) => `<option value="${esc(k.id)}" ${k.id === elegidoAntes ? 'selected' : ''}>${esc(k.nombre)}</option>`).join('')}
        </select></div>`
      : `<div class="field"><label for="fProg">¿Qué te gustaría estudiar?</label>
          <input id="fProg" maxlength="160" placeholder="Marketing digital, inteligencia artificial, negocios…" required></div>`}

    <h2>Quién eres</h2>
    <div class="fila">
      <div class="field"><label for="fNombre">Nombre</label><input id="fNombre" autocomplete="given-name" maxlength="80" required></div>
      <div class="field"><label for="fApellido">Apellido</label><input id="fApellido" autocomplete="family-name" maxlength="80"></div>
      <div class="field"><label for="fEmail">Correo</label><input id="fEmail" type="email" autocomplete="email" maxlength="120" required></div>
      <div class="field"><label for="fTel">WhatsApp o teléfono</label><input id="fTel" type="tel" autocomplete="tel" maxlength="40"></div>
      <div class="field"><label for="fPais">País donde vives</label><select id="fPais" required></select></div>
      <div class="field"><label for="fCiudad">Ciudad</label><input id="fCiudad" autocomplete="address-level2" maxlength="80"></div>
    </div>
    <div class="fila3">
      <div class="field"><label for="fEdad">Edad</label><input id="fEdad" type="number" inputmode="numeric" min="10" max="110"></div>
      <div class="field"><label for="fOcup">A qué te dedicas</label><input id="fOcup" maxlength="120" placeholder="Estudiante, comerciante…"></div>
      <div class="field"><label for="fSit">Tu situación</label>
        <select id="fSit">${opciones(['Estudio', 'Trabajo', 'Estudio y trabajo', 'Busco trabajo', 'Tengo mi propio negocio', 'Otra'], 'Elige')}</select></div>
    </div>

    <h2>Por qué la quieres</h2>
    <div class="field"><label for="fPorQue">¿Por qué quieres estudiar este programa?</label>
      <textarea id="fPorQue" rows="5" maxlength="3000" required placeholder="Cuéntanos tu historia: dónde estás hoy y por qué este programa te cambiaría las cosas."></textarea>
      <span class="cuenta-letras" id="cPorQue"></span></div>
    <div class="field"><label for="fParaQue">¿Qué harás con lo que aprendas?</label>
      <textarea id="fParaQue" rows="3" maxlength="3000" required placeholder="Conseguir trabajo, empezar un negocio, ayudar en tu comunidad…"></textarea></div>
    <div class="fila">
      <div class="field"><label for="fHoras">¿Cuántas horas a la semana podrías dedicarle?</label>
        <select id="fHoras">${opciones(['Menos de 3', 'De 3 a 6', 'De 6 a 10', 'Más de 10'], 'Elige')}</select></div>
      <div class="field"><label for="fComo">¿Cómo te enteraste de la beca?</label>
        <select id="fComo">${opciones(['Instagram', 'TikTok', 'Facebook', 'YouTube', 'WhatsApp', 'Un amigo o un familiar', 'Una asociación', 'Google', 'Otro'], 'Elige')}</select></div>
    </div>
    ${c.pregunta_extra ? `<div class="field"><label for="fExtra">${esc(c.pregunta_extra)}</label>
      <textarea id="fExtra" rows="3" maxlength="2000"></textarea></div>` : ''}
    <div class="field"><label for="fRedes">Tu Instagram o TikTok <span class="tiny muted">(opcional)</span></label>
      <input id="fRedes" maxlength="120" placeholder="@tuusuario"></div>

    <div aria-hidden="true" class="visually-hidden"><label for="fWeb">No rellenes esto</label>
      <input type="text" id="fWeb" name="website" tabindex="-1" autocomplete="off"></div>

    <label class="check" style="margin-top:var(--e2)"><input type="checkbox" id="fPublicar">
      Si me dan la beca, acepto que el CEM publique mi nombre de pila y mi país para animar a otras personas a estudiar.</label>
    <label class="check"><input type="checkbox" id="fConfirma" required>
      Confirmo que lo que cuento es cierto.</label>

    <div id="fError"></div>
    <button class="ini-boton" type="submit" id="fEnviar" style="width:100%;margin-top:var(--e2)">
      <span class="material-symbols-outlined" aria-hidden="true">send</span> Enviar mi solicitud</button>
    <p class="tiny muted" style="margin:var(--e2) 0 0">Usamos tus datos sólo para estudiar tu solicitud y escribirte sobre ella.</p>
  </form>`;

  $('#fPais').innerHTML = opcionesDePais('', 'Selecciona tu país');
  const cuenta = () => {
    const n = $('#fPorQue').value.trim().length;
    const el = $('#cPorQue');
    el.textContent = n < 40 ? `Faltan ${40 - n} letras para lo mínimo` : `${n} letras`;
    el.classList.toggle('corto', n < 40);
  };
  $('#fPorQue').addEventListener('input', cuenta);
  cuenta();
  $('#f').onsubmit = enviar;
}

function canal() {
  let origen = qs('utm_source') || qs('origen') || '', campana = qs('utm_campaign') || '';
  if (!origen) {
    try { const g = JSON.parse(sessionStorage.getItem('cemCanal') || 'null'); origen = g?.canal || ''; campana = campana || g?.campana || ''; } catch {}
  }
  return { origen, campana };
}

async function enviar(e) {
  e.preventDefault();
  const err = $('#fError');
  const decir = (m, foco) => { err.innerHTML = `<div class="nota err">${esc(m)}</div>`; if (foco) $(foco)?.focus(); };
  err.innerHTML = '';
  const v = (id) => ($(id)?.value || '').trim();
  if ($('#fCurso') && !v('#fCurso')) return decir('Elige el programa que quieres estudiar.', '#fCurso');
  if ($('#fProg') && v('#fProg').length < 2) return decir('Dinos qué te gustaría estudiar.', '#fProg');
  if (v('#fNombre').length < 2) return decir('Hace falta tu nombre.', '#fNombre');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v('#fEmail'))) return decir('Ese correo no parece un correo.', '#fEmail');
  if (!v('#fPais')) return decir('Dinos en qué país vives.', '#fPais');
  if (v('#fPorQue').length < 40) return decir('Cuéntanos un poco más por qué quieres estudiar: con dos o tres frases basta.', '#fPorQue');
  if (v('#fParaQue').length < 15) return decir('Cuéntanos qué harás con lo que aprendas.', '#fParaQue');
  if (!$('#fConfirma').checked) return decir('Confirma que lo que cuentas es cierto.', '#fConfirma');

  const boton = $('#fEnviar');
  boton.disabled = true;
  const { origen, campana } = canal();
  const { data, error: e2 } = await sb.rpc('cem_beca_solicitar', {
    p_codigo: conv.codigo,
    p_datos: {
      curso_id: v('#fCurso') || null, programa_texto: v('#fProg') || null,
      nombre: v('#fNombre'), apellido: v('#fApellido'), email: v('#fEmail'), telefono: v('#fTel'),
      pais: paisNombre(v('#fPais')) || v('#fPais'), ciudad: v('#fCiudad'), edad: v('#fEdad'),
      ocupacion: v('#fOcup'), situacion: v('#fSit'), horas: v('#fHoras'),
      por_que: v('#fPorQue'), para_que: v('#fParaQue'), extra: v('#fExtra'),
      redes: v('#fRedes'), como_nos_conocio: v('#fComo'),
      acepta_publicar: $('#fPublicar').checked, confirma: $('#fConfirma').checked,
      website: v('#fWeb'), origen, campana,
    },
  });
  if (e2) { boton.disabled = false; return decir(e2.message || 'No se pudo enviar. Prueba otra vez.'); }
  medir('solicitar_beca', { convocatoria: conv.codigo });
  $('#caja').innerHTML = `<div class="hecho">
    <span class="material-symbols-outlined" aria-hidden="true">mark_email_read</span>
    <h2>¡Solicitud enviada!</h2>
    <p class="muted">${esc(data?.gracias || 'Recibimos tu solicitud.')}</p>
    <p class="muted">Te mandamos un correo para que tengas el número de tu solicitud.</p>
    <div class="row" style="justify-content:center;margin-top:var(--e3)">
      <a class="btn" href="../programas/">Conocer los programas</a>
      <a class="btn outline" href="becas.html">Cómo funcionan las becas</a></div></div>`;
  $('#caja').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
