<body>
<div class="auth-wrap">
  <div class="auth-card" style="max-width:520px">
    <div class="brand-badge"><span class="material-symbols-outlined">verified</span></div>
    <h1>Verificar certificado</h1>
    <div class="sub">Consulta la autenticidad de un certificado emitido por CEM International Education.</div>
    <form id="f">
      <div class="field"><label for="codigo">Código, cédula o enlace del QR</label>
        <input id="codigo" placeholder="CEM-2026-00000, o 12.345.678" required>
        <span class="tiny muted">Si tienes el certificado delante, con la cédula basta:
          salen todos los títulos de esa persona.</span></div>
      <button class="btn block" type="submit">Verificar <span class="material-symbols-outlined" aria-hidden="true">search</span></button>
    </form>
    <div id="res" style="margin-top:16px"></div>
    <div class="demo-list"><a href="catalogo.html">Ver catálogo de programas</a></div>
  </div>
</div>
<script type="module">
import { sb, $, esc, fdate, qs } from './assets/app.js?v=2026-08-29-2';

/* Un solo verificador para los dos sistemas.
   ═══════════════════════════════════════════════════════════════════════════
   Hay dos registros de certificados —el del generador, con los que ya están
   impresos y en la mano de la gente, y el de la plataforma— y hasta ahora esta
   pantalla sólo sabía del segundo. Quien tenía un papel del CEM delante y
   escribía aquí lo que veía se encontraba «no existe», que es lo mismo que le
   diría un certificado falso.

   Ahora acepta las tres cosas que alguien puede tener a mano: el código, el
   identificador del QR, o la cédula. La cédula devuelve todos sus títulos, que
   es lo que quiere quien está a punto de contratar a alguien. */
async function verificar(texto){
  const res = $('#res');
  res.innerHTML = '<p class="tiny muted">Consultando…</p>';
  const { data, error } = await sb.rpc('cem_verificar', { p_texto: texto });

  if (error || !data?.hay){
    res.innerHTML = `<div class="card" style="border-color:var(--error)">
      <div class="row"><span class="material-symbols-outlined err-text">cancel</span>
      <b>No encontrado</b></div>
      <p class="tiny muted" style="margin:8px 0 0">${error
        ? 'No pudimos consultar el registro ahora mismo. Vuelve a intentarlo en un momento.'
        : `No hay ningún certificado del CEM con <code>${esc(texto)}</code>. Comprueba que esté
           bien copiado —se distinguen las letras de los números— o prueba con la cédula
           de la persona.`}</p></div>`;
    return;
  }

  const linea = (etiqueta, valor, negrita) =>
    `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--filete)">
       <span class="muted tiny">${etiqueta}</span>
       ${negrita ? `<b style="text-align:right">${valor}</b>` : `<span style="text-align:right">${valor}</span>`}
     </div>`;

  const certs = data.certificados || [];

  /* Buscando por cédula pueden salir ocho. Se dice cuántos antes de la lista:
     sin eso, quien la lee no sabe si está viendo todo o sólo lo primero. */
  const anulados = certs.filter((c) => c.anulado).length;
  /* La frase se arma en una variable y no dentro del HTML: partida en varias
     líneas de plantilla salía con un espacio suelto antes del punto. */
  const resumen = `${certs[0]?.estudiante || ''} tiene ${certs.length} `
    + `certificado${certs.length === 1 ? '' : 's'} del CEM`
    + (anulados ? ` (${anulados} anulado${anulados === 1 ? '' : 's'})` : '') + '.';
  const cabecera = data.por_cedula
    ? `<p class="nota ok" style="text-align:left">${esc(resumen)}</p>`
    : '';

  res.innerHTML = cabecera + certs.map((c) => {
    /* item 25 · un certificado anulado no se borra: se dice qué pasó. Dejar de
       devolverlo haría pensar que el papel es falso cuando lo que pasó es que
       se anuló. */
    /* Tres estados, no dos. Un certificado SUSTITUIDO no es un certificado
       anulado: el título vale, lo que pasa es que el papel bueno es otro
       —se corrigió un nombre, o se rehízo una carga incompleta—. Pintarlo en
       rojo con «ya no acredita nada» es una acusación falsa delante de quien
       está a punto de contratar a esa persona. */
    const anulado = !!c.anulado;
    const sustituido = !!c.reemplazado;
    const color = anulado ? 'error' : sustituido ? 'warn' : 'ok';
    return `<div class="card" style="border-color:var(--${color})">
      <div class="row"><span class="material-symbols-outlined ${
        anulado ? 'err-text' : sustituido ? '' : 'ok-text'}" ${
        sustituido ? 'style="color:var(--warn)"' : ''}>${
        anulado ? 'gpp_bad' : sustituido ? 'history' : 'verified'}</span>
        <b>${anulado ? 'Certificado anulado'
           : sustituido ? 'Hay una versión más nueva'
           : 'Certificado auténtico'}</b></div>
      ${anulado ? `<p class="nota err">Este certificado lo emitió CEM pero fue anulado${
        c.anulado_en ? ` el ${fdate(c.anulado_en)}` : ''}${
        c.anulado_motivo ? `: ${esc(c.anulado_motivo)}` : '.'} Ya no acredita nada.</p>` : ''}
      ${sustituido ? `<p class="nota warn" style="text-align:left">Este certificado lo emitió
        CEM y la formación es válida, pero se rehízo${
        c.anulado_motivo ? `: ${esc(c.anulado_motivo)}` : '.'}
        ${c.sustituto ? `<a href="?codigo=${encodeURIComponent(c.sustituto)}">Ver el que
          está vigente</a>.` : ''}</p>` : ''}
      <div class="sep">
        ${linea('Estudiante', esc(c.estudiante), true)}
        ${c.cedula ? linea('Cédula', esc(c.cedula)) : ''}
        ${linea('Certificado', esc(c.titulo), true)}
        ${c.curso && c.curso !== c.titulo ? linea('Programa', esc(c.curso)) : ''}
        ${linea('Emitido', fdate(c.emitido_en))}
        <div class="row between" style="padding:6px 0">
          <span class="muted tiny">Código</span><code>${esc(c.codigo)}</code></div>
      </div>

      ${c.perfil_slug && !anulado ? `
        <!-- item 03 · quien escanea un título suele estar a punto de contratar, y
             lo que quiere saber es qué formación tiene esa persona, no sólo si
             este papel vale. -->
        <a class="btn block sep" href="perfil-publico.html?p=${encodeURIComponent(c.perfil_slug)}">
          <span class="material-symbols-outlined" aria-hidden="true">badge</span>
          Ver todas las credenciales de ${esc(c.estudiante)}</a>` : ''}
    </div>`;
  }).join('');
}

$('#f').onsubmit = (e) => { e.preventDefault(); verificar($('#codigo').value.trim()); };
const c = qs('codigo');
if (c) { $('#codigo').value = c; verificar(c); }
</script>
