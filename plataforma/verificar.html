<!doctype html>
<html lang="es" data-publico="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEM International · Verificar certificado</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=2026-08-23-9">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" style="max-width:520px">
    <div class="brand-badge"><span class="material-symbols-outlined">verified</span></div>
    <h1>Verificar certificado</h1>
    <div class="sub">Consulta la autenticidad de un certificado emitido por CEM International Education.</div>
    <form id="f">
      <div class="field"><label>Código del certificado</label>
        <input id="codigo" placeholder="CEM-2026-00000" required></div>
      <button class="btn block" type="submit">Verificar <span class="material-symbols-outlined">search</span></button>
    </form>
    <div id="res" style="margin-top:16px"></div>
    <div class="demo-list"><a href="catalogo.html">Ver catálogo de programas</a></div>
  </div>
</div>
<script type="module">
import { sb, $, esc, fdate, qs } from './assets/app.js?v=2026-08-23-9';

async function verificar(codigo){
  const res = $('#res');
  res.innerHTML = '<p class="tiny muted">Consultando…</p>';
  const { data, error } = await sb.rpc('cem_verify_certificate', { p_codigo: codigo });
  if (error || !data || !data.codigo){
    res.innerHTML = `<div class="card" style="border-color:var(--error)">
      <div class="row"><span class="material-symbols-outlined err-text">cancel</span>
      <b>No encontrado</b></div>
      <p class="tiny muted" style="margin:8px 0 0">${error
        ? 'No pudimos consultar el registro ahora mismo. Vuelve a intentarlo en un momento.'
        : `No existe ningún certificado con el código <code>${esc(codigo)}</code>. Comprueba que esté bien copiado: se distinguen las letras de los números.`}</p></div>`;
    return;
  }
  /* item 25 · un certificado anulado no se borraba: se dejaba de devolver, y la
     verificación decía «no existe». Eso sugiere que el papel es falso cuando lo
     que pasó es que se anuló. Ahora se dice qué pasó y cuándo. */
  const anulado = !!data.anulado;
  const linea = (etiqueta, valor, negrita) =>
    `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--filete)">
       <span class="muted tiny">${etiqueta}</span>
       ${negrita ? `<b style="text-align:right">${valor}</b>` : `<span style="text-align:right">${valor}</span>`}
     </div>`;

  res.innerHTML = `<div class="card" style="border-color:var(--${anulado ? 'error' : 'ok'})">
    <div class="row"><span class="material-symbols-outlined ${anulado ? 'err-text' : 'ok-text'}">${anulado ? 'gpp_bad' : 'verified'}</span>
      <b>${anulado ? 'Certificado anulado' : 'Certificado auténtico'}</b></div>
    ${anulado ? `<p class="nota err">Este certificado lo emitió CEM pero fue anulado
      el ${fdate(data.anulado_en)}${data.anulado_motivo ? `: ${esc(data.anulado_motivo)}` : '.'}
      Ya no acredita nada.</p>` : ''}
    <div class="sep">
      ${linea('Estudiante', esc(data.estudiante), true)}
      ${linea('Certificado', esc(data.titulo), true)}
      ${data.curso ? linea('Programa', esc(data.curso)) : ''}
      ${linea('Emitido', fdate(data.emitido_en))}
      <div class="row between" style="padding:6px 0">
        <span class="muted tiny">Código</span><code>${esc(data.codigo)}</code></div>
    </div>

    ${data.perfil_slug && !anulado ? `
      <!-- item 03 · quien escanea un título suele estar a punto de contratar, y
           lo que quiere saber es qué formación tiene esa persona, no sólo si
           este papel vale. El QR impreso sigue apuntando aquí —una dirección que
           no se rompe aunque el graduado despublique su perfil— y desde aquí se
           pasa al perfil cuando existe. -->
      <a class="btn block sep" href="perfil-publico.html?p=${encodeURIComponent(data.perfil_slug)}">
        <span class="material-symbols-outlined">badge</span>
        Ver todas las credenciales de ${esc(data.estudiante)}</a>` : ''}
  </div>`;
}

$('#f').onsubmit = (e) => { e.preventDefault(); verificar($('#codigo').value.trim()); };
const c = qs('codigo');
if (c) { $('#codigo').value = c; verificar(c); }
</script>
</body>
</html>
