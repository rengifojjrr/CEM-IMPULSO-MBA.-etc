<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM · Evaluación</title>
<!-- El logotipo, para cada quien lo pida: .ico para Google y lo viejo,
     PNG para todo lo demás, SVG para quien prefiera un vector, y el de 180
     para el iPhone. Ver herramientas/iconos.mjs. -->
<link rel="icon" href="/favicon.ico?v=2026-09-03" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="../assets/favicon-96.png?v=2026-09-03">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2026-09-03">
<link rel="apple-touch-icon" href="../assets/icono-180.png?v=2026-09-03">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d2440">
<!-- Los cuatro servidores de fuera, avisados de golpe y no en fila.
     Sin esto el navegador descubre cada uno cuando le toca, y paga el
     DNS y el saludo TLS de cada cual por separado, con la pantalla en
     blanco mientras tanto. Ver herramientas/acelerar-cabeceras.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://vajbsfgojtunamhrzrpf.supabase.co" crossorigin>
<link rel="modulepreload" href="../assets/app.js?v=2026-09-04-3">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-09-04-3">
<style>
  .qcard{background:var(--papel);border:1px solid var(--filete);border-radius:var(--r);
    padding:var(--e3);margin-bottom:var(--aire);}
  .qcard.falta{border-color:var(--error);}
  .qnum{width:26px;height:26px;border-radius:var(--r-full);background:var(--primary);
    color:var(--on-primary);display:inline-flex;align-items:center;justify-content:center;
    font-size:var(--t-xs);font-weight:var(--peso-fuerte);flex-shrink:0;}
  .opt{display:flex;align-items:center;gap:var(--e1);padding:var(--e1) var(--e2);
    border:1px solid var(--filete);border-radius:var(--r);margin-top:var(--e1);cursor:pointer;
    min-height:44px;}
  .opt:hover{background:var(--hueco);}
  .opt.on{border-color:var(--primary);background:var(--primary-suave);
    font-weight:var(--peso-fuerte);}
  .opt input{accent-color:var(--primary);width:20px;height:20px;flex:none;}
  .timer{font-variant-numeric:tabular-nums;font-weight:var(--peso-fuerte);}
  /* Se queda pegada porque el tiempo y el botón de entregar tienen que estar
     siempre a la vista, aunque el examen tenga cuarenta preguntas. La clase
     `pegajosa` es la que le pone el fondo opaco: sin él, las preguntas se
     leerían a través de la barra al desplazar. */
  .barra-examen{top:70px;}
  @media (max-width:900px){ .barra-examen{top:60px;} }
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="card pegajosa barra-examen">
    <div class="row between">
      <div class="crece"><h1 id="tit" style="margin:0;font-size:var(--t-md)"></h1>
        <p class="tiny muted" style="margin:3px 0 0">Tus respuestas se guardan solas. Sólo cuentan al pulsar «Entregar».</p>
        <div class="tiny muted" id="sub"></div></div>
      <div class="row">
        <span class="chip info" id="intento"></span>
        <span class="chip neutral" id="avance"></span>
        <span class="chip warn timer" id="timer"></span>
        <button class="btn" id="btnEnviar">Entregar</button>
      </div>
    </div>
  </div>
  <div id="cuerpo"></div>
  <div class="card hidden" id="paginador">
    <div class="row between">
      <button class="btn outline" id="btnAtras"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Atrás</button>
      <span class="tiny muted" id="pagInfo"></span>
      <button class="btn" id="btnSig">Siguiente <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></button>
    </div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, qs, ok, fail, run, confirmDialog, modal, nota, chipNota,
         mensajeError, avisar, ocupado, subirDocumentoLeccion } from '../assets/app.js?v=2026-09-04-3';
import { TIPOS, controlDeRespuesta, leerControl, estaRespondida, etiquetaTipo }
  from '../assets/preguntas.js?v=2026-09-04-3';

const me = await mount({ require:['estudiante'], active:'panel.html', area:'estudiante' });
let assess, preguntas = [], sub, respuestas = {}, tLeft = null, tick = null;
let pagina = 0;            // sólo se usa cuando la evaluación va de una en una
let guardando = null;      // para no pisar un guardado con otro

if (me) load();

async function load(){
  const aId = qs('id'), enrId = qs('enr');
  if (!aId){ location.href = 'panel.html'; return; }
  const { data: a } = await sb.from('cem_assessments').select('*,cem_courses(nombre)').eq('id',aId).maybeSingle();
  if (!a){ fail('Evaluación no encontrada'); return; }
  assess = a;

  let enrollment = enrId;
  if (!enrollment){
    const { data: e } = await sb.from('cem_enrollments').select('id')
      .eq('profile_id',me.id).eq('course_id',a.course_id).maybeSingle();
    enrollment = e?.id;
  }
  if (!enrollment){ fail('No estás inscrito en este programa.'); setTimeout(()=>location.href='panel.html',1200); return; }

  const { data: prev } = await sb.from('cem_submissions').select('*').eq('assessment_id',aId)
    .eq('enrollment_id',enrollment).order('intento',{ascending:false}).limit(500);
  const usados = (prev||[]).length;
  const abierta = (prev||[]).find(s=>s.estado==='en_progreso');

  if (!abierta && usados >= (a.intentos||1)){
    $('#page').innerHTML = `<div class="card" style="text-align:center;padding:var(--e4)">
      <span class="material-symbols-outlined" style="font-size:44px;color:var(--outline)">block</span>
      <h2>Sin intentos disponibles</h2>
      <p class="muted">Ya usaste los ${a.intentos} intento(s) permitidos para esta evaluación.</p>
      ${(prev||[]).filter(s=>s.puntaje!=null).map(s=>
        `<span class="tiny muted">Intento ${s.intento}:</span> ${chipNota(s.puntaje, 100, a.nota_aprobatoria||70)}`).join(' ')}
      <div class="sep-mucho"><a class="btn" href="panel.html">Volver a mi panel</a></div></div>`;
    return;
  }

  sub = abierta || await run(sb.from('cem_submissions').insert({
    assessment_id:aId, enrollment_id:enrollment, intento:usados+1, estado:'en_progreso'
  }).select().single(),'No se pudo iniciar la evaluación');
  if (!sub) return;
  respuestas = sub.respuestas || {};

  // RPC security-definer: entrega las preguntas sin la respuesta correcta.
  const { data: qsData, error: qErr } = await sb.rpc('cem_exam_questions',{ p_assessment_id:aId });
  if (qErr){ avisar($('#cuerpo'), mensajeError(qErr)); return; }
  preguntas = (qsData||[]).map(x=>({
    id:x.question_id, enunciado:x.enunciado, ayuda:x.ayuda, tipo:x.tipo,
    opciones:x.opciones||[], config:x.config||{}, obligatoria:x.obligatoria,
    barajar_opciones:x.barajar_opciones, seccion:x.seccion, seccion_desc:x.seccion_desc,
    _puntaje:Number(x.puntaje)||0 }));

  $('#tit').textContent = assess.nombre;
  $('#sub').textContent = `${assess.cem_courses?.nombre||''} · sobre ${assess.puntaje_max||100} puntos`
    + (assess.descripcion ? ` · ${assess.descripcion}` : '');
  $('#intento').textContent = `Intento ${sub.intento} de ${assess.intentos||1}`;
  if (assess.tiempo_min){ tLeft = assess.tiempo_min*60; startTimer(); } else $('#timer').classList.add('hidden');
  $('#paginador').classList.toggle('hidden', !assess.una_por_pagina || preguntas.length < 2);
  render();
}

function startTimer(){
  const upd=()=>{
    const m=Math.floor(Math.max(tLeft,0)/60), s=Math.max(tLeft,0)%60;
    $('#timer').innerHTML = `<span class="material-symbols-outlined">timer</span> ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (tLeft<=60) $('#timer').className='chip err timer';
    if (tLeft<=0){ clearInterval(tick); tick=null; entregar(true); }
    tLeft--;
  };
  upd(); tick=setInterval(upd,1000);
}

/* Lo que se enseña en cada momento: todas las preguntas, o sólo la de la
   página actual cuando la evaluación va de una en una. */
const visibles = () => assess.una_por_pagina ? preguntas.slice(pagina, pagina+1) : preguntas;

function render(){
  const lista = visibles();
  $('#cuerpo').innerHTML = lista.map((q)=>{
    const i = preguntas.indexOf(q);
    const cabecera = q.seccion ? `<div class="q-seccion"><h3>${esc(q.seccion)}</h3>
      ${q.seccion_desc?`<div class="tiny muted">${esc(q.seccion_desc)}</div>`:''}</div>` : '';
    return cabecera + `<div class="qcard caja" data-tarjeta="${q.id}">
      <div class="row" style="gap:var(--e1);align-items:flex-start;flex-wrap:nowrap">
        <span class="qnum">${i+1}</span>
        <div class="crece">
          <div class="negrita">${esc(q.enunciado)}${q.obligatoria?' <span style="color:var(--error)" title="Obligatoria">*</span>':''}</div>
          ${q.ayuda?`<div class="tiny muted" style="margin-top:3px">${esc(q.ayuda)}</div>`:''}
          <div class="sep">${controlDeRespuesta(q, respuestas[q.id])}</div>
        </div>
        <span class="chip neutral">${q._puntaje} pts</span>
      </div></div>`;
  }).join('') || '<div class="card">Esta evaluación todavía no tiene preguntas.</div>';

  conectar();
  pintarAvance();
  if (assess.una_por_pagina){
    $('#pagInfo').textContent = `Pregunta ${pagina+1} de ${preguntas.length}`;
    $('#btnAtras').disabled = pagina === 0;
    $('#btnSig').disabled = pagina >= preguntas.length-1;
  }
}

function conectar(){
  $$('[data-q]').forEach(el => {
    const id = el.dataset.q;
    const aplicar = () => {
      respuestas[id] = leerControl(el, respuestas[id]);
      // Marcar la opción elegida es feedback inmediato; repintarlo todo haría
      // perder el foco de un textarea a medio escribir.
      const caja = el.closest('.qcard');
      if (caja) caja.classList.remove('falta');
      $$('.opt', caja || document).forEach(o => o.classList.toggle('on', !!$('input',o)?.checked));
      guardar();
    };
    if (el.dataset.forma === 'archivo'){
      el.onchange = async () => {
        const f = el.files?.[0];
        if (!f) return;
        const q = preguntas.find(x=>x.id===id);
        const tope = (Number(q?.config?.max_mb) || 10) * 1024 * 1024;
        if (f.size > tope){ fail(`El archivo pesa más de ${Math.round(tope/1048576)} MB.`); el.value=''; return; }
        const aviso = $(`[data-archivo-de="${id}"]`);
        if (aviso) aviso.textContent = 'Subiendo…';
        try {
          const { url } = await subirDocumentoLeccion(f);
          respuestas[id] = url;
          if (aviso) aviso.innerHTML = `<a href="${esc(url)}" target="_blank" rel="noopener">Archivo entregado</a>`;
          await guardar();
          ok('Archivo subido');
        } catch (e){ fail(mensajeError(e)); if (aviso) aviso.textContent = 'No se pudo subir. Inténtalo otra vez.'; }
      };
      return;
    }
    if (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type === 'text')){
      el.oninput = () => { respuestas[id] = leerControl(el, respuestas[id]); };
      el.onblur = guardar;
    } else {
      el.onchange = aplicar;
    }
  });
}

function pintarAvance(){
  const hechas = preguntas.filter(q => estaRespondida(respuestas[q.id])).length;
  $('#avance').textContent = `${hechas} de ${preguntas.length} respondidas`;
}

/* Guardar sin pisarse: si llega un cambio mientras el anterior está en vuelo,
   se encola. Antes se lanzaban dos peticiones a la vez y ganaba la que llegara
   última, que no siempre era la última respuesta. */
async function guardar(){
  pintarAvance();
  if (guardando) { guardando = guardando.then(escribir); return guardando; }
  guardando = escribir();
  try { await guardando; } finally { guardando = null; }
}
async function escribir(){
  const { error } = await sb.from('cem_submissions').update({ respuestas }).eq('id', sub.id);
  if (error) fail('No se pudo guardar tu última respuesta. Revisa la conexión antes de entregar.');
}

$('#btnAtras').onclick = () => { if (pagina>0){ pagina--; render(); window.scrollTo({top:0,behavior:'smooth'}); } };
$('#btnSig').onclick = () => {
  const q = preguntas[pagina];
  if (q.obligatoria && !estaRespondida(respuestas[q.id])){
    $(`[data-tarjeta="${q.id}"]`)?.classList.add('falta');
    fail('Esta pregunta es obligatoria.');
    return;
  }
  if (pagina < preguntas.length-1){ pagina++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
};

$('#btnEnviar').onclick = (e) => entregar(false, e.currentTarget);

async function entregar(auto, boton){
  const sinContestar = preguntas.filter(q => !estaRespondida(respuestas[q.id]));
  const obligatorias = sinContestar.filter(q => q.obligatoria);

  if (!auto && obligatorias.length){
    // Una obligatoria en blanco no se entrega por descuido: se lleva a la
    // pregunta y se dice cuál es, en vez de un «faltan 3» que no ubica nada.
    const primera = obligatorias[0];
    if (assess.una_por_pagina){ pagina = preguntas.indexOf(primera); render(); }
    $(`[data-tarjeta="${primera.id}"]`)?.classList.add('falta');
    $(`[data-tarjeta="${primera.id}"]`)?.scrollIntoView({ behavior:'smooth', block:'center' });
    fail(obligatorias.length === 1
      ? 'Te falta una pregunta obligatoria.'
      : `Te faltan ${obligatorias.length} preguntas obligatorias. La primera está marcada.`);
    return;
  }
  if (!auto){
    const msg = sinContestar.length
      ? `Dejas ${sinContestar.length} pregunta(s) sin responder. ¿Entregar de todas formas?`
      : '¿Entregar la evaluación ahora? No se puede volver a enviar.';
    if (!await confirmDialog(msg)) return;
  }
  if (tick){ clearInterval(tick); tick = null; }

  const enviar = async () => {
    if (guardando) await guardando;
    const { data, error } = await sb.rpc('cem_submit_assessment',
      { p_submission_id: sub.id, p_respuestas: respuestas });
    if (error){ fail(mensajeError(error)); return; }
    mostrarResultado(Array.isArray(data) ? data[0] : data);
  };
  if (boton) await ocupado(boton, 'Entregando…', enviar); else await enviar();
}

function mostrarResultado(r){
  const pendiente = r?.puntaje == null;
  const aprobado = !pendiente && Number(r.puntaje) >= (assess.nota_aprobatoria||70);

  const parcial = pendiente && r?.puntaje_objetivo != null ? `
    <div class="card" style="margin:var(--e2) 0;background:var(--surface-container)">
      <div class="tiny muted">De la parte que se corrige sola</div>
      <div style="font-size:26px;font-weight:var(--peso-fuerte);margin:2px 0">${r.puntaje_objetivo} / 100</div>
      <div class="tiny muted">Esa parte vale el ${r.peso_objetivo}% de la evaluación.
        El resto son preguntas abiertas que lee un profesor.</div>
    </div>` : '';

  const m = modal({ title:'Evaluación entregada', body:`
    <div style="text-align:center;padding:var(--e1)">
      <span class="material-symbols-outlined" style="font-size:52px;color:${pendiente?'var(--info)':aprobado?'var(--ok)':'var(--error)'}">
        ${pendiente?'hourglass_top':aprobado?'check_circle':'cancel'}</span>
      <h2 style="margin:var(--e1) 0 4px">${pendiente?'Entrega registrada':nota(r.puntaje, 100, assess.nota_aprobatoria||70)}</h2>
      ${parcial}
      <p class="muted">${pendiente
        ? 'Tu evaluación tiene preguntas abiertas: un profesor las revisa y te avisamos cuando esté la nota definitiva.'
        : aprobado?'¡Felicitaciones, aprobaste la evaluación!':`No alcanzaste la nota mínima (${assess.nota_aprobatoria}).`}</p>
      ${assess.mensaje_final?`<p>${esc(assess.mensaje_final)}</p>`:''}
    </div>`,
    footer: `${assess.mostrar_correctas && !pendiente
      ? '<button class="btn outline" data-ver>Ver cuáles fallé</button>' : ''}
      <a class="btn" href="panel.html">Volver a mi panel</a>` });
  const ver = $('[data-ver]', m);
  if (ver) ver.onclick = () => { m.close(); verRevision(); };
  const cerrar = $('[data-x]', m);
  if (cerrar) cerrar.onclick = () => location.href = 'panel.html';
}

/* La revisión pide las claves aparte y sólo después de entregar: mientras el
   examen está abierto, las respuestas correctas no salen del servidor. */
async function verRevision(){
  const { data, error } = await sb.rpc('cem_revision_intento', { p_submission_id: sub.id });
  if (error){ fail(mensajeError(error)); return; }
  modal({ title:'Cómo te fue pregunta por pregunta', wide:true, body:
    (data||[]).map((q,i)=>`<div class="card" style="box-shadow:none;margin-bottom:var(--e1);
        border-left:3px solid ${q.acerto===true?'var(--ok)':q.acerto===false?'var(--error)':'var(--filete)'}">
      <div class="row between"><b>${i+1}. ${esc(q.enunciado)}</b>
        <span class="chip ${q.acerto===true?'ok':q.acerto===false?'err':'neutral'}">${
          q.acerto===true?'Correcta':q.acerto===false?'Incorrecta':'La revisa un profesor'}</span></div>
      <div class="tiny sep-poco"><b>Tu respuesta:</b> ${esc(q.tuya ?? '—')}</div>
      ${q.acerto===false&&q.correcta!=null?`<div class="tiny"><b>La correcta:</b> ${esc(q.correcta)}</div>`:''}
      ${q.explicacion?`<div class="tiny muted sep-poco">${esc(q.explicacion)}</div>`:''}
    </div>`).join('') || '<p class="muted">No hay nada que revisar.</p>' });
}
</script>
</body>
</html>
