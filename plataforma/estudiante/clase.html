<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM · Aula</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-20">
<style>
  .aula{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:var(--aire);}
  .aula > *{min-width:0;}
  @media(max-width:900px){ .aula{grid-template-columns:minmax(0,1fr);} }
  .les-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r);cursor:pointer;font-size:var(--t-sm);}
  .les-t{flex:1;min-width:0;overflow-wrap:anywhere;}
  .les-item:hover{background:var(--hueco);}
  .les-item.on{background:var(--secondary-container);color:var(--secondary);font-weight:600;}
  .les-item .material-symbols-outlined{font-size:var(--t-md);}
  .player{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;display:flex;
    align-items:center;justify-content:center;color:#fff;position:relative;}
  /* !important a propósito: la API de YouTube reemplaza el <div id="ytHost">
     por su propio <iframe> con width/height puestos por ella (640×390 si no
     se le dice nada), y eso pisa una regla normal de la hoja de estilos. */
  .player iframe{width:100%!important;height:100%!important;border:0;}
  .yt-host{width:100%;height:100%;}

  /* Tapa la esquina donde YouTube pone «Ver en YouTube» y el título con enlace.
     No esconde el enlace de quien abra las herramientas del navegador —eso no
     se puede— pero evita que salir del aula sea un clic accidental. */
  .tapa-yt{position:absolute;top:0;right:0;height:62px;width:190px;z-index:2;cursor:default;}
  .tapa-yt.izq{left:0;right:auto;width:150px;}

  /* La marca de agua. No estorba para ver la clase y sí sale en cualquier
     grabación. Cambia de sitio cada pocos segundos: recortarla obligaría a
     recortar el vídeo entero. `pointer-events:none` para que no se coma los
     clics del reproductor. */
  .agua{position:absolute;z-index:3;pointer-events:none;user-select:none;
    font-size:12px;line-height:1.35;letter-spacing:.02em;
    color:rgba(255,255,255,.42);text-shadow:0 1px 3px rgba(0,0,0,.85);
    transition:top .9s ease, left .9s ease;white-space:nowrap;}
  @media(max-width:700px){ .agua{font-size:10px;} .tapa-yt{width:120px;height:48px;} }
  @media print{ .player{display:none!important;} }
</style>
</head>
<body>
<div id="page" class="hidden">
  <div id="migas"></div>
  <div class="row between" style="margin-bottom:14px">
    <div><h1 id="tCurso" style="margin:0;font-size:20px"></h1>
      <p class="tiny muted" style="margin:3px 0 0">Ve la lección, márcala como completada y así avanza tu progreso.
        A la izquierda están todas las lecciones del programa.</p>
      <div class="tiny muted" id="tProg" style="margin-top:3px"></div></div>
    <div class="actions" id="accionesAula"></div>
  </div>

  <div class="aula">
    <div class="card" style="align-self:start;max-height:78vh;overflow:auto">
      <h2 class="sec">Contenido del curso</h2>
      <div id="indice"></div>
    </div>

    <div>
      <div id="visor"></div>
      <div class="card sep">
        <div class="tabs" id="tabs">
          <button class="active" data-t="tablon">Tablón</button>
          <button data-t="notas">Mis notas</button>
          <button data-t="evaluaciones">Evaluaciones</button>
          <button data-t="recursos">Recursos</button>
          <button data-t="sesiones">Sesiones en vivo</button>
        </div>
        <div id="panelTabs"></div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, bar, pct, fdate, qs, ok, run, chipEstado, migas, chipNota, money,
         mensajeError, modal, avisar, ocupado } from '../assets/app.js?v=2026-08-20';
import { pintarMuro } from '../assets/aula.js?v=2026-08-20';
const me = await mount({ require:['estudiante'], active:'panel.html', area:'estudiante' });
let curso, enr, mods=[], progreso={}, actual=null, clases=[], media=[], evals=[], entregas=[];
let hayExpress = false;
if (me) load();

async function load(){
  let cursoId = qs('curso');
  const claseId = qs('clase');
  if (claseId && !cursoId){
    const { data: cl } = await sb.from('cem_classes').select('cohort_id,cem_cohorts(course_id)').eq('id',claseId).maybeSingle();
    cursoId = cl?.cem_cohorts?.course_id;
  }
  const { data: ens } = await sb.from('cem_enrollments')
    .select('*,cem_courses(id,nombre),cem_cohorts(id,nombre)').eq('profile_id',me.id).limit(500);
  enr = cursoId ? (ens||[]).find(e=>e.course_id===cursoId) : (ens||[])[0];
  if (!enr) { document.body.innerHTML='<div class="content"><div class="card">No tienes inscripciones activas. <a href="catalogo.html">Ver catálogo</a></div></div>'; return; }
  curso = enr.cem_courses;

  /* El enlace y el cuerpo de cada lección no vienen aquí: la base ya no los
     entrega por consulta directa. Se piden abajo, después de la puerta, y sólo
     los devuelve a quien pagó. */
  const [{data:ms},{data:lp},{data:cls},{data:md},{data:evs},{data:subs}] = await Promise.all([
    sb.from('cem_modules')
      .select('*,cem_lessons(id,module_id,titulo,descripcion,tipo,duracion_min,orden,obligatorio,estado)')
      .eq('course_id',enr.course_id).order('orden'),
    sb.from('cem_lesson_progress').select('*').eq('enrollment_id',enr.id).limit(500),
    enr.cohort_id? sb.from('cem_classes').select('*').eq('cohort_id',enr.cohort_id).order('fecha').limit(500) : Promise.resolve({data:[]}),
    sb.from('cem_media').select('*').eq('course_id',enr.course_id).limit(500),
    sb.from('cem_assessments').select('*').eq('course_id',enr.course_id).eq('estado','publicado').order('nombre'),
    sb.from('cem_submissions').select('*').eq('enrollment_id',enr.id).limit(500),
  ]);
  /* La puerta. El servidor ya rechaza las evaluaciones y el progreso de quien
     no ha pagado; aquí se le dice por qué, en vez de dejarle chocar con un
     error en cada clic. */
  const { data: acceso } = await sb.rpc('cem_mi_acceso');
  if (acceso && acceso[enr.id] && acceso[enr.id].abierto === false) {
    $('#page').innerHTML = `<div class="card" style="max-width:620px;margin:0 auto;text-align:center;padding:var(--e4)">
      <span class="material-symbols-outlined" style="font-size:46px;color:var(--warn)">lock</span>
      <h2 style="margin:var(--e2) 0 var(--e1)">Tu inscripción está esperando el primer pago</h2>
      <p class="muted">Reservamos tu cupo en <b>${esc(curso?.nombre || 'el programa')}</b>.
        El contenido se abre en cuanto se confirme el pago${
          acceso[enr.id].primeraCuota
            ? ` de <b>${money(acceso[enr.id].primeraCuota, acceso[enr.id].moneda)}</b>` : ''}.</p>
      <div class="row sep-mucho" style="justify-content:center">
        <a class="btn" href="pagos.html?enr=${enr.id}">
          <span class="material-symbols-outlined">payments</span> Ir a pagar</a>
        <a class="btn outline" href="curso.html?id=${enr.course_id}">Ver el temario</a>
      </div>
      <p class="tiny muted sep">Si ya pagaste y subiste el comprobante, lo estamos verificando.
        En cuanto lo aprobemos te llega el aviso y el curso se abre solo.</p>
    </div>`;
    return;
  }

  mods = (ms||[]).map(m=>({ ...m, cem_lessons:(m.cem_lessons||[]).sort((a,b)=>a.orden-b.orden) }));

  /* Pasada la puerta, se pide el material de verdad. Si la base dijera que no,
     las lecciones se quedan con el título y sin reproductor: se ve el temario
     pero no se ve la clase, que es exactamente lo que debe pasar. */
  const idsLecciones = mods.flatMap(m=>m.cem_lessons).map(l=>l.id);
  if (idsLecciones.length){
    const { data: material } = await sb.rpc('cem_material_lecciones',{ p_ids: idsLecciones });
    mods.forEach(m=>m.cem_lessons.forEach(l=>{
      const x = material?.[l.id];
      l.url = x?.url ?? null;
      l.video_id = x?.video_id ?? null;
      l.contenido = x?.contenido ?? null;
    }));
  }

  /* ¿Este curso tiene vídeos express? Se pregunta aparte y sin bloquear: si
     fallara, el aula tiene que abrir igual — es un atajo, no la clase. */
  sb.rpc('cem_shorts_del_curso', { p_course_id: enr.course_id }).then(({ data }) => {
    hayExpress = (data || []).length > 0;
    if (hayExpress && $('#accionesAula')) render();
  }, () => {});

  (lp||[]).forEach(x=>progreso[x.lesson_id]=x);
  clases = cls||[]; media = md||[]; evals = evs||[]; entregas = subs||[];
  const all = mods.flatMap(m=>m.cem_lessons);
  actual = all.find(l=>!progreso[l.id]?.completado) || all[0];
  render();
}

/* ── El reproductor ────────────────────────────────────────────────────────
   Tres cosas que no son lo mismo y conviene no confundir:

   · Se usa `youtube-nocookie.com`, que no deja rastro publicitario en quien ve
     la clase. Es lo correcto con menores y con datos de alumnos.
   · `rel=0` evita que al terminar salgan vídeos de otros canales, y
     `modestbranding=1` + la tapa de la esquina quitan los caminos de vuelta a
     YouTube. Esto para a quien se despista, no a quien busca.
   · La dirección se arma aquí con el identificador, en vez de guardar la URL
     entera en la base. No esconde nada más —quien tiene el identificador tiene
     el vídeo— pero deja que sea la plataforma quien decida cómo se ve.

   Lo que NO hace, y conviene decirlo: esto no impide sacar el enlace ni grabar
   la pantalla. Nada en una página web puede. Lo que sí hace es que cualquier
   grabación salga con el nombre de quien la hizo encima. */
function reproductor(l){
  if (l.tipo !== 'video') return '';
  if (l.video_id) {
    /* No se arma un <iframe> con la dirección puesta a mano: se deja el hueco para que lo
       llene la API de YouTube, montada después en montarReproductor().

       La razón es el fallo que se vio en producción: un identificador que no
       corresponde a ningún vídeo (borrado, privado, o todavía sin emparejar)
       no da un error DENTRO de un <iframe> normal. YouTube responde con su
       propia página de aviso, y esa página sí bloquea que se enmarque —
       termina en la pantalla de Chrome «youtube.com rechazó la conexión», que
       es la de Google, no la nuestra. Con la API real se recibe un evento
       `onError` en su lugar, y se puede mostrar un aviso propio. */
    return `<div id="ytHost" class="yt-host"></div>
      <div class="tapa-yt" aria-hidden="true"></div>
      <div class="tapa-yt izq" aria-hidden="true"></div>`;
  }
  // Material antiguo, con la URL entera guardada y sin identificador. Se sigue
  // viendo tal cual, sin la API: no hay manera de saber si es de YouTube.
  return l.url ? `<iframe src="${esc(l.url)}" allowfullscreen title="${esc(l.titulo)}"></iframe>` : '';
}

/* ── La marca de agua ──────────────────────────────────────────────────────
   Quien reparta la clase reparte su propio nombre con ella. Es lo único de
   todo esto que de verdad frena una filtración: no porque sea imposible, sino
   porque deja de ser anónima.

   Va sobre el <div>, no dentro del <iframe> —ahí no se puede escribir— así que
   desaparece a pantalla completa. Por eso también se registra quién ve qué:
   las dos cosas juntas cubren lo que cada una deja fuera. */
const QUIEN = [
  [me.nombre, me.apellido].filter(Boolean).join(' ').trim() || me.email,
  me.documento ? `${me.documento_tipo || 'CI'} ${me.documento}` : me.email,
].filter(Boolean);

let aguaReloj = null;
function marcaDeAgua(){
  clearInterval(aguaReloj);
  const host = $('#reproductor');
  if (!host || !host.querySelector('iframe')) return;

  const el = document.createElement('div');
  el.className = 'agua';
  el.textContent = QUIEN.join('  ·  ');
  host.appendChild(el);

  /* Se mueve entre nueve posiciones, saltando el centro para no taparle la
     cara a quien da la clase y las esquinas de los controles. */
  const sitios = [[8,6],[8,42],[8,80],[46,6],[46,80],[84,6],[84,42],[84,80]];
  let i = Math.floor(Math.random() * sitios.length);
  const mover = () => {
    const [top, left] = sitios[i % sitios.length];
    el.style.top = top + '%';
    el.style.left = left + '%';
    i += 3;   // salto de tres para que no recorra el borde en orden
  };
  mover();
  aguaReloj = setInterval(mover, 8000);
}

/* ── El registro ───────────────────────────────────────────────────────────
   Cada medio minuto mientras la lección está abierta y el vídeo REPRODUCIÉNDOSE
   —no basta con tenerlo abierto en pausa—. La IP la pone el servidor: pedírsela
   al navegador sería pedirle a quien se investiga que rellene el informe.

   Con material antiguo (sólo `url`, sin identificador) no hay API y por tanto
   no hay forma de saber si está en pausa; ahí se cuenta como siempre se contó,
   mientras la pestaña esté visible. */
let verReloj = null, verSegundos = 0, verLeccion = null, jugando = false;
function registrarQueSeVe(l, conAPI){
  clearInterval(verReloj);
  if (!l || l.tipo !== 'video' || !(l.video_id || l.url)) return;
  if (verLeccion !== l.id) { verLeccion = l.id; verSegundos = 0; }
  jugando = !conAPI;

  /* El `.then()` no es decorativo: lo que devuelve `sb.rpc()` es perezoso y no
     sale a la red hasta que alguien lo espera. Sin esto, la llamada quedaba
     montada y nunca se enviaba — y como nadie mira el valor de vuelta, el fallo
     habría pasado desapercibido hasta que alguien preguntara por el registro.
     Los errores se tragan a propósito: que no se pueda anotar quién vio la
     clase no es razón para estropearle la clase a nadie. */
  const anotar = (segundos) =>
    sb.rpc('cem_registrar_reproduccion', { p_lesson_id: l.id, p_segundos: segundos })
      .then(() => {}, () => {});

  const latir = () => {
    if (document.hidden) return;          // pestaña de fondo no es ver clase
    if (!jugando) return;                 // en pausa tampoco
    verSegundos += 30;
    anotar(verSegundos);
  };
  anotar(verSegundos);
  verReloj = setInterval(latir, 30000);
}

/* ── La API de YouTube, cargada una sola vez ────────────────────────────────
   El script se pide siempre al mismo dominio (`youtube.com`, no el de
   `-nocookie`): es la librería que controla al reproductor, no el propio
   reproductor, y Google no la sirve desde el dominio sin cookies. El vídeo en
   sí se sigue pidiendo con `host: 'https://www.youtube-nocookie.com'` al
   crear el reproductor, así que la persona que ve la clase no deja rastro. */
let promesaYT = null;
function cargarYoutubeAPI(){
  if (window.YT?.Player) return Promise.resolve(window.YT);
  if (promesaYT) return promesaYT;
  promesaYT = new Promise((resolve, reject) => {
    const anterior = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { anterior?.(); resolve(window.YT); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => reject(new Error('No se pudo cargar la librería de YouTube.'));
    document.head.appendChild(s);
  });
  return promesaYT;
}

/* El aviso propio que sustituye a la pantalla de Google. Los códigos de error
   de la API están documentados por YouTube: 100 es «no existe o es privado»,
   101 y 150 son el mismo caso —el dueño bloqueó reproducirlo fuera de
   YouTube— con dos números distintos según la versión de la API. */
function avisoSinVideo(codigo){
  // Si onError llegó DESPUÉS de que ya se hubieran arrancado los relojes, hay
  // que apagarlos: nadie está viendo nada.
  clearInterval(aguaReloj); aguaReloj = null;
  clearInterval(verReloj); verReloj = null;
  const host = $('#reproductor');
  if (!host) return;
  /* Un identificador inventado no siempre vuelve como «100 · no existe»: en la
     práctica YouTube a veces lo trata como si el dueño hubiera bloqueado la
     reproducción externa (101/150). No conviene afirmar una causa con más
     certeza de la que se tiene, así que sólo el caso inequívoco —100— lleva un
     motivo concreto; el resto comparte un mensaje honesto. */
  const porque = codigo === 100
    ? 'El vídeo se borró, o quien lo subió lo puso como privado.'
    : 'Puede que este vídeo todavía no se haya emparejado con la lección, o que su reproducción esté restringida.';
  host.innerHTML = `<div style="text-align:center;padding:30px;max-width:360px">
    <span class="material-symbols-outlined" style="font-size:44px;opacity:.65">videocam_off</span>
    <div class="sep-poco" style="font-weight:600">Este vídeo no se puede reproducir todavía</div>
    <div class="tiny" style="opacity:.7;margin-top:4px">${esc(porque)} Avísale a tu profesor o a soporte.</div>
  </div>`;
}

/* ── Montar el reproductor de verdad ─────────────────────────────────────── 
   Aparte de reproductor(), que sólo pinta el hueco: instanciarlo es asíncrono
   —la API tarda en cargar— y mientras carga la persona puede haber cambiado de
   lección, así que se comprueba antes de montar nada encima. */
let ytPlayer = null;
function limpiarReproductor(){
  clearInterval(aguaReloj); aguaReloj = null;
  clearInterval(verReloj); verReloj = null;
  if (ytPlayer) { try { ytPlayer.destroy(); } catch { /* ya no había nada que destruir */ } }
  ytPlayer = null;
}

async function montarReproductor(l){
  limpiarReproductor();
  if (!l || l.tipo !== 'video') return;

  if (l.video_id) {
    let YT;
    try { YT = await cargarYoutubeAPI(); }
    catch { avisoSinVideo(null); return; }
    if (actual?.id !== l.id) return;   // se cambió de lección mientras cargaba
    const host = $('#ytHost');
    if (!host) return;
    /* Cuándo se anota que alguien vio la clase.
       ────────────────────────────────────────
       Antes se anotaba en `onReady`, y estaba mal por dos razones distintas:

       · `onReady` sólo dice que el REPRODUCTOR cargó, no que el vídeo exista.
         Con un identificador inventado dispara igual, y `onError` llega un
         instante después — así que quedaba registrada como vista una clase que
         nunca se reprodujo. Lo encontró la propia prueba automática.
       · Y abrir la página no es ver la clase. Quien entra, mira el título y se
         va no ha visto nada, y contarlo ensucia justamente el dato que sirve
         para detectar una contraseña compartida.

       Así que se anota al primer PLAYING de verdad. La bandera `fallo` corta
       el registro si `onError` dispara, llegue antes o después. */
    let registrado = false, fallo = false;
    ytPlayer = new YT.Player(host, {
      videoId: l.video_id,
      host: 'https://www.youtube-nocookie.com',
      width: '100%', height: '100%',
      playerVars: { rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1, origin: location.origin },
      events: {
        // El <iframe> de verdad no existe hasta este momento: la marca de agua
        // se arranca aquí, no al instanciar el reproductor.
        onReady: () => marcaDeAgua(),
        onStateChange: (ev) => {
          if (fallo) return;
          jugando = ev.data === YT.PlayerState.PLAYING;
          if (jugando && !registrado) { registrado = true; registrarQueSeVe(l, true); }
        },
        onError: (ev) => { fallo = true; avisoSinVideo(ev.data); },
      },
    });
  } else if (l.url) {
    marcaDeAgua();
    registrarQueSeVe(l, false);
  }
}

function render(){
  limpiarReproductor();
  $('#tCurso').textContent = curso?.nombre||'';
  /* El acceso al repaso rápido. Sólo si el curso tiene alguno: un botón que
     lleva a una pantalla vacía es peor que no tenerlo. */
  $('#accionesAula').innerHTML = hayExpress
    ? `<a class="btn outline" href="express.html?curso=${esc(curso?.id || '')}">
        <span class="material-symbols-outlined">bolt</span> Repaso express</a>` : '';
  $('#tProg').innerHTML = `${esc(enr.cem_cohorts?.nombre||'')} · ${pct(enr.progreso)} completado`;
  /* item 41 · el rastro dice de dónde vienes y en qué lección estás; el botón
     «Mi panel» de antes no decía nada de eso. */
  $('#migas').innerHTML = migas([
    ['Mis cursos', 'panel.html'],
    [curso?.nombre || 'Curso', `curso.html?id=${curso?.id || ''}`],
    [actual?.titulo || 'Lección'],
  ]);
  $('#indice').innerHTML = mods.map(m=>`
    <div style="margin-bottom:10px">
      <div class="tiny" style="font-weight:700;text-transform:uppercase;color:var(--on-surface-variant);padding:4px 10px">${esc(m.titulo)}</div>
      ${m.cem_lessons.map(l=>{
        const done = progreso[l.id]?.completado;
        return `<div class="les-item ${actual?.id===l.id?'on':''}" data-l="${l.id}">
          <span class="material-symbols-outlined" style="color:${done?'var(--ok)':'var(--outline)'}">
            ${done?'check_circle':'radio_button_unchecked'}</span>
          <span class="les-t">${esc(l.titulo)}</span>
          <span class="tiny muted" style="flex-shrink:0">${l.duracion_min||0}′</span></div>`;
      }).join('')}
    </div>`).join('');
  $$('[data-l]').forEach(el=>el.onclick=()=>{
    actual = mods.flatMap(m=>m.cem_lessons).find(l=>l.id===el.dataset.l); render();
  });

  const l = actual;
  $('#visor').innerHTML = l ? `
    <div class="player" id="reproductor">${reproductor(l)
      || `<div style="text-align:center;padding:30px">
          <span class="material-symbols-outlined" style="font-size:44px">${l.tipo==='pdf'?'picture_as_pdf':l.tipo==='quiz'?'quiz':'article'}</span>
          <div class="sep-poco">${esc(l.titulo)}</div></div>`}</div>
    <div class="card sep">
      <div class="row between">
        <div><h2 class="sec" style="margin:0 0 4px">${esc(l.titulo)}</h2>
          <div class="tiny muted">${esc(l.descripcion||'')}</div></div>
        <button class="btn ${progreso[l.id]?.completado?'outline':''}" id="btnDone">
          <span class="material-symbols-outlined">${progreso[l.id]?.completado?'check_circle':'done'}</span>
          ${progreso[l.id]?.completado?'Completada':'Marcar completada'}</button>
      </div>
      ${l.contenido?`<p class="muted sep">${esc(l.contenido)}</p>`:''}
      <div class="sep">${bar(enr.progreso)}</div>
    </div>
    ${cierreDelCurso()}` : '<div class="card">Este curso todavía no tiene lecciones publicadas.</div>';

/* Terminar de ver el curso y no saber qué sigue es donde se pierde la gente:
   se queda mirando la última lección sin enterarse de que hay un examen. En
   cuanto no queda nada por ver, el siguiente paso ocupa el sitio del reproductor
   y dice cuál es. */
function cierreDelCurso(){
  const todas = mods.flatMap(m=>m.cem_lessons);
  if (!todas.length || todas.some(x=>!progreso[x.id]?.completado)) return '';

  const pendientes = evals.filter(a=>{
    const mias = entregas.filter(s=>s.assessment_id===a.id);
    const entregada = mias.some(s=>s.entregado_en);
    const aprobada = mias.some(s=>s.puntaje!=null && Number(s.puntaje) >= (a.nota_aprobatoria||70));
    const quedanIntentos = mias.filter(s=>s.entregado_en).length < (a.intentos||1);
    return !aprobada && (!entregada || quedanIntentos);
  });

  if (!pendientes.length) return `<div class="card sep" style="border-color:var(--ok)">
    <div class="row" style="gap:var(--e2)">
      <span class="material-symbols-outlined" style="font-size:34px;color:var(--ok)">workspace_premium</span>
      <div class="crece"><b>Terminaste el programa y no tienes evaluaciones pendientes.</b>
        <div class="tiny muted">Cuando estés al día con los pagos, el certificado aparece en tu sección de certificados.</div></div>
      <a class="btn outline" href="certificados.html">Ver mis certificados</a>
    </div></div>`;

  return `<div class="card sep" style="border-color:var(--primary)">
    <div class="row" style="gap:var(--e2)">
      <span class="material-symbols-outlined" style="font-size:34px;color:var(--primary)">task_alt</span>
      <div class="crece"><b>Viste todo el contenido. Ahora toca la evaluación.</b>
        <div class="tiny muted">${pendientes.length===1
          ? `«${esc(pendientes[0].nombre)}» · sobre ${pendientes[0].puntaje_max||100} puntos, se aprueba con ${pendientes[0].nota_aprobatoria||70}`
          : `Te quedan ${pendientes.length} evaluaciones por presentar.`}</div></div>
      ${pendientes.length===1
        ? `<a class="btn" href="evaluacion.html?id=${pendientes[0].id}&enr=${enr.id}">Ver evaluación</a>`
        : `<button class="btn" id="irEvals">Ver evaluaciones</button>`}
    </div></div>`;
}

  const btn=$('#btnDone');
  if (btn) btn.onclick = async () => {
    const done = !progreso[l.id]?.completado;
    await run(sb.from('cem_lesson_progress').upsert({
      enrollment_id:enr.id, lesson_id:l.id, completado:done, actualizado_en:new Date().toISOString()
    },{onConflict:'enrollment_id,lesson_id'}),'No se pudo guardar el progreso');
    progreso[l.id] = { completado:done };
    const { data: np } = await sb.rpc('cem_recalc_progress',{p_enrollment_id:enr.id});
    enr.progreso = np ?? enr.progreso;
    ok(done?'Lección completada':'Marcada como pendiente');
    render();
  };
  const irEvals = $('#irEvals');
  if (irEvals) irEvals.onclick = () => $('[data-t="evaluaciones"]').click();

  /* El reproductor se repinta entero en cada render, así que se vuelve a
     montar aquí y no una sola vez al cargar. */
  montarReproductor(l);
  const caja = $('#reproductor');
  if (caja) caja.oncontextmenu = (ev) => { ev.preventDefault(); };

  tab($('#tabs button.active')?.dataset.t || 'tablon');
}

$$('#tabs button').forEach(b=>b.onclick=()=>{ $$('#tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); tab(b.dataset.t); });

function tab(t){
  const P=$('#panelTabs');
  if (t==='tablon'){
    /* El tablón es de la cohorte, no de la lección: es donde el profesor
       avisa de lo que pasa con la clase entera. */
    P.innerHTML = '<span class="cargando una"></span>';
    if (!enr?.cohort_id) {
      P.innerHTML = `<div class="empty"><span class="material-symbols-outlined ico">groups</span>
        <b>Esta inscripción no está en ningún grupo</b>
        <span>El tablón es de un grupo con su profesor. Escríbele a coordinación para que te asignen a uno.</span></div>`;
      return;
    }
    sb.rpc('cem_aula', { p_cohort: enr.cohort_id }).then(({ data, error }) => {
      if (error) { P.innerHTML = `<p class="nota err">${esc(mensajeError(error))}</p>`; return; }
      pintarMuro({ host: P, aula: data, yo: me.id, recargar: () => tab('tablon') });
    });
  }
  if (t==='notas'){
    const nota = progreso[actual?.id]?.notas || '';
    P.innerHTML = `<div class="field"><label>Notas personales de esta lección</label>
      <textarea id="nota" placeholder="Escribe tus apuntes…">${esc(nota)}</textarea></div>
      <button class="btn outline sm" id="btnNota"><span class="material-symbols-outlined">save</span> Guardar nota</button>`;
    $('#btnNota').onclick = async () => {
      await run(sb.from('cem_lesson_progress').upsert({
        enrollment_id:enr.id, lesson_id:actual.id, notas:$('#nota').value,
        completado:progreso[actual.id]?.completado||false, actualizado_en:new Date().toISOString()
      },{onConflict:'enrollment_id,lesson_id'}),'No se pudo guardar');
      progreso[actual.id] = { ...(progreso[actual.id]||{}), notas:$('#nota').value };
      ok('Nota guardada');
    };
  }
  if (t==='evaluaciones'){
    P.innerHTML = evals.length ? evals.map(a=>{
      const mias = entregas.filter(s=>s.assessment_id===a.id).sort((x,y)=>y.intento-x.intento);
      const ult = mias[0];
      const abierta = mias.find(s=>s.estado==='en_progreso');
      const usados = mias.length;
      const sinIntentos = !abierta && usados >= (a.intentos||1);
      const aprob = a.nota_aprobatoria||70;
      let estado, accion;
      if (abierta){
        estado = chip('en progreso','warn');
        accion = `<a class="btn sm" href="evaluacion.html?id=${a.id}&enr=${enr.id}">Continuar</a>`;
      } else if (ult?.estado==='calificada'){
        estado = chipNota(ult.puntaje, 100, aprob);
        accion = sinIntentos ? '<span class="tiny muted">Sin intentos</span>'
          : `<a class="btn outline sm" href="evaluacion.html?id=${a.id}&enr=${enr.id}">Reintentar</a>`;
      } else if (ult?.estado==='entregada'){
        estado = chip('en revisión','info');
        accion = '<span class="tiny muted">Esperando calificación</span>';
      } else {
        estado = chip('pendiente','warn');
        accion = `<a class="btn sm" href="evaluacion.html?id=${a.id}&enr=${enr.id}">Rendir</a>`;
      }
      return `<div class="list-item">
        <span class="material-symbols-outlined">${a.tipo==='examen'?'quiz':'assignment'}</span>
        <div class="grow"><div class="t">${esc(a.nombre)}</div>
          <div class="s">${esc(a.tipo||'')} · nota mínima ${aprob} · intento ${Math.min(usados||1,a.intentos||1)} de ${a.intentos||1}${a.tiempo_min?` · ${a.tiempo_min} min`:''}</div></div>
        ${estado}${accion}</div>`;
    }).join('') : '<p class="muted tiny">Este curso todavía no tiene evaluaciones publicadas.</p>';
  }
  if (t==='recursos'){
    P.innerHTML = media.length ? media.map(m=>`<div class="list-item">
      <span class="material-symbols-outlined">${m.tipo==='pdf'?'picture_as_pdf':m.tipo==='video'?'play_circle':'dataset'}</span>
      <div class="grow"><div class="t">${esc(m.nombre)}</div>
        <div class="s">${esc(m.tipo)} · ${(Number(m.tamano_bytes||0)/1048576).toFixed(1)} MB</div></div>
      ${m.url?`<a class="btn outline sm" href="${esc(m.url)}" target="_blank"><span class="material-symbols-outlined">download</span></a>`:''}
      </div>`).join('') : '<p class="muted tiny">Sin recursos para este curso.</p>';
  }
  if (t==='sesiones'){
    P.innerHTML = clases.length ? clases.map(c=>`<div class="list-item">
      <div style="text-align:center;min-width:42px"><b>${new Date(c.fecha+'T12:00').getDate()}</b>
        <div class="tiny muted">${new Date(c.fecha+'T12:00').toLocaleDateString('es-ES',{month:'short'})}</div></div>
      <div class="grow"><div class="t">${esc(c.titulo)}</div>
        <div class="s">${(c.hora_inicio||'').slice(0,5)}–${(c.hora_fin||'').slice(0,5)} · ${esc(c.modalidad.replace('_',' '))}</div></div>
      ${chipEstado(c.estado)}
      ${c.estado!=='dictada'&&c.url_sesion?`<a class="btn sm" href="${esc(c.url_sesion)}" target="_blank">Unirme</a>`:''}
      ${c.grabacion_url?`<a class="btn outline sm" href="${esc(c.grabacion_url)}" target="_blank">Grabación</a>`:''}
      ${c.estado==='dictada'?`<button class="btn outline sm" data-opinar="${esc(c.id)}"
          data-titulo="${esc(c.titulo)}">Opinar</button>`:''}
      </div>`).join('') : '<p class="muted tiny">Sin sesiones programadas.</p>';
    $$('[data-opinar]', P).forEach(b => b.onclick = () => opinar(b.dataset.opinar, b.dataset.titulo));
  }
}

/* ============ qué te pareció la clase ============
   Tres notas de 1 a 5 y un comentario. Tres porque son las que se contestan
   sin pensarlo mucho: si se piden ocho, nadie contesta ninguna. Y el profesor
   lo ve SIN NOMBRE: si se supiera quién dijo qué, nadie diría nada útil. */
function opinar(claseId, titulo){
  const escala = (id, etiqueta, ayuda) => `
    <div class="field"><label>${esc(etiqueta)} <span class="tiny muted">${esc(ayuda)}</span></label>
      <div class="escala" id="${id}">${[1,2,3,4,5].map(n =>
        `<button type="button" data-v="${n}">${n}</button>`).join('')}</div></div>`;

  const m = modal({ title:`¿Qué te pareció «${titulo}»?`, body:`
    <p class="tiny muted">Tu profesor ve el promedio y lo que escribas, pero <b>no quién lo escribió</b>.
      Contesta con confianza: es para que la próxima clase salga mejor.</p>
    ${escala('vClaridad', 'Se entendió', '1 = nada · 5 = clarísimo')}
    ${escala('vUtilidad', 'Me sirve', '1 = nada · 5 = mucho')}
    ${escala('vRitmo', 'El ritmo', '1 = muy lento o muy rápido · 5 = justo')}
    <div class="field"><label>¿Algo que mejorarías? (opcional)</label>
      <textarea id="vCom" rows="3" maxlength="600"
        placeholder="Por ejemplo: los ejemplos ayudaron mucho, pero la última parte fue muy rápida."></textarea></div>
    <div id="vMsg"></div>`,
    footer:`<button class="btn outline" data-x>Ahora no</button>
            <button class="btn" id="vGo">Enviar</button>` });

  const valores = {};
  $$('.escala button', m).forEach(b => b.onclick = () => {
    const caja = b.parentElement;
    $$('button', caja).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    valores[caja.id] = Number(b.dataset.v);
  });

  $('#vGo', m).onclick = () => ocupado('#vGo', 'Enviando…', async () => {
    if (!valores.vClaridad || !valores.vUtilidad || !valores.vRitmo) {
      avisar($('#vMsg', m), 'Marca las tres: son un clic cada una.', 'err'); return;
    }
    const { error } = await sb.rpc('cem_valorar_clase', {
      p_class_id: claseId, p_claridad: valores.vClaridad,
      p_utilidad: valores.vUtilidad, p_ritmo: valores.vRitmo,
      p_comentario: $('#vCom', m).value.trim() || null,
    });
    if (error) { avisar($('#vMsg', m), mensajeError(error), 'err'); return; }
    m.close(); ok('Gracias. Tu profesor lo verá sin tu nombre.');
  });
}
</script>
