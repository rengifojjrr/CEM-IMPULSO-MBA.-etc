<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM · Mis logros</title>
<!-- El logotipo, para cada quien lo pida: .ico para Google y lo viejo,
     PNG para todo lo demás, SVG para quien prefiera un vector, y el de 180
     para el iPhone. Ver herramientas/iconos.mjs. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="../assets/favicon-96.png">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="apple-touch-icon" href="../assets/icono-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d2440">
<!-- Los cuatro servidores de fuera, avisados de golpe y no en fila.
     Sin esto el navegador descubre cada uno cuando le toca, y paga el
     DNS y el saludo TLS de cada cual por separado, con la pantalla en
     blanco mientras tanto. Ver herramientas/acelerar-cabeceras.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://vajbsfgojtunamhrzrpf.supabase.co" crossorigin>
<link rel="modulepreload" href="../assets/app.js?v=2026-09-03">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-09-03">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  .cert{background:var(--papel);border:1px solid var(--filete);
    border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:flex-start;}

  /* El certificado, a la vista.
     ----------------------------------------------------------------------
     Estaba dibujado desde el principio, pero detrás de un botón que decía
     «Descargar»: nadie pulsa descargar para ver algo. Ahora se ve la lámina
     de verdad —la misma, no un dibujo parecido— reducida dentro de un marco.

     Se reduce con `transform:scale`, no cambiando los tamaños de letra, para
     que sea literalmente el mismo trozo de página en pequeño: si mañana se
     cambia el diseño de la lámina, la miniatura cambia sola. El marco tiene
     alto fijo y `overflow:hidden` porque un elemento escalado sigue ocupando
     su tamaño original en la maquetación. */
  /* sin-caja: enmarca un lienzo escalado; el vidrio lo deformaria */
  .cert-mini{width:210px;flex:none;border:1px solid var(--filete);border-radius:var(--r);
    overflow:hidden;background:#fff;cursor:zoom-in;padding:0;display:block;
    height:150px;position:relative;}
  .cert-mini:hover{border-color:var(--primary);}
  .cert-mini > div{transform:scale(.34);transform-origin:top left;width:618px;pointer-events:none;}
  .cert-mini .lupa{position:absolute;inset:auto 6px 6px auto;background:rgba(0,0,0,.62);color:#fff;
    border-radius:var(--r-full);width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
  .cert-mini .lupa .material-symbols-outlined{font-size:16px;}
  @media(max-width:560px){ .cert{flex-direction:column;} .cert-mini{width:100%;} }
  .badge-card{text-align:center;padding:18px;width:100%;border:1px solid var(--filete);
    cursor:pointer;font:inherit;color:inherit;transition:border-color var(--rapido);}
  .badge-card:hover{border-color:var(--primary);}
  .badge-ico{width:62px;height:62px;border-radius:var(--r-full);background:var(--gold-suave);color:var(--gold);
    display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px;}
  .badge-ico .material-symbols-outlined{font-size:var(--t-2xl);}
  .badge-card.locked{opacity:.5;} .badge-card.locked .badge-ico{background:var(--hueco);color:var(--filete-fuerte);}
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head"><div><h1>Mis logros</h1>
    <p>Revisa y descarga tus certificaciones e insignias oficiales de CEM International.</p></div></div>

  <h2 class="sec">Certificados oficiales</h2>
  <div class="grid g2" id="certs"></div>

  <h2 class="sec sep-mucho">Camino a la certificación</h2>
  <div class="card" id="camino"></div>

  <h2 class="sec sep-mucho">Insignias</h2>
  <div class="grid g4" id="badges"></div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, bar, pct, fdate, modal, vacio } from '../assets/app.js?v=2026-09-03';
import { lienzoCertificado } from '../assets/certificado.js?v=2026-09-03';
const me = await mount({ require:['estudiante'], active:'certificados.html', area:'estudiante' });
if (me) load();

async function load(){
  /* item 33 · las reglas de las insignias estaban escritas en la base y no las
     llamaba nadie: ni una pantalla, ni un disparador, ni la tarea programada.
     O sea que ninguna se otorgaba sola, por bien definida que estuviera.

     Se piden aquí, que es la pantalla donde se van a mirar, y sólo para uno
     mismo — la función rechaza evaluar a otro si no eres del equipo. Si algo
     falla, la pantalla sigue: no ver una insignia nueva es molesto, no poder
     ver los certificados sería peor. */
  try { await sb.rpc('cem_evaluar_insignias'); } catch { /* ver arriba */ }

  const [{data:certs},{data:ens},{data:all},{data:mine}] = await Promise.all([
    sb.from('cem_certificates').select('*,cem_courses(nombre)').eq('profile_id',me.id).order('emitido_en',{ascending:false}).limit(500),
    sb.from('cem_enrollments').select('*,cem_courses(nombre,certificado_nombre)').eq('profile_id',me.id).limit(500),
    sb.from('cem_badges').select('*').eq('activo',true).order('nombre'),
    sb.from('cem_badge_awards').select('badge_id,otorgado_en').eq('profile_id',me.id),
  ]);
  const got = new Set((mine||[]).map(x=>x.badge_id));

  $('#certs').innerHTML = (certs||[]).length ? certs.map(c=>`
    <div class="cert caja">
      <button type="button" class="cert-mini" data-ver="${c.id}"
              title="Ver el certificado en grande" aria-label="Ver en grande el certificado de ${esc(c.titulo)}">
        ${lienzo(c)}
        <span class="lupa"><span class="material-symbols-outlined" aria-hidden="true">zoom_in</span></span>
      </button>
      <div class="crece">
        <span class="chip ok">Completado · ${fdate(c.emitido_en)}</span>
        <h3 style="margin:8px 0 4px;font-size:16px">${esc(c.titulo)}</h3>
        <div class="tiny muted">Otorgado por CEM International Education System</div>
        <div class="tiny muted">ID: <code>${esc(c.codigo)}</code></div>
        <div class="row sep">
          <button class="btn sm" data-pdf="${c.id}"><span class="material-symbols-outlined" aria-hidden="true">visibility</span> Ver y descargar</button>
          <a class="btn outline sm" href="../verificar.html?codigo=${encodeURIComponent(c.codigo)}" target="_blank">
            <span class="material-symbols-outlined" aria-hidden="true">verified</span> Verificar</a>
        </div>
      </div></div>`).join('')
    : `<div class="card sin-margen">${vacio({ icono:'workspace_premium',
        titulo:'Todavía no tienes certificados',
        texto:'Al terminar un programa, aprobar sus evaluaciones y quedar sin deuda, tu certificado aparece aquí para descargar.' })}</div>`;

  $$('[data-pdf]').forEach(b=>b.onclick=()=>verCertificado((certs||[]).find(c=>c.id===b.dataset.pdf)));
  $$('[data-ver]').forEach(b=>b.onclick=()=>verCertificado((certs||[]).find(c=>c.id===b.dataset.ver)));

  /* item 58 · antes esto decía «necesitas el 80%» y mostraba una barra. Los
     requisitos de verdad son tres —no deber nada, aprobar las evaluaciones y
     llegar al 100%— y el servidor ya los calcula al emitir. Aquí se muestran
     los del propio estudiante, con lo cumplido marcado, para que sepa qué le
     falta sin tener que preguntarlo. */
  const enCurso = (ens||[]).filter(e=>!(certs||[]).some(c=>c.enrollment_id===e.id));
  const requisitos = await Promise.all(enCurso.map(async e => {
    const { data } = await sb.rpc('cem_mis_requisitos_certificado', { p_enrollment_id: e.id });
    return data || null;
  }));

  const punto = (cumplido, texto) => `<div class="row" style="gap:7px;align-items:flex-start;padding:3px 0">
    <span class="material-symbols-outlined" style="font-size:18px;color:var(--${cumplido?'ok':'outline'})">
      ${cumplido ? 'check_circle' : 'radio_button_unchecked'}</span>
    <span class="tiny${cumplido ? ' muted' : ''}">${texto}</span></div>`;

  $('#camino').innerHTML = enCurso.length ? enCurso.map((e, i) => {
    const r = requisitos[i];
    const nombre = esc(e.cem_courses?.certificado_nombre || e.cem_courses?.nombre || '');
    if (!r) return `<div class="list-item"><div class="grow"><div class="t">${nombre}</div>
      <div class="s">No pudimos consultar los requisitos ahora mismo. Recarga la página en un momento.</div></div></div>`;
    const sinDeuda = Number(r.deuda) <= 0;
    const evalOk = Number(r.evaluaciones_aprobadas) >= Number(r.evaluaciones_total);
    const completo = Number(r.avance) >= 100;
    return `<div class="list-item"><div class="grow">
      <div class="t">${nombre}</div>
      <div style="margin:6px 0">${bar(e.progreso, true)}</div>
      ${/* Cada cosa que falta lleva al sitio donde se hace. Antes decía «te
            faltan 3 evaluaciones» y ahí se acababa: había que salir, adivinar
            en qué pantalla estaban y buscarlas. Enumerar deberes sin dar la
            puerta es hacer trabajar a quien ya va retrasado. */''}
      ${punto(completo, completo
        ? 'Terminaste todas las lecciones.'
        : `Te falta terminar el programa: vas en ${pct(r.avance)}.
           <a href="clase.html?curso=${esc(e.course_id)}">Seguir donde lo dejaste</a>`)}
      ${punto(evalOk, evalOk
        ? `Aprobaste las ${r.evaluaciones_total} evaluación(es).`
        : `Te faltan ${Number(r.evaluaciones_total) - Number(r.evaluaciones_aprobadas)} evaluación(es) de ${r.evaluaciones_total} por aprobar.
           <a href="evaluaciones.html?curso=${esc(e.course_id)}">Ver cuáles son</a>`)}
      ${punto(sinDeuda, sinDeuda
        ? 'No tienes nada pendiente de pago.'
        : `Te quedan ${r.cuotas_pendientes} cuota(s) por pagar. <a href="pagos.html">Ver mis pagos</a>`)}
      </div>
      ${r.listo ? chip('Cumples todo: falta que lo emitan','ok') : chip('Te falta algo','warn')}</div>`;
  }).join('')
    : vacio({ icono:'flag', titulo:'No tienes programas en camino',
        texto:'Cuando te inscribas en uno, aquí verás qué te falta para certificarte.',
        accion:{ texto:'Ver el catálogo', href:'catalogo.html' } });

  /* Las insignias se abren.
     ----------------------------------------------------------------------
     La ficha enseñaba el nombre, el nivel y el criterio recortado a dos
     líneas, así que la mitad de las insignias decían algo como «Completa el
     primer módu…». Una insignia que no explica qué significa ni por qué la
     tienes no premia nada: es un icono bonito. Dentro está la descripción
     entera, la competencia que reconoce, qué hay que hacer para ganarla y,
     si ya la tienes, cuándo te la dieron. */
  const cuando = {}; (mine||[]).forEach(x => { cuando[x.badge_id] = x.otorgado_en; });
  $('#badges').innerHTML = (all||[]).map(b=>{
    const has = got.has(b.id);
    return `<button type="button" class="card badge-card ${has?'':'locked'} sin-margen" data-insignia="${esc(b.id)}"
              aria-label="Ver qué significa la insignia ${esc(b.nombre)}">
      <div class="badge-ico"><span class="material-symbols-outlined" aria-hidden="true">${esc(b.icono||'military_tech')}</span></div>
      <div style="font-weight:600;font-size:13.5px">${esc(b.nombre)}</div>
      <div class="tiny muted">${esc(b.nivel||'')}</div>
      <div class="sep-poco">${has?chip('obtenida','ok'):chip('bloqueada','neutral')}</div></button>`;
  }).join('') || '<div class="card">Sin insignias configuradas.</div>';

  $$('[data-insignia]').forEach(el => el.onclick = () => {
    const b = (all||[]).find(x => x.id === el.dataset.insignia);
    if (!b) return;
    const has = got.has(b.id);
    modal({ title: b.nombre, body: `
      <div style="text-align:center;margin-bottom:14px">
        <div class="badge-ico" style="${has?'':'opacity:.5'}">
          <span class="material-symbols-outlined">${esc(b.icono||'military_tech')}</span></div>
        <div>${has ? chip('la tienes','ok') : chip('todavía no la tienes','neutral')}</div>
      </div>
      ${b.descripcion ? `<p>${esc(b.descripcion)}</p>` : ''}
      ${b.competencia ? `<p class="tiny muted"><b>Reconoce:</b> ${esc(b.competencia)}${
        b.nivel ? ` · nivel ${esc(b.nivel)}` : ''}</p>` : ''}
      ${b.criterio ? `<div class="card sep" style="background:var(--hueco);box-shadow:none">
        <b class="tiny">${has ? 'Por qué la tienes' : 'Cómo se consigue'}</b>
        <p class="tiny" style="margin:6px 0 0">${esc(b.criterio)}</p></div>` : ''}
      ${has && cuando[b.id]
        ? `<p class="tiny muted sep">Te la dieron el ${fdate(cuando[b.id])}.</p>` : ''}`,
      footer: `<button class="btn outline" data-x>Cerrar</button>` });
  });
}

/* La lámina, escrita una sola vez.
   ------------------------------------------------------------------------
   La miniatura de la tarjeta y la vista grande son el mismo HTML: si fueran
   dos, la miniatura acabaría enseñando un certificado que ya no es el que se
   imprime, y eso es peor que no enseñar ninguno. Sólo cambia el marco que lo
   contiene. */
/* El dibujo del diploma vive en assets/certificado.js: el mismo se enseña en
   la ficha del equipo y, con marca de agua, en el perfil que se comparte. Aquí
   va limpio — es su certificado y ésta es su cuenta. */
const lienzo = (c, opciones = {}) =>
  lienzoCertificado(c, `${me.nombre} ${me.apellido || ''}`.trim(),
                    { ...opciones, qr: window.qrcode });

function verCertificado(c){
  const m = modal({ title:'Certificado', wide:true, body: lienzo(c, { id:'lienzo' }),
    footer:`<button class="btn outline" data-x2>Cerrar</button><button class="btn" data-print>
      <span class="material-symbols-outlined" aria-hidden="true">print</span> Imprimir / Guardar PDF</button>` });
  $('[data-x2]',m).onclick=m.close;
  $('[data-print]',m).onclick=()=>{
    const w = window.open('','_blank');
    w.document.write(`<html><head><title>${esc(c.codigo)}</title>
      <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
      <style>body{font-family:'Hanken Grotesk',sans-serif;padding:30px;} code{font-size:12px}</style></head>
      <body>${$('#lienzo',m).outerHTML}<script>onload=()=>print()<\/script></body></html>`);
    w.document.close();
  };
}
</script>
</body>
</html>
