<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM · Mis logros</title>
<!-- El logotipo, para cada quien lo pida: .ico para Google y lo viejo,
     PNG para todo lo demás, SVG para quien prefiera un vector, y el de 180
     para el iPhone. Ver herramientas/iconos.mjs. -->
<link rel="icon" href="/favicon.ico?v=2026-09-03" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="../assets/favicon-96.png?v=2026-09-03">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2026-09-03">
<link rel="apple-touch-icon" href="../assets/icono-180.png?v=2026-09-03">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d2440">
<!-- Los cuatro servidores de fuera, avisados de golpe y no en fila.
     Sin esto el navegador descubre cada uno cuando le toca, y paga el
     DNS y el saludo TLS de cada cual por separado, con la pantalla en
     blanco mientras tanto. Ver herramientas/acelerar-cabeceras.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://vajbsfgojtunamhrzrpf.supabase.co" crossorigin>
<link rel="modulepreload" href="../assets/app.js?v=2026-09-04-4">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-09-04-4">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<!-- Para armar la constancia de fe de erratas: un .docx es un zip, y se le
     sustituyen las marcas sin tocar nada más. El mismo JSZip que usa el
     generador para los ZIP de cada grupo. -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  .cert{background:var(--papel);border:1px solid var(--filete);
    border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:flex-start;}

  /* El certificado, a la vista.
     ----------------------------------------------------------------------
     Estaba dibujado desde el principio, pero detrás de un botón que decía
     «Descargar»: nadie pulsa descargar para ver algo. Ahora se ve la lámina
     de verdad —la misma, no un dibujo parecido— reducida dentro de un marco.

     Se reduce con `transform:scale`, no cambiando los tamaños de letra, para
     que sea literalmente el mismo trozo de página en pequeño: si mañana se
     cambia el diseño de la lámina, la miniatura cambia sola. El marco tiene
     alto fijo y `overflow:hidden` porque un elemento escalado sigue ocupando
     su tamaño original en la maquetación. */
  /* sin-caja: enmarca un lienzo escalado; el vidrio lo deformaria */
  .cert-mini{width:210px;flex:none;border:1px solid var(--filete);border-radius:var(--r);
    overflow:hidden;background:#fff;cursor:zoom-in;padding:0;display:block;
    height:150px;position:relative;}
  .cert-mini:hover{border-color:var(--primary);}
  .cert-mini > div{transform:scale(.34);transform-origin:top left;width:618px;pointer-events:none;}
  .cert-mini .lupa{position:absolute;inset:auto 6px 6px auto;background:rgba(0,0,0,.62);color:#fff;
    border-radius:var(--r-full);width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
  .cert-mini .lupa .material-symbols-outlined{font-size:16px;}
  @media(max-width:560px){ .cert{flex-direction:column;} .cert-mini{width:100%;} }
  .badge-card{text-align:center;padding:18px;width:100%;border:1px solid var(--filete);
    cursor:pointer;font:inherit;color:inherit;transition:border-color var(--rapido);}
  .badge-card:hover{border-color:var(--primary);}
  .badge-ico{width:62px;height:62px;border-radius:var(--r-full);background:var(--gold-suave);color:var(--gold);
    display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px;}
  .badge-ico .material-symbols-outlined{font-size:var(--t-2xl);}
  .badge-card.locked{opacity:.5;} .badge-card.locked .badge-ico{background:var(--hueco);color:var(--filete-fuerte);}

  /* La fila del diploma, la miniatura y la lámina grande viven en la hoja
     compartida: las usa también la ficha que mira el equipo, y tenerlas aquí
     dejaría dos miniaturas distintas dentro de un mes. */

  /* El aviso de la fe de erratas. Va en ámbar y no con el azul de la casa
     porque no es una acción más de la fila: es algo que hay que leer una vez.
     Ámbar y no rojo, que es la otra tentación — el título de esta persona no
     tiene ningún problema, y pintarlo de alarma diría lo contrario. */
  .dip-aviso{background:var(--warn);border-color:var(--warn);color:#1f2937;}
  .dip-aviso:hover{filter:brightness(.95);}

  /* La constancia, dentro de la ventana: se lee como un documento, no como una
     pantalla, así que se le da medida de lectura y un poco de aire. */
  .constancia{padding:var(--e3);max-width:70ch;}
  .constancia p{margin:0 0 var(--e1);}
  .constancia h4{margin-top:var(--e2);font-size:var(--t-sm);}
  .cons-datos{margin:var(--e1) 0 0;}
  .cons-datos > div{display:flex;justify-content:space-between;gap:var(--e2);
    padding:7px 0;border-bottom:1px solid var(--filete);}
  .cons-datos > div:last-child{border-bottom:0;}
  .cons-datos dt{color:var(--tinta-2);font-size:var(--t-xs);margin:0;flex:none;}
  .cons-datos dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere;
    font-weight:var(--peso-fuerte);}
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head"><div><h1>Mis logros</h1>
    <p>Revisa y descarga tus certificaciones e insignias oficiales de CEM International.</p></div></div>

  <h2 class="sec">Certificados oficiales</h2>
  <div class="grid g2" id="certs"></div>

  <div id="egresado" hidden>
    <h2 class="sec sep-mucho">Tus diplomados</h2>
    <p class="tiny muted" style="margin:-6px 0 10px">
      Encontrados por tu cédula. Si hiciste más de un diplomado, aquí salen todos.</p>
    <div class="card" id="egresado-lista"></div>
  </div>

  <h2 class="sec sep-mucho">Camino a la certificación</h2>
  <div class="card" id="camino"></div>

  <h2 class="sec sep-mucho">Insignias</h2>
  <div class="grid g4" id="badges"></div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, bar, pct, fdate, modal, vacio, ok, fail } from '../assets/app.js?v=2026-09-04-4';
import { lienzoCertificado } from '../assets/certificado.js?v=2026-09-04-4';
/* El MISMO dibujante que usa la escuela para imprimir. No una copia: el propio
   módulo del que tira el generador. Es lo que garantiza que el diploma que se
   ve aquí y el que llega impreso sean el mismo documento. */
import { dibujarCertificadoEmitido } from '../../certificados/dibujar.js?v=2026-09-04-4';
import { construirConstancia, nombreDeArchivo, textoDeLaConstancia }
  from '../../certificados/constancia.js?v=2026-09-04-4';
const me = await mount({ require:['estudiante'], active:'certificados.html', area:'estudiante' });
if (me) load();

async function load(){
  /* item 33 · las reglas de las insignias estaban escritas en la base y no las
     llamaba nadie: ni una pantalla, ni un disparador, ni la tarea programada.
     O sea que ninguna se otorgaba sola, por bien definida que estuviera.

     Se piden aquí, que es la pantalla donde se van a mirar, y sólo para uno
     mismo — la función rechaza evaluar a otro si no eres del equipo. Si algo
     falla, la pantalla sigue: no ver una insignia nueva es molesto, no poder
     ver los certificados sería peor. */
  try { await sb.rpc('cem_evaluar_insignias'); } catch { /* ver arriba */ }

  const [{data:certs},{data:ens},{data:all},{data:mine}] = await Promise.all([
    sb.from('cem_certificates').select('*,cem_courses(nombre)').eq('profile_id',me.id).order('emitido_en',{ascending:false}).limit(500),
    sb.from('cem_enrollments').select('*,cem_courses(nombre,certificado_nombre)').eq('profile_id',me.id).limit(500),
    sb.from('cem_badges').select('*').eq('activo',true).order('nombre'),
    sb.from('cem_badge_awards').select('badge_id,otorgado_en').eq('profile_id',me.id),
  ]);
  const got = new Set((mine||[]).map(x=>x.badge_id));

  $('#certs').innerHTML = (certs||[]).length ? certs.map(c=>`
    <div class="cert caja">
      <button type="button" class="cert-mini" data-ver="${c.id}"
              title="Ver el certificado en grande" aria-label="Ver en grande el certificado de ${esc(c.titulo)}">
        ${lienzo(c)}
        <span class="lupa"><span class="material-symbols-outlined" aria-hidden="true">zoom_in</span></span>
      </button>
      <div class="crece">
        <span class="chip ok">Completado · ${fdate(c.emitido_en)}</span>
        <h3 style="margin:8px 0 4px;font-size:16px">${esc(c.titulo)}</h3>
        <div class="tiny muted">Otorgado por CEM International Education System</div>
        <div class="tiny muted">ID: <code>${esc(c.codigo)}</code></div>
        <div class="row sep">
          <button class="btn sm" data-pdf="${c.id}"><span class="material-symbols-outlined" aria-hidden="true">visibility</span> Ver y descargar</button>
          <a class="btn outline sm" href="../verificar.html?codigo=${encodeURIComponent(c.codigo)}" target="_blank">
            <span class="material-symbols-outlined" aria-hidden="true">verified</span> Verificar</a>
        </div>
      </div></div>`).join('')
    : `<div class="card sin-margen">${vacio({ icono:'workspace_premium',
        titulo:'Todavía no tienes certificados',
        texto:'Al terminar un programa, aprobar sus evaluaciones y quedar sin deuda, tu certificado aparece aquí para descargar.' })}</div>`;

  $$('[data-pdf]').forEach(b=>b.onclick=()=>verCertificado((certs||[]).find(c=>c.id===b.dataset.pdf)));
  $$('[data-ver]').forEach(b=>b.onclick=()=>verCertificado((certs||[]).find(c=>c.id===b.dataset.ver)));

  /* item 58 · antes esto decía «necesitas el 80%» y mostraba una barra. Los
     requisitos de verdad son tres —no deber nada, aprobar las evaluaciones y
     llegar al 100%— y el servidor ya los calcula al emitir. Aquí se muestran
     los del propio estudiante, con lo cumplido marcado, para que sepa qué le
     falta sin tener que preguntarlo. */
  const enCurso = (ens||[]).filter(e=>!(certs||[]).some(c=>c.enrollment_id===e.id));
  const requisitos = await Promise.all(enCurso.map(async e => {
    const { data } = await sb.rpc('cem_mis_requisitos_certificado', { p_enrollment_id: e.id });
    return data || null;
  }));

  const punto = (cumplido, texto) => `<div class="row" style="gap:7px;align-items:flex-start;padding:3px 0">
    <span class="material-symbols-outlined" style="font-size:18px;color:var(--${cumplido?'ok':'outline'})">
      ${cumplido ? 'check_circle' : 'radio_button_unchecked'}</span>
    <span class="tiny${cumplido ? ' muted' : ''}">${texto}</span></div>`;

  $('#camino').innerHTML = enCurso.length ? enCurso.map((e, i) => {
    const r = requisitos[i];
    const nombre = esc(e.cem_courses?.certificado_nombre || e.cem_courses?.nombre || '');
    if (!r) return `<div class="list-item"><div class="grow"><div class="t">${nombre}</div>
      <div class="s">No pudimos consultar los requisitos ahora mismo. Recarga la página en un momento.</div></div></div>`;
    const sinDeuda = Number(r.deuda) <= 0;
    const evalOk = Number(r.evaluaciones_aprobadas) >= Number(r.evaluaciones_total);
    const completo = Number(r.avance) >= 100;
    return `<div class="list-item"><div class="grow">
      <div class="t">${nombre}</div>
      <div style="margin:6px 0">${bar(e.progreso, true)}</div>
      ${/* Cada cosa que falta lleva al sitio donde se hace. Antes decía «te
            faltan 3 evaluaciones» y ahí se acababa: había que salir, adivinar
            en qué pantalla estaban y buscarlas. Enumerar deberes sin dar la
            puerta es hacer trabajar a quien ya va retrasado. */''}
      ${punto(completo, completo
        ? 'Terminaste todas las lecciones.'
        : `Te falta terminar el programa: vas en ${pct(r.avance)}.
           <a href="clase.html?curso=${esc(e.course_id)}">Seguir donde lo dejaste</a>`)}
      ${punto(evalOk, evalOk
        ? `Aprobaste las ${r.evaluaciones_total} evaluación(es).`
        : `Te faltan ${Number(r.evaluaciones_total) - Number(r.evaluaciones_aprobadas)} evaluación(es) de ${r.evaluaciones_total} por aprobar.
           <a href="evaluaciones.html?curso=${esc(e.course_id)}">Ver cuáles son</a>`)}
      ${punto(sinDeuda, sinDeuda
        ? 'No tienes nada pendiente de pago.'
        : `Te quedan ${r.cuotas_pendientes} cuota(s) por pagar. <a href="pagos.html">Ver mis pagos</a>`)}
      </div>
      ${r.listo ? chip('Cumples todo: falta que lo emitan','ok') : chip('Te falta algo','warn')}</div>`;
  }).join('')
    : vacio({ icono:'flag', titulo:'No tienes programas en camino',
        texto:'Cuando te inscribas en uno, aquí verás qué te falta para certificarte.',
        accion:{ texto:'Ver el catálogo', href:'catalogo.html' } });

  /* Las insignias se abren.
     ----------------------------------------------------------------------
     La ficha enseñaba el nombre, el nivel y el criterio recortado a dos
     líneas, así que la mitad de las insignias decían algo como «Completa el
     primer módu…». Una insignia que no explica qué significa ni por qué la
     tienes no premia nada: es un icono bonito. Dentro está la descripción
     entera, la competencia que reconoce, qué hay que hacer para ganarla y,
     si ya la tienes, cuándo te la dieron. */
  const cuando = {}; (mine||[]).forEach(x => { cuando[x.badge_id] = x.otorgado_en; });
  $('#badges').innerHTML = (all||[]).map(b=>{
    const has = got.has(b.id);
    return `<button type="button" class="card badge-card ${has?'':'locked'} sin-margen" data-insignia="${esc(b.id)}"
              aria-label="Ver qué significa la insignia ${esc(b.nombre)}">
      <div class="badge-ico"><span class="material-symbols-outlined" aria-hidden="true">${esc(b.icono||'military_tech')}</span></div>
      <div style="font-weight:600;font-size:13.5px">${esc(b.nombre)}</div>
      <div class="tiny muted">${esc(b.nivel||'')}</div>
      <div class="sep-poco">${has?chip('obtenida','ok'):chip('bloqueada','neutral')}</div></button>`;
  }).join('') || '<div class="card">Sin insignias configuradas.</div>';

  $$('[data-insignia]').forEach(el => el.onclick = () => {
    const b = (all||[]).find(x => x.id === el.dataset.insignia);
    if (!b) return;
    const has = got.has(b.id);
    modal({ title: b.nombre, body: `
      <div style="text-align:center;margin-bottom:14px">
        <div class="badge-ico" style="${has?'':'opacity:.5'}">
          <span class="material-symbols-outlined">${esc(b.icono||'military_tech')}</span></div>
        <div>${has ? chip('la tienes','ok') : chip('todavía no la tienes','neutral')}</div>
      </div>
      ${b.descripcion ? `<p>${esc(b.descripcion)}</p>` : ''}
      ${b.competencia ? `<p class="tiny muted"><b>Reconoce:</b> ${esc(b.competencia)}${
        b.nivel ? ` · nivel ${esc(b.nivel)}` : ''}</p>` : ''}
      ${b.criterio ? `<div class="card sep" style="background:var(--hueco);box-shadow:none">
        <b class="tiny">${has ? 'Por qué la tienes' : 'Cómo se consigue'}</b>
        <p class="tiny" style="margin:6px 0 0">${esc(b.criterio)}</p></div>` : ''}
      ${has && cuando[b.id]
        ? `<p class="tiny muted sep">Te la dieron el ${fdate(cuando[b.id])}.</p>` : ''}`,
      footer: `<button class="btn outline" data-x>Cerrar</button>` });
  });
}

/* La lámina, escrita una sola vez.
   ------------------------------------------------------------------------
   La miniatura de la tarjeta y la vista grande son el mismo HTML: si fueran
   dos, la miniatura acabaría enseñando un certificado que ya no es el que se
   imprime, y eso es peor que no enseñar ninguno. Sólo cambia el marco que lo
   contiene. */
/* El dibujo del diploma vive en assets/certificado.js: el mismo se enseña en
   la ficha del equipo y, con marca de agua, en el perfil que se comparte. Aquí
   va limpio — es su certificado y ésta es su cuenta. */
const lienzo = (c, opciones = {}) =>
  lienzoCertificado(c, `${me.nombre} ${me.apellido || ''}`.trim(),
                    { ...opciones, qr: window.qrcode });

function verCertificado(c){
  const m = modal({ title:'Certificado', wide:true, body: lienzo(c, { id:'lienzo' }),
    footer:`<button class="btn outline" data-x2>Cerrar</button><button class="btn" data-print>
      <span class="material-symbols-outlined" aria-hidden="true">print</span> Imprimir / Guardar PDF</button>` });
  $('[data-x2]',m).onclick=m.close;
  $('[data-print]',m).onclick=()=>{
    const w = window.open('','_blank');
    w.document.write(`<html><head><title>${esc(c.codigo)}</title>
      <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
      <style>body{font-family:'Hanken Grotesk',sans-serif;padding:30px;} code{font-size:12px}</style></head>
      <body>${$('#lienzo',m).outerHTML}<script>onload=()=>print()<\/script></body></html>`);
    w.document.close();
  };
}

/* ============ Los diplomados, encontrados por la cédula ============
   Los diplomas y los certificados de módulo no viven en cem_certificates:
   los emite el generador y sólo guardan la cédula dentro de sus datos, sin
   ninguna relación con una cuenta. Un graduado de 2026 puede registrarse hoy
   y no ver nada suyo, aunque su diploma esté emitido desde hace meses.

   El puente es la cédula del perfil. La función se atiene a auth.uid() y no
   acepta que se le diga de quién, así que nadie puede pedir los de otro.

   Va aparte de load() a propósito: si esto falla, el resto de la pantalla
   —los certificados de la plataforma, las insignias— tiene que seguir. */
if (me) cargarEgresado();

let plazoFisico = null, pedidos = new Map(), fechaErratas = null;

async function cargarEgresado(){
  let docs = [];
  try {
    // Deja rastro de que esta cuenta reclamó esa cédula, y trae lo que hay.
    const [, { data }, { data:plazo }, { data:mios }, { data:fErratas }] = await Promise.all([
      sb.rpc('cem_vincular_mis_certificados'),
      sb.rpc('cem_mis_certificados_de_egresado'),
      sb.rpc('cem_plazo_diploma_fisico'),
      sb.rpc('cem_mis_pedidos_fisicos'),
      sb.rpc('cem_fecha_fe_de_erratas'),
    ]);
    docs = data || [];
    plazoFisico = Array.isArray(plazo) ? plazo[0] : plazo;
    (mios || []).forEach(p => pedidos.set(p.certificado_id, p));
    fechaErratas = fErratas;
  } catch { return; }          // ver arriba
  if (!docs.length) return;    // sin cédula puesta, o sin nada a su nombre

  const caja = $('#egresado');
  caja.hidden = false;

  /* Agrupados por diplomado, que es como los piensa la persona: «lo mío de
     Marketing» y «lo mío de IA», no una lista de veinte papeles seguidos. */
  const porPrograma = new Map();
  docs.forEach(d => {
    if (!porPrograma.has(d.programa)) porPrograma.set(d.programa, []);
    porPrograma.get(d.programa).push(d);
  });

  $('#egresado-lista').innerHTML = [...porPrograma.entries()].map(([programa, lista]) => {
    const diplomas = lista.filter(d => d.es_diploma);
    const modulos  = lista.filter(d => !d.es_diploma);
    return `<section class="sep">
      <h3 style="margin:0 0 6px;font-size:15px">${esc(programa)}</h3>
      ${diplomas.map(d => `
        <div class="dip-fila">
          <button type="button" class="dip-mini" data-mini="${d.id}" data-ver="${d.id}"
            aria-label="Ver el diploma de ${esc(d.titulo)}"><span class="tiny muted">Dibujando…</span></button>
          <div class="dip-texto"><span class="chip ok">Diploma</span>
            <b style="margin-left:6px">${esc(d.titulo)}</b>
            <div class="tiny muted">A nombre de ${esc(d.nombre)} · ${esc(d.cedula)}</div></div>
          <div class="row" style="gap:6px">
            <button class="btn outline sm" data-ver="${d.id}">
              <span class="material-symbols-outlined" aria-hidden="true">visibility</span> Ver</button>
            ${botonFisico(d)}
            ${d.fe_erratas ? `<button class="btn sm dip-aviso" data-erratas="${d.id}">
              <span class="material-symbols-outlined" aria-hidden="true">campaign</span>
              Aviso importante</button>` : ''}
          </div>
        </div>`).join('')}
      ${modulos.length ? `<details class="sep">
        <summary class="tiny">Y sus ${modulos.length} certificado${modulos.length === 1 ? '' : 's'} de módulo</summary>
        ${modulos.map(d => `
          <div class="row" style="justify-content:space-between;gap:10px;padding:6px 0">
            <span class="tiny">${esc(d.titulo)}</span>
            <button class="btn ghost sm" data-ver="${d.id}">Ver</button>
          </div>`).join('')}
      </details>` : ''}
    </section>`;
  }).join('');

  /* El aviso del plazo va arriba del todo y con los días contados, no con una
     fecha suelta: «quedan 12 días» mueve a pedirlo hoy; «hasta el 8 de octubre»
     se lee y se pospone. Cuando se acaba, el mismo hueco explica qué pasa
     ahora, en vez de desaparecer y dejar a la gente sin saber si puede pedirlo. */
  if (plazoFisico) {
    const p = plazoFisico;
    $('#egresado-lista').insertAdjacentHTML('afterbegin', p.aun_gratis
      ? `<div class="nota ok" style="margin-bottom:12px">
           <b>¿Lo quieres impreso?</b> Pídelo antes del ${fdate(p.gratis_hasta)} y la impresión
           y el envío corren por cuenta del CEM.
           ${p.dias_restantes === 0 ? 'Hoy es el último día.'
             : `Quedan ${p.dias_restantes} día${p.dias_restantes === 1 ? '' : 's'}.`}</div>`
      : `<div class="nota warn" style="margin-bottom:12px">
           El plazo para pedirlo impreso gratis terminó el ${fdate(p.gratis_hasta)}.
           Puedes seguir pidiéndolo: ${esc(p.precio)}.</div>`);
  }

  $$('[data-fisico]', caja).forEach(b => b.addEventListener('click', () => pedirFisico(b.dataset.fisico, b.dataset.titulo)));
  $$('[data-ver]', caja).forEach(b => b.addEventListener('click', () => verDiploma(b.dataset.ver)));
  $$('[data-erratas]', caja).forEach(b => b.addEventListener('click',
    () => verConstancia(docs.find(x => x.id === b.dataset.erratas))));

  /* Las miniaturas se dibujan DESPUÉS de pintar la lista y de una en una.
     Cada una tiene que bajarse el fondo de su plantilla —cerca de un mega— y
     dibujar un lienzo de 3300×2400; lanzarlas todas a la vez deja el teléfono
     clavado justo cuando la persona acaba de entrar. Así la lista se lee de
     inmediato y las láminas van apareciendo. */
  for (const b of $$('[data-mini]', caja)) await miniatura(b);
}

/* ============ el diploma, dibujado ============
   ═══════════════════════════════════════════════════════════════════════════
   El diploma no está guardado como imagen en ningún sitio: se dibuja cada vez
   juntando el fondo y las posiciones de la plantilla con los datos del
   certificado. Por eso «Ver» llevaba antes a una tarjeta de texto — era lo
   único que esta pantalla podía enseñar sin la plantilla, que sólo lee el
   equipo. `cem_mi_certificado_para_dibujar` abre esa puerta, y sólo para los
   documentos que llevan la cédula de quien pregunta.

   Se guarda lo dibujado: abrir, cerrar y volver a abrir no vuelve a bajarse el
   fondo ni a repintar. */
const dibujados = new Map();

async function lienzoDeMiDiploma(id){
  if (dibujados.has(id)) return dibujados.get(id);
  const tarea = (async () => {
    const { data, error } = await sb.rpc('cem_mi_certificado_para_dibujar', { p_id: id });
    if (error) throw error;
    const fila = (data || [])[0];
    if (!fila) throw new Error('Ese documento no está a tu nombre, o ya no está vigente.');
    const verifyUrl = new URL('../../certificados/verificar.html', location.href).href
                    + '?c=' + encodeURIComponent(id);
    return { lienzo: await dibujarCertificadoEmitido(fila, fila.config, verifyUrl), titulo: fila.titulo };
  })();
  dibujados.set(id, tarea);
  // Un fallo no se queda guardado: la próxima vez se reintenta.
  tarea.catch(() => dibujados.delete(id));
  return tarea;
}

async function miniatura(boton){
  try {
    const { lienzo } = await lienzoDeMiDiploma(boton.dataset.mini);
    /* La miniatura se reduce a un lienzo pequeño en vez de encoger el grande
       con CSS: así el navegador no guarda en memoria una imagen de ocho
       millones de píxeles por cada fila. */
    const ancho = 168, alto = Math.round(ancho * lienzo.height / lienzo.width);
    const mini = document.createElement('canvas');
    mini.width = ancho; mini.height = alto;
    const cx = mini.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(lienzo, 0, 0, ancho, alto);
    boton.innerHTML = '';
    boton.appendChild(mini);
  } catch {
    /* Si no se pudo dibujar, el hueco no puede quedarse diciendo «Dibujando…»
       para siempre. Se dice que no se pudo, y el botón «Ver» sigue ahí para
       intentarlo otra vez con el mensaje completo. */
    boton.innerHTML = '<span class="tiny muted">No se pudo dibujar</span>';
  }
}

async function verDiploma(id){
  const m = modal({ title:'Tu diploma', wide:true,
    body:`<div class="dip-grande" id="dipGrande"><span class="tiny muted">Dibujando tu diploma…</span></div>`,
    footer:`<a class="btn outline" id="dipComprobar" target="_blank" rel="noopener"
              href="../../certificados/verificar.html?c=${encodeURIComponent(id)}">
              <span class="material-symbols-outlined" aria-hidden="true">verified</span> Comprobar que es válido</a>
            <button class="btn" id="dipBajar" disabled>
              <span class="material-symbols-outlined" aria-hidden="true">download</span> Descargar</button>` });
  try {
    const { lienzo, titulo } = await lienzoDeMiDiploma(id);
    const img = new Image();
    img.alt = 'Tu diploma de ' + titulo;
    img.src = lienzo.toDataURL('image/png');
    $('#dipGrande', m).innerHTML = '';
    $('#dipGrande', m).appendChild(img);
    m.querySelector('.modal-h h3').textContent = titulo;

    const bajar = $('#dipBajar', m);
    bajar.disabled = false;
    bajar.onclick = () => {
      /* En JPEG y no en PNG: la misma lámina pesa unas seis veces menos y para
         un fondo fotográfico se ve igual. Es lo mismo que baja la escuela. */
      const a = document.createElement('a');
      a.href = lienzo.toDataURL('image/jpeg', 0.92);
      a.download = (titulo || 'diploma').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '') + '.jpg';
      a.click();
      ok('Descargado.');
    };
  } catch (e) {
    $('#dipGrande', m).innerHTML =
      `<div class="nota err">No pudimos dibujar tu diploma. ${esc(e.message || '')}</div>`;
  }
}

/* ============ la constancia de fe de erratas ============
   ═══════════════════════════════════════════════════════════════════════════
   Los diplomas que ya se imprimieron dicen «Titular de la cédula de
   indentidad». La errata está corregida en las plantillas —lo que se dibuja hoy
   sale bien— pero el papel que 143 personas tienen en la mano no se arregla con
   un despliegue, así que la Dirección Académica emitió una constancia oficial.

   Va al lado del diploma, y no como un aviso arriba de la pantalla, porque la
   constancia es de UN documento concreto: lleva su código, y quien hizo los dos
   diplomados necesita las dos. Arriba habría que explicar a cuál se refiere; al
   lado no hay nada que explicar.

   Y se lee entera aquí antes de descargar nada. Quien abre esto se acaba de
   asustar por su título: obligarle a bajarse un Word y abrirlo para enterarse
   de que no pasa nada sería poner una puerta justo delante de la tranquilidad. */
function verConstancia(d){
  if (!d) return;
  const t = textoDeLaConstancia(d, fechaErratas || new Date());
  const m = modal({ title:'Aviso importante sobre tu diploma', wide:true, body:`
    <div class="nota ok">
      <b>Tu diploma es válido y no tienes que hacer nada.</b> En la impresión se coló una letra
      de más en una palabra —«indentidad» en vez de «identidad»—. La Dirección Académica emitió
      esta constancia oficial que lo hace constar y ratifica que el título mantiene toda su
      validez. Guárdala junto a tu diploma.</div>

    <div class="caja constancia sep">
      <p class="tiny muted" style="margin:0">${esc(t.entidad)}</p>
      <h3 style="margin:2px 0 10px">${esc(t.titulo)}</h3>
      <p>${esc(t.entrada)}</p>
      <dl class="cons-datos">
        ${t.datos.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}
      </dl>
      <h4 class="sep" style="margin-bottom:4px">Detalle de la rectificación</h4>
      <p style="margin:0"><span class="muted tiny">Donde dice:</span> <b>${esc(t.donde_dice)}</b></p>
      <p style="margin:2px 0 0"><span class="muted tiny">Debe decir:</span> <b>${esc(t.debe_decir)}</b></p>
      <h4 class="sep" style="margin-bottom:4px">Declaración de validez</h4>
      ${t.validez.map(p => `<p>${esc(p)}</p>`).join('')}
      <p>${esc(t.cierre)}</p>
      <p class="tiny muted" style="margin-bottom:0">${esc(t.firma)}</p>
    </div>`,
    footer:`<button class="btn outline" data-x>Cerrar</button>
            <button class="btn" id="bajarConstancia">
              <span class="material-symbols-outlined" aria-hidden="true">download</span>
              Descargar la constancia oficial</button>` });

  $('#bajarConstancia', m).onclick = async () => {
    try {
      /* Lo que se baja es el .docx original de la Dirección Académica con sus
         siete huecos rellenos. Ni maquetado de nuevo ni convertido a otra cosa:
         el mismo archivo, con su membrete y su sello intactos. */
      const blob = await construirConstancia(d, fechaErratas || new Date(),
                                             new URL('../../certificados/', location.href).href);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = nombreDeArchivo(d);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      ok('Constancia descargada.');
    } catch (e) {
      fail(e.message || 'No pudimos preparar la constancia. Vuelve a intentarlo.');
    }
  };
}

function botonFisico(d){
  const ya = pedidos.get(d.id);
  if (ya) {
    return `<span class="chip ok" title="${esc(ya.direccion)}">
      <span class="material-symbols-outlined" aria-hidden="true">local_shipping</span>
      ${esc(ya.estado)}${ya.gratis ? '' : ' · de pago'}</span>`;
  }
  return `<button class="btn sm" data-fisico="${d.id}" data-titulo="${esc(d.titulo)}">
    <span class="material-symbols-outlined" aria-hidden="true">local_shipping</span> Lo quiero impreso</button>`;
}

async function pedirFisico(id, titulo){
  const p = plazoFisico || {};
  const m = modal({ title: 'Pedir el diploma impreso', body: `
    <p class="tiny muted">${esc(titulo)}</p>
    ${p.aun_gratis
      ? `<div class="nota ok">Sin coste. El plazo termina el ${fdate(p.gratis_hasta)}.</div>`
      : `<div class="nota warn">Fuera de plazo: ${esc(p.precio || '')}. El equipo te escribe para cerrarlo.</div>`}
    <div class="field sep"><label for="fTel">Teléfono con WhatsApp</label>
      <input id="fTel" required placeholder="0412 000 0000"></div>
    <div class="field"><label for="fDir">Dirección de entrega</label>
      <textarea id="fDir" required rows="3" placeholder="Calle, edificio, piso, punto de referencia"></textarea></div>
    <div class="row">
      <div class="field crece"><label for="fCiudad">Ciudad</label><input id="fCiudad"></div>
      <div class="field crece"><label for="fPais">País</label><input id="fPais" value="Venezuela"></div>
    </div>
    <div class="row sep"><button class="btn" id="fEnviar">Pedirlo</button>
      <button class="btn outline" data-x>Ahora no</button></div>
    <div id="fMsg" class="tiny" role="status"></div>` });

  $('#fEnviar', m).addEventListener('click', async () => {
    const tel = $('#fTel', m).value.trim(), dir = $('#fDir', m).value.trim();
    if (!tel || !dir) { $('#fMsg', m).textContent = 'Hacen falta el teléfono y la dirección.'; return; }
    $('#fEnviar', m).disabled = true;
    const { data, error } = await sb.rpc('cem_pedir_diploma_fisico', {
      p_certificado_id: id, p_telefono: tel, p_direccion: dir,
      p_ciudad: $('#fCiudad', m).value.trim() || null,
      p_pais: $('#fPais', m).value.trim() || null,
    });
    if (error) { $('#fMsg', m).textContent = error.message; $('#fEnviar', m).disabled = false; return; }
    pedidos.set(id, Array.isArray(data) ? data[0] : data);
    m.close();
    cargarEgresado();
  });
}
</script>
</body>
