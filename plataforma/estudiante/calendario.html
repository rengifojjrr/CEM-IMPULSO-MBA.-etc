<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM · Mi calendario</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-26">
<style>
  /* El día abierto: la lista de lo que pasa ese día, al lado del mes. */
  .con-dia{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:var(--aire);align-items:start;}
  @media(max-width:980px){ .con-dia{grid-template-columns:1fr;} }
  .cal .day{cursor:pointer;}
  .cal .day.elegido{outline:2px solid var(--primary);outline-offset:-2px;}
  .dato{display:flex;gap:10px;align-items:flex-start;padding:7px 0;}
  .dato .material-symbols-outlined{font-size:19px;color:var(--tinta-3);flex:none;}
  .dato .k{font-size:var(--t-xs);color:var(--tinta-3);}
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Mi calendario <button type="button" class="ayuda-btn" data-ayuda="Las clases de los programas en los que estás inscrito. Pulsa un día para ver lo que hay ese día, y una clase para verla entera: hora, dónde es y con quién.">?</button></h1>
      <p>Las clases de tus programas, mes a mes.</p></div>
    <div class="actions">
      <div class="field"><label for="fCurso">Programa</label>
        <select id="fCurso"><option value="">Todos mis programas</option></select></div>
      <button class="btn outline" id="btnHoy">Hoy</button>
    </div>
  </div>

  <div class="card">
    <div class="row between sep-poco">
      <div class="row" style="gap:6px;align-items:center">
        <button class="icon-btn" id="prev" title="Mes anterior" aria-label="Mes anterior">
          <span class="material-symbols-outlined">chevron_left</span></button>
        <h2 class="sec" id="mesLbl" style="margin:0;min-width:180px;text-align:center"></h2>
        <button class="icon-btn" id="next" title="Mes siguiente" aria-label="Mes siguiente">
          <span class="material-symbols-outlined">chevron_right</span></button>
      </div>
      <span class="tiny muted" id="cuenta"></span>
    </div>

    <div class="con-dia">
      <div class="cal" id="cal"></div>
      <div>
        <h3 class="sec" id="diaLbl" style="margin-top:0">Elige un día</h3>
        <div id="delDia"></div>
      </div>
    </div>
  </div>

  <h2 class="sec sep-mucho">Lo que viene</h2>
  <div class="card" id="proximas"></div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, chipEstado, fdate, modal, vacio, etiqueta } from '../assets/app.js?v=2026-08-26';

/* ============ el calendario del estudiante ============
   Las clases estaban, pero repartidas: la próxima salía en el panel y el resto
   dentro de cada curso, en la pestaña «Sesiones en vivo». Para saber qué tenía
   esta semana había que abrir sus programas uno a uno y juntarlo de cabeza.

   Aquí están todas juntas, en un mes que se recorre. La lógica es la que la
   gente ya conoce de cualquier calendario: se ve el mes, se pulsa un día y sale
   lo de ese día, se pulsa una clase y sale entera.

   «Entera» quiere decir lo que hace falta para presentarse: la hora, y según la
   modalidad el salón —con su dirección— o el enlace para entrar. Una clase
   presencial sin decir dónde es no sirve de nada, y era justo lo que pasaba. */
const me = await mount({ require:['estudiante'], active:'calendario.html', area:'estudiante' });

let cur = new Date();
let clases = [], porCohorte = {}, diaElegido = null;
if (me) load();

async function load(){
  const { data: ens } = await sb.from('cem_enrollments')
    .select('cohort_id,course_id,cem_courses(nombre),cem_cohorts(nombre)')
    .eq('profile_id', me.id).limit(500);
  const cohortes = (ens||[]).map(e=>e.cohort_id).filter(Boolean);
  (ens||[]).forEach(e => { if (e.cohort_id) porCohorte[e.cohort_id] =
    { curso: e.cem_courses?.nombre || '', cohorte: e.cem_cohorts?.nombre || '', course_id: e.course_id }; });

  $('#fCurso').innerHTML = '<option value="">Todos mis programas</option>' +
    [...new Map((ens||[]).filter(e=>e.cohort_id)
      .map(e=>[e.course_id, e.cem_courses?.nombre||''])).entries()]
      .map(([id,n])=>`<option value="${esc(id)}">${esc(n)}</option>`).join('');

  if (!cohortes.length){
    $('#cal').innerHTML = '';
    $('#delDia').innerHTML = '';
    $('#proximas').innerHTML = vacio({ icono:'event_busy', titulo:'Todavía no tienes clases programadas',
      texto:'Cuando te asignen a una cohorte con sesiones en vivo o presenciales, las verás aquí.',
      accion:{ texto:'Ver el catálogo', href:'catalogo.html' } });
    return;
  }

  /* Se traen todas las de sus cohortes de una vez y el mes se recorre sin
     volver a pedir nada: son unas decenas de filas, no miles, y así moverse
     entre meses es instantáneo. */
  const { data } = await sb.from('cem_classes')
    .select('*,cem_profiles(nombre,apellido)')
    .in('cohort_id', cohortes).order('fecha').limit(1000);
  clases = data || [];
  render();
}

const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const HOY = iso(new Date());

/** Las que pasan el filtro de programa. */
const visibles = () => {
  const c = $('#fCurso').value;
  return clases.filter(x => !c || porCohorte[x.cohort_id]?.course_id === c);
};

function render(){
  const lista = visibles();
  cur.setDate(1);
  $('#mesLbl').textContent = cur.toLocaleDateString('es-ES',{ month:'long', year:'numeric' });
  const y = cur.getFullYear(), mo = cur.getMonth();
  const primero = new Date(y, mo, 1);
  const arranca = (primero.getDay()+6) % 7;              // lunes = 0
  const diasDelMes = new Date(y, mo+1, 0).getDate();
  const diasAntes = new Date(y, mo, 0).getDate();

  const porDia = {};
  lista.forEach(c => (porDia[c.fecha] ||= []).push(c));
  const esteMes = lista.filter(c => c.fecha.slice(0,7) === `${y}-${String(mo+1).padStart(2,'0')}`);
  $('#cuenta').textContent = esteMes.length
    ? `${esteMes.length} clase(s) este mes`
    : 'Ninguna clase este mes';

  let celdas = '';
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d => celdas += `<div class="dow">${d}</div>`);
  for (let i = arranca; i > 0; i--) celdas += `<div class="day out"><div class="num">${diasAntes-i+1}</div></div>`;
  for (let d = 1; d <= diasDelMes; d++){
    const f = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dentro = (porDia[f]||[]).map(c => `
      <button type="button" class="ev ${c.estado==='dictada'?'dictada':(c.modalidad==='presencial'?'presencial':'')}"
              data-clase="${esc(c.id)}" title="${esc(c.titulo)}">
        ${(c.hora_inicio||'').slice(0,5)} ${esc(c.titulo)}</button>`).join('');
    celdas += `<div class="day ${f===HOY?'today':''} ${f===diaElegido?'elegido':''}" data-dia="${f}">
      <div class="num">${d}</div>${dentro}</div>`;
  }
  const sobran = (7 - ((arranca + diasDelMes) % 7)) % 7;
  for (let i = 1; i <= sobran; i++) celdas += `<div class="day out"><div class="num">${i}</div></div>`;
  $('#cal').innerHTML = celdas;

  $$('#cal .day[data-dia]').forEach(el => el.onclick = () => { diaElegido = el.dataset.dia; render(); });
  $$('#cal [data-clase]').forEach(el => el.onclick = (ev) => {
    ev.stopPropagation();                     // pulsar la clase no es pulsar el día
    verClase(clases.find(c => c.id === el.dataset.clase));
  });

  pintarDia(porDia);
  pintarProximas(lista);
}

function pintarDia(porDia){
  if (!diaElegido){
    $('#diaLbl').textContent = 'Elige un día';
    $('#delDia').innerHTML = '<p class="tiny muted">Pulsa un día del mes para ver lo que tienes ese día.</p>';
    return;
  }
  const f = new Date(diaElegido + 'T12:00');
  $('#diaLbl').textContent = f.toLocaleDateString('es-ES',{ weekday:'long', day:'numeric', month:'long' });
  const del = (porDia[diaElegido] || []).sort((a,b)=>String(a.hora_inicio).localeCompare(String(b.hora_inicio)));
  $('#delDia').innerHTML = del.length ? del.map(c => tarjetaClase(c)).join('')
    : '<p class="tiny muted">Ese día no tienes clases.</p>';
  $$('#delDia [data-abrir]').forEach(b => b.onclick = () => verClase(clases.find(c => c.id === b.dataset.abrir)));
}

function tarjetaClase(c){
  const d = porCohorte[c.cohort_id] || {};
  return `<div class="list-item">
    <div class="grow">
      <div class="t">${esc(c.titulo)}</div>
      <div class="s">${(c.hora_inicio||'').slice(0,5)}–${(c.hora_fin||'').slice(0,5)} · ${esc(etiqueta(c.modalidad))}</div>
      <div class="s">${esc(d.curso||'')}</div>
    </div>
    <button class="btn outline sm" data-abrir="${esc(c.id)}">Ver</button>
  </div>`;
}

function pintarProximas(lista){
  const siguientes = lista.filter(c => c.fecha >= HOY && c.estado !== 'cancelada')
    .sort((a,b)=>a.fecha.localeCompare(b.fecha) || String(a.hora_inicio).localeCompare(String(b.hora_inicio)))
    .slice(0, 8);
  $('#proximas').innerHTML = siguientes.length ? siguientes.map(c => {
    const d = porCohorte[c.cohort_id] || {};
    const f = new Date(c.fecha + 'T12:00');
    return `<div class="list-item">
      <div style="text-align:center;min-width:46px">
        <b style="font-size:var(--t-md)">${f.getDate()}</b>
        <div class="tiny muted">${f.toLocaleDateString('es-ES',{ month:'short' })}</div>
      </div>
      <div class="grow">
        <div class="t">${esc(c.titulo)}</div>
        <div class="s">${(c.hora_inicio||'').slice(0,5)}–${(c.hora_fin||'').slice(0,5)} ·
          ${esc(etiqueta(c.modalidad))}${c.modalidad==='presencial' && c.salon ? ` · ${esc(c.salon)}` : ''}</div>
        <div class="s">${esc(d.curso||'')}</div>
      </div>
      ${c.fecha === HOY ? chip('hoy','warn') : ''}
      <button class="btn outline sm" data-abrir2="${esc(c.id)}">Ver</button>
    </div>`;
  }).join('')
    : '<p class="tiny muted">No tienes clases próximas. Cuando programen la siguiente, aparecerá aquí.</p>';
  $$('#proximas [data-abrir2]').forEach(b => b.onclick = () => verClase(clases.find(c => c.id === b.dataset.abrir2)));
}

/* La clase entera. Lo que se enseña depende de la modalidad, y no por adorno:
   a una presencial se va, a una en línea se entra. Enseñar las dos cosas
   siempre obliga a la persona a decidir cuál de las dos le sirve. */
function verClase(c){
  if (!c) return;
  const d = porCohorte[c.cohort_id] || {};
  const f = new Date(c.fecha + 'T12:00');
  const dato = (icono, k, v) => `<div class="dato"><span class="material-symbols-outlined">${icono}</span>
    <div><div class="k">${esc(k)}</div><div>${v}</div></div></div>`;
  const presencial = c.modalidad === 'presencial' || c.modalidad === 'hibrido';
  const enLinea = c.modalidad !== 'presencial';
  const profe = c.cem_profiles ? `${c.cem_profiles.nombre||''} ${c.cem_profiles.apellido||''}`.trim() : '';

  modal({ title: c.titulo, body: `
    <div class="row" style="gap:8px;margin-bottom:12px">${chipEstado(c.estado)}
      <span class="chip neutral">${esc(etiqueta(c.modalidad))}</span></div>
    ${c.descripcion ? `<p class="muted">${esc(c.descripcion)}</p>` : ''}
    ${dato('event', 'Cuándo',
      `${f.toLocaleDateString('es-ES',{ weekday:'long', day:'numeric', month:'long', year:'numeric' })}
       <div class="tiny muted">${(c.hora_inicio||'').slice(0,5)}–${(c.hora_fin||'').slice(0,5)}</div>`)}
    ${dato('school', 'Programa', `${esc(d.curso||'—')}${d.cohorte?`<div class="tiny muted">${esc(d.cohorte)}</div>`:''}`)}
    ${profe ? dato('person', 'La dicta', esc(profe)) : ''}
    ${presencial ? dato('location_on', 'Dónde',
      c.salon ? esc(c.salon) : '<span class="tiny muted">Todavía no han dicho el salón. Pregúntanos si se acerca la fecha.</span>') : ''}
    ${enLinea && c.url_sesion ? dato('videocam', 'Para entrar',
      `<a class="btn sm" href="${esc(c.url_sesion)}" target="_blank" rel="noopener">
        <span class="material-symbols-outlined">login</span> Unirme a la clase</a>`) : ''}
    ${enLinea && !c.url_sesion && c.estado !== 'dictada'
      ? dato('videocam_off', 'Para entrar', '<span class="tiny muted">El enlace se publica poco antes de la clase.</span>') : ''}
    ${c.grabacion_url ? dato('smart_display', 'Grabación',
      `<a class="btn outline sm" href="${esc(c.grabacion_url)}" target="_blank" rel="noopener">
        <span class="material-symbols-outlined">play_arrow</span> Ver la grabación</a>`) : ''}`,
    footer: `<button class="btn outline" data-x>Cerrar</button>` });
}

$('#prev').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth()-1, 1); render(); };
$('#next').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1); render(); };
$('#btnHoy').onclick = () => { cur = new Date(); diaElegido = HOY; render(); };
$('#fCurso').onchange = render;
</script>
</body>
</html>
