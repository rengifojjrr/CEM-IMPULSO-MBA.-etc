<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM International · Finaliza tu inscripción</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icono-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d2440">
<!-- Los cuatro servidores de fuera, avisados de golpe y no en fila.
     Sin esto el navegador descubre cada uno cuando le toca, y paga el
     DNS y el saludo TLS de cada cual por separado, con la pantalla en
     blanco mientras tanto. Ver herramientas/acelerar-cabeceras.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://vajbsfgojtunamhrzrpf.supabase.co" crossorigin>
<link rel="modulepreload" href="../assets/app.js?v=2026-08-29-2">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-29-2">
<style>
  .plan{border:2px solid var(--filete);border-radius:var(--r);padding:14px;cursor:pointer;flex:1;min-width:190px;}
  .plan.on{border-color:var(--primary);background:var(--primary-suave);}
  .plan .p{font-size:var(--t-lg);font-weight:700;color:var(--primary);}
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="pub-main" style="max-width:960px">
    <a class="btn ghost sm" href="#" id="back"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Volver</a>
    <div style="text-align:center;margin:10px 0 22px">
      <span class="chip ok"><span class="material-symbols-outlined">lock</span> Pago seguro</span>
      <h1 style="margin:10px 0 4px">Finaliza tu inscripción</h1>
      <p class="muted" id="sub" style="margin:0"></p>
    </div>

    <div class="grid dos-columnas">
      <div>
        <div class="card">
          <h2 class="sec"><span class="material-symbols-outlined">payments</span> Opciones de pago</h2>
          <div class="row" id="planes"></div>
        </div>

        <div class="card">
          <h2 class="sec"><span class="material-symbols-outlined">groups</span> Cohorte</h2>
          <div class="field"><label>Selecciona tu grupo</label><select id="cohorte"></select></div>
        </div>

        <div class="card">
          <h2 class="sec"><span class="material-symbols-outlined">person</span> Datos del estudiante</h2>
          <div class="row">
            <div class="field medio"><label>Nombre</label><input id="dNombre"></div>
            <div class="field medio"><label>Apellidos</label><input id="dApellido"></div>
          </div>
          <div class="field"><label>Correo electrónico</label><input id="dEmail" disabled></div>
          <div class="row">
            <div class="field medio"><label>Tipo de documento</label>
              <select id="dDocTipo"><option>Cédula</option><option>DNI</option><option>Pasaporte</option></select></div>
            <div class="field medio"><label>Número de documento</label><input id="dDoc"></div>
          </div>
          <div class="row">
            <div class="field medio"><label>Teléfono</label><input id="dTel" placeholder="+58 412 1234567"></div>
            <div class="field medio"><label for="dPais">País</label><select id="dPais"></select></div>
          </div>
        </div>

        <div class="card">
          <h2 class="sec"><span class="material-symbols-outlined">local_offer</span> ¿Tienes un código de beca o descuento?</h2>
          <div class="row"><input id="cupon" placeholder="Ej. CEM10" style="flex:1;min-width:180px">
            <button class="btn outline" id="btnCupon">Aplicar</button></div>
          <div id="cuponMsg" class="tiny sep-poco"></div>
        </div>
      </div>

      <div>
        <div class="card pegajosa" style="top:80px">
          <h2 class="sec">Resumen del pedido</h2>
          <div id="resumen"></div>
          <div id="botones" style="margin-top:14px"><span class="cargando"></span></div>
          <p class="tiny muted" style="margin-top:10px;text-align:center" id="piePago"></p>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, money, fdate, qs, ok, fail, run, audit, profile, etiqueta, ocupado, avisar,
         SUPABASE_URL, SUPABASE_KEY } from '../assets/app.js?v=2026-08-29-2';
import { opcionesDePais } from '../assets/paises.js?v=2026-08-29-2';
const me = await mount({ require:['estudiante','admin','superadmin','coordinador'], area:'estudiante', active:'catalogo.html' });
const cursoId = qs('curso');
let curso, cohortes=[], plan=1, descuento=0, hayTarjeta=false;

$('#back').onclick = (e)=>{ e.preventDefault(); history.back(); };
if (me) { if (!cursoId) location.href='catalogo.html'; else load(); }

async function load(){
  const [{data:c},{data:cs},{data:stripe}] = await Promise.all([
    sb.from('cem_courses').select('*').eq('id',cursoId).maybeSingle(),
    sb.from('cem_cohorts').select('*').eq('course_id',cursoId).in('estado',['inscripciones_abiertas','en_curso','planificada']).order('fecha_inicio'),
    sb.rpc('cem_stripe_estado'),
  ]);
  hayTarjeta = stripe?.listo === true;
  if (!c) { fail('Curso no encontrado'); setTimeout(()=>location.href='catalogo.html',900); return; }
  curso=c; cohortes=cs||[];

  const { data: ya } = await sb.from('cem_enrollments').select('id').eq('profile_id',me.id).eq('course_id',cursoId)
    .not('estado','in','("cancelada","finalizada")').maybeSingle();
  if (ya) { fail('Ya tienes una inscripción en este programa.'); setTimeout(()=>location.href='panel.html',1200); return; }

  $('#sub').textContent = `Estás a un paso de comenzar ${curso.nombre}.`;
  $('#dNombre').value=me.nombre||''; $('#dApellido').value=me.apellido||''; $('#dEmail').value=me.email||'';
  $('#dDoc').value=me.documento||''; $('#dTel').value=me.telefono||''; $('#dPais').innerHTML=opcionesDePais(me.pais||'');
  if (me.documento_tipo) $('#dDocTipo').value=me.documento_tipo;

  $('#cohorte').innerHTML = cohortes.length
    ? cohortes.map(c=>`<option value="${c.id}">${esc(c.nombre)} — ${c.fecha_inicio?'inicia '+fdate(c.fecha_inicio):'fecha por definir'}</option>`).join('')
    : '<option value="">Sin cohorte disponible (te asignaremos una)</option>';

  renderPlanes(); resumen(); renderBotones();
}

/* Los botones del final: uno por camino, y el de tarjeta lleva a Stripe SIN
   pasar por ninguna pantalla intermedia.
   ═══════════════════════════════════════════════════════════════════════════
   Antes esto era un solo botón, «Confirmar inscripción», y al pulsarlo dejaba
   a la persona en la pantalla de pagos con la lista de todas sus cuotas para
   que encontrase la que acababa de crear, eligiera forma de pago y volviera a
   pulsar. Cuatro paradas más después de haber decidido comprar.

   Ahora la decisión se toma AQUÍ, donde la persona ya está mirando el precio,
   y el botón hace lo que dice: si elige tarjeta, lo siguiente que ve es la
   pantalla de pago de Stripe. */
function renderBotones(){
  const total = totalPlan();
  const primera = plan > 1 ? total/plan : total;
  $('#botones').innerHTML = `
    ${hayTarjeta ? `<button class="btn block" id="btnTarjeta">
      <span class="material-symbols-outlined" aria-hidden="true">credit_card</span>
      Inscribirme y pagar ${money(primera, curso.moneda)}</button>` : ''}
    <button class="btn ${hayTarjeta ? 'outline' : ''} block" id="btnOtra" style="margin-top:8px">
      ${hayTarjeta
        ? 'Prefiero transferencia u otra forma'
        : `Inscribirme y ver dónde pagar <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>`}</button>`;

  $('#piePago').innerHTML = hayTarjeta
    ? `<span class="material-symbols-outlined" style="font-size:15px">lock</span>
       Pagas en Stripe. Tu tarjeta no pasa por nosotros${plan>1
         ? `, y hoy sólo se cobra la primera de ${plan} cuotas` : ''}.`
    : `<span class="material-symbols-outlined" style="font-size:15px">shield</span>
       Tu inscripción queda registrada y un asesor validará tu pago.`;

  if (hayTarjeta) $('#btnTarjeta').onclick = () =>
    ocupado('#btnTarjeta', 'Abriendo el pago…', () => inscribir('tarjeta'));
  $('#btnOtra').onclick = () =>
    ocupado('#btnOtra', 'Registrando tu inscripción…', () => inscribir('otra'));
}

/* item 45 · las tres opciones cambiaban el número final sin decir por qué: no
   se veía que pagar de una vez descuenta un 10% y que en seis hay un 6% de
   recargo. Ahora cada tarjeta dice cuánto cuesta al final y cuánto se ahorra o
   se paga de más frente a pagar en tres, que es el precio de lista. */
function renderPlanes(){
  const base = Number(curso.precio)||0;
  const opciones = [
    { n:1, lbl:'Un solo pago', factor:0.9 },
    { n:3, lbl:'3 cuotas', factor:1 },
    { n:6, lbl:'6 cuotas', factor:1.06 },
  ];
  $('#planes').innerHTML = opciones.map(o=>{
    const total = Math.round(base*o.factor*100)/100;
    const dif = Math.round((total - base)*100)/100;   // contra el precio de lista
    const nota = dif < 0
      ? `<span class="ok-text">Te ahorras ${money(-dif, curso.moneda)}</span>`
      : dif > 0
        ? `<span class="err-text">Pagas ${money(dif, curso.moneda)} de más por financiarlo</span>`
        : 'Precio de lista, sin recargo';
    return `<div class="plan caja ${o.n===plan?'on':''}" data-plan="${o.n}" data-factor="${o.factor}"
      role="button" tabindex="0" aria-pressed="${o.n===plan}">
      <div class="row between"><b>${o.lbl}</b>${o.n===plan?'<span class="material-symbols-outlined" style="color:var(--primary)">check_circle</span>':''}</div>
      <div class="p">${money(total/o.n, curso.moneda)}${o.n>1?'<span class="tiny muted"> cada una</span>':''}</div>
      <div class="tiny muted">${o.n>1?`${o.n} pagos mensuales · `:''}total ${money(total, curso.moneda)}</div>
      <div class="tiny sep-poco">${nota}</div></div>`;
  }).join('');
  const elegir = (el) => { plan=Number(el.dataset.plan); renderPlanes(); resumen(); renderBotones(); };
  $$('[data-plan]').forEach(el=>{
    el.onclick = () => elegir(el);
    el.onkeydown = (ev) => { if (ev.key==='Enter'||ev.key===' ') { ev.preventDefault(); elegir(el); } };
  });
}

function totalPlan(){
  const base=Number(curso.precio)||0;
  const factor = plan===1?0.9 : plan===3?1 : 1.06;
  return Math.max(Math.round(base*factor*100)/100 - descuento, 0);
}

function resumen(){
  const base=Number(curso.precio)||0, total=totalPlan();
  const ahorro = plan===1? Math.round(base*0.1*100)/100 : 0;
  $('#resumen').innerHTML = `
    <div class="list-item"><div class="grow"><div class="t">${esc(curso.nombre)}</div>
      <div class="s">${esc(curso.duracion_texto||curso.horas+' h')} · ${esc(etiqueta(curso.modalidad))}</div></div></div>
    <div class="row between tiny" style="padding:6px 0"><span class="muted">Subtotal</span><span>${money(base, curso.moneda)}</span></div>
    ${ahorro?`<div class="row between tiny" style="padding:6px 0"><span class="muted">Descuento (pago único)</span><span class="ok-text">-${money(ahorro, curso.moneda)}</span></div>`:''}
    ${descuento?`<div class="row between tiny" style="padding:6px 0"><span class="muted">Cupón</span><span class="ok-text">-${money(descuento, curso.moneda)}</span></div>`:''}
    <div class="row between" style="padding:10px 0;border-top:1px solid var(--outline-variant);margin-top:6px">
      <b>Total a pagar</b><b style="font-size:19px;color:var(--primary)">${money(total, curso.moneda)}</b></div>
    <div class="tiny muted">${plan>1?`${plan} cuotas de ${money(total/plan, curso.moneda)}`:'Pago único'}</div>`;
}

$('#btnCupon').onclick = () => {
  const code = $('#cupon').value.trim().toUpperCase();
  if (code && curso.codigo_descuento && code === String(curso.codigo_descuento).trim().toUpperCase() && Number(curso.descuento_pct) > 0) {
    descuento = Math.round((Number(curso.precio)||0)*(Number(curso.descuento_pct)/100)*100)/100;
    avisar('#cuponMsg', `Cupón aplicado: ${curso.descuento_pct}% de descuento`, 'ok');
  } else { descuento=0; avisar('#cuponMsg', 'Cupón no válido', 'err'); }
  resumen(); renderBotones();
};

/**
 * Inscribe y, según el camino elegido, lleva directo a pagar.
 *
 * `via` es 'tarjeta' u 'otra'. La inscripción es la misma en los dos casos: lo
 * único que cambia es a dónde va la persona después.
 */
async function inscribir(via){
  try{
    await sb.from('cem_profiles').update({
      nombre:$('#dNombre').value.trim(), apellido:$('#dApellido').value.trim(),
      documento_tipo:$('#dDocTipo').value, documento:$('#dDoc').value.trim(),
      telefono:$('#dTel').value.trim(), pais:$('#dPais').value,
    }).eq('id',me.id);

    const enr = await run(sb.rpc('cem_self_enroll',{
      p_course_id:cursoId, p_cohort_id:$('#cohorte').value||null,
      p_cuotas:plan, p_codigo_descuento:$('#cupon').value.trim()||null,
    }),'No se pudo completar la inscripción');

    await audit('inscripcion_estudiante','cem_enrollments',enr?.id,'medio',{curso:curso.nombre, plan, via});

    /* Si el programa fuera gratuito o ya estuviera pagado, `cem_mi_acceso` dice
       que la puerta está abierta y entonces no hay nada que cobrar. */
    const { data: acceso } = await sb.rpc('cem_mi_acceso');
    if (acceso?.[enr?.id]?.abierto === true) {
      ok('¡Listo! Ya puedes empezar.');
      setTimeout(()=>location.href=`clase.html?curso=${cursoId}`, 1100);
      return;
    }

    if (via === 'tarjeta' && await irAStripe(enr?.id)) return;

    /* Sin tarjeta —o si Stripe no pudo abrir el cobro— se va a la pantalla de
       pagos con la inscripción en la dirección, que la destaca en vez de
       enseñar la lista entera de cuotas. */
    ok('Inscripción registrada. Ahora el pago para abrir el curso.');
    setTimeout(()=>location.href=`pagos.html?enr=${enr?.id||''}`, 1100);
  } catch(e){ /* `run` ya explicó qué pasó; el botón vuelve solo */ }
}

/**
 * Abre el cobro de la PRIMERA cuota y lleva a Stripe. Devuelve `true` si se
 * fue; `false` si no se pudo, para que quien llama tenga a dónde caer.
 *
 * El importe no se manda desde aquí: al servidor se le dice qué cuota es y él
 * mira en la base cuánto se debe. Si el importe viniera del navegador,
 * cualquiera podría pedir un cobro de un euro por una cuota de mil.
 */
async function irAStripe(enrollmentId){
  if (!enrollmentId) return false;
  try{
    const { data: cuotas } = await sb.from('cem_installments')
      .select('id,numero,estado').eq('enrollment_id', enrollmentId)
      .neq('estado','pagada').order('numero').limit(1);
    const primera = cuotas?.[0];
    if (!primera) return false;

    const { data:{ session } } = await sb.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/cem-stripe-checkout`, {
      method:'POST',
      headers:{ Authorization:`Bearer ${session?.access_token}`,
                apikey:SUPABASE_KEY, 'Content-Type':'application/json' },
      /* Al volver de Stripe se cae en la pantalla de pagos de ESTA inscripción,
         no en una dirección suelta: si el pago se completó ya se ve pagada, y
         si se canceló se ve el botón para reintentar. */
      body: JSON.stringify({ installment_id: primera.id,
        volver_a: new URL(`pagos.html?enr=${enrollmentId}`, location.href).href }),
    });
    const json = await res.json();
    if (!res.ok || !json.url) throw new Error(json.error || 'No se pudo abrir el cobro.');
    location.href = json.url;
    return true;
  } catch(e){
    /* La inscripción YA está hecha, así que esto no es un callejón: se avisa y
       se sigue por el otro camino. Perder aquí el hilo sería dejar a alguien
       inscrito y convencido de que no se registró nada. */
    fail(`${e.message} Te llevamos a la pantalla de pago.`);
    return false;
  }
}
</script>
</body>
</html>
