<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM · Mi panel</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-14">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head"><div><h1 id="saludo">Hola</h1><p>Este es el resumen de tu actividad académica.</p></div></div>

  <div class="card" id="proxima" style="background:linear-gradient(120deg,#00122b,#1f3a5f);color:#fff;border:none"></div>

  <div class="kpis" id="kpis"></div>

  <h2 class="sec" style="margin-top:20px">Cursos activos</h2>
  <div class="grid g2" id="cursos"></div>

  <!-- "Así voy": antes se veían los cursos y las evaluaciones sueltas, pero
       en ninguna parte el promedio ni qué faltaba por presentar. -->
  <div class="card">
    <div class="row between"><h2 class="sec">Cómo voy</h2>
      <span class="tiny muted">promedio, entregas y lo que falta</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Programa</th><th>Avance</th><th>Promedio</th>
        <th>Evaluaciones</th><th>Lo próximo</th></tr></thead>
      <tbody id="tbDesempeno"></tbody></table></div>
  </div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2 class="sec">Mis evaluaciones</h2><div id="entregas"></div></div>
    <div class="card"><h2 class="sec">Mis pagos</h2><div id="pagos"></div></div>
  </div>

  <div class="card"><h2 class="sec">Anuncios</h2><div id="anuncios"></div></div>
</div>
<script type="module">
import { sb, mount, $, esc, chip, bar, money, pct, fdate, fdatetime, kpi, num, emptyRow, chipEstado} from '../assets/app.js?v=2026-08-14';
const p = await mount({ require:['estudiante'], active:'panel.html', area:'estudiante' });
if (p) init();

async function init(){
  $('#saludo').textContent = `Hola, ${p.nombre}`;
  const { data: ens } = await sb.from('cem_enrollments')
    .select('*,cem_courses(id,nombre,imagen_url,modalidad),cem_cohorts(id,nombre)').eq('profile_id',p.id).limit(500);
  const eids = (ens||[]).map(e=>e.id), cohIds=(ens||[]).map(e=>e.cohort_id).filter(Boolean);

  const cIds = (ens||[]).map(e=>e.course_id).filter(Boolean);
  const [{data:clases},{data:insts},{data:subs},{data:anuncios},{data:certs},{data:evals}] = await Promise.all([
    cohIds.length? sb.from('cem_classes').select('*,cem_cohorts(nombre,cem_courses(nombre))').in('cohort_id',cohIds)
      .gte('fecha',new Date().toISOString().slice(0,10)).order('fecha').limit(5) : Promise.resolve({data:[]}),
    eids.length? sb.from('cem_installments').select('*').in('enrollment_id',eids).order('fecha_vencimiento').limit(500) : Promise.resolve({data:[]}),
    eids.length? sb.from('cem_submissions').select('*,cem_assessments(nombre,tipo,course_id)').in('enrollment_id',eids).limit(500) : Promise.resolve({data:[]}),
    sb.from('cem_announcements').select('*').eq('estado','enviado').order('enviado_en',{ascending:false}).limit(4),
    sb.from('cem_certificates').select('id').eq('profile_id',p.id).limit(500),
    cIds.length? sb.from('cem_assessments').select('id,nombre,tipo,course_id,intentos,nota_aprobatoria')
      .in('course_id',cIds).eq('estado','publicado') : Promise.resolve({data:[]}),
  ]);

  const prog = ens?.length? ens.reduce((a,e)=>a+Number(e.progreso||0),0)/ens.length : 0;
  const saldo = (insts||[]).filter(i=>['pendiente','parcial','vencida'].includes(i.estado)).reduce((a,i)=>a+Number(i.saldo||0),0);
  $('#kpis').innerHTML = [
    kpi('Cursos activos', num((ens||[]).filter(e=>e.estado==='activa').length),'school',`${(ens||[]).length} inscripciones`),
    kpi('Progreso general', pct(prog),'trending_up','promedio'),
    kpi('Certificados', num((certs||[]).length),'workspace_premium','obtenidos'),
    kpi('Saldo pendiente', money(saldo),'account_balance_wallet', saldo>0?'revisa tus cuotas':'estás al día'),
  ].join('');

  const next = (clases||[])[0];
  $('#proxima').innerHTML = next ? `
    <div class="row" style="gap:14px">
      <span class="material-symbols-outlined" style="font-size:34px">video_camera_front</span>
      <div class="grow" style="flex:1;min-width:200px">
        <div class="tiny" style="opacity:.75">Tu próxima clase</div>
        <div style="font-size:17px;font-weight:700">${esc(next.titulo)}</div>
        <div class="tiny" style="opacity:.85">${esc(next.cem_cohorts?.cem_courses?.nombre||'')} · ${fdate(next.fecha)} ${(next.hora_inicio||'').slice(0,5)}</div>
      </div>
      <a class="btn gold" href="clase.html?clase=${next.id}">Ir a la clase</a>
    </div>` : `<div class="row" style="gap:12px"><span class="material-symbols-outlined">event_available</span>
      <div>No tienes clases programadas próximamente.</div></div>`;

  $('#cursos').innerHTML = (ens||[]).length ? ens.map(e=>`
    <div class="card" style="margin:0">
      <div class="row between" style="align-items:flex-start">
        <div style="flex:1;min-width:0">
          <span class="chip teal">${esc(e.cem_courses?.modalidad?.replace('_',' ')||'')}</span>
          <h3 style="margin:8px 0 4px;font-size:16px">${esc(e.cem_courses?.nombre||'')}</h3>
          <div class="tiny muted">${esc(e.cem_cohorts?.nombre||'Sin cohorte')}</div>
        </div>${chipEstado(e.estado)}
      </div>
      <div style="margin-top:12px">
        <div class="row between tiny muted"><span>Progreso general</span><b>${pct(e.progreso)}</b></div>
        ${bar(e.progreso)}
      </div>
      <div class="row" style="margin-top:12px">
        <a class="btn sm" href="clase.html?curso=${e.cem_courses?.id}">Continuar</a>
        <a class="btn outline sm" href="curso.html?id=${e.cem_courses?.id}">Ver programa</a>
      </div>
    </div>`).join('') : '<div class="card"><p class="muted">Aún no tienes cursos. <a href="catalogo.html">Explora el catálogo</a>.</p></div>';

  const enrPorCurso = {}; (ens||[]).forEach(e=>{ enrPorCurso[e.course_id] = e.id; });
  const tareas = (evals||[]).map(a=>{
    const mias = (subs||[]).filter(s=>s.assessment_id===a.id).sort((x,y)=>y.intento-x.intento);
    const ult = mias[0];
    return { a, ult, usados:mias.length, abierta:mias.find(s=>s.estado==='en_progreso'), enr:enrPorCurso[a.course_id] };
  }).filter(t=>t.enr);
  const orden = { en_progreso:0, pendiente:1, entregada:2, calificada:3 };
  tareas.sort((x,y)=>(orden[x.abierta?'en_progreso':x.ult?.estado||'pendiente']??9)
                    -(orden[y.abierta?'en_progreso':y.ult?.estado||'pendiente']??9));
  $('#entregas').innerHTML = tareas.length ? tareas.slice(0,6).map(({a,ult,usados,abierta,enr})=>{
    const aprob = a.nota_aprobatoria||70;
    const sinIntentos = !abierta && usados >= (a.intentos||1);
    let estado, accion;
    if (abierta){ estado = chip('en progreso','warn');
      accion = `<a class="btn sm" href="evaluacion.html?id=${a.id}&enr=${enr}">Continuar</a>`;
    } else if (ult?.estado==='calificada'){
      estado = `<span class="chip ${ult.puntaje>=aprob?'ok':'err'}">${ult.puntaje} pts</span>`;
      accion = sinIntentos? '' : `<a class="btn outline sm" href="evaluacion.html?id=${a.id}&enr=${enr}">Reintentar</a>`;
    } else if (ult?.estado==='entregada'){ estado = chip('en revisión','info'); accion = '';
    } else { estado = chip('pendiente','warn');
      accion = `<a class="btn sm" href="evaluacion.html?id=${a.id}&enr=${enr}">Rendir</a>`; }
    return `<div class="list-item"><span class="material-symbols-outlined" style="color:var(--on-surface-variant)">${a.tipo==='examen'?'quiz':'assignment'}</span>
      <div class="grow"><div class="t">${esc(a.nombre)}</div>
        <div class="s">${esc(a.tipo||'')} · ${ult?.entregado_en?'entregado '+fdate(ult.entregado_en):`nota mínima ${aprob}`}</div></div>
      ${estado}${accion}</div>`;
  }).join('')
    : '<p class="muted tiny">No tienes evaluaciones pendientes.</p>';

  $('#pagos').innerHTML = (insts||[]).length ? insts.slice(0,6).map(i=>{
    const venc = i.estado!=='pagada' && i.fecha_vencimiento < new Date().toISOString().slice(0,10);
    return `<div class="list-item"><div class="grow">
      <div class="t">Cuota ${i.numero} · ${money(i.monto)}</div>
      <div class="s">Vence ${fdate(i.fecha_vencimiento)}</div></div>
      ${venc?chip('vencida','err'):chipEstado(i.estado)}</div>`;
  }).join('') : '<p class="muted tiny">Sin cuotas registradas.</p>';

  $('#anuncios').innerHTML = (anuncios||[]).length ? anuncios.map(a=>`
    <div class="list-item"><span class="material-symbols-outlined" style="color:var(--on-surface-variant)">campaign</span>
      <div class="grow"><div class="t">${esc(a.titulo)}</div><div class="s">${esc(a.cuerpo||'')}</div></div>
      <span class="tiny muted">${fdate(a.enviado_en)}</span></div>`).join('')
    : '<p class="muted tiny">Sin anuncios recientes.</p>';
}

/* ============ cómo voy (item 06) ============
   Una fila por programa con lo que de verdad se pregunta un estudiante:
   cuánto llevo, qué promedio tengo, qué me falta y qué viene ahora. */
(async () => {
  const { data } = await sb.rpc('cem_mi_desempeno');
  const filas = data || [];
  $('#tbDesempeno').innerHTML = filas.length ? filas.map(f => {
    const aprueba = f.nota_minima ?? 60;
    const flojo = f.promedio != null && Number(f.promedio) < Number(aprueba);
    return `<tr>
      <td class="wrap"><b>${esc(f.curso)}</b>
        ${f.estado !== 'activa' ? `<div>${chipEstado(f.estado)}</div>` : ''}</td>
      <td style="min-width:110px">${bar(f.progreso)}<span class="tiny muted">${pct(f.progreso)}</span></td>
      <td>${f.promedio == null
          ? '<span class="tiny muted">sin notas aún</span>'
          : `<b style="color:${flojo ? 'var(--error)' : 'inherit'}">${f.promedio}</b>
             <div class="tiny muted">aprueba con ${aprueba}</div>`}</td>
      <td class="tiny">
        ${num(f.evaluaciones_aprobadas)} aprobada(s) de ${num(f.evaluaciones_total)}
        ${Number(f.pendientes_de_revision) > 0
          ? `<div style="color:var(--warn,#7A6215)">${f.pendientes_de_revision} esperando corrección</div>` : ''}
        ${Number(f.evaluaciones_total) > Number(f.evaluaciones_entregadas)
          ? `<div class="muted">${Number(f.evaluaciones_total) - Number(f.evaluaciones_entregadas)} sin presentar</div>` : ''}
      </td>
      <td class="wrap tiny">${f.proxima_evaluacion
          ? `${esc(f.proxima_evaluacion)}${f.proxima_fecha ? `<div class="muted">cierra el ${fdate(f.proxima_fecha)}</div>` : ''}`
          : '<span class="muted">nada pendiente</span>'}</td></tr>`;
  }).join('') : emptyRow(5, 'Todavía no tienes programas activos.');
})();
</script>
</body>
</html>
