<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM · Biblioteca de recursos</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-21-26">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head"><div><h1>Biblioteca de recursos</h1><p id="sub">Materiales de tus programas.</p></div></div>
  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Nombre del recurso…"></div>
      <div class="field"><label>Curso</label><select id="fCurso"><option value="">Todos mis cursos</option></select></div>
      <div class="field"><label>Formato</label><select id="fTipo"><option value="">Todos</option>
        <option value="pdf">PDF</option><option value="excel">Excel</option><option value="video">Video</option>
        <option value="enlace">Enlace</option></select></div>
    </div>
  </div>
  <div class="grid g3" id="lista"></div>
</div>
<script type="module">
import { sb, mount, $, esc, chip, match, vacio, previaDeMaterial } from '../assets/app.js?v=2026-08-21-26';
const me = await mount({ require:['estudiante'], active:'biblioteca.html', area:'estudiante' });
let rows=[], progresoPorCurso={};
if (me) load();

async function load(){
  const { data: ens } = await sb.from('cem_enrollments').select('id,course_id,progreso,cem_courses(nombre)').eq('profile_id',me.id).limit(500);
  const ids = (ens||[]).map(e=>e.course_id);
  (ens||[]).forEach(e=>progresoPorCurso[e.course_id]=Number(e.progreso)||0);
  $('#fCurso').innerHTML = '<option value="">Todos mis cursos</option>' +
    (ens||[]).map(e=>`<option value="${e.course_id}">${esc(e.cem_courses?.nombre||'')}</option>`).join('');
  if (!ids.length){ $('#lista').innerHTML=`<div class="card sin-margen">${vacio({ icono:'menu_book',
    titulo:'Todavía no hay materiales para ti',
    texto:'Los apuntes y grabaciones de tus programas aparecerán aquí en cuanto el profesor los suba.',
    accion:{ texto:'Ver el catálogo', href:'catalogo.html' } })}</div>`; return; }
  const { data } = await sb.from('cem_media').select('*,cem_courses(nombre)').in('course_id',ids).order('nombre').limit(500);
  rows = data||[];
  $('#sub').textContent = `Mostrando ${rows.length} recurso(s) de tus programas.`;
  render();
}

function render(){
  const q=$('#q').value.trim(), c=$('#fCurso').value, t=$('#fTipo').value;
  const list = rows.filter(r=>match(r,q,['nombre','descripcion','cem_courses.nombre'])
    && (!c||r.course_id===c) && (!t||r.tipo===t));
  $('#lista').innerHTML = list.length ? list.map(m=>{
    // bloqueo por avance: si el recurso exige un módulo, se libera al superar 50% del curso
    const bloqueado = !!m.requiere_modulo && (progresoPorCurso[m.course_id]||0) < 50;
    return `<div class="card sin-margen">
      <!-- Lo que está bajo llave no se enseña: enseñarlo y luego negarlo es
           peor que no enseñarlo, así que ahí va el candado en su sitio. -->
      ${bloqueado
        ? `<div class="previa sin-previa" style="height:132px"><span class="material-symbols-outlined">lock</span></div>`
        : previaDeMaterial({ tipo:m.tipo, url:m.url, nombre:m.nombre })}
      <div class="row" style="gap:12px;align-items:flex-start">
        <div class="crece">
          <div class="negrita">${esc(m.nombre)}</div>
          <div class="tiny muted">${esc(m.cem_courses?.nombre||'')} · ${(Number(m.tamano_bytes||0)/1048576).toFixed(1)} MB</div>
          ${m.descripcion?`<div class="tiny muted sep-poco">${esc(m.descripcion)}</div>`:''}
        </div></div>
      <div class="row between sep">
        ${bloqueado ? `<span class="chip warn"><span class="material-symbols-outlined">lock</span> Requiere ${esc(m.requiere_modulo)}</span>`
          : `<span class="chip ok">Disponible</span>`}
        ${bloqueado ? '' : `<a class="btn outline sm" href="${esc(m.url||'#')}" target="_blank">
          <span class="material-symbols-outlined">${m.tipo==='video'?'visibility':'download'}</span>
          ${m.tipo==='video'?'Ver':'Descargar'}</a>`}
      </div></div>`;
  }).join('') : '<div class="card" style="grid-column:1/-1"><p class="muted">No se encontraron recursos con esos filtros.</p></div>';
}
['#q','#fCurso','#fTipo'].forEach(s=>{const el=$(s); el.oninput=render; el.onchange=render;});
</script>
</body>
</html>
