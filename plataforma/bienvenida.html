<style>body.ini-oscura{--fondo:#050a14;--papel:#0b1426;--hueco:#101c33;--tinta:#eaf1fb;--tinta-2:#a3b3cb;--filete:rgba(148,190,255,.14);--primary:#9fc1ff;--on-primary:#06101f;--secondary:#3ee6d2;background:#050a14;color:#eaf1fb;}body.ini-clara{--fondo:#f4f7fc;--papel:#ffffff;--hueco:#edf2fa;--tinta:#0b1630;--tinta-2:#46546e;--filete:rgba(13,36,64,.1);--primary:#0d2440;--on-primary:#fff;--secondary:#087a6f;background:#f4f7fc;color:#0b1630;}::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal;}</style>

<body class="ini-portada ini-clara">
<script>try{var t=localStorage.getItem('cemPortadaTema');if(t==='clara'||t==='oscura'){document.body.classList.remove('ini-oscura','ini-clara');document.body.classList.add('ini-'+t);}}catch(e){}</script>
<main class="llegada">
  <div class="card" id="caja"><span class="cargando"></span></div>
</main>

<script type="module">
/* Después de pagar.
   ═══════════════════════════════════════════════════════════════════════════
   Aquí NO se da nada por hecho. Que Stripe devuelva a esta página significa
   que la persona terminó el formulario de pago, no que el dinero entró: lo que
   lo confirma es el webhook, que llega por otro lado y puede tardar unos
   segundos.

   Así que se pregunta a la base por el estado real y se espera un poco. Decir
   «ya estás inscrito» antes de que la inscripción exista es la clase de
   mentira que se descubre al minuto siguiente, cuando la persona entra y no
   encuentra su curso. */
import { sb, mount, $, esc, qs, money, fail, ocupado, abrirContacto, imprimirDocumento }
  from './assets/app.js?v=2026-10-28-1';

/* Pública a propósito: quien llega aquí acaba de pagar y todavía no tiene con
   qué entrar —la cuenta se está creando en este mismo momento, del otro lado.
   Pedirle sesión sería cerrarle la puerta justo después de cobrarle. */
await mount({ pub: true });

const compraId = qs('compra');
if (!compraId) location.replace('catalogo.html');

let intentos = 0;
mirar();

async function mirar() {
  const { data, error } = await sb.rpc('cem_compra_invitado_estado', { p_compra_id: compraId });

  if (error || !data?.hay) {
    pintarProblema('No encontramos esa compra. Si te cobraron, escríbenos y lo resolvemos enseguida.');
    return;
  }

  if (data.estado === 'pagada') { pintarBien(data); return; }

  /* Todavía no ha llegado el aviso de Stripe. Se reintenta con paciencia —diez
     veces, unos veinte segundos— antes de decir nada. */
  if (++intentos < 10) { setTimeout(mirar, 2000); pintarEsperando(); return; }

  pintarTarda(data);
}

/* Cuando pasan los veinte segundos.
   ═══════════════════════════════════════════════════════════════════════════
   Antes esto era un callejón: «te llega por correo» y un botón de volver al
   catálogo. Quien acaba de pagar y no ve su curso no vuelve al catálogo, se
   queda mirando la pantalla y luego escribe enfadado — o peor, paga otra vez.

   Ahora hay las tres salidas que de verdad hacen falta: volver a mirar sin
   recargar, avisar al equipo con el número de la compra en la mano, y la
   promesa de que no hay que pagar dos veces, dicha primero y en negrita. */
function pintarTarda(d) {
  $('#caja').innerHTML = `
    <h1 style="margin-top:0;font-size:1.3rem">Tu pago está tardando en confirmarse</h1>
    <p class="nota" style="text-align:left"><b>No pagues otra vez.</b> Si el cobro salió,
      entra solo: a veces el aviso del banco tarda unos minutos.</p>
    <p class="muted">En cuanto entre te llega el acceso a
      <b>${esc(d?.email || 'tu correo')}</b>.</p>
    <button class="btn block" id="reintentar">
      <span class="material-symbols-outlined" aria-hidden="true">refresh</span> Volver a mirar</button>
    <button class="btn outline block" id="avisar" style="margin-top:var(--e1)">
      <span class="material-symbols-outlined" aria-hidden="true">forum</span> Avisar al equipo</button>
    <p class="tiny muted" style="margin-top:var(--e2)">
      Tu número de compra es
      <b style="font-variant-numeric:tabular-nums">${esc(String(compraId).slice(0, 8))}</b>.
      Tenlo a mano si nos escribes.</p>`;

  $('#reintentar').onclick = () => { intentos = 0; mirar(); };
  $('#avisar').onclick = () => abrirContacto({
    titulo: 'Pagué y no me llega el acceso',
    interes: `Pagué y todavía no me llega el acceso. Mi número de compra es `
      + `${String(compraId).slice(0, 8)}.`,
  });
}

function pintarEsperando() {
  $('#caja').innerHTML = `<span class="cargando"></span>
    <h1 style="margin:var(--e2) 0 0;font-size:1.3rem">Confirmando tu pago…</h1>
    <p class="muted">Un momento. No cierres esta pantalla.</p>`;
}

function pintarBien(d) {
  $('#caja').innerHTML = `
    <div class="tic"><span class="material-symbols-outlined">check</span></div>
    <h1 style="margin:0;font-size:1.4rem">Listo, ${esc(String(d.nombre || '').split(' ')[0])}</h1>
    <p class="muted">Ya estás inscrito en <b>${esc(d.curso)}</b>.</p>

    ${d.cuenta_nueva ? `
      <p class="nota" style="text-align:left">
        Te acabamos de crear la cuenta con <b>${esc(d.email)}</b>. Para entrar al
        aula sólo falta tu contraseña: te mandamos a ese correo un enlace para
        ponerla. Ábrelo y entras directo.</p>
      <p class="tiny muted">Si en unos minutos no lo ves, mira en correo no deseado
        o en promociones.</p>
      <button class="btn outline block" type="button" id="otraVez">
        <span class="material-symbols-outlined" aria-hidden="true">forward_to_inbox</span>
        No me llegó: mandármelo otra vez</button>
      <div id="otraVezMsg"></div>`
    : `
      <p class="nota" style="text-align:left">
        Ya tenías cuenta con <b>${esc(d.email)}</b>, así que el programa te aparece
        al entrar con tu contraseña de siempre.</p>
      <a class="btn block" href="index.html">Entrar al aula</a>`}

    <!-- El comprobante, aquí y no sólo dentro del aula.
         Quien paga un curso para su empresa lo necesita ahora, y ahora mismo
         todavía no tiene contraseña: pedirle que entre primero para bajarlo es
         pedirle que haga dos cosas para conseguir una. -->
    <button class="btn ghost block" id="recibo" style="margin-top:var(--e2)">
      <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span> Descargar el recibo</button>`;

  $('#recibo').onclick = descargarRecibo;

  /* Pedir otra vez el enlace para poner la contraseña.
     ═══════════════════════════════════════════════════════════════════════════
     Antes aquí había un botón «Poner mi contraseña» que llevaba a
     cambiar-clave.html. Esa pantalla es para cambiar la clave de fábrica y
     exige sesión, y quien acaba de comprar no la tiene: le devolvía a la de
     entrar, donde no podía entrar porque aún no tenía contraseña.

     Ahora el enlace sale por correo al cerrarse la compra (en el servidor,
     _shared/cerrar-compra.ts), y aquí sólo se puede volver a pedir. Se contesta
     igual salga o no —si se pidió hace nada, el servidor espera un minuto antes
     de mandar otro—, y el que sirve es el último que llegue. */
  const otra = $('#otraVez');
  if (otra) otra.onclick = (e) => ocupado(e.currentTarget, 'Enviando…', async () => {
    const aqui = location.href.replace(/[^/?#]*(\?.*)?(#.*)?$/, '');
    await sb.auth.resetPasswordForEmail(d.email, { redirectTo: aqui + 'nueva-clave.html' })
      .catch(() => {});
    $('#otraVezMsg').innerHTML = `<p class="nota ok sep" style="text-align:left">
      Te lo mandamos otra vez a <b>${esc(d.email)}</b>. Puede tardar un par de
      minutos; si te llegan dos, usa el último.</p>`;
  });
}

async function descargarRecibo() {
  const { data: r, error } = await sb.rpc('cem_recibo_compra_invitado', { p_compra_id: compraId });
  if (error || !r?.hay) { fail('No pudimos preparar el recibo. Escríbenos y te lo mandamos.'); return; }

  imprimirDocumento(`Recibo ${r.numero}`, `
    <div class="cab">
      <div><div class="marca">CEM INTERNATIONAL</div>
        <h1>Recibo de pago</h1></div>
      <div class="meta"><b>${esc(r.numero)}</b><br>Emitido el ${esc(r.emitido_en)}</div>
    </div>

    <h2>Recibimos de</h2>
    <div><b>${esc(r.estudiante)}</b>
      <div style="font-size:12px;color:var(--tinta-3)">${esc(r.email)}</div></div>

    <h2>Concepto</h2>
    <table><tbody>
      <tr><td>Programa</td><td class="num">${esc(r.programa)}</td></tr>
      ${r.cuota ? `<tr><td>Cuota</td><td class="num">N.º ${r.cuota} de ${r.de_cuotas}</td></tr>` : ''}
      <tr><td>Fecha del pago</td><td class="num">${esc(r.fecha)}</td></tr>
      <tr><td>Forma de pago</td><td class="num">${esc(r.metodo || '—')}</td></tr>
      <tr><td>Referencia</td><td class="num">${esc(r.referencia || '—')}</td></tr>
    </tbody></table>

    <div class="tot fuerte sep">
      <span>Monto recibido</span>
      <span>${money(r.monto, r.moneda)}</span></div>

    <div class="pie">
      Comprobante emitido automáticamente por la plataforma de CEM International.
      El detalle completo de tu plan de pago está en tu aula, en «Mis pagos».
    </div>`);
}

function pintarProblema(texto) {
  $('#caja').innerHTML = `
    <h1 style="margin-top:0;font-size:1.3rem">Algo no cuadró</h1>
    <p class="muted">${esc(texto)}</p>
    <a class="btn outline" href="catalogo.html">Volver a los programas</a>`;
}
</script>
