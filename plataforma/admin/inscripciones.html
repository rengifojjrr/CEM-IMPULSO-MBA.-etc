<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Inscripciones y pagos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Inscripciones y planes de pago</h1><p>Gestiona las inscripciones y el estado financiero de los estudiantes.</p></div>
    <div class="actions">
      <button class="btn outline" id="btnExport"><span class="material-symbols-outlined">download</span> Exportar</button>
      <button class="btn" id="btnNueva"><span class="material-symbols-outlined">person_add</span> Nueva inscripción</button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs">
    <button class="active" data-t="ins">Inscripciones</button>
    <button data-t="cuotas">Cuotas y cartera</button>
    <button data-t="pagos">Pagos registrados</button>
  </div>
  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Estudiante o programa…"></div>
      <div class="field"><label>Estado</label><select id="fEstado"><option value="">Todos</option></select></div>
      <button class="btn ghost" id="btnClear">Limpiar</button>
    </div>
    <div class="table-wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, money, num, fdate, emptyRow, match, kpi, modal, ok, run, audit, toCSV, download, qs } from '../assets/app.js';
const p = await mount({ require:['coordinador','admin','superadmin','auditor'], active:'inscripciones.html', area:'admin' });
const editable = p && ['coordinador','admin','superadmin'].includes(p.rol);
let ens=[], insts=[], pays=[], tab='ins';
if (p) load();

async function load(){
  const [{data:e},{data:i},{data:y}] = await Promise.all([
    sb.from('cem_enrollments').select('*,cem_profiles(nombre,apellido,email),cem_courses(nombre),cem_cohorts(nombre)').order('fecha_inscripcion',{ascending:false}),
    sb.from('cem_installments').select('*').order('fecha_vencimiento'),
    sb.from('cem_payments').select('*').order('fecha',{ascending:false}),
  ]);
  ens=e||[]; insts=i||[]; pays=y||[];
  const hoy = new Date().toISOString().slice(0,10);
  const vencidas = insts.filter(x=>['pendiente','parcial','vencida'].includes(x.estado) && x.fecha_vencimiento < hoy);
  $('#kpis').innerHTML = [
    kpi('Inscripciones', num(ens.length),'assignment_ind',`${ens.filter(x=>x.estado==='activa').length} activas`),
    kpi('Ingresos totales', money(pays.reduce((a,x)=>a+Number(x.monto||0),0)),'payments',`${pays.length} pagos`),
    kpi('Por cobrar', money(insts.filter(x=>x.estado!=='pagada'&&x.estado!=='anulada').reduce((a,x)=>a+Number(x.saldo||0),0)),'account_balance_wallet','cuotas abiertas'),
    kpi('Cartera vencida', money(vencidas.reduce((a,x)=>a+Number(x.saldo||0),0)),'warning',`${vencidas.length} cuotas`,'down'),
  ].join('');
  if (qs('cohorte')) $('#q').value = ens.find(x=>x.cohort_id===qs('cohorte'))?.cem_cohorts?.nombre || '';
  render();
}

$$('#tabs button').forEach(b=>b.onclick=()=>{ $$('#tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); tab=b.dataset.t; render(); });

function render(){
  const q=$('#q').value.trim(), f=$('#fEstado').value;
  if (tab==='ins'){
    $('#fEstado').innerHTML = '<option value="">Todos</option>'+['pendiente','activa','suspendida','congelada','finalizada','cancelada'].map(v=>`<option ${f===v?'selected':''}>${v}</option>`).join('');
    $('#th').innerHTML = '<tr><th>Estudiante</th><th>Programa</th><th>Cohorte</th><th>Precio</th><th>Pagado</th><th>Saldo</th><th>Estado</th><th>Fecha</th><th></th></tr>';
    const list = ens.filter(r=>match(r,q,['cem_profiles.nombre','cem_profiles.apellido','cem_profiles.email','cem_courses.nombre','cem_cohorts.nombre']) && (!f||r.estado===f));
    $('#tb').innerHTML = list.length? list.map(r=>{
      const mine = insts.filter(i=>i.enrollment_id===r.id);
      const pagado = pays.filter(x=>x.enrollment_id===r.id).reduce((a,x)=>a+Number(x.monto||0),0);
      const saldo = mine.filter(i=>i.estado!=='pagada'&&i.estado!=='anulada').reduce((a,i)=>a+Number(i.saldo||0),0);
      return `<tr>
        <td class="wrap"><b>${esc((r.cem_profiles?.nombre||'')+' '+(r.cem_profiles?.apellido||''))}</b>
          <div class="tiny muted">${esc(r.cem_profiles?.email||'')}</div></td>
        <td class="wrap">${esc(r.cem_courses?.nombre||'')}</td><td>${esc(r.cem_cohorts?.nombre||'—')}</td>
        <td>${money(r.precio_final)}</td><td>${money(pagado)}</td>
        <td>${saldo>0?`<span class="chip warn">${money(saldo)}</span>`:'<span class="chip ok">0</span>'}</td>
        <td>${chip(r.estado)}</td><td class="muted">${fdate(r.fecha_inscripcion)}</td>
        <td><a class="btn ghost sm" href="estudiante.html?id=${r.profile_id}"><span class="material-symbols-outlined">visibility</span></a></td></tr>`;
    }).join('') : emptyRow(9);
  }
  if (tab==='cuotas'){
    $('#fEstado').innerHTML = '<option value="">Todos</option>'+['pendiente','parcial','pagada','vencida','congelada','anulada','reembolsada'].map(v=>`<option ${f===v?'selected':''}>${v}</option>`).join('');
    $('#th').innerHTML = '<tr><th>Estudiante</th><th>Programa</th><th>#</th><th>Monto</th><th>Saldo</th><th>Vence</th><th>Estado</th><th></th></tr>';
    const hoy = new Date().toISOString().slice(0,10);
    const rows = insts.map(i=>({ ...i, _e: ens.find(e=>e.id===i.enrollment_id) }))
      .filter(i=>i._e && match(i._e,q,['cem_profiles.nombre','cem_profiles.apellido','cem_courses.nombre']) && (!f||i.estado===f));
    $('#tb').innerHTML = rows.length? rows.map(i=>{
      const venc = i.estado!=='pagada' && i.fecha_vencimiento < hoy;
      return `<tr><td class="wrap">${esc((i._e.cem_profiles?.nombre||'')+' '+(i._e.cem_profiles?.apellido||''))}</td>
        <td class="wrap">${esc(i._e.cem_courses?.nombre||'')}</td><td>${i.numero}</td>
        <td>${money(i.monto)}</td><td>${money(i.saldo)}</td>
        <td class="${venc?'':'muted'}">${fdate(i.fecha_vencimiento)} ${venc?'<span class="chip err">vencida</span>':''}</td>
        <td>${chip(i.estado)}</td>
        <td>${editable && i.estado!=='pagada'?`<button class="btn outline sm" data-pay="${i.id}">Registrar pago</button>`:''}</td></tr>`;
    }).join('') : emptyRow(8);
    $$('[data-pay]').forEach(b=>b.onclick=()=>pagar(insts.find(i=>i.id===b.dataset.pay)));
  }
  if (tab==='pagos'){
    $('#fEstado').innerHTML = '<option value="">Todos</option><option value="1">Conciliados</option><option value="0">Sin conciliar</option>';
    $('#th').innerHTML = '<tr><th>Fecha</th><th>Estudiante</th><th>Programa</th><th>Monto</th><th>Método</th><th>Referencia</th><th>Conciliado</th><th></th></tr>';
    const rows = pays.map(x=>({ ...x, _e: ens.find(e=>e.id===x.enrollment_id) }))
      .filter(x=>x._e && match(x._e,q,['cem_profiles.nombre','cem_profiles.apellido','cem_courses.nombre'])
        && (f===''||String(x.conciliado?1:0)===f));
    $('#tb').innerHTML = rows.length? rows.map(x=>`<tr>
      <td class="muted">${fdate(x.fecha)}</td>
      <td class="wrap">${esc((x._e.cem_profiles?.nombre||'')+' '+(x._e.cem_profiles?.apellido||''))}</td>
      <td class="wrap">${esc(x._e.cem_courses?.nombre||'')}</td><td><b>${money(x.monto)}</b></td>
      <td>${esc(x.metodo||'—')}</td><td>${esc(x.referencia||'—')}</td>
      <td>${x.conciliado?chip('sí','ok'):chip('pendiente','warn')}</td>
      <td>${editable && !x.conciliado?`<button class="btn outline sm" data-conc="${x.id}">Conciliar</button>`:''}</td></tr>`).join('') : emptyRow(8);
    $$('[data-conc]').forEach(b=>b.onclick=async()=>{
      await run(sb.from('cem_payments').update({conciliado:true}).eq('id',b.dataset.conc),'No se pudo conciliar');
      await audit('pago_conciliado','cem_payments',b.dataset.conc,'alto',{}); ok('Pago conciliado'); load();
    });
  }
}
['#q','#fEstado'].forEach(s=>{const el=$(s); el.oninput=render; el.onchange=render;});
$('#btnClear').onclick=()=>{$('#q').value='';$('#fEstado').value='';render();};
$('#btnExport').onclick=()=>{
  const rows = tab==='ins'? ens.map(r=>({estudiante:(r.cem_profiles?.nombre||'')+' '+(r.cem_profiles?.apellido||''),
      email:r.cem_profiles?.email, programa:r.cem_courses?.nombre, cohorte:r.cem_cohorts?.nombre,
      precio:r.precio_final, estado:r.estado, fecha:r.fecha_inscripcion}))
    : tab==='cuotas'? insts : pays;
  download(`${tab}_cem.csv`, toCSV(rows));
};

function pagar(i){
  const m = modal({ title:`Registrar pago · cuota ${i.numero}`, body:`
    <div class="row"><div class="field" style="flex:1;min-width:130px"><label>Monto *</label>
      <input type="number" step="0.01" id="pMonto" value="${i.saldo||i.monto}"></div>
      <div class="field" style="flex:1;min-width:150px"><label>Método</label><select id="pMetodo">
        <option>transferencia</option><option>zelle</option><option>paypal</option><option>binance</option>
        <option>efectivo</option><option>pago movil</option><option>tarjeta</option></select></div></div>
    <div class="field"><label>Referencia</label><input id="pRef"></div>
    <div class="field"><label>Comprobante (URL)</label><input id="pComp"></div>`,
    footer:`<button class="btn outline" data-x>Cancelar</button><button class="btn" data-s>Registrar</button>` });
  $('[data-x]',m).onclick=m.close;
  $('[data-s]',m).onclick=async()=>{
    await run(sb.rpc('cem_register_payment',{ p_installment_id:i.id, p_monto:Number($('#pMonto',m).value),
      p_metodo:$('#pMetodo',m).value, p_referencia:$('#pRef',m).value.trim()||null,
      p_comprobante:$('#pComp',m).value.trim()||null }),'No se pudo registrar');
    m.close(); ok('Pago registrado'); load();
  };
}

$('#btnNueva').onclick = async () => {
  const [{data:est},{data:cursos},{data:cohs}] = await Promise.all([
    sb.from('cem_profiles').select('id,nombre,apellido,email').eq('rol','estudiante').order('nombre'),
    sb.from('cem_courses').select('id,nombre,precio').eq('estado','publicado').order('nombre'),
    sb.from('cem_cohorts').select('id,nombre,course_id'),
  ]);
  const m = modal({ title:'Nueva inscripción', body:`
    <div class="field"><label>Estudiante *</label><select id="nEst">
      ${(est||[]).map(e=>`<option value="${e.id}">${esc(e.nombre)} ${esc(e.apellido||'')} — ${esc(e.email)}</option>`).join('')}</select></div>
    <div class="field"><label>Programa *</label><select id="nCurso">
      ${(cursos||[]).map(c=>`<option value="${c.id}" data-p="${c.precio}">${esc(c.nombre)}</option>`).join('')}</select></div>
    <div class="field"><label>Cohorte</label><select id="nCoh"></select></div>
    <div class="row"><div class="field" style="flex:1;min-width:120px"><label>Cuotas</label>
      <select id="nCuotas"><option value="1">Pago único</option><option value="3" selected>3</option><option value="6">6</option></select></div>
      <div class="field" style="flex:1;min-width:120px"><label>Descuento</label><input type="number" step="0.01" id="nDesc" value="0"></div></div>`,
    footer:`<button class="btn outline" data-x>Cancelar</button><button class="btn" data-s>Crear inscripción</button>` });
  const fill=()=>{ const cid=$('#nCurso',m).value;
    $('#nCoh',m).innerHTML='<option value="">Sin cohorte</option>'+(cohs||[]).filter(c=>c.course_id===cid).map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join(''); };
  fill(); $('#nCurso',m).onchange=fill;
  $('[data-x]',m).onclick=m.close;
  $('[data-s]',m).onclick=async()=>{
    const precio=Number($('#nCurso',m).selectedOptions[0].dataset.p)||0, desc=Number($('#nDesc',m).value)||0;
    const cuotas=Number($('#nCuotas',m).value)||1, final=Math.max(precio-desc,0);
    const enr = await run(sb.from('cem_enrollments').insert({ profile_id:$('#nEst',m).value, course_id:$('#nCurso',m).value,
      cohort_id:$('#nCoh',m).value||null, precio_lista:precio, descuento:desc, precio_final:final, estado:'pendiente' })
      .select().single(),'No se pudo crear');
    const monto=Math.round((final/cuotas)*100)/100;
    await run(sb.from('cem_installments').insert(Array.from({length:cuotas},(_,k)=>({
      enrollment_id:enr.id, numero:k+1, monto, saldo:monto,
      fecha_vencimiento:new Date(Date.now()+k*30*86400000).toISOString().slice(0,10), estado:'pendiente'}))),'No se crearon las cuotas');
    await audit('inscripcion_manual','cem_enrollments',enr.id,'medio',{});
    m.close(); ok('Inscripción creada'); load();
  };
};
</script>
</body>
</html>
