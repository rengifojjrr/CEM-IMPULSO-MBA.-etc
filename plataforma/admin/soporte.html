<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Centro de soporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .sup{display:grid;grid-template-columns:minmax(250px,340px) minmax(0,1fr);gap:16px;align-items:start;}
  @media(max-width:900px){ .sup{grid-template-columns:1fr;} }
  .tk{display:flex;gap:10px;padding:11px;border-radius:9px;cursor:pointer;}
  .tk:hover{background:var(--surface-container);}
  .tk.on{background:var(--secondary-container);}
  .msg{padding:10px 12px;border-radius:10px;margin-bottom:8px;max-width:82%;}
  .msg.in{background:var(--surface-container);}
  .msg.out{background:var(--primary-fixed);margin-left:auto;}
  .msg.interno{background:var(--warn-container);}
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Centro de soporte</h1><p>Gestiona y resuelve las consultas de estudiantes.</p></div>
    <div class="actions"><button class="btn" id="btnNuevo"><span class="material-symbols-outlined">add</span> Nuevo ticket</button></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="sup">
    <div class="card" style="max-height:78vh;overflow:auto">
      <div class="filters" style="margin-bottom:8px">
        <div class="field grow" style="min-width:120px"><input type="search" id="q" placeholder="Buscar…"></div>
      </div>
      <div class="row" style="gap:4px;margin-bottom:8px" id="fEstados"></div>
      <div id="lista"></div>
    </div>
    <div id="detalle"></div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, num, fdatetime, kpi, match, initials, modal, ok, run, audit } from '../assets/app.js';
const p = await mount({ require:['coordinador','admin','superadmin','auditor'], active:'soporte.html', area:'admin' });
const puede = p && ['coordinador','admin','superadmin'].includes(p.rol);
let tickets=[], sel=null, fEstado='', staff=[];
if (p) load();

async function load(){
  const [{data},{data:st}] = await Promise.all([
    sb.from('cem_tickets').select('*,cem_profiles!cem_tickets_profile_id_fkey(nombre,apellido,email)').order('actualizado_en',{ascending:false}),
    sb.from('cem_profiles').select('id,nombre,apellido').in('rol',['coordinador','admin','superadmin']),
  ]);
  tickets=data||[]; staff=st||[];
  $('#kpis').innerHTML = [
    kpi('Tickets', num(tickets.length),'support_agent','en total'),
    kpi('Abiertos', num(tickets.filter(t=>['abierto','en_proceso','esperando'].includes(t.estado)).length),'pending_actions','sin resolver'),
    kpi('Alta prioridad', num(tickets.filter(t=>['alta','urgente'].includes(t.prioridad)&&t.estado!=='cerrado').length),'priority_high','requieren atención'),
    kpi('Resueltos', num(tickets.filter(t=>['resuelto','cerrado'].includes(t.estado)).length),'check_circle','cerrados'),
  ].join('');
  $('#fEstados').innerHTML = [['','Todos'],['abierto','Abiertos'],['en_proceso','En proceso'],['resuelto','Resueltos']]
    .map(([v,l])=>`<button class="chip chip-btn ${fEstado===v?'on':''}" data-f="${v}">${l}</button>`).join('');
  $$('[data-f]').forEach(b=>b.onclick=()=>{ fEstado=b.dataset.f; sel=null; load(); });
  render();
}

function render(){
  const q=$('#q').value.trim();
  const list = tickets.filter(t=>match(t,q,['asunto','descripcion','codigo','cem_profiles.nombre','cem_profiles.apellido'])
    && (!fEstado||t.estado===fEstado));
  $('#lista').innerHTML = list.length ? list.map(t=>`
    <div class="tk ${sel?.id===t.id?'on':''}" data-t="${t.id}">
      <span class="avatar">${initials(t.cem_profiles?.nombre,t.cem_profiles?.apellido)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px">${esc(t.asunto)}</div>
        <div class="tiny muted">${esc(t.codigo||'')} · ${esc((t.cem_profiles?.nombre||'')+' '+(t.cem_profiles?.apellido||''))}</div>
        <div class="row" style="gap:5px;margin-top:4px">${chip(t.estado)}${chip(t.prioridad)}</div>
      </div></div>`).join('') : '<p class="muted tiny">Sin tickets.</p>';
  $$('[data-t]').forEach(el=>el.onclick=()=>{ sel=tickets.find(t=>t.id===el.dataset.t); render(); });
  detalle();
}
$('#q').oninput = render;

async function detalle(){
  const D=$('#detalle');
  if (!sel){ D.innerHTML = `<div class="card" style="text-align:center;padding:44px">
    <span class="material-symbols-outlined" style="font-size:42px;color:var(--outline)">forum</span>
    <h3>Selecciona un ticket</h3><p class="muted tiny">Elige un ticket de la lista para ver la conversación.</p></div>`; return; }
  const t=sel;
  const { data: msgs } = await sb.from('cem_ticket_messages').select('*,cem_profiles(nombre,apellido,rol)')
    .eq('ticket_id',t.id).order('created_at');
  D.innerHTML = `<div class="card">
    <div class="row between">
      <div><h2 class="sec" style="margin:0 0 3px">${esc(t.asunto)}</h2>
        <div class="tiny muted">${esc(t.codigo||'')} · ${esc((t.cem_profiles?.nombre||'')+' '+(t.cem_profiles?.apellido||''))}
          · ${esc(t.cem_profiles?.email||'')}</div></div>
      <div class="row">${chip(t.estado)}${chip(t.prioridad)}${chip(t.categoria,'neutral')}</div>
    </div>
    ${puede? `<div class="row" style="margin-top:12px">
      <div class="field" style="margin:0;flex:1;min-width:140px"><label class="tiny">Estado</label><select id="sEstado">
        ${['abierto','en_proceso','esperando','resuelto','cerrado'].map(v=>`<option ${t.estado===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field" style="margin:0;flex:1;min-width:140px"><label class="tiny">Prioridad</label><select id="sPrio">
        ${['baja','media','alta','urgente'].map(v=>`<option ${t.prioridad===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field" style="margin:0;flex:1;min-width:160px"><label class="tiny">Asignado a</label><select id="sAsig">
        <option value="">Sin asignar</option>
        ${staff.map(s=>`<option value="${s.id}" ${t.asignado_a===s.id?'selected':''}>${esc(s.nombre)} ${esc(s.apellido||'')}</option>`).join('')}</select></div>
      <button class="btn outline sm" id="btnUpd" style="align-self:flex-end">Actualizar</button>
    </div>`:''}

    <div class="card" style="background:var(--surface-container);box-shadow:none;margin-top:14px">
      <b class="tiny">Descripción original</b>
      <p class="tiny" style="margin:6px 0 0;white-space:pre-wrap">${esc(t.descripcion||'')}</p></div>

    <div style="margin-top:14px">
      ${(msgs||[]).map(m=>`<div class="msg ${m.interno?'interno':(m.cem_profiles?.rol==='estudiante'?'in':'out')}">
        <div class="tiny" style="font-weight:700">${esc((m.cem_profiles?.nombre||'')+' '+(m.cem_profiles?.apellido||''))}
          ${m.interno?'<span class="chip warn">nota interna</span>':''}</div>
        <div style="white-space:pre-wrap">${esc(m.cuerpo)}</div>
        <div class="tiny muted" style="margin-top:3px">${fdatetime(m.created_at)}</div></div>`).join('')
        || '<p class="muted tiny">Sin respuestas todavía.</p>'}
    </div>

    ${puede? `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--outline-variant)">
      <div class="field"><label>Responder</label><textarea id="rMsg" placeholder="Escribe tu respuesta…"></textarea></div>
      <div class="row"><label class="check"><input type="checkbox" id="rInt"> Nota interna (no visible para el estudiante)</label>
        <button class="btn" id="btnMsg" style="margin-left:auto"><span class="material-symbols-outlined">send</span> Enviar</button></div>
    </div>`:''}
  </div>`;

  if (puede){
    $('#btnUpd').onclick = async () => {
      await run(sb.from('cem_tickets').update({ estado:$('#sEstado').value, prioridad:$('#sPrio').value,
        asignado_a:$('#sAsig').value||null, actualizado_en:new Date().toISOString() }).eq('id',t.id),'No se pudo actualizar');
      await audit('ticket_actualizado','cem_tickets',t.id,'bajo',{estado:$('#sEstado').value});
      ok('Ticket actualizado'); const id=t.id; await load(); sel=tickets.find(x=>x.id===id); render();
    };
    $('#btnMsg').onclick = async () => {
      const cuerpo=$('#rMsg').value.trim(); if (!cuerpo) return;
      await run(sb.from('cem_ticket_messages').insert({ ticket_id:t.id, autor_id:p.id, cuerpo, interno:$('#rInt').checked }),'No se pudo enviar');
      if (t.estado==='abierto') await sb.from('cem_tickets').update({estado:'en_proceso', actualizado_en:new Date().toISOString()}).eq('id',t.id);
      ok('Respuesta enviada'); const id=t.id; await load(); sel=tickets.find(x=>x.id===id); render();
    };
  }
}

$('#btnNuevo').onclick = async () => {
  const { data: est } = await sb.from('cem_profiles').select('id,nombre,apellido,email').eq('rol','estudiante').order('nombre');
  const m = modal({ title:'Nuevo ticket', body:`
    <div class="field"><label>Estudiante *</label><select id="nE">
      ${(est||[]).map(e=>`<option value="${e.id}">${esc(e.nombre)} ${esc(e.apellido||'')} — ${esc(e.email)}</option>`).join('')}</select></div>
    <div class="field"><label>Asunto *</label><input id="nA"></div>
    <div class="row">
      <div class="field" style="flex:1;min-width:140px"><label>Categoría</label><select id="nC">
        ${['acceso','contenido','pagos','certificados','general'].map(v=>`<option>${v}</option>`).join('')}</select></div>
      <div class="field" style="flex:1;min-width:140px"><label>Prioridad</label><select id="nP">
        ${['baja','media','alta','urgente'].map(v=>`<option ${v==='media'?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Descripción</label><textarea id="nD"></textarea></div>`,
    footer:`<button class="btn outline" data-x>Cancelar</button><button class="btn" data-s>Crear ticket</button>` });
  $('[data-x]',m).onclick=m.close;
  $('[data-s]',m).onclick=async()=>{
    if (!$('#nA',m).value.trim()) return;
    await run(sb.from('cem_tickets').insert({ codigo:'TK-'+String(Date.now()).slice(-6),
      profile_id:$('#nE',m).value, asunto:$('#nA',m).value.trim(), categoria:$('#nC',m).value,
      prioridad:$('#nP',m).value, descripcion:$('#nD',m).value.trim(), estado:'abierto', asignado_a:p.id }),'No se pudo crear');
    await audit('ticket_creado','cem_tickets',null,'bajo',{}); m.close(); ok('Ticket creado'); load();
  };
};
</script>
</body>
</html>
