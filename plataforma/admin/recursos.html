<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Recursos para redes</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-24-3">
<style>
  /* En bloque y con ancho máximo, y no por gusto: siendo un elemento EN LÍNEA
     sin límite, la dirección se llevaba todo el ancho que pedía —son sesenta
     caracteres— y empujaba la tabla más allá del borde de la tarjeta. Los
     botones de la última columna quedaban fuera, detrás de un desplazamiento
     horizontal que nadie ve, así que era como si no existieran.
     `word-break` sólo parte la línea cuando hay una anchura que respetar. */
  /* sin-caja: un enlace en monoespaciada para copiarlo, no un panel */
  .enlace-manychat{display:block;max-width:26ch;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t-xs);
    background:var(--hueco);padding:6px 9px;border-radius:var(--r-sm);border:1px solid var(--filete);
    word-break:break-all;}

  /* La fila se pulsa entera. Sin la mano y el resalte al pasar por encima,
     nadie adivina que se puede pulsar: un botón pequeño en la esquina era
     justo lo que no se encontraba. */
  .fila-recurso{cursor:pointer;}
  .fila-recurso:hover{background:var(--hueco);}
  .fila-recurso:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
  .fila-recurso .flecha{font-size:20px;color:var(--tinta-2);
    transition:transform var(--rapido);}
  .fila-recurso.abierta .flecha{transform:rotate(90deg);color:var(--primary);}
  @media (prefers-reduced-motion:reduce){ .fila-recurso .flecha{transition:none;} }

  /* En una pantalla estrecha sobra una columna, y la que sobra es la fecha.
     ───────────────────────────────────────────────────────────────────────
     Entre 720 y 1200 px la tabla no cabe: por debajo de 720 se apila sola en
     tarjetas, y por encima de 1200 caben las seis. En esa franja hay que
     quitar algo, y la última entrega es lo más prescindible —sale otra vez,
     y por persona, en cuanto se abre la fila—. Lo que NO puede desaparecer
     son los botones, que es justo lo que pasaba antes. */
  @media (min-width:721px) and (max-width:1200px){
    .col-fecha{display:none;}
  }

  /* La fila que se abre debajo. Fondo distinto para que se vea que pertenece
     a la de arriba y no es una fila más de la tabla. */
  .desplegado{background:var(--hueco);padding:14px 16px;}
  /* El archivo a la izquierda y la gente a la derecha mientras quepan; en un
     portátil estrecho o en el teléfono, uno debajo del otro. */
  .dos-lados{display:grid;gap:var(--e3);
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr));align-items:start;}

  /* sin-caja: el marco del archivo, que no es un panel de la interfaz */
  .ojeada{border:1px solid var(--filete);border-radius:var(--r);overflow:hidden;
    background:var(--hueco);}
  .ojeada iframe{display:block;width:100%;height:min(60vh,520px);border:0;}
  .ojeada img{display:block;width:100%;height:auto;max-height:min(60vh,520px);
    object-fit:contain;}
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Recursos para redes</h1>
      <p>Lo que se regala a cambio de un contacto: «comenta IA y te mando la clase».
         Cada recurso tiene su enlace, y ese enlace es el que se pega en ManyChat.</p></div>
    <div class="actions">
      <button class="btn" id="btnNuevo">
        <span class="material-symbols-outlined">add</span> Nuevo recurso</button>
    </div>
  </div>

  <div id="avisoMotor"></div>
  <div class="kpis" id="kpis"></div>
  <div id="cuerpo"><span class="cargando"></span></div>
</div>

<script type="module">
/* Los imanes de captación.
   ═══════════════════════════════════════════════════════════════════════════
   Cómo encaja con el resto: quien reclama un recurso NO se convierte en
   alumno. Queda en «Contactos de la web» —la misma tabla que el formulario de
   la portada— con el recurso que pidió apuntado como interés. Después se le
   invita por correo a terminar la cuenta, y si lo hace entra por el registro
   normal como cualquiera.

   Es a propósito: pedirle contraseña y confirmación de correo a alguien que
   viene de comentar una palabra en Instagram es donde se cae la mitad de la
   gente, y lo que se buscaba era justamente traerla. */
import { sb, mount, $, $$, esc, num, chip, fdate, ok, fail, toast, modal, avisar,
         confirmDialog, mensajeError, emptyRow, ocupado, subirRegalo, SUPABASE_URL }
  from '../assets/app.js?v=2026-08-24-3';

await mount({ require:['coordinador','admin','superadmin'], area:'admin', active:'recursos.html' });

/* La dirección que se reparte. Sale del sitio donde está publicada la
   plataforma y no escrita a mano: en local es 127.0.0.1 y publicada es el
   dominio, y copiar un enlace de localhost a ManyChat es un error que no
   avisa hasta que alguien lo pulsa. */
const SITIO = location.origin + location.pathname.replace(/\/admin\/[^/]*$/, '');
const enlaceDe = (codigo) => `${SITIO}/recurso.html?c=${codigo}`;

let RECURSOS = [];

const COMO_SE_LLAMA = { documento: 'Documento', video: 'Vídeo', enlace: 'Enlace' };
const ICONO = { documento: 'description', video: 'play_circle', enlace: 'link' };

/* ¿Está el motor puesto?
   ═══════════════════════════════════════════════════════════════════════════
   Quien entrega los recursos es una función de servidor: es la única que puede
   firmar el enlace de un documento guardado en privado. Si no está desplegada,
   esta pantalla funciona entera —se crean recursos, se copian enlaces— y lo
   que falla es lo que pasa al otro lado, donde no lo ve nadie del equipo.

   Así que se pregunta al abrir. Vale la pena la llamada: descubrir esto porque
   alguien te escribe diciendo que el enlace no le dio nada es descubrirlo
   tarde y con público delante. */
async function mirarElMotor(){
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/cem-recurso`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      // Sin código: la función contesta que falta, y con eso ya sabemos que está.
      body: '{}',
    });
    if (res.status !== 404) return;
  } catch { /* sin red: no se puede afirmar que falte, así que no se dice nada */
    return;
  }
  $('#avisoMotor').innerHTML = `<div class="nota err">
    <b>Falta desplegar el motor de entrega.</b>
    Puedes crear recursos y copiar sus enlaces, pero <b>quien los abra no
    recibirá nada</b>: la función que firma el enlace del documento y anota el
    contacto no está publicada en Supabase.
    <br><br>Se arregla con un comando, desde el repositorio:
    <code>supabase functions deploy cem-recurso --no-verify-jwt</code>
    <br><span class="tiny muted">Mientras tanto conviene no repartir los
    enlaces por redes.</span></div>`;
}

async function cargar(){
  mirarElMotor();
  const { data, error } = await sb.rpc('cem_recursos_listar');
  if (error) { avisar('#cuerpo', mensajeError(error)); return; }
  RECURSOS = data || [];
  pintar();
}

function pintar(){
  const activos = RECURSOS.filter(r => r.activo).length;
  const personas = RECURSOS.reduce((s, r) => s + Number(r.personas || 0), 0);
  const conCuenta = RECURSOS.reduce((s, r) => s + Number(r.con_cuenta || 0), 0);
  const pct = personas ? Math.round(conCuenta / personas * 100) : 0;

  /* Tres cifras y la tercera es la que importa.
     ───────────────────────────────────────────────────────────────────────
     Cuánta gente pidió el material dice si la publicación gustó. Cuánta acabó
     con cuenta dice si sirvió. Cien descargas y ningún alumno es una
     publicación que entretuvo. */
  $('#kpis').innerHTML = [
    `<div class="kpi"><div class="k-lbl">Recursos</div><div class="k-val">${num(RECURSOS.length)}</div>
      <div class="k-sub">${num(activos)} con el enlace vivo</div></div>`,
    `<div class="kpi"><div class="k-lbl">Contactos traídos</div><div class="k-val">${num(personas)}</div>
      <div class="k-sub">personas que dejaron sus datos</div></div>`,
    `<div class="kpi"><div class="k-lbl">Ya con cuenta</div><div class="k-val">${num(conCuenta)}</div>
      <div class="k-sub">${personas ? `${pct} % de los que pidieron algo` : 'todavía nadie ha pedido nada'}</div></div>`,
  ].join('');

  if (!RECURSOS.length) {
    $('#cuerpo').innerHTML = `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Recurso</th></tr></thead><tbody>
      ${emptyRow(1, 'Todavía no hay ningún recurso. Aquí se crean los documentos y vídeos que '
        + 'se regalan en redes a cambio de un contacto.',
        { texto:'Crear el primero', id:'vacioRec', icono:'redeem' })}
      </tbody></table></div></div>`;
    $('#vacioRec').onclick = () => editar(null);
    return;
  }

  /* Seis columnas, no ocho.
     ═══════════════════════════════════════════════════════════════════════
     La versión anterior tenía siete y no cabían: la tabla se desbordaba y los
     botones de la última columna —«Quiénes», editar, borrar— quedaban fuera
     del borde, detrás de un desplazamiento horizontal que nadie ve. Estaban
     ahí y era como si no existieran.

     Se juntan «Personas» y «Con cuenta» en una sola celda, porque las dos
     cifras se leen juntas o no dicen nada: dos personas está bien o está mal
     según cuántas se quedaron. */
  $('#cuerpo').innerHTML = `<div class="card"><div class="table-wrap"><table class="tarjetas">
    <thead><tr>
      <th>Recurso</th><th>Enlace para ManyChat</th><th>Gente</th>
      <th class="col-fecha">Última</th><th>Estado</th><th></th>
    </tr></thead>
    <tbody>${RECURSOS.map(r => `<tr class="fila-recurso" data-abrir="${esc(r.id)}"
        role="button" tabindex="0" aria-expanded="false" aria-controls="gente-${esc(r.id)}"
        title="Pulsa para ver quién lo pidió">
      <td data-col="Recurso">
        <div class="t" style="display:flex;align-items:center;gap:7px">
          <span class="material-symbols-outlined flecha">chevron_right</span>
          <span class="material-symbols-outlined" style="font-size:18px;color:var(--primary)">${ICONO[r.tipo] || 'redeem'}</span>
          ${esc(r.titulo)}</div>
        <div class="s" style="padding-left:25px">${esc(COMO_SE_LLAMA[r.tipo] || r.tipo)}${
          r.gancho ? ` · comentan «${esc(r.gancho)}»` : ''}</div>
      </td>
      <td data-col="Enlace para ManyChat">
        <code class="enlace-manychat">${esc(enlaceDe(r.codigo))}</code>
        <button class="btn ghost sm" data-copiar="${esc(r.codigo)}" type="button" style="margin-top:5px">
          <span class="material-symbols-outlined">content_copy</span> Copiar</button>
      </td>
      <td data-col="Gente" class="nowrap">
        <div class="t">${num(r.personas || 0)} ${Number(r.personas) === 1 ? 'persona' : 'personas'}</div>
        <div class="s">${Number(r.personas)
          ? `${num(r.con_cuenta || 0)} con cuenta · ${Math.round((r.con_cuenta || 0) / r.personas * 100)} %`
          : 'nadie todavía'}</div>
      </td>
      <td data-col="Última" class="nowrap col-fecha">${r.ultima ? fdate(r.ultima) : '—'}</td>
      <td data-col="Estado">${r.activo ? chip('Activo','ok') : chip('Apagado','')}</td>
      <td class="acciones nowrap">
        <button class="btn ghost sm" data-editar="${esc(r.id)}" type="button" title="Editar">
          <span class="material-symbols-outlined">edit</span></button>
        <button class="btn ghost sm" data-borrar="${esc(r.id)}" type="button" title="Borrar">
          <span class="material-symbols-outlined">delete</span></button>
      </td></tr>
      <!-- Lo que se abre debajo, en lugar de un diálogo. Un diálogo tapa la
           tabla, así que comparar dos recursos obliga a abrir, leer, cerrar y
           abrir el otro. Desplegados se pueden tener los dos a la vez. -->
      <tr class="hidden" data-gente="${esc(r.id)}" id="gente-${esc(r.id)}">
        <td colspan="6" class="desplegado"></td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ── crear y editar ─────────────────────────────────────────────────────── */
function editar(r){
  const esNuevo = !r;
  const m = modal({
    title: esNuevo ? 'Nuevo recurso' : 'Editar recurso',
    wide: true,
    body: `
      <div class="field"><label for="rTitulo">Título</label>
        <input id="rTitulo" value="${esc(r?.titulo || '')}" placeholder="Clase: IA aplicada al marketing">
        <span class="pista">Es lo que se lee arriba del todo cuando alguien abre el enlace.</span></div>

      <div class="field"><label for="rCodigo">Código del enlace</label>
        <input id="rCodigo" value="${esc(r?.codigo || '')}" placeholder="clase-ia" autocomplete="off">
        <span class="pista">Minúsculas, números y guiones. Es lo que va al final del enlace, así que
          conviene que se lea: <code>clase-ia</code> mejor que <code>c7f3</code>.
          <b>Si lo cambias, el enlace de antes deja de funcionar.</b></span></div>

      <div class="field"><label for="rDesc">De qué va</label>
        <textarea id="rDesc" rows="2" placeholder="Dos líneas para que sepa qué va a recibir.">${esc(r?.descripcion || '')}</textarea></div>

      <div class="field"><label for="rGancho">Palabra que se comenta <span class="tiny muted">(opcional)</span></label>
        <input id="rGancho" value="${esc(r?.gancho || '')}" placeholder="IA">
        <span class="pista">No lo usa el programa: sirve para que dentro de seis meses sepas qué
          publicación trajo a esta gente.</span></div>

      <div class="field"><label for="rTipo">Qué se entrega</label>
        <select id="rTipo">
          <option value="documento"${r?.tipo === 'documento' ? ' selected' : ''}>Un documento (PDF, Word, presentación…)</option>
          <option value="video"${r?.tipo === 'video' ? ' selected' : ''}>Un vídeo de YouTube</option>
          <option value="enlace"${r?.tipo === 'enlace' ? ' selected' : ''}>Un enlace a otro sitio</option>
        </select></div>

      <div id="segunTipo"></div>

      <label class="casilla sep"><input type="checkbox" id="rActivo"${r?.activo !== false ? ' checked' : ''}>
        <span class="tiny muted">El enlace funciona. Si lo apagas, quien lo abra verá que ya no está
          disponible en vez de un error.</span></label>
      <div id="rMsg"></div>`,
    footer: `<button class="btn ghost" data-x>Cancelar</button>
             <button class="btn" id="rGuardar">Guardar</button>`,
  });

  /* Lo subido en esta sesión, si se cambió el archivo. `null` quiere decir
     «déjalo como estaba», que es lo que espera la función de la base. */
  let subido = null;

  const pintarSegunTipo = () => {
    const t = $('#rTipo', m).value;
    const host = $('#segunTipo', m);
    if (t === 'documento') {
      host.innerHTML = `<div class="field"><label for="rArchivo">El documento</label>
        <input type="file" id="rArchivo"
          accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,image/*">
        <span class="pista" id="rArchivoPista">${
          r?.archivo_nombre
            ? `Ahora mismo se entrega <b>${esc(r.archivo_nombre)}</b>. Elige otro sólo si quieres cambiarlo.`
            : 'Se guarda en privado: sólo se puede abrir con un enlace que caduca a la hora.'}</span></div>`;
      $('#rArchivo', m).onchange = async (ev) => {
        const f = ev.target.files?.[0];
        if (!f) return;
        const pista = $('#rArchivoPista', m);
        pista.textContent = 'Subiendo…';
        try {
          subido = await subirRegalo(f);
          pista.innerHTML = `Listo: <b>${esc(subido.nombre)}</b>. Se guardará al pulsar «Guardar».`;
        } catch (e) { subido = null; pista.innerHTML = `<span class="err-text">${esc(e.message)}</span>`; }
      };
    } else if (t === 'video') {
      host.innerHTML = `<div class="field"><label for="rVideo">El vídeo de YouTube</label>
        <input id="rVideo" value="${esc(r?.video_id || '')}" placeholder="https://youtu.be/… o el identificador">
        <span class="pista">Pega la dirección entera y se queda con lo que hace falta.
          Puede ser un vídeo oculto: se ve incrustado aquí sin salir a YouTube.</span></div>`;
    } else {
      host.innerHTML = `<div class="field"><label for="rUrl">La dirección</label>
        <input id="rUrl" value="${esc(r?.url || '')}" placeholder="https://…" inputmode="url">
        <span class="pista">Por ejemplo, un formulario para agendar la asesoría.</span></div>`;
    }
  };
  pintarSegunTipo();
  $('#rTipo', m).onchange = pintarSegunTipo;

  /* Escribir el título rellena el código solo, pero sólo mientras se está
     creando y sólo si nadie lo ha tocado: cambiárselo a un recurso que ya está
     repartido rompería los enlaces que hay dando vueltas. */
  let codigoTocado = !esNuevo;
  $('#rCodigo', m).oninput = () => { codigoTocado = true; };
  $('#rTitulo', m).oninput = () => {
    if (codigoTocado) return;
    $('#rCodigo', m).value = $('#rTitulo', m).value
      .replace(/[ñÑ]/g, 'n').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  };

  $('#rGuardar', m).onclick = () => ocupado($('#rGuardar', m), 'Guardando…', async () => {
    const tipo = $('#rTipo', m).value;
    const video = $('#rVideo', m)?.value.trim() || '';
    /* De una dirección de YouTube sólo interesa el identificador, y llega de
       cuatro formas distintas según de dónde se copie. */
    const idVideo = (video.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{6,})/) || [, video])[1];

    if (tipo === 'documento' && !subido && !r?.storage_path) {
      return avisar('#rMsg', 'Falta el documento que se va a entregar.', 'err');
    }
    if (tipo === 'video' && !idVideo) return avisar('#rMsg', 'Falta el vídeo.', 'err');
    if (tipo === 'enlace' && !$('#rUrl', m)?.value.trim()) {
      return avisar('#rMsg', 'Falta la dirección a la que se manda.', 'err');
    }

    const { error } = await sb.rpc('cem_recurso_guardar', {
      p_id: r?.id || null,
      p_codigo: $('#rCodigo', m).value.trim(),
      p_titulo: $('#rTitulo', m).value.trim(),
      p_descripcion: $('#rDesc', m).value.trim() || null,
      p_tipo: tipo,
      p_storage_path: subido?.ruta || null,
      p_archivo_nombre: subido?.nombre || null,
      p_video_id: tipo === 'video' ? idVideo : null,
      p_url: tipo === 'enlace' ? $('#rUrl', m).value.trim() : null,
      p_gancho: $('#rGancho', m).value.trim() || null,
      p_activo: $('#rActivo', m).checked,
    });
    if (error) return avisar('#rMsg', mensajeError(error), 'err');
    m.close();
    ok(esNuevo ? 'Recurso creado. Ya puedes copiar su enlace.' : 'Guardado.');
    cargar();
  });
}

/* ── lo que se abre al pulsar la fila ────────────────────────────────────── */
/* Dos cosas a la vez: el archivo y la gente. Son justo las dos preguntas que
   uno tiene delante de un recurso —«¿qué estoy repartiendo?» y «¿a quién le
   está llegando?»— y separarlas en dos botones obligaba a hacer dos clics
   para responder una sola. */
async function abrir(r, fila){
  const panel = $(`[data-gente="${r.id}"]`);
  const celda = $('.desplegado', panel);

  // Segundo clic sobre la misma fila: se cierra.
  if (!panel.classList.contains('hidden')) {
    panel.classList.add('hidden');
    fila.setAttribute('aria-expanded', 'false');
    fila.classList.remove('abierta');
    return;
  }
  panel.classList.remove('hidden');
  fila.setAttribute('aria-expanded', 'true');
  fila.classList.add('abierta');
  celda.innerHTML = '<p class="tiny muted">Buscando…</p>';

  const [archivo, { data, error }] = await Promise.all([
    vistaDelArchivo(r),
    sb.rpc('cem_recurso_quienes', { p_recurso_id: r.id }),
  ]);

  const gente = error
    ? `<div class="nota err">${esc(mensajeError(error))}</div>`
    : !data?.length
      ? '<p class="muted tiny">Todavía no lo ha pedido nadie. Cuando alguien abra el enlace y '
        + 'deje sus datos, aparecerá aquí.</p>'
      : (() => {
          const conCuenta = data.filter(p => p.perfil_id).length;
          return `<p class="tiny muted">${data.length} persona${data.length === 1 ? '' : 's'};
            <b>${conCuenta}</b> ${conCuenta === 1 ? 'ya tiene cuenta' : 'ya tienen cuenta'}.
            Están todas en <a href="leads.html">Contactos de la web</a>.</p>
          <div class="table-wrap"><table>
            <thead><tr><th>Cuándo</th><th>Quién</th><th>Contacto</th>
              <th>De dónde</th><th>Qué pasó después</th></tr></thead>
            <tbody>${data.map(p => `<tr>
              <td data-col="Cuándo" class="nowrap">${fdate(p.cuando)}</td>
              <td data-col="Quién">${esc(p.nombre || '—')}</td>
              <td data-col="Contacto"><div class="t">${
                p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : '—'}</div>
                <div class="s">${p.telefono
                  ? `<a href="tel:${esc(String(p.telefono).replace(/\s/g,''))}">${esc(p.telefono)}</a>` : ''}</div></td>
              <td data-col="De dónde">${esc(p.origen || '—')}</td>
              <td data-col="Qué pasó después">${
                !p.perfil_id ? '<span class="tiny muted">Sólo contacto</span>'
                : Number(p.inscripciones) > 0
                  ? chip(`Alumno · ${num(p.inscripciones)} inscripción(es)`, 'ok')
                  : chip('Se hizo cuenta', 'info')}</td>
            </tr>`).join('')}</tbody></table></div>`;
        })();

  celda.innerHTML = `<div class="dos-lados">
    <div>${archivo}</div>
    <div>${gente}</div>
  </div>`;
}

/* El archivo, firmado por el propio equipo.
   ───────────────────────────────────────────────────────────────────────────
   La política del cubo privado deja leer al equipo, así que no hace falta
   pasar por la función de servidor —que está pensada para quien NO tiene
   cuenta—. Y así mirar el archivo no ensucia el recuento de personas que lo
   pidieron, que es la cifra con la que se decide si la publicación sirvió. */
async function vistaDelArchivo(r){
  if (r.tipo === 'enlace') {
    return `<p class="tiny muted">Manda a:</p>
      <a class="btn outline sm" href="${esc(r.url)}" target="_blank" rel="noopener">
        <span class="material-symbols-outlined">open_in_new</span> Abrir el enlace</a>`;
  }
  if (r.tipo === 'video') {
    return `<div class="ojeada"><iframe
      src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(r.video_id)}?rel=0"
      title="${esc(r.titulo)}" allowfullscreen loading="lazy"></iframe></div>`;
  }

  const { data, error } = await sb.storage.from('cem-regalos')
    .createSignedUrl(r.storage_path, 300);   // cinco minutos: es para mirarlo ahora
  if (error || !data?.signedUrl) {
    return `<div class="nota err">No se pudo abrir el archivo:
      ${esc(error?.message || 'el almacén no lo encontró')}.<br>
      <span class="tiny">Si acabas de subirlo, vuelve a guardarlo. Si no, pudo borrarse
      del almacén y habría que subirlo otra vez.</span></div>`;
  }

  const ext = (r.archivo_nombre || '').split('.').pop().toLowerCase();
  const dentro = ext === 'pdf'
    ? `<div class="ojeada"><iframe src="${esc(data.signedUrl)}"
        title="${esc(r.titulo)}" loading="lazy"></iframe></div>`
    : ['png','jpg','jpeg','webp','gif','avif'].includes(ext)
      ? `<div class="ojeada"><img src="${esc(data.signedUrl)}" alt="${esc(r.titulo)}"></div>`
      : `<p class="tiny muted">Un <b>.${esc(ext)}</b> no se puede ojear desde el navegador.</p>`;

  return `${dentro}
    <p class="tiny muted sep-poco">${esc(r.archivo_nombre || '')}</p>
    <a class="btn outline sm" href="${esc(data.signedUrl)}" target="_blank" rel="noopener">
      <span class="material-symbols-outlined">download</span> Descargarlo</a>
    <p class="tiny muted sep-poco">Esta dirección es sólo para ti, caduca en cinco minutos,
      y mirarlo desde aquí no cuenta como una entrega.</p>`;
}

/* ── los botones ────────────────────────────────────────────────────────── */
document.addEventListener('click', async (ev) => {
  const copiar = ev.target.closest('[data-copiar]');
  if (copiar) {
    const enlace = enlaceDe(copiar.dataset.copiar);
    try { await navigator.clipboard.writeText(enlace); ok('Enlace copiado. Pégalo en ManyChat.'); }
    catch { toast('Selecciónalo y cópialo con Ctrl+C: ' + enlace); }
    return;
  }
  if (ev.target.closest('#btnNuevo')) { editar(null); return; }

  const ed = ev.target.closest('[data-editar]');
  if (ed) { editar(RECURSOS.find(r => r.id === ed.dataset.editar)); return; }

  /* La fila entera abre el desplegable, PERO sólo si no se pulsó algo de
     dentro. Sin esta comprobación, copiar el enlace abriría además el panel, y
     borrar abriría el panel del recurso que se está borrando. */
  const fila = ev.target.closest('.fila-recurso');
  if (fila && !ev.target.closest('button, a, code')) {
    abrir(RECURSOS.find(r => r.id === fila.dataset.abrir), fila);
    return;
  }

  const br = ev.target.closest('[data-borrar]');
  if (br) {
    const r = RECURSOS.find(x => x.id === br.dataset.borrar);
    if (!await confirmDialog(
      `El enlace <b>${esc(enlaceDe(r.codigo))}</b> dejará de funcionar, y si está puesto en un
       flujo de ManyChat esa gente se encontrará con que no existe.<br><br>
       Las ${num(r.personas || 0)} persona(s) que ya lo pidieron <b>siguen en Contactos</b>:
       lo que se pierde es el recuento de este recurso.<br><br>
       Si sólo quieres dejar de repartirlo, <b>apágalo</b> en vez de borrarlo: quien abra el
       enlace verá que ya no está disponible en lugar de un error.`,
      `Borrar «${r.titulo}»`)) return;
    const { error } = await sb.rpc('cem_recurso_borrar', { p_id: r.id });
    if (error) return fail(mensajeError(error));
    ok('Recurso borrado.');
    cargar();
  }
});

/* Y con el teclado, porque la fila dice ser un botón (`role="button"`) y un
   botón que sólo responde al ratón es una promesa rota para quien navega con
   el tabulador o con lector de pantalla. */
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const fila = ev.target?.closest?.('.fila-recurso');
  // Sólo si el foco está en la fila misma: dentro hay botones con su propio
  // Enter, y robárselo haría que «Copiar» abriera el panel.
  if (!fila || ev.target !== fila) return;
  ev.preventDefault();
  abrir(RECURSOS.find(r => r.id === fila.dataset.abrir), fila);
});

cargar();
</script>
</body>
</html>
