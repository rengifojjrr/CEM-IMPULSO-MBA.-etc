<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Perfil del estudiante</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-24-2">
</head>
<body>
<div id="page" class="hidden">
  <div id="migas"></div>
  <div class="card" id="hero"></div>
  <div class="tabs" id="tabs">
    <button class="active" data-t="resumen">Resumen</button>
    <button data-t="historia">Historia</button>
    <button data-t="cursos">Cursos</button>
    <button data-t="evaluaciones">Evaluaciones</button>
    <button data-t="certificados">Certificados</button>
    <button data-t="pagos">Pagos</button>
    <!-- El documento va en su propia pestaña, no dentro de «Resumen»: abrirlo
         queda registrado con riesgo alto, así que tiene que hacer falta ir a
         buscarlo. Si estuviera en el resumen se abriría cada vez que alguien
         mira una ficha, y el registro dejaría de decir nada. -->
    <button data-t="documento">Documento</button>
  </div>
  <div id="panel"></div>
</div>
<script type="module">
import { sb, mount, MONEDA_BASE, $, $$, esc, chip, bar, money, pct, fdate, fdatetime, emptyRow, initials, qs, kpi,
         modal, ok, okDeshacer, fail, run, audit, confirmDialog, campoArchivo, subirComprobante, opciones,
         etiqueta, chipEstado, montoPagado, enDolares, migas, mejorarSelects, nota, filaTotales, mensajeError,
         campoDescuento, saldo as saldoCelda } from '../assets/app.js?v=2026-08-24-2';
import { paisConBandera } from '../assets/paises.js?v=2026-08-24-2';
import { barras, linea, hitos } from '../assets/graficos.js?v=2026-08-24-2';
const p = await mount({ require:['coordinador','admin','superadmin','auditor'], active:'estudiantes.html', area:'admin' });
const editable = p && ['coordinador','admin','superadmin'].includes(p.rol);
const id = qs('id');
let stu, ens=[], subs=[], certs=[], insts=[], pays=[], badges=[], exp=null;
if (p) { if (!id) location.href='estudiantes.html'; else load(); }

async function load(){
  const [{data:s},{data:e},{data:c},{data:b}] = await Promise.all([
    sb.from('cem_profiles').select('*').eq('id',id).maybeSingle(),
    sb.from('cem_enrollments').select('*,cem_courses(nombre,tipo),cem_cohorts(nombre)').eq('profile_id',id).limit(500),
    sb.from('cem_certificates').select('*,cem_courses(nombre)').eq('profile_id',id).limit(500),
    sb.from('cem_badge_awards').select('*,cem_badges(nombre,nivel,icono)').eq('profile_id',id),
  ]);
  stu=s; ens=e||[]; certs=c||[]; badges=b||[];

  /* item 01 · «¿este quién es y qué ha hecho?» se respondía abriendo cinco
     pantallas. `cem_expediente` lo trae todo de una vez, incluida la parte
     académica que aquí no había —asistencia, entregas, la línea de tiempo—
     y que es justo la que se preguntaba. */
  const { data: ex } = await sb.rpc('cem_expediente', { p_profile_id: id });
  exp = ex || null;
  const eids = ens.map(x=>x.id);
  if (eids.length){
    const [{data:sb1},{data:i1},{data:p1}] = await Promise.all([
      sb.from('cem_submissions').select('*,cem_assessments(nombre,tipo,puntaje_max,nota_aprobatoria)').in('enrollment_id',eids).limit(500),
      sb.from('cem_installments').select('*').in('enrollment_id',eids).order('numero').limit(500),
      sb.from('cem_payments').select('*').in('enrollment_id',eids).order('fecha',{ascending:false}).limit(500),
    ]);
    subs=sb1||[]; insts=i1||[]; pays=p1||[];
  }
  hero(); tab('resumen');
}

function hero(){
  /* item 41 · «Volver» no decía a dónde. El rastro sí: dice dónde estás y deja
     subir un nivel de un clic. */
  $('#migas').innerHTML = migas([
    ['Estudiantes', 'estudiantes.html'],
    [(stu.nombre || '') + ' ' + (stu.apellido || '')],
  ]);
  const prog = ens.length? ens.reduce((a,x)=>a+Number(x.progreso||0),0)/ens.length : 0;
  const saldo = insts.filter(i=>['pendiente','parcial','vencida'].includes(i.estado)).reduce((a,i)=>a+Number(i.saldo||0),0);
  $('#hero').innerHTML = `<div class="row" style="gap:16px;align-items:flex-start">
    <span class="avatar lg">${initials(stu.nombre,stu.apellido)}</span>
    <div class="grow" style="flex:1;min-width:220px">
      <h1 style="margin:0 0 4px;font-size:21px">${esc(stu.nombre)} ${esc(stu.apellido||'')}</h1>
      <!-- item 23 · el correo salía repetido y sin servir para nada. Aquí, que
           es donde se usa para escribirle, se deja pulsable. -->
      <div class="tiny muted"><a href="mailto:${esc(stu.email)}">${esc(stu.email)}</a>
        · ${stu.pais?esc(paisConBandera(stu.pais)):'—'} ${stu.documento?'· '+esc(stu.documento_tipo||'Doc')+' '+esc(stu.documento):''}</div>
      <div class="row sep-poco">
        ${stu.activo?chip('activo','ok'):chip('inactivo','err')}
        <span class="chip info">${ens.length} inscripción(es)</span>
        <span class="chip ${prog>=80?'ok':prog<40?'err':'warn'}">Progreso ${pct(prog)}</span>
        ${saldo>0?`<span class="chip warn">Saldo ${money(saldo)}</span>`:'<span class="chip ok">Al día</span>'}
      </div></div>
    <!-- item 07 · estando en la ficha de alguien, lo que sigue es casi siempre
         una de tres cosas: registrarle un pago, emitirle un certificado o
         escribirle. Antes había que ir a otra pantalla y buscarlo de nuevo. -->
    <div class="row">
      <!-- Mejora 23: cuando alguien escribe «no veo mi curso», esto contesta en
           un minuto lo que antes eran tres correos. Lo puede pulsar también
           auditoría: es sólo lectura y queda asentado. -->
      <button class="btn outline" id="btnVerComo" title="Ver qué le está contestando la plataforma">
        <span class="material-symbols-outlined">visibility</span> Ver lo que ve</button>
      ${editable?`<button class="btn outline" id="btnMatricular"><span class="material-symbols-outlined">add_circle</span> Matricular</button>
      <a class="btn outline" href="mailto:${esc(stu.email)}"><span class="material-symbols-outlined">mail</span> Escribirle</a>
      <button class="btn ghost" id="btnToggle" title="${stu.activo?'Desactivar la cuenta':'Reactivar la cuenta'}"
        aria-label="${stu.activo?'Desactivar la cuenta':'Reactivar la cuenta'}"><span class="material-symbols-outlined">${stu.activo?'block':'check_circle'}</span></button>`:''}
    </div></div>
    ${exp?.perfil?.perfil_publico ? `<p class="tiny muted sep-poco">
      <span class="material-symbols-outlined" style="font-size:15px">public</span>
      Tiene perfil público: <a href="../plataforma/perfil-publico.html?p=${esc(exp.perfil.perfil_slug)}"
        target="_blank" rel="noopener">${esc(exp.perfil.perfil_slug)}</a></p>` : ''}`;
  const btnVerComo = $('#btnVerComo');
  if (btnVerComo) btnVerComo.onclick = verComo;

  if (editable){
    $('#btnToggle').onclick = async () => {
      await run(sb.from('cem_profiles').update({activo:!stu.activo}).eq('id',id),'No se pudo actualizar');
      await audit('estudiante_estado','cem_profiles',id,'medio',{activo:!stu.activo});
      const antes = stu.activo;
      const quien = `${stu.nombre} ${stu.apellido||''}`.trim();
      okDeshacer(antes ? `${quien} ya no puede entrar a la plataforma.` : `${quien} vuelve a tener acceso.`, async () => {
        await run(sb.from('cem_profiles').update({activo:antes}).eq('id',id),'No se pudo deshacer');
        await audit('estudiante_estado','cem_profiles',id,'medio',{activo:antes, deshecho:true});
        load();
      });
      load();
    };
    $('#btnMatricular').onclick = matricular;
  }
}

/* ── el documento de identidad, para el equipo ────────────────────────────
   Las imágenes viven en un depósito privado y NO se piden a la tabla: se pasa
   por `cem_identidad_para_revisar`, que comprueba el rol y APUNTA quién lo
   abrió antes de devolver las rutas. Con esas rutas se pide un enlace firmado
   que caduca en cinco minutos.

   Cinco minutos y no una hora: un enlace de estos, copiado a un chat, deja de
   servir antes de que a nadie le dé tiempo a reenviarlo. */
async function pintarDocumento(){
  const P = $('#panel');
  P.innerHTML = '<div class="card"><span class="cargando"></span></div>';

  const { data, error } = await sb.rpc('cem_identidad_para_revisar', { p_profile_id:id });
  if (error){ P.innerHTML = `<div class="card"><div class="nota err">${esc(mensajeError(error))}</div></div>`; return; }
  const d = (data||[])[0];

  if (!d || (!d.frente_ruta && !d.dorso_ruta)){
    P.innerHTML = `<div class="card"><h2 class="sec">Documento de identidad</h2>
      <div class="nota">Todavía no ha subido ninguna foto. Se le pide en «Mis datos»,
      y hasta que no esté no se le puede emitir un certificado a su nombre.</div></div>`;
    return;
  }

  const firmar = async (ruta) => {
    if (!ruta) return null;
    const { data: f } = await sb.storage.from('cem-identidad').createSignedUrl(ruta, 300);
    return f?.signedUrl || null;
  };
  const [uFrente, uDorso] = await Promise.all([firmar(d.frente_ruta), firmar(d.dorso_ruta)]);

  const cara = (titulo, url) => `<div>
    <div class="tiny muted" style="font-weight:600;margin-bottom:6px">${titulo}</div>
    ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">
        <img src="${esc(url)}" alt="${titulo}" style="width:100%;border-radius:var(--r);
          border:1px solid var(--filete);display:block"></a>`
          : '<div class="nota warn">No la ha subido.</div>'}</div>`;

  P.innerHTML = `<div class="card">
    <div class="row between"><h2 class="sec">Documento de identidad</h2>
      <span class="chip ${{aprobado:'ok',rechazado:'err',pendiente:'warn'}[d.estado]||'neutral'}">${esc(d.estado)}</span></div>
    <p class="tiny muted sin-margen">Subido el ${esc(fdate(d.subido_en))}.
      <b>Que hayas abierto esto queda registrado</b> con tu nombre y la hora, en Auditoría.
      Los enlaces de las imágenes caducan en cinco minutos.</p>
    <div class="sep" style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
      ${cara('Por delante', uFrente)}${cara('Por detrás', uDorso)}
    </div>
    ${editable ? `<div class="row sep">
      <button class="btn" id="btnAprobar"><span class="material-symbols-outlined">check</span> Aprobar</button>
      <button class="btn outline" id="btnRechazar"><span class="material-symbols-outlined">close</span> Pedir que lo corrija</button>
    </div>` : '<div class="nota sep">Sólo lectura: tu rol no resuelve documentos.</div>'}
    <div id="msgDoc"></div></div>`;

  if (!editable) return;
  $('#btnAprobar').onclick = async () => {
    await run(sb.rpc('cem_identidad_resolver', { p_profile_id:id, p_estado:'aprobado' }),
      'No se pudo aprobar');
    ok('Documento verificado.');
    pintarDocumento();
  };
  /* Rechazar SIN decir por qué obliga a la persona a adivinar, y lo normal es
     que vuelva a subir exactamente lo mismo. La función lo exige; aquí se pide
     antes para no llegar al servidor con las manos vacías. */
  $('#btnRechazar').onclick = async () => {
    const motivo = await pedirTexto();
    if (!motivo) return;
    await run(sb.rpc('cem_identidad_resolver',
      { p_profile_id:id, p_estado:'rechazado', p_motivo:motivo }), 'No se pudo rechazar');
    ok('Se le pidió que lo corrija, con el motivo.');
    pintarDocumento();
  };
}

function pedirTexto(){
  return new Promise((resolver) => {
    const m = modal({ title:'¿Qué hay que corregir?', body:`
      <p class="tiny muted sin-margen">Lo va a leer la persona tal cual. Sé concreto:
        «la foto de atrás está movida y no se lee el número» sirve; «no es válido» no.</p>
      <div class="field sep"><textarea id="motivoDoc" rows="3"
        placeholder="Ej.: la foto de delante está cortada y falta el número."></textarea></div>`,
      footer:`<button class="btn outline" data-x>Cancelar</button>
              <button class="btn" id="okMotivo">Enviar</button>` });
    $('#okMotivo', m).onclick = () => {
      const t = $('#motivoDoc', m).value.trim();
      if (!t){ fail('Escribe qué está mal, o la persona no sabrá qué corregir.'); return; }
      m.querySelector('[data-x]')?.click();
      resolver(t);
    };
  });
}

$$('#tabs button').forEach(b=>b.onclick=()=>{ $$('#tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); tab(b.dataset.t); });

const ICONO_HITO = {
  inscripcion:'how_to_reg', pago_ok:'payments', pago_no:'money_off', pago:'receipt_long',
  entrega:'upload_file', nota:'grading', certificado:'workspace_premium', insignia:'military_tech',
};
const CLASE_HITO = {
  pago_ok:'ok', nota:'ok', pago_no:'mal', certificado:'hito', insignia:'hito',
};

function tab(t){
  const P = $('#panel');

  /* item 02 · la misma información que las otras pestañas, pero contada en el
     orden en que pasó. Es la vista que responde «¿qué ha hecho esta persona?»
     sin tener que juntar cinco tablas en la cabeza. */
  if (t==='historia'){
    const linea = exp?.linea || [];
    P.innerHTML = `<div class="card">
      <div class="row between"><h2 class="sec">Todo lo que ha pasado</h2>
        <span class="tiny muted">${linea.length} hecho(s), del más reciente al primero</span></div>
      ${linea.length ? `<ul class="linea">${linea.map(h => `
        <li class="${CLASE_HITO[h.tipo] || ''}">
          <div class="cuando">${fdatetime(h.cuando)}</div>
          <div class="que"><span class="material-symbols-outlined"
            style="font-size:17px;color:var(--tinta-3)">${ICONO_HITO[h.tipo] || 'circle'}</span>
            ${esc(h.titulo)}${h.monto != null ? ` · ${money(h.monto, h.moneda || MONEDA_BASE)}` : ''}</div>
          ${h.detalle ? `<div class="detalle">${esc(h.detalle)}</div>` : ''}
        </li>`).join('')}</ul>`
        : `<p class="muted tiny">Todavía no hay nada registrado de esta persona.</p>`}
    </div>`;
  }

  if (t==='documento'){ pintarDocumento(); return; }

  if (t==='resumen'){
    // Los gráficos van del curso en el que está más avanzado sin terminar,
    // que es donde la persona está de verdad ahora mismo.
    const foco = ens.filter(e=>e.estado==='activa')
      .sort((a,b)=>Number(b.progreso||0)-Number(a.progreso||0))[0] || ens[0];
    if (foco) pintarGraficos(foco);
    P.innerHTML = `<div class="grid graficos" id="gExp"></div><div class="grid g2">
      <div class="card"><h2 class="sec">Cursos activos</h2>${ens.filter(e=>e.estado==='activa').map(e=>`
        <div class="list-item"><div class="grow"><div class="t">${esc(e.cem_courses?.nombre||'')}</div>
          <div class="s">${esc(e.cem_cohorts?.nombre||'')} · último acceso ${e.ultimo_acceso?fdate(e.ultimo_acceso):'—'}</div>
          <div class="sep-poco">${bar(e.progreso)}</div></div>
          <b>${pct(e.progreso)}</b></div>`).join('')||'<p class="muted tiny">Sin cursos activos.</p>'}</div>
      <!-- item 01 · lo académico faltaba entero: la ficha enseñaba cursos,
           cuotas y pagos, y ni una palabra de asistencia ni de evaluaciones. -->
      <div class="card"><h2 class="sec">Cómo va</h2>
        <div class="kpis">
          ${kpi('Asistencia', exp?.asistencia?.total
              ? pct(100 * Number(exp.asistencia.presente) / Number(exp.asistencia.total))
              : '—', 'co_present',
              exp?.asistencia?.total ? `${exp.asistencia.presente} de ${exp.asistencia.total} clases` : 'sin clases registradas')}
          ${kpi('Evaluaciones', String((exp?.entregas || []).filter(x => x.estado === 'calificada').length),
              'grading', `${(exp?.entregas || []).length} entrega(s) en total`)}
          ${kpi('Certificados', String((exp?.certificados || []).filter(c => !c.anulado_en).length),
              'workspace_premium', 'vigentes')}
        </div>
      </div>
      <div class="card"><h2 class="sec">Insignias obtenidas</h2>${badges.map(b=>`
        <div class="list-item"><span class="material-symbols-outlined" style="color:var(--tertiary-container)">${esc(b.cem_badges?.icono||'military_tech')}</span>
        <div class="grow"><div class="t">${esc(b.cem_badges?.nombre||'')}</div><div class="s">${esc(b.cem_badges?.nivel||'')} · ${fdate(b.otorgado_en)}</div></div></div>`).join('')
        ||'<p class="muted tiny">Sin insignias todavía.</p>'}</div></div>`;
  }
  if (t==='cursos'){
    P.innerHTML = `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Programa</th><th>Cohorte</th><th>Progreso</th><th>Estado</th><th>Precio</th><th>Inscripción</th><th></th></tr></thead>
      <tbody>${ens.length? ens.map(e=>`<tr>
        <td class="wrap"><b>${esc(e.cem_courses?.nombre||'')}</b><div class="tiny muted">${esc(e.cem_courses?.tipo||'')}</div></td>
        <td>${esc(e.cem_cohorts?.nombre||'—')}</td>
        <td style="min-width:110px">${Number(e.progreso) > 0
          ? `${bar(e.progreso)}<span class="tiny muted">${pct(e.progreso)}</span>`
          : '<span class="tiny muted">Todavía sin empezar</span>'}</td>
        <td>${chipEstado(e.estado)}</td><td>${money(e.precio_final)}</td><td class="muted">${fdate(e.fecha_inscripcion)}</td>
        <td>${editable?`<button class="btn ghost sm" data-est="${e.id}" title="Cambiar el estado de la inscripción"><span class="material-symbols-outlined">edit</span></button>
          ${Number(e.progreso)>=80?`<button class="btn ghost sm" data-cert="${e.id}" title="Emitir certificado"><span class="material-symbols-outlined">workspace_premium</span></button>`:''}`:''}</td>
      </tr>`).join('') : emptyRow(7, 'Este estudiante no está inscrito en ningún programa.')}</tbody></table></div></div>`;
    $$('[data-est]').forEach(b=>b.onclick=()=>cambiarEstado(ens.find(x=>x.id===b.dataset.est)));
    $$('[data-cert]').forEach(b=>b.onclick=async()=>{
      if(!await confirmDialog('¿Emitir certificado para esta inscripción?')) return;
      await run(sb.rpc('cem_issue_certificate',{p_enrollment_id:b.dataset.cert}),'No se pudo emitir');
      ok('Certificado emitido'); load();
    });
  }
  if (t==='evaluaciones'){
    P.innerHTML = `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Evaluación</th><th>Tipo</th><th>Intento</th><th>Puntaje</th><th>Estado</th><th>Entregado</th></tr></thead>
      <tbody>${subs.length? subs.map(s=>`<tr>
        <td class="wrap">${esc(s.cem_assessments?.nombre||'')}</td><td>${esc(s.cem_assessments?.tipo||'')}</td>
        <td>${s.intento}</td><td>${nota(s.puntaje, s.cem_assessments?.puntaje_max, s.cem_assessments?.nota_aprobatoria)}</td>
        <td>${chipEstado(s.estado)}${s.tarde?' '+chip('tarde','err'):''}</td><td class="muted">${fdatetime(s.entregado_en)}</td>
      </tr>`).join('') : emptyRow(6, 'Este estudiante todavía no ha entregado ninguna evaluación.')}</tbody></table></div></div>`;
  }
  if (t==='certificados'){
    P.innerHTML = `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Código</th><th>Título</th><th>Programa</th><th>Emitido</th><th>Estado</th><th></th></tr></thead>
      <tbody>${certs.length? certs.map(c=>`<tr>
        <td><code>${esc(c.codigo)}</code></td><td class="wrap">${esc(c.titulo)}</td>
        <td class="wrap">${esc(c.cem_courses?.nombre||'')}</td><td class="muted">${fdate(c.emitido_en)}</td>
        <td>${chipEstado(c.estado)}</td>
        <td><a class="btn ghost sm" href="../verificar.html?codigo=${encodeURIComponent(c.codigo)}" target="_blank"><span class="material-symbols-outlined">verified</span></a></td>
      </tr>`).join('') : emptyRow(6, 'Todavía no se le ha emitido ningún certificado.')}</tbody></table></div></div>`;
  }
  if (t==='pagos') pintarPagos(P);
}

/* items 38 y 41 · las dos notas piden lo mismo desde dos sitios: quien cobra
   quiere ver «cuánto lleva pagado de este programa», y aquí las cuotas de
   todos los programas caían en una sola lista ordenada por número de cuota.
   Con dos inscripciones, la cuota 1 de una salía pegada a la cuota 1 de la
   otra y había que ir leyendo la columna «Programa» fila por fila para
   separarlas; el porcentaje pagado de cada uno no salía por ningún lado.

   Ahora cada programa es su propia línea con su avance, y se abre para ver sus
   cuotas y sus pagos. Lo de arriba sigue siendo el total de la persona, que es
   lo que se mira primero. */
function pintarPagos(P){
  const hoy = new Date().toISOString().slice(0,10);
  const grupos = ens.map(e => {
    const cuotas = insts.filter(i => i.enrollment_id === e.id);
    const pagos  = pays.filter(x => x.enrollment_id === e.id);
    /* Un programa con cuotas vale lo que suman sus cuotas; uno sin plan vale
       su precio, y lo pagado son sus pagos confirmados. No se mezclan las dos
       cuentas: sumar cuotas y pagos a la vez cuenta el mismo dinero dos veces. */
    const mezcla = new Set(cuotas.map(i => i.moneda || MONEDA_BASE)).size > 1;
    const confirmado = pagos.filter(x => x.estado === 'confirmado').reduce((a,x)=>a+enDolares(x),0);
    const total = cuotas.length
      ? cuotas.reduce((a,i)=>a+Number(i.monto||0),0)
      : Number(e.precio_final||0);
    const pendiente = cuotas.length
      ? cuotas.reduce((a,i)=>a+Number(i.saldo||0),0)
      : Math.max(0, Number(e.precio_final||0) - confirmado);
    const pagado = Math.max(0, total - pendiente);
    /* Con cuotas en dos monedas distintas el porcentaje sería una cifra sin
       significado. Antes de inventarla, no se enseña. */
    const avance = (mezcla || !total) ? null : 100 * pagado / total;
    /* Vencida es la que se pasó de fecha **y** todavía debe algo. Sin el saldo
       en la cuenta, una cuota saldada a la que nadie le cambió el estado se
       cuela como deuda y manda el programa a lo alto de la lista. */
    const vencidas = cuotas.filter(i => i.estado !== 'pagada' && Number(i.saldo||0) > 0 && i.fecha_vencimiento < hoy);
    return { e, cuotas, pagos, total, pendiente, pagado, avance, vencidas, mezcla };
  }).sort((a,b) =>
    /* Primero lo vencido, que es a lo que hay que llamar hoy; después lo que
       más falta por cobrar. Lo saldado se va al fondo: ya no hay nada que
       hacer con ello. */
    (b.vencidas.length - a.vencidas.length) || (b.pendiente - a.pendiente) || (b.total - a.total));

  const total = grupos.reduce((a,g)=>a+g.total,0);
  const debe  = grupos.reduce((a,g)=>a+g.pendiente,0);
  const puesto = Math.max(0, total - debe);
  const conMora = grupos.filter(g => g.vencidas.length).length;

  P.innerHTML = `<div class="card"><div class="kpis">
      ${kpi('Contratado', money(total), 'shopping_bag', `${grupos.length} programa(s)`)}
      ${kpi('Pagado', money(puesto), 'payments', total ? pct(100*puesto/total) + ' del total' : '')}
      ${kpi('Pendiente', money(debe), 'account_balance_wallet',
            conMora ? `${conMora} programa(s) con cuotas vencidas` : 'nada vencido', conMora ? 'malo' : '')}
    </div></div>
    ${grupos.length ? grupos.map((g,n)=>tarjetaPrograma(g,n)).join('')
      : `<div class="card"><p class="muted tiny">Este estudiante no está inscrito en ningún programa, así que no hay nada que cobrar.</p></div>`}`;

  $$('[data-pay]').forEach(b=>b.onclick=()=>registrarPago(insts.find(i=>i.id===b.dataset.pay)));
  /* Recordar cuál estaba abierto: quien revisa una cobranza vuelve a la misma
     pestaña varias veces y no tiene por qué volver a buscar su programa. */
  $$('details[data-prog]').forEach(d=>d.addEventListener('toggle',()=>{
    localStorage.setItem('cemPagosAbierto', d.open ? d.dataset.prog : '');
  }));
}

function tarjetaPrograma(g, n){
  const { e, cuotas, pagos, total, pendiente, pagado, avance, vencidas, mezcla } = g;
  const hoy = new Date().toISOString().slice(0,10);
  const abierto = localStorage.getItem('cemPagosAbierto') === e.id || (n === 0 && !localStorage.getItem('cemPagosAbierto'));
  /* «Al día» sólo si de verdad va pagando. Un programa por el que no ha
     entrado un céntimo tampoco tiene nada vencido todavía, y llamarlo «al día»
     lo esconde justo de quien lo está buscando. */
  const estadoCobro = !total ? chip('sin importe', 'neutral')
    : pendiente <= 0 ? chip('pagado', 'ok')
    : vencidas.length ? chip(`${vencidas.length} cuota(s) vencida(s)`, 'err')
    : pagado > 0 ? chip('al día', 'warn')
    : chip('sin pagos', 'warn');

  return `<details class="card" data-prog="${esc(e.id)}"${abierto ? ' open' : ''}>
    <summary><div class="resumen-programa">
      <div class="grow">
        <div class="t">${esc(e.cem_courses?.nombre || 'Programa sin nombre')}</div>
        <div class="s">${esc(e.cem_cohorts?.nombre || 'sin cohorte')} · ${esc(e.cem_courses?.tipo || '')}
          ${cuotas.length ? ` · ${cuotas.length} cuota(s)` : ' · pago único'}</div>
      </div>
      <div class="avance-programa">
        ${avance == null
          ? `<span class="tiny muted">${mezcla ? 'cuotas en varias monedas' : 'sin importe'}</span>`
          : `${bar(avance)}<div class="tiny muted">${money(pagado)} de ${money(total)} · <b>${pct(avance)}</b></div>`}
      </div>
      ${estadoCobro}
      <span class="material-symbols-outlined">expand_more</span>
    </div></summary>

    <div class="table-wrap"><table class="tarjetas">
      <thead><tr><th class="num">#</th><th class="num">Monto</th><th>Vence</th><th class="num">Saldo</th><th>Estado</th><th></th></tr></thead>
      <tbody>${cuotas.length ? cuotas.map(i=>{
        const venc = i.estado!=='pagada' && Number(i.saldo||0) > 0 && i.fecha_vencimiento < hoy;
        const mora = venc ? Math.round((new Date(hoy) - new Date(i.fecha_vencimiento))/86400000) : 0;
        return `<tr class="${venc?'vencida':''}"><td class="num" data-col="#">${i.numero}</td>
        <td class="num" data-col="Monto">${money(i.monto, i.moneda || MONEDA_BASE)}</td>
        <td class="${venc?'':'muted'}" data-col="Vence">${fdate(i.fecha_vencimiento)}
          ${venc?`<div class="tiny dias-mora">${mora} día(s) de mora</div>`:''}</td>
        <td class="num" data-col="Saldo">${saldoCelda(i.saldo)}</td>
        <td data-col="Estado">${chipEstado(i.estado)}</td>
        <td data-col="">${editable && i.estado!=='pagada'?`<button class="btn outline sm" data-pay="${i.id}">Registrar pago</button>`:''}</td></tr>`;
      }).join('') : emptyRow(6, 'Sin plan de cuotas: este programa se paga de una vez.')}</tbody>
      ${cuotas.length ? filaTotales(['Totales',
        {num:true, html: money(cuotas.reduce((a,i)=>a+Number(i.monto||0),0))}, '',
        {num:true, html: money(pendiente)}, '', '']) : ''}
    </table></div>

    <h3 class="sec sep">Pagos de este programa</h3>
    <div class="table-wrap"><table class="tarjetas">
      <thead><tr><th>Fecha</th><th class="num">Monto</th><th>Método</th><th>Referencia</th><th>Conciliado</th></tr></thead>
      <tbody>${pagos.length ? pagos.map(x=>`<tr>
        <td class="muted" data-col="Fecha">${fdate(x.fecha)}</td>
        <td class="num" data-col="Monto"><b>${montoPagado(x)}</b></td>
        <td data-col="Método">${esc(etiqueta(x.metodo||'—'))}</td>
        <td data-col="Referencia">${esc(x.referencia||'—')}</td>
        <td data-col="Conciliado">${x.conciliado?chip('sí','ok'):chip('pendiente','warn')}</td></tr>`).join('')
        : emptyRow(5, 'Todavía no ha pagado nada de este programa.')}</tbody>
      ${pagos.length ? filaTotales([`Aprobado (${pagos.filter(x=>x.estado==='confirmado').length} de ${pagos.length} pagos)`,
        {num:true, html: money(pagos.filter(x=>x.estado==='confirmado').reduce((a,x)=>a+enDolares(x),0))},
        '', '', '']) : ''}
    </table></div>
  </details>`;
}

function cambiarEstado(e){
  const m = modal({ title:'Estado de la inscripción', body:`
    <div class="field"><label>Estado</label><select id="nEstado">
      ${opciones(['pendiente','activa','suspendida','congelada','finalizada','cancelada'], e.estado)}</select></div>`,
    footer:`<button class="btn outline" data-x>Cancelar</button><button class="btn" data-s>Guardar</button>` });
  $('[data-x]',m).onclick=m.close;
  $('[data-s]',m).onclick=async()=>{
    await run(sb.from('cem_enrollments').update({estado:$('#nEstado',m).value}).eq('id',e.id),'No se pudo actualizar');
    await audit('inscripcion_estado','cem_enrollments',e.id,'medio',{estado:$('#nEstado',m).value});
    m.close(); ok('Inscripción actualizada'); load();
  };
}

function registrarPago(i){
  const saldoCuota = Number(i.saldo || i.monto) || 0;
  // Quien registra el pago tiene la captura del banco a mano, no una dirección web.
  const comprobante = campoArchivo({
    id:'pComp', tipo:'comprobante', subir: subirComprobante,
    etiquetaSubir:'Adjuntar el comprobante', permitirEnlace:false,
  });

  const m = modal({ title:`Registrar pago · cuota ${i.numero}`, body:`
    <p class="tiny muted" style="margin:-4px 0 12px">
      Saldo de esta cuota: <b>${esc(money(saldoCuota, i.moneda || MONEDA_BASE))}</b></p>
    <div class="row"><div class="field medio"><label>Monto *</label>
      <input type="number" step="0.01" id="pMonto" value="${saldoCuota}" required>
      <div class="tiny" id="pAviso"></div></div>
      <div class="field medio"><label>Método</label>
        <select id="pMetodo">${opciones(['transferencia','zelle','paypal','binance','efectivo','pago movil','tarjeta'])}</select></div></div>
    <div class="field"><label>Referencia</label>
      <input id="pRef" placeholder="Ej.: 004512873"></div>
    <div class="field"><label>Comprobante</label>${comprobante.html}</div>`,
    footer:`<button class="btn outline" data-x>Cancelar</button>
            <button class="btn" data-s>Registrar el pago</button>` });

  comprobante.conectar(m);
  mejorarSelects(m);

  const monto = $('#pMonto', m), aviso = $('#pAviso', m);
  monto.addEventListener('input', () => {
    const v = Number(monto.value) || 0;
    aviso.className = 'tiny';
    if (v > saldoCuota * 2 && saldoCuota > 0) {
      aviso.className = 'tiny err-text';
      aviso.textContent = `Es más del doble del saldo. Comprueba la cifra.`;
    } else if (v > 0 && v < saldoCuota) {
      aviso.textContent = `Abono parcial: quedarían ${money(saldoCuota - v, i.moneda || MONEDA_BASE)}.`;
    } else aviso.textContent = '';
  });

  $('[data-x]',m).onclick=m.close;
  $('[data-s]',m).onclick=async()=>{
    const v = Number(monto.value);
    if (!(v > 0)) { fail('El monto tiene que ser mayor que cero.'); return; }
    await run(sb.rpc('cem_register_payment',{ p_installment_id:i.id, p_monto:v,
      p_metodo:$('#pMetodo',m).value, p_referencia:$('#pRef',m).value.trim()||null,
      p_comprobante:comprobante.valor()||null }),'No se pudo registrar el pago');
    m.close();
    ok(`Pago de ${money(v, i.moneda || MONEDA_BASE)} registrado en la cuota ${i.numero}`);
    load();
  };
}

/* item 22 · aquí ya se sabe a quién, así que no hace falta buscador; lo que
   faltaba era lo otro dos: decir el descuento en la unidad que uno piensa, y
   poder proponerlo en vez de imponerlo. Meter a alguien en un programa que no
   pidió le deja unas cuotas que no esperaba, y esa conversación la tiene
   después cobranza. */
async function matricular(){
  const { data: cursos } = await sb.from('cem_courses').select('id,nombre,precio,moneda').eq('estado','publicado').order('nombre');
  const { data: cohs } = await sb.from('cem_cohorts').select('id,nombre,course_id');
  const desc = campoDescuento({ id:'mDesc', precio: Number(cursos?.[0]?.precio)||0,
                                moneda: cursos?.[0]?.moneda || MONEDA_BASE });
  const m = modal({ title:`Inscribir o invitar a ${stu.nombre}`, body:`
    <div class="field"><label for="mCurso">Programa *</label><select id="mCurso" required>
      ${(cursos||[]).map(c=>`<option value="${c.id}" data-p="${c.precio}">${esc(c.nombre)}</option>`).join('')}</select></div>
    <div class="field"><label for="mCoh">Cohorte</label><select id="mCoh"></select></div>
    <div class="row"><div class="field corto"><label for="mCuotas">Cuotas</label>
      <select id="mCuotas"><option value="1">Pago único</option><option value="3" selected>3 cuotas</option><option value="6">6 cuotas</option></select></div>
      ${desc.html}</div>
    <details class="card" id="mInvit" style="margin:var(--e2) 0 0">
      <summary><span class="material-symbols-outlined">expand_more</span>
        <b>Si prefieres invitarle en vez de matricularle</b></summary>
      <div class="field"><label for="mMsg">Mensaje (opcional)</label>
        <textarea id="mMsg" rows="2" placeholder="Por qué le viene bien este programa"></textarea></div>
      <div class="field corto"><label for="mVence">La oferta vale hasta</label><input type="date" id="mVence"></div>
      <p class="tiny muted">Le llega un aviso dentro de la plataforma y por correo. La
        inscripción y las cuotas se crean cuando acepte, con este mismo precio.</p>
    </details>`,
    footer:`<button class="btn outline" data-x>Cancelar</button>
            <button class="btn outline" data-inv><span class="material-symbols-outlined">forward_to_inbox</span> Invitar</button>
            <button class="btn" data-s>Matricular ya</button>` });
  desc.conectar(m);

  const cursoElegido = () => (cursos||[]).find(c => c.id === $('#mCurso',m).value);
  const factorPlan = (n) => n === 1 ? 0.9 : n === 6 ? 1.06 : 1;
  const refrescar = () => {
    const c = cursoElegido();
    $('#mCoh',m).innerHTML = '<option value="">Sin cohorte</option>' +
      (cohs||[]).filter(x=>x.course_id===c?.id).map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
    desc.fijarPrecio(Math.round((Number(c?.precio)||0) * factorPlan(Number($('#mCuotas',m).value)||1) * 100) / 100);
  };
  refrescar();
  $('#mCurso',m).onchange = refrescar;
  $('#mCuotas',m).onchange = refrescar;
  $('[data-x]',m).onclick = m.close;

  $('[data-inv]',m).onclick = async () => {
    const inv = await run(sb.rpc('cem_invitar_a_curso', {
      p_profile_id: id, p_course_id: $('#mCurso',m).value,
      p_cohort_id: $('#mCoh',m).value || null,
      p_descuento: desc.valor().descuento,
      p_cuotas: Number($('#mCuotas',m).value) || 1,
      p_mensaje: $('#mMsg',m).value.trim() || null,
      p_vence: $('#mVence',m).value || null,
    }), 'No se pudo mandar la invitación');
    m.close();
    ok(`Invitación enviada a ${stu.nombre} por ${money(inv.precio_final, inv.moneda)}. Se inscribe cuando acepte.`);
    load();
  };

  $('[data-s]',m).onclick=async()=>{
    const c = cursoElegido();
    const cuotas = Number($('#mCuotas',m).value)||1;
    const lista = Math.round((Number(c?.precio)||0) * factorPlan(cuotas) * 100) / 100;
    const { descuento, final } = desc.valor();
    const enr = await run(sb.from('cem_enrollments').insert({ profile_id:id, course_id:c.id,
      cohort_id:$('#mCoh',m).value||null, precio_lista:lista, descuento, precio_final:final,
      moneda: c?.moneda || MONEDA_BASE, estado:'pendiente' }).select().single(),'No se pudo matricular');
    // La última cuota absorbe el céntimo del redondeo, igual que en la base.
    const base = Math.round((final/cuotas)*100)/100;
    const ultima = Math.round((final - base*(cuotas-1))*100)/100;
    await run(sb.from('cem_installments').insert(Array.from({length:cuotas},(_,k)=>({
      enrollment_id:enr.id, numero:k+1, monto:k===cuotas-1?ultima:base, saldo:k===cuotas-1?ultima:base,
      moneda: c?.moneda || MONEDA_BASE,
      fecha_vencimiento:new Date(Date.now()+k*30*86400000).toISOString().slice(0,10), estado:'pendiente'
    }))),'No se pudieron crear las cuotas');
    await audit('matricula_manual','cem_enrollments',enr.id,'medio',{estudiante:stu.email, total:final});
    m.close();
    /* Matricular en el programa de al lado pasa: la lista está ordenada por
       nombre y dos maestrías se llaman casi igual. Deshacer cancela la
       inscripción recién creada —todavía sin un solo pago— y anula sus cuotas,
       que es exactamente lo que hace `cem_cancelar_inscripcion`. */
    okDeshacer(`${stu.nombre} matriculado por ${money(final, c?.moneda || MONEDA_BASE)}.`, async () => {
      const { error } = await sb.rpc('cem_cancelar_inscripcion', {
        p_enrollment_id: enr.id,
        p_motivo: 'Se deshizo la matrícula recién hecha.' });
      if (error) { fail(mensajeError(error)); return; }
      load();
    });
    load();
  };
}
/* ============ el expediente, en gráficos ============
   La misma consulta que ve el estudiante en su panel: si el coordinador
   mirara otros números que la persona a la que llama, la conversación empieza
   torcida. */
async function pintarGraficos(enr){
  const { data: g, error } = await sb.rpc('cem_mi_avance', { p_enrollment_id: enr.id });
  const host = document.getElementById('gExp');
  if (error || !host) return;
  host.innerHTML = `
    <div class="card">${barras({
      titulo: `Avance en ${enr.cem_courses?.nombre || 'el programa'}`,
      formato: 'pct', ordenar: false, col: 'Módulo', colN: 'Visto',
      pie: 'Dónde se quedó exactamente, que es lo que hay que saber antes de llamarle.',
      datos: (g.modulos || []).map(m => ({ ...m, n: Number(m.n) })),
      marcar: (d) => d.n >= 100 ? 'ok' : d.n > 0 ? 'warn' : null })}</div>

    <div class="card">${(g.notas || []).length
      ? linea({ titulo: 'Sus notas en el tiempo',
          datos: (g.notas || []).map(x => ({ etq: x.cuando, n: Number(x.n) })),
          referencia: Number(g.aprobatoria) || 70,
          etqRef: `la punteada es el ${g.aprobatoria || 70}`,
          pie: 'Una nota mala aislada no dice nada; tres bajando seguidas sí.' })
      : `<figure class="gr"><figcaption class="gr-tit">Sus notas</figcaption>
         <p class="gr-vacio">Todavía no tiene evaluaciones calificadas.</p></figure>`}</div>

    <div class="card" style="grid-column:1/-1">${hitos({
      titulo: 'Sus cuotas',
      pie: 'Se lee el patrón: siempre tarde, o se torció este mes. No es lo mismo.',
      puntos: (g.cuotas || []).map(c => ({ etq: c.etq, cuando: c.cuando, tono: c.tono,
        detalle: `${money(c.monto, c.moneda || undefined)} · ${c.estado}` })) })}</div>`;
}

/* ============ ver lo que ve (mejora 23) ============
   NO es entrar con su cuenta: eso permitiría escribir en su nombre y haría
   imposible saber después quién hizo qué. Es una foto de sólo lectura de lo
   que la plataforma le está contestando a esa persona —qué cursos ve abiertos,
   por qué los otros no, qué pagos tiene en el aire y qué avisos le llegaron—
   y queda asentada en la auditoría, con quién miró y a quién. */
function verComo(){
  const m = modal({ title: 'Lo que ve esta persona', wide: true,
    body: '<span class="cargando una"></span>' });
  const caja = m.querySelector('.modal-b');

  sb.rpc('cem_ver_como', { p_profile_id: id }).then(({ data, error }) => {
    if (error) { caja.innerHTML = `<p class="nota err">${esc(mensajeError(error))}</p>`; return; }

    const ins = data.inscripciones || [];
    const pagos = data.pagos_en_el_aire || [];
    const avisos = data.avisos || [];

    caja.innerHTML = `
      <p class="tiny muted">Sólo lectura. Queda registrado en la auditoría que
        ${esc(p.nombre)} miró la cuenta de ${esc(data.perfil?.nombre || '')}.</p>

      ${data.perfil?.activo === false
        ? '<p class="nota err"><b>Su cuenta está desactivada.</b> No puede entrar a nada.</p>' : ''}
      ${data.correo_en_pausa
        ? `<p class="nota warn"><b>El correo está en pausa.</b> Si dice que no le llegó
             ningún aviso, es por esto: los mensajes están en cola sin perderse.</p>` : ''}

      <h3 class="sec">Sus cursos</h3>
      ${ins.length ? `<div class="stack">${ins.map(x => `
        <div class="list-item">
          <span class="material-symbols-outlined"
            style="color:var(--${x.abierto ? 'ok' : 'warn'})">${x.abierto ? 'lock_open' : 'lock'}</span>
          <div class="grow"><div class="t">${esc(x.curso || '—')}</div>
            <div class="s">${x.abierto
              ? `Lo ve abierto · ${pct(x.progreso)} completado`
              : esc(x.porque || 'Cerrado')}</div>
            ${x.publicado === false
              ? '<div class="s" style="color:var(--error)">Ojo: el programa no está publicado, así que tampoco lo vería aunque pagara.</div>' : ''}
          </div>
          ${chipEstado(x.estado)}
          ${Number(x.cuotas_pendientes) ? chip(`${x.cuotas_pendientes} cuota(s)`, 'warn') : ''}
        </div>`).join('')}</div>`
        : '<p class="muted tiny">No tiene ninguna inscripción.</p>'}

      <h3 class="sec sep">Pagos en el aire</h3>
      ${pagos.length ? `<div class="stack">${pagos.map(x => `
        <div class="list-item">
          <div class="grow"><div class="t">${money(x.monto, x.moneda)} · ${esc(x.referencia || 'sin referencia')}</div>
            <div class="s">${esc(x.metodo || '')} · ${fdate(x.fecha)}</div>
            ${x.nota ? `<div class="s"><i>«${esc(x.nota)}»</i> — ${esc(x.nota_de)}</div>` : ''}</div>
          ${chipEstado(x.estado)}
        </div>`).join('')}</div>`
        : '<p class="muted tiny">Ninguno esperando verificación ni rechazado.</p>'}

      <h3 class="sec sep">Los últimos avisos que le mandamos</h3>
      ${avisos.length ? `<div class="stack">${avisos.map(x => `
        <div class="list-item">
          <div class="grow"><div class="t">${esc(x.titulo)}</div>
            <div class="s">${fdatetime(x.cuando)}</div></div>
          ${x.leido ? chip('lo abrió', 'ok') : chip('sin leer', 'neutral')}
        </div>`).join('')}</div>`
        : '<p class="muted tiny">Todavía no le hemos mandado ninguno.</p>'}`;
  });
}
</script>
