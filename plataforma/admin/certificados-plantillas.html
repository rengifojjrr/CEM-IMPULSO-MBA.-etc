<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Certificados (plantillas)</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Los iconos necesitan su propia petición con display=block: fusionarlos con
     el resto de tipografías hace que no carguen y se vean como su nombre. -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=EB+Garamond:wght@400;700&family=Merriweather:wght@400;700&family=Lora:wght@400;700&family=PT+Serif:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Cinzel:wght@400;700&family=Marcellus&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Raleway:wght@400;700&family=Poppins:wght@400;700&family=Roboto+Slab:wght@400;700&family=Great+Vibes&family=Dancing+Script&family=Pacifico&family=Sacramento&family=Alex+Brush&family=Allura&family=Parisienne&family=UnifrakturMaguntia&family=UnifrakturCook:wght@700&family=Pirata+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-21-27">
<style>
  /* El generador ya toma sus colores de los tokens del portal (ver
     ESTILOS_GENERADOR): repetir aquí la paleta a mano era justamente lo que
     dejaba esta pantalla anclada al tema claro. Sólo queda la tipografía. */
  body{font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Certificados · Plantillas y emisión</h1>
      <p>Diseña plantillas, organízalas en carpetas, asigna por estudiante y emite certificados y diplomas con QR de verificación.</p></div>
    <div class="actions">
      <a class="btn outline" href="certificados.html"><span class="material-symbols-outlined">workspace_premium</span> Certificados institucionales</a>
      <a class="btn outline" href="../../certificados/generar.html" target="_blank"><span class="material-symbols-outlined">bolt</span> Abrir generador rápido</a>
    </div>
  </div>
  <div id="host"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script type="module">
/* Envoltorio institucional del mismo motor que usa certificados/generar.html.
   Antes las dos pantallas eran copias de ~3.500 líneas y cada mejora había que
   hacerla dos veces; ahora el motor vive en certificados/generador.js. */
import { sb as supabase, mount } from '../assets/app.js?v=2026-08-21-27';
import { montarGenerador, ESTILOS_GENERADOR } from '../../certificados/generador.js?v=2026-08-21-27';

/* El auditor no entra aquí: esta pantalla diseña plantillas y emite documentos,
   y su rol es de sólo lectura. Los certificados ya emitidos los revisa desde
   Certificados y desde el registro de auditoría. */
const p = await mount({ require:['coordinador','admin','superadmin'],
                        active:'certificados-plantillas.html', area:'admin' });

document.head.insertAdjacentHTML('beforeend', '<style>' + ESTILOS_GENERADOR + '</style>');
montarGenerador({
  supabase,
  contenedor: document.getElementById('host'),
  // La verificación pública vive fuera del portal, en la raíz del sitio.
  rutaVerificar: '../../certificados/verificar.html',
});
</script>
</body>
</html>
