<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Crear nuevo programa</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .steps{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px;}
  .steps button{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--surface-lowest);
    border:1px solid var(--outline-variant);border-radius:20px;padding:7px 14px;font-size:12.8px;font-weight:600;
    color:var(--on-surface-variant);}
  .steps button.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .steps button .n{width:20px;height:20px;border-radius:50%;background:var(--surface-highest);color:var(--on-surface-variant);
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;}
  .steps button.on .n{background:rgba(255,255,255,.25);color:#fff;}
  .step{display:none;} .step.on{display:block;}
  .imagen-preview{margin-top:8px;width:160px;height:90px;border-radius:var(--radius-sm);object-fit:cover;
    border:1px solid var(--outline-variant);display:none;}
  .imagen-preview.on{display:block;}
  .metodos-pago{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:6px;}
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Crear nuevo programa</h1><p id="stepLabel">Paso 1: Información general</p></div>
    <div class="actions">
      <a class="btn ghost" href="cursos.html">Cancelar</a>
      <button class="btn outline" id="btnDraft"><span class="material-symbols-outlined">save</span> Guardar borrador</button>
    </div>
  </div>

  <div class="steps" id="steps"></div>

  <form id="form">
    <div class="step on" data-step="0">
      <div class="card">
        <h2 class="sec">Detalles principales</h2>
        <div class="row">
          <div class="field" style="flex:2;min-width:240px"><label>Nombre del programa *</label><input id="nombre" required placeholder="Diplomado Internacional en…"></div>
          <div class="field" style="flex:1;min-width:140px"><label>Código</label><input id="codigo" placeholder="CEM-DIP-009"></div>
        </div>
        <div class="field"><label>Subtítulo</label><input id="subtitulo" placeholder="Certificación avanzada para…"></div>
        <div class="field"><label>Descripción corta</label><textarea id="descCorta" style="min-height:60px"></textarea></div>
        <div class="field"><label>Descripción completa</label><textarea id="descripcion"></textarea></div>
        <div class="field"><label>Imagen de portada</label>
          <div class="row" style="gap:8px;align-items:center">
            <input id="imagen" placeholder="https://…" style="flex:1">
            <button type="button" class="btn outline sm" id="btnSubirImagen"><span class="material-symbols-outlined">add_photo_alternate</span> Subir foto</button>
            <input type="file" id="imagenArchivo" accept="image/*" class="hidden">
          </div>
          <img id="imagenPreview" class="imagen-preview">
        </div>
      </div>
    </div>

    <div class="step" data-step="1">
      <div class="card">
        <h2 class="sec">Información académica</h2>
        <div class="row">
          <div class="field" style="flex:1;min-width:150px"><label>Tipo *</label><select id="tipo">
            <option value="curso">Curso (20 h)</option><option value="masterclass">Masterclass (hasta 4 h)</option>
            <option value="programa">Programa (20–89 h)</option><option value="diplomado" selected>Diplomado (90 h)</option>
            <option value="maestria">Maestría (240 h)</option></select></div>
          <div class="field" style="flex:1;min-width:150px"><label>Categoría</label><select id="categoria"></select></div>
          <div class="field" style="flex:1;min-width:130px"><label>Nivel</label><select id="nivel">
            <option value="basico">Básico</option><option value="intermedio">Intermedio</option><option value="avanzado" selected>Avanzado</option></select></div>
        </div>
        <div class="row">
          <div class="field" style="flex:1;min-width:130px"><label>Horas cronológicas</label><input type="number" id="horas" value="90"></div>
          <div class="field" style="flex:1;min-width:150px"><label>Duración (texto)</label><input id="duracion" placeholder="12 Semanas"></div>
          <div class="field" style="flex:1;min-width:150px"><label>Modalidad</label><select id="modalidad">
            <option value="online">Online</option><option value="en_vivo">En vivo</option>
            <option value="presencial">Presencial</option><option value="hibrido" selected>Híbrido</option></select></div>
        </div>
        <div class="field"><label>Nombre del certificado que otorga</label><input id="certNombre" placeholder="Diplomado Internacional en…"></div>
      </div>
    </div>

    <div class="step" data-step="2">
      <div class="card">
        <div class="row between"><h2 class="sec">Estructura de módulos</h2>
          <button type="button" class="btn outline sm" id="addMod"><span class="material-symbols-outlined">add</span> Agregar módulo</button></div>
        <div id="mods" class="stack"></div>
        <p class="tiny muted" style="margin-top:10px">Podrás añadir las lecciones de cada módulo desde el constructor de contenido.</p>
      </div>
    </div>

    <div class="step" data-step="3">
      <div class="card">
        <h2 class="sec">Disponibilidad y primera cohorte</h2>
        <label class="check" style="margin-bottom:12px"><input type="checkbox" id="crearCohorte" checked> Crear una cohorte inicial junto con el programa</label>
        <div id="cohorteFields">
          <div class="row">
            <div class="field" style="flex:1;min-width:150px"><label>Nombre de la cohorte</label><input id="cohNombre" value="Cohorte 25A"></div>
            <div class="field" style="flex:1;min-width:130px"><label>Turno</label><select id="cohTurno"></select></div>
            <div class="field" style="flex:1;min-width:130px"><label>Cupos</label><input type="number" id="cohCupos" value="30"></div>
          </div>
          <div class="row">
            <div class="field" style="flex:1;min-width:150px"><label>Fecha de inicio</label><input type="date" id="cohIni"></div>
            <div class="field" style="flex:1;min-width:150px"><label>Fecha de fin</label><input type="date" id="cohFin"></div>
            <div class="field" style="flex:1;min-width:220px"><label>Horario</label><div id="cohHorarioPicker"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="step" data-step="4">
      <div class="card">
        <h2 class="sec">Precio</h2>
        <div class="row">
          <div class="field" style="flex:1;min-width:150px"><label>Precio de lista *</label><input type="number" step="0.01" id="precio" value="0"></div>
          <div class="field" style="flex:1;min-width:130px"><label>Moneda</label><select id="moneda"><option>USD</option><option>EUR</option><option>VES</option></select></div>
        </div>
        <label class="check"><input type="checkbox" id="destacado"> Mostrar como destacado en el catálogo público</label>
      </div>
      <div class="card">
        <h2 class="sec">Descuentos y facilidades de pago</h2>
        <div class="row">
          <div class="field" style="flex:1;min-width:150px"><label>Descuento general (%)</label><input type="number" step="0.1" min="0" max="100" id="descuentoPct" placeholder="0"></div>
          <div class="field" style="flex:2;min-width:220px"><label>Condición del descuento</label><input id="descuentoNota" placeholder="Pago de contado, pronto pago, alianza…"></div>
        </div>
        <label class="check" style="margin-bottom:12px"><input type="checkbox" id="cuotasHab"> Se acepta pago en cuotas</label>
        <div class="row" id="cuotasCantidadWrap" style="display:none">
          <div class="field" style="flex:1;min-width:150px"><label>Cantidad de cuotas</label><input type="number" min="2" id="cuotasCantidad" value="3"></div>
        </div>
        <div class="field"><label>Métodos / pasarelas de pago aceptados</label>
          <div class="metodos-pago" id="metodosPago"></div>
        </div>
      </div>
    </div>

    <div class="step" data-step="5">
      <div class="card"><h2 class="sec">Revisión final</h2><div id="review"></div></div>
    </div>
  </form>

  <div class="row between" style="margin-top:16px">
    <button class="btn outline" id="btnPrev"><span class="material-symbols-outlined">arrow_back</span> Atrás</button>
    <button class="btn" id="btnNext">Siguiente <span class="material-symbols-outlined">arrow_forward</span></button>
  </div>
</div>

<script type="module">
import { sb, mount, $, $$, esc, money, ok, fail, run, audit, mejorarSelects, subirImagenCurso, montarHorarioPicker, horarioResumen } from '../assets/app.js';

const p = await mount({ require:['coordinador','admin','superadmin'], active:'cursos.html', area:'admin' });
const LABELS = ['Información general','Información académica','Estructura','Disponibilidad','Precio','Revisión'];
const METODOS_PAGO = ['Transferencia bancaria','Tarjeta de crédito/débito','Zelle','PayPal','Pago móvil','Efectivo'];
let step = 0, mods = [{titulo:'Módulo 1: Fundamentos'},{titulo:'Módulo 2: Desarrollo'}];
let categorias = [], turnos = [];
let horarioValor = { dias: [], horaInicio: '', horaFin: '' };

if (p) { await cargarListas(); renderSteps(); renderMods(); renderMetodosPago(); montarHorario(); mejorarSelects(); }

async function cargarListas(){
  const [{ data: cs }, { data: ts }] = await Promise.all([
    sb.from('cem_categorias').select('nombre').eq('activo', true).order('orden'),
    sb.from('cem_turnos').select('nombre').eq('activo', true).order('orden'),
  ]);
  categorias = cs || []; turnos = ts || [];
  $('#categoria').innerHTML = categorias.map(c => `<option value="${esc(c.nombre)}">${esc(c.nombre)}</option>`).join('') || '<option value="">Sin categorías definidas</option>';
  $('#cohTurno').innerHTML = turnos.map(t => `<option value="${esc(t.nombre)}">${esc(t.nombre)}</option>`).join('') || '<option value="">Sin turnos definidos</option>';
}

function montarHorario(){
  montarHorarioPicker($('#cohHorarioPicker'), horarioValor, (v) => { horarioValor = v; });
}

function renderMetodosPago(){
  $('#metodosPago').innerHTML = METODOS_PAGO.map(m => `<label class="check"><input type="checkbox" data-metodo="${esc(m)}"> ${esc(m)}</label>`).join('');
}
$('#cuotasHab').onchange = () => { $('#cuotasCantidadWrap').style.display = $('#cuotasHab').checked ? 'flex' : 'none'; };

function renderSteps(){
  $('#steps').innerHTML = LABELS.map((l,i)=>`<button type="button" class="${i===step?'on':''}" data-go="${i}">
    <span class="n">${i+1}</span>${l}</button>`).join('');
  $$('[data-go]').forEach(b => b.onclick = () => go(Number(b.dataset.go)));
  $('#stepLabel').textContent = `Paso ${step+1}: ${LABELS[step]}`;
  $$('.step').forEach(s => s.classList.toggle('on', Number(s.dataset.step)===step));
  $('#btnPrev').style.visibility = step===0?'hidden':'visible';
  $('#btnNext').innerHTML = step===LABELS.length-1
    ? 'Crear programa <span class="material-symbols-outlined">check</span>'
    : 'Siguiente <span class="material-symbols-outlined">arrow_forward</span>';
  if (step===LABELS.length-1) review();
}
function go(i){ if(i>0 && !$('#nombre').value.trim()){ fail('Primero escribe el nombre del programa.'); return; } step=i; renderSteps(); }
$('#btnPrev').onclick = () => go(Math.max(0,step-1));
$('#btnNext').onclick = () => step===LABELS.length-1 ? crear() : go(Math.min(LABELS.length-1,step+1));

$('#addMod').onclick = () => { mods.push({titulo:`Módulo ${mods.length+1}: `}); renderMods(); };
function renderMods(){
  $('#mods').innerHTML = mods.map((m,i)=>`<div class="row" style="gap:8px">
    <span class="chip neutral">${i+1}</span>
    <input class="inp" style="flex:1" data-m="${i}" value="${esc(m.titulo)}" placeholder="Título del módulo">
    <button type="button" class="btn ghost sm" data-del="${i}"><span class="material-symbols-outlined">delete</span></button></div>`).join('');
  $$('[data-m]').forEach(inp => inp.oninput = () => mods[Number(inp.dataset.m)].titulo = inp.value);
  $$('[data-del]').forEach(b => b.onclick = () => { mods.splice(Number(b.dataset.del),1); renderMods(); });
}

$('#btnSubirImagen').onclick = () => $('#imagenArchivo').click();
$('#imagenArchivo').onchange = async () => {
  const file = $('#imagenArchivo').files[0];
  if (!file) return;
  try {
    const url = await subirImagenCurso(file);
    $('#imagen').value = url;
    $('#imagenPreview').src = url; $('#imagenPreview').classList.add('on');
    ok('Imagen subida');
  } catch (e) { fail(e.message || 'No se pudo subir la imagen.'); }
};
$('#imagen').oninput = () => {
  const v = $('#imagen').value.trim();
  if (v) { $('#imagenPreview').src = v; $('#imagenPreview').classList.add('on'); }
  else $('#imagenPreview').classList.remove('on');
};

function review(){
  $('#review').innerHTML = [
    ['Nombre', $('#nombre').value], ['Código', $('#codigo').value||'—'], ['Tipo', $('#tipo').value],
    ['Categoría', $('#categoria').value || '—'], ['Modalidad', $('#modalidad').value], ['Nivel', $('#nivel').value], ['Horas', $('#horas').value],
    ['Precio', money(Number($('#precio').value)||0, $('#moneda').value)],
    ['Descuento', $('#descuentoPct').value ? `${$('#descuentoPct').value}%` : 'Sin descuento'],
    ['Cuotas', $('#cuotasHab').checked ? `${$('#cuotasCantidad').value} cuotas` : 'No'],
    ['Módulos', mods.filter(m=>m.titulo.trim()).length],
    ['Cohorte inicial', $('#crearCohorte').checked ? `${$('#cohNombre').value} · ${$('#cohTurno').value} · ${horarioResumen(horarioValor)||'sin horario'}` : 'No'],
  ].map(([k,v])=>`<div class="list-item"><div class="grow"><div class="s">${k}</div><div class="t">${esc(String(v))}</div></div></div>`).join('');
}

async function crear(estado='publicado'){
  if (!$('#nombre').value.trim()) { fail('El nombre es obligatorio.'); go(0); return; }
  const metodosPago = $$('[data-metodo]').filter(c=>c.checked).map(c=>c.dataset.metodo);
  const course = await run(sb.from('cem_courses').insert({
    nombre:$('#nombre').value.trim(), codigo:$('#codigo').value.trim()||null, subtitulo:$('#subtitulo').value.trim(),
    descripcion_corta:$('#descCorta').value.trim(), descripcion:$('#descripcion').value.trim(),
    tipo:$('#tipo').value, categoria:$('#categoria').value.trim(), modalidad:$('#modalidad').value,
    nivel:$('#nivel').value, horas:Number($('#horas').value)||0, duracion_texto:$('#duracion').value.trim(),
    precio:Number($('#precio').value)||0, moneda:$('#moneda').value, imagen_url:$('#imagen').value.trim()||null,
    destacado:$('#destacado').checked, estado, certificado_nombre:$('#certNombre').value.trim()||null,
    descuento_pct:$('#descuentoPct').value?Number($('#descuentoPct').value):null, descuento_nota:$('#descuentoNota').value.trim()||null,
    cuotas_habilitadas:$('#cuotasHab').checked, cuotas_cantidad:$('#cuotasHab').checked?Number($('#cuotasCantidad').value)||null:null,
    metodos_pago:metodosPago.length?metodosPago:null,
  }).select().single(), 'No se pudo crear el programa');

  const validMods = mods.filter(m=>m.titulo.trim());
  if (validMods.length) {
    await run(sb.from('cem_modules').insert(validMods.map((m,i)=>({ course_id:course.id, titulo:m.titulo.trim(), orden:i+1 }))), 'No se pudieron crear los módulos');
  }
  if ($('#crearCohorte').checked) {
    await run(sb.from('cem_cohorts').insert({
      course_id:course.id, codigo:(course.codigo||'CEM')+'-'+Date.now().toString().slice(-4),
      nombre:$('#cohNombre').value.trim()||'Cohorte inicial', modalidad:$('#modalidad').value,
      turno:$('#cohTurno').value, horario:horarioResumen(horarioValor),
      horario_dias:horarioValor.dias.length?horarioValor.dias:null, horario_hora_inicio:horarioValor.horaInicio||null, horario_hora_fin:horarioValor.horaFin||null,
      fecha_inicio:$('#cohIni').value||null, fecha_fin:$('#cohFin').value||null,
      cupos:Number($('#cohCupos').value)||30, estado:'inscripciones_abiertas',
    }), 'No se pudo crear la cohorte');
  }
  await audit('curso_creado','cem_courses',course.id,'medio',{nombre:course.nombre, estado});
  ok('Programa creado correctamente');
  setTimeout(()=>location.href='cursos.html', 700);
}
$('#btnDraft').onclick = () => crear('borrador');
</script>
</body>
</html>
