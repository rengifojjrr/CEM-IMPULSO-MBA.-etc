<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Bandeja de apelaciones</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-14">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Bandeja de apelaciones</h1><p>Gestión y seguimiento de solicitudes de revisión de calificaciones.</p></div>
    <div class="actions"><button class="btn outline" id="btnExport"><span class="material-symbols-outlined">download</span> Exportar CSV</button></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Estudiante o evaluación…"></div>
      <div class="field"><label>Estado</label><select id="fEstado"><option value="">Todos</option>
        <option value="recibida">Recibida</option><option value="en_analisis">En análisis</option>
        <option value="requiere_info">Requiere información</option><option value="aceptada">Aceptada</option>
        <option value="rechazada">Rechazada</option></select></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Estudiante</th><th>Evaluación</th><th>Nota actual</th><th>Motivo</th><th>Estado</th><th>Recibida</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table></div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, fdate, emptyRow, match, kpi, num, modal, ok, run, audit, toCSV, download } from '../assets/app.js?v=2026-08-14';
const p = await mount({ require:['coordinador','admin','superadmin','profesor','auditor'], active:'apelaciones.html', area:'admin' });
const puede = p && ['coordinador','admin','superadmin','profesor'].includes(p.rol);
let rows=[];
if (p) load();

async function load(){
  const { data } = await sb.from('cem_appeals')
    .select(`*,cem_profiles!cem_appeals_profile_id_fkey(nombre,apellido,email),
      cem_submissions(id,puntaje,intento,estado,cem_assessments(nombre,nota_aprobatoria,cem_courses(nombre)))`)
    .order('created_at',{ascending:false});
  rows = data||[];
  $('#kpis').innerHTML = [
    kpi('Apelaciones', num(rows.length),'gavel','histórico'),
    kpi('Abiertas', num(rows.filter(r=>['recibida','en_analisis','requiere_info'].includes(r.estado)).length),'pending_actions','requieren respuesta'),
    kpi('Aceptadas', num(rows.filter(r=>r.estado==='aceptada').length),'check_circle','con ajuste de nota'),
    kpi('Rechazadas', num(rows.filter(r=>r.estado==='rechazada').length),'cancel','nota confirmada'),
  ].join('');
  render();
}

function render(){
  const q=$('#q').value.trim(), e=$('#fEstado').value;
  const list = rows.filter(r=>match(r,q,['cem_profiles.nombre','cem_profiles.apellido','cem_submissions.cem_assessments.nombre','motivo'])
    && (!e||r.estado===e));
  $('#tb').innerHTML = list.length ? list.map(r=>{
    const a=r.cem_submissions?.cem_assessments;
    return `<tr>
      <td class="wrap"><b>${esc((r.cem_profiles?.nombre||'')+' '+(r.cem_profiles?.apellido||''))}</b>
        <div class="tiny muted">${esc(r.cem_profiles?.email||'')}</div></td>
      <td class="wrap">${esc(a?.nombre||'')}<div class="tiny muted">${esc(a?.cem_courses?.nombre||'')}</div></td>
      <td><b>${r.cem_submissions?.puntaje ?? '—'}</b><div class="tiny muted">mín. ${a?.nota_aprobatoria||70}</div></td>
      <td class="wrap" style="max-width:280px">${esc((r.motivo||'').slice(0,140))}${(r.motivo||'').length>140?'…':''}</td>
      <td>${chip(r.estado)}</td><td class="muted">${fdate(r.created_at)}</td>
      <td style="white-space:nowrap">
        <button class="btn ghost sm" data-v="${r.id}"><span class="material-symbols-outlined">visibility</span></button>
        ${puede && !['aceptada','rechazada'].includes(r.estado)?`<button class="btn outline sm" data-r="${r.id}">Resolver</button>`:''}
      </td></tr>`;
  }).join('') : emptyRow(7,'No hay apelaciones registradas.');
  $$('[data-v]').forEach(b=>b.onclick=()=>ver(rows.find(r=>r.id===b.dataset.v)));
  $$('[data-r]').forEach(b=>b.onclick=()=>resolver(rows.find(r=>r.id===b.dataset.r)));
}
['#q','#fEstado'].forEach(s=>{const el=$(s); el.oninput=render; el.onchange=render;});
$('#btnExport').onclick=()=>download('apelaciones_cem.csv', toCSV(rows.map(r=>({
  estudiante:(r.cem_profiles?.nombre||'')+' '+(r.cem_profiles?.apellido||''), email:r.cem_profiles?.email,
  evaluacion:r.cem_submissions?.cem_assessments?.nombre, nota:r.cem_submissions?.puntaje,
  motivo:r.motivo, estado:r.estado, recibida:r.created_at, resolucion:r.resolucion }))));

function ver(r){
  const a=r.cem_submissions?.cem_assessments;
  modal({ title:'Detalle de la apelación', wide:true, body:`
    <div class="row" style="gap:8px;margin-bottom:12px">${chip(r.estado)}
      <span class="chip neutral">Nota: ${r.cem_submissions?.puntaje ?? '—'}</span>
      <span class="chip neutral">Intento ${r.cem_submissions?.intento||1}</span></div>
    <div class="list-item"><div class="grow"><div class="s">Estudiante</div>
      <div class="t">${esc((r.cem_profiles?.nombre||'')+' '+(r.cem_profiles?.apellido||''))}</div></div></div>
    <div class="list-item"><div class="grow"><div class="s">Evaluación</div>
      <div class="t">${esc(a?.nombre||'')} <span class="muted tiny">· ${esc(a?.cem_courses?.nombre||'')}</span></div></div></div>
    <div class="card" style="background:var(--surface-container);box-shadow:none;margin-top:12px">
      <b class="tiny">Motivo expuesto por el estudiante</b>
      <p class="tiny" style="margin:6px 0 0">${esc(r.motivo||'')}</p></div>
    ${r.resolucion? `<div class="card" style="background:${r.estado==='aceptada'?'var(--ok-container)':'var(--error-container)'};box-shadow:none;margin-top:10px">
      <b class="tiny">Resolución</b><p class="tiny" style="margin:6px 0 0">${esc(r.resolucion)}</p>
      <div class="tiny muted" style="margin-top:4px">${fdate(r.resuelto_en)}</div></div>`:''}` });
}

function resolver(r){
  const nota = r.cem_submissions?.puntaje;
  const m = modal({ title:'Resolver apelación', wide:true, body:`
    <div class="card" style="background:var(--surface-container);box-shadow:none;margin-bottom:12px">
      <b class="tiny">Motivo del estudiante</b><p class="tiny" style="margin:6px 0 0">${esc(r.motivo||'')}</p></div>
    <div class="field"><label>Decisión *</label><select id="aE">
      <option value="en_analisis">En análisis (seguir revisando)</option>
      <option value="requiere_info">Requiere más información del estudiante</option>
      <option value="aceptada">Aceptada — ajustar la nota</option>
      <option value="rechazada">Rechazada — mantener la nota</option></select></div>
    <div class="field hidden" id="wrapNota"><label>Nueva nota *</label>
      <input type="number" id="aN" min="0" max="100" value="${nota??''}"></div>
    <div class="field"><label>Resolución / respuesta al estudiante *</label>
      <textarea id="aR" placeholder="Explica la decisión tomada…"></textarea></div>`,
    footer:`<button class="btn outline" data-x>Cancelar</button><button class="btn" data-s>Guardar resolución</button>` });
  const upd = () => $('#wrapNota',m).classList.toggle('hidden', $('#aE',m).value!=='aceptada');
  $('#aE',m).onchange = upd; upd();
  $('[data-x]',m).onclick=m.close;
  $('[data-s]',m).onclick=async()=>{
    const estado=$('#aE',m).value, res=$('#aR',m).value.trim();
    if (!res) return;
    const final = ['aceptada','rechazada'].includes(estado);
    await run(sb.from('cem_appeals').update({ estado, resolucion:res,
      resuelto_por: final? p.id : null, resuelto_en: final? new Date().toISOString() : null }).eq('id',r.id),'No se pudo guardar');
    if (estado==='aceptada'){
      const nueva = Number($('#aN',m).value);
      if (!isNaN(nueva) && r.submission_id){
        await run(sb.rpc('cem_grade_submission',{ p_submission_id:r.submission_id, p_puntaje:nueva,
          p_feedback:'Nota ajustada por apelación: '+res }),'No se pudo ajustar la nota');
      }
    }
    await audit('apelacion_resuelta','cem_appeals',r.id,'medio',{estado});
    m.close(); ok('Apelación actualizada'); load();
  };
}
</script>
</body>
</html>
