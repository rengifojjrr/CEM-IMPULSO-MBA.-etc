<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Gestión de cohortes</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icono-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d2440">
<!-- Los cuatro servidores de fuera, avisados de golpe y no en fila.
     Sin esto el navegador descubre cada uno cuando le toca, y paga el
     DNS y el saludo TLS de cada cual por separado, con la pantalla en
     blanco mientras tanto. Ver herramientas/acelerar-cabeceras.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://vajbsfgojtunamhrzrpf.supabase.co" crossorigin>
<link rel="modulepreload" href="../assets/app.js?v=2026-08-29-2">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-29-2">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Gestión de cohortes</h1><p>Una cohorte es el grupo con el que se dicta un programa: cuándo empieza, cuántos cupos tiene y quién lo dicta.</p></div>
    <div class="actions"><button class="btn" id="btnNueva"><span class="material-symbols-outlined">add_circle</span> Nueva cohorte</button></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Nombre o código de cohorte…"></div>
      <div class="field"><label>Curso</label><select id="fCurso"><option value="">Todos</option></select></div>
      <div class="field"><label>Estado</label><select id="fEstado"><option value="">Todos</option>
        <option value="planificada">Planificada</option><option value="inscripciones_abiertas">Inscripciones abiertas</option>
        <option value="en_curso">En curso</option><option value="finalizada">Finalizada</option><option value="cancelada">Cancelada</option></select></div>
      <button class="btn ghost" id="btnClear">Limpiar</button>
    </div>
    <div class="table-wrap">
      <table id="tabla"><thead><tr><th data-ord="nombre">Cohorte</th><th data-ord="_curso">Programa</th><th>Modalidad</th><th>Horario</th>
        <th data-ord="fecha_inicio">Inicio</th><th class="num" data-ord="_n">Ocupación</th><th>Profesor</th><th data-ord="estado">Estado</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table>
    </div>
  </div>
</div>

<script type="module">
import { sb, mount, $, $$, esc, chip, bar, num, fdate, emptyRow, match, kpi, modal, ok, fail, run, audit, qs, mejorarSelects, montarHorarioPicker, horarioResumen, opciones, chipEstado, accionVacio, etiqueta, ordenable, ordenarPor, montarAyudas, conectarFiltros } from '../assets/app.js?v=2026-08-29-2';

const p = await mount({ require:['coordinador','admin','superadmin','auditor'], active:'cohortes.html', area:'admin' });
const editable = p && ['coordinador','admin','superadmin'].includes(p.rol);
let rows = [], cursos = [], profes = [], turnos = [];
if (p) { load(); sb.from('cem_turnos').select('nombre').eq('activo',true).order('orden').then(({data})=>turnos=data||[]); }

async function load(){
  const [{ data: cs }, { data: cos }, { data: ens }, { data: tas }, { data: ps }] = await Promise.all([
    sb.from('cem_courses').select('id,nombre').order('nombre'),
    sb.from('cem_cohorts').select('*').order('fecha_inicio',{ascending:false}),
    sb.from('cem_enrollments').select('cohort_id').limit(500),
    sb.from('cem_teacher_assignments').select('cohort_id,teacher_id'),
    sb.from('cem_profiles').select('id,nombre,apellido').eq('rol','profesor').limit(500),
  ]);
  cursos = cs||[]; profes = ps||[];
  const nEns = {}; (ens||[]).forEach(e => nEns[e.cohort_id] = (nEns[e.cohort_id]||0)+1);
  const tByCoh = {}; (tas||[]).forEach(t => tByCoh[t.cohort_id] = t.teacher_id);
  const pName = Object.fromEntries(profes.map(x=>[x.id, `${x.nombre} ${x.apellido||''}`.trim()]));
  rows = (cos||[]).map(c => ({ ...c, _curso: cs?.find(x=>x.id===c.course_id)?.nombre||'',
    _n: nEns[c.id]||0, _prof: pName[tByCoh[c.id]]||'—' }));

  $('#fCurso').innerHTML = '<option value="">Todos</option>' + cursos.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
  if (qs('curso')) $('#fCurso').value = qs('curso');

  const activas = rows.filter(r=>['en_curso','inscripciones_abiertas'].includes(r.estado));
  const totalCupos = activas.reduce((a,r)=>a+(r.cupos||0),0), totalIns = activas.reduce((a,r)=>a+r._n,0);
  $('#kpis').innerHTML = [
    kpi('Cohortes activas', num(activas.length), 'vital_signs', 'en curso o abiertas'),
    kpi('Inscripciones abiertas', num(rows.filter(r=>r.estado==='inscripciones_abiertas').length), 'door_open', 'programas disponibles'),
    kpi('Ocupación global', totalCupos? Math.round(100*totalIns/totalCupos)+'%' : '—', 'pie_chart', `${num(totalIns)}/${num(totalCupos)} cupos`),
    kpi('Total cohortes', num(rows.length), 'groups', 'histórico'),
  ].join('');
  render();
}

function render(){
  const q=$('#q').value.trim(), c=$('#fCurso').value, e=$('#fEstado').value;
  const list = ordenarPor(rows.filter(r => match(r,q,['nombre','codigo','_curso']) && (!c||r.course_id===c) && (!e||r.estado===e)), ordenCohortes);
  $('#tb').innerHTML = list.length ? list.map(r => {
    const occ = Math.round(100*r._n/Math.max(r.cupos,1));
    return `<tr>
      <td><b>${esc(r.nombre)}</b><div class="tiny muted">${esc(r.codigo)}</div></td>
      <td class="wrap">${esc(r._curso)}</td><td>${esc(etiqueta(r.modalidad))}</td>
      <td class="wrap">${esc(r.horario||'—')}</td><td>${fdate(r.fecha_inicio)}</td>
      <td style="min-width:120px">${r._n
        ? `${bar(occ)}<span class="tiny muted">${r._n}/${r.cupos} · ${occ}%</span>`
        : `<span class="tiny muted">Sin inscritos · ${r.cupos} cupos</span>`}</td>
      <td>${esc(r._prof)}</td><td>${chipEstado(r.estado)}</td>
      <td class="nowrap">
        <a class="btn ghost sm" href="calendario.html?cohorte=${r.id}" title="Calendario"><span class="material-symbols-outlined">calendar_today</span></a>
        <a class="btn ghost sm" href="inscripciones.html?cohorte=${r.id}" title="Inscritos"><span class="material-symbols-outlined">group</span></a>
        ${editable?`<button class="btn ghost sm" data-edit="${r.id}" title="Editar la cohorte"><span class="material-symbols-outlined">edit</span></button>`:''}
      </td></tr>`;
  }).join('') : emptyRow(9, 'Todavía no hay cohortes. Una cohorte es el grupo con el que un programa se dicta.', {texto:'Crear la primera cohorte', id:'vacioCohorte', icono:'group_add'});
  $$('[data-edit]').forEach(b => b.onclick = () => form(rows.find(x=>x.id===b.dataset.edit)));
  ordenable('#tabla', ordenCohortes, render);
}

/** item 26 · por qué columna se está ordenando. */
const ordenCohortes = { campo:null, asc:true };
conectarFiltros(['#q','#fCurso','#fEstado'], render);
$('#btnClear').onclick = () => { ['#q','#fCurso','#fEstado'].forEach(s=>$(s).value=''); render(); };
$('#btnNueva').onclick = () => form(null);
/* item 19 · el vacío ofrece la acción, no sólo la noticia de que está vacío. */
accionVacio('vacioCohorte', () => form(null));

function form(c){
  const isNew = !c;
  /* item 22 · eran catorce campos seguidos, sin ningún corte: el nombre pesaba
     lo mismo que el salón. Ahora van en tres bloques —qué grupo es, cuándo se
     da, quién lo dicta— y lo que casi nunca se toca queda plegado. */
  const m = modal({ title: isNew?'Nueva cohorte':`Editar: ${c.nombre}`, wide:true, body:`
    <h3 class="sec">Qué grupo es</h3>
    <div class="row">
      <div class="field largo"><label>Programa *</label><select id="cCurso" required>
        ${cursos.map(x=>`<option value="${x.id}" ${c&&c.course_id===x.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></div>
      <div class="field medio"><label>Código *</label><input id="cCodigo" value="${esc(c?.codigo||'')}" required placeholder="CEM-DIP-009"></div>
    </div>
    <div class="field"><label>Nombre *</label><input id="cNombre" value="${esc(c?.nombre||'')}" placeholder="Cohorte 25A - Primavera" required></div>
    <div class="row">
      <div class="field corto"><label>Cupos <button type="button" class="ayuda-btn" data-ayuda="Cuánta gente cabe. No impide inscribir de más: sirve para ver la ocupación y saber cuándo cerrar el grupo.">?</button></label><input type="number" id="cCupos" value="${c?.cupos??30}"></div>
      <div class="field medio"><label>Estado</label><select id="cEstado">
        ${opciones(['planificada','inscripciones_abiertas','en_curso','finalizada','cancelada'], c?.estado)}</select></div>
    </div>

    <h3 class="sec sep-mucho">Cuándo se da</h3>
    <div class="row">
      <div class="field medio"><label>Inicio</label><input type="date" id="cIni" value="${c?.fecha_inicio||''}"></div>
      <div class="field medio"><label>Fin</label><input type="date" id="cFin" value="${c?.fecha_fin||''}"></div>
    </div>
    <div class="field"><label>Horario</label><div id="cHorarioPicker"></div></div>

    <h3 class="sec sep-mucho">Quién la dicta</h3>
    <!-- Un titular no quiere decir que dé todas las clases: en un diplomado es
         normal que un módulo lo lleve otro. Esa asignación por sesión ya existe
         —cada clase del calendario tiene su profesor— pero desde aquí parecía
         que la cohorte tenía un profesor y ya, así que se dice. -->
    <p class="tiny muted sin-margen">Es quien responde por la cohorte y quien sale por omisión en las
      clases nuevas. Cada sesión puede tener otro: se elige en el
      <a href="calendario.html">calendario</a>, clase por clase.</p>
    <div class="field sep-poco"><label>Profesor titular</label><select id="cProf"><option value="">Sin asignar</option>
      ${profes.map(x=>`<option value="${x.id}">${esc(x.nombre)} ${esc(x.apellido||'')}</option>`).join('')}</select></div>

    <details class="filtros-plegables sep">
      <summary><span class="material-symbols-outlined">tune</span> Más opciones</summary>
      <div class="row">
        <div class="field medio"><label>Modalidad</label><select id="cMod">
          ${opciones(['online','en_vivo','presencial','hibrido'], c?.modalidad)}</select></div>
        <div class="field medio"><label>Turno</label><select id="cTurno">
          ${turnos.map(t=>`<option value="${esc(t.nombre)}" ${c?.turno===t.nombre?'selected':''}>${esc(t.nombre)}</option>`).join('') || `<option value="${esc(c?.turno||'')}">${esc(c?.turno||'Sin turnos definidos')}</option>`}</select></div>
        <div class="field medio"><label>Salón</label><input id="cSalon" value="${esc(c?.salon||'')}" placeholder="Aula 3 o el enlace de la sala"></div>
      </div>
    </details>`,
    footer:`<button class="btn outline" data-c>Cancelar</button><button class="btn" data-s>Guardar la cohorte</button>` });
  mejorarSelects(m);
  let horarioValor = { dias: c?.horario_dias || [], horaInicio: c?.horario_hora_inicio || '', horaFin: c?.horario_hora_fin || '' };
  montarHorarioPicker($('#cHorarioPicker',m), horarioValor, (v) => { horarioValor = v; });
  $('[data-c]',m).onclick = m.close;
  $('[data-s]',m).onclick = async () => {
    const payload = {
      course_id:$('#cCurso',m).value, codigo:$('#cCodigo',m).value.trim(), nombre:$('#cNombre',m).value.trim(),
      modalidad:$('#cMod',m).value, turno:$('#cTurno',m).value, cupos:Number($('#cCupos',m).value)||30,
      fecha_inicio:$('#cIni',m).value||null, fecha_fin:$('#cFin',m).value||null,
      salon:$('#cSalon',m).value.trim(), horario:horarioResumen(horarioValor), estado:$('#cEstado',m).value,
      horario_dias:horarioValor.dias.length?horarioValor.dias:null, horario_hora_inicio:horarioValor.horaInicio||null, horario_hora_fin:horarioValor.horaFin||null,
    };
    if (!payload.nombre || !payload.codigo) {
      /* item 42 · antes sólo subía el modal, sin decir qué faltaba. */
      fail('Faltan el nombre y el código de la cohorte: sin ellos nadie la distingue de las demás.');
      m.querySelector('.modal-b').scrollTop = 0;
      (!payload.nombre ? $('#cNombre', m) : $('#cCodigo', m)).focus();
      return;
    }
    let id = c?.id;
    if (isNew) { const r = await run(sb.from('cem_cohorts').insert(payload).select().single(),'No se pudo crear'); id = r.id; }
    else await run(sb.from('cem_cohorts').update(payload).eq('id',c.id),'No se pudo guardar');
    const prof = $('#cProf',m).value;
    if (prof) {
      await sb.from('cem_teacher_assignments').delete().eq('cohort_id',id);
      await sb.from('cem_teacher_assignments').insert({ teacher_id:prof, cohort_id:id, course_id:payload.course_id });
    }
    await audit(isNew?'cohorte_creada':'cohorte_actualizada','cem_cohorts',id,'medio',{nombre:payload.nombre});
    m.close(); ok(isNew?'Cohorte creada':'Cohorte actualizada'); load();
  };
}
</script>
</body>
</html>
