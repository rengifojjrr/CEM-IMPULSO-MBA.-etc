<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Cursos y programas</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icono-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d2440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-26-11">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Cursos y programas</h1><p>Gestiona la oferta académica, contenidos y estado de publicación.</p></div>
    <div class="actions">
      <button class="btn outline" id="btnExport"><span class="material-symbols-outlined">download</span> Exportar</button>
      <a class="btn" href="curso-nuevo.html"><span class="material-symbols-outlined">add</span> Nuevo programa</a>
    </div>
  </div>

  <div class="card">
    <!-- Sólo el buscador a la vista. Los otros cuatro filtros ocupaban una franja
         entera encima de la tabla, y en el teléfono, media pantalla antes de
         ver la primera fila. -->
    <div class="filters" style="align-items:flex-end">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Nombre o código…"></div>
      <details class="filtros-plegables" id="masFiltros">
        <summary><span class="material-symbols-outlined">tune</span> Filtros
          <span class="cuantos" id="nFiltros" hidden></span></summary>
        <div class="campos filters">
          <div class="field"><label>Tipo</label><select id="fTipo"><option value="">Todos</option>
            <option value="masterclass">Masterclass</option><option value="curso">Curso</option>
            <option value="programa">Programa</option><option value="diplomado">Diplomado</option><option value="maestria">Maestría</option></select></div>
          <div class="field"><label>Modalidad</label><select id="fMod"><option value="">Todas</option>
            <option value="online">En línea</option><option value="en_vivo">En vivo</option>
            <option value="presencial">Presencial</option><option value="hibrido">Híbrido</option></select></div>
          <div class="field"><label>Nivel</label><select id="fNivel"><option value="">Todos</option>
            <option value="basico">Básico</option><option value="intermedio">Intermedio</option><option value="avanzado">Avanzado</option></select></div>
          <div class="field"><label>Estado <button type="button" class="ayuda-btn" data-ayuda="Sólo los publicados se ven en el catálogo. Un borrador existe pero nadie de fuera lo alcanza.">?</button></label><select id="fEstado"><option value="">Todos</option>
            <option value="publicado">Publicado</option><option value="borrador">Borrador</option>
            <option value="en_revision">En revisión</option><option value="pausado">En pausa</option><option value="archivado">Archivado</option></select></div>
          <button class="btn ghost" id="btnClear">Limpiar</button>
        </div>
      </details>
      <!-- Los programas se venden por su portada, y en la lista no se veía
           ninguna: había que abrir la ficha para saber si un curso tenía
           imagen o si la que tenía era la buena. En «Catálogo» se ven como los
           ve quien va a pagar. La elección se recuerda. -->
      <div class="row" style="gap:0;margin-left:auto" role="group" aria-label="Cómo ver la lista">
        <button class="btn ghost sm" id="btnTabla" title="Ver como tabla" aria-pressed="true">
          <span class="material-symbols-outlined">view_list</span></button>
        <button class="btn ghost sm" id="btnCatalogo" title="Ver como catálogo, con las portadas" aria-pressed="false">
          <span class="material-symbols-outlined">grid_view</span></button>
      </div>
    </div>

    <div id="catalogo" hidden></div>

    <div class="table-wrap" id="zonaTabla">
      <!-- De diez columnas a cinco. Nivel, modalidad y horas casi nunca deciden
           lo que vas a hacer con un curso: viven en su ficha, no en la lista. -->
      <table id="tabla" class="tarjetas"><thead><tr>
        <th data-ord="nombre">Curso</th>
        <th class="num" data-ord="_alumnos">Alumnos</th>
        <th data-ord="_avance">Avance</th>
        <th class="num" data-ord="precio">Precio</th>
        <th data-ord="estado">Estado</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table>
    </div>
  </div>
</div>

<script type="module">
import { sb, mount, $, $$, esc, chip, bar, money, num, pct, emptyRow, match, toCSV, download, ok, fail,
         modal, confirmDialog, run, audit, mejorarSelects, subirImagenCurso, campoArchivo, opciones,
         etiqueta, chipEstado, ayuda, montarAyudas, ordenable, ordenarPor, accionVacio,
         idDeYoutube } from '../assets/app.js?v=2026-08-26-11';

const p = await mount({ require:['coordinador','admin','superadmin','auditor'], active:'cursos.html', area:'admin' });
const editable = p && ['coordinador','admin','superadmin'].includes(p.rol);
const METODOS_PAGO = ['Transferencia bancaria','Tarjeta de crédito/débito','Zelle','PayPal','Pago móvil','Efectivo'];
let rows = [], categorias = [];
if (p) { load(); sb.from('cem_categorias').select('nombre').eq('activo',true).order('orden').then(({data})=>categorias=data||[]); }
accionVacio('vacioNuevo', () => location.href = 'curso-nuevo.html');

async function load(){
  const { data } = await sb.from('cem_courses').select('*').order('created_at',{ascending:false});
  const { data: ens } = await sb.from('cem_enrollments').select('course_id,progreso').limit(500);
  const agg = {};
  (ens||[]).forEach(e => { (agg[e.course_id] ||= { n:0, s:0 }); agg[e.course_id].n++; agg[e.course_id].s += Number(e.progreso)||0; });
  rows = (data||[]).map(c => ({ ...c, _alumnos: agg[c.id]?.n||0, _avance: agg[c.id]? agg[c.id].s/agg[c.id].n : 0 }));
  render();
}

/* Cada programa se refleja como producto en Stripe al guardarlo, para que los
   cobros se informen por curso y la página de pago enseñe su imagen. Aquí sólo
   se avisa cuando algo salió mal: si va bien, no hay nada que contar y una
   pantalla llena de «correcto» es una pantalla que no se lee.

   Se distingue «falló» de «va en camino» a propósito. El reflejo sale por libre
   y la respuesta llega unos segundos después; decir «hecho» al mandarlo sería
   decir que algo está hecho porque se pidió. */
function estadoStripe(r){
  if (r.stripe_sync_error) {
    return ` <span class="chip err" title="${esc(r.stripe_sync_error)}">Stripe: falló</span>`;
  }
  if (r.stripe_sync_peticion) return ' <span class="chip">Stripe: en camino</span>';
  return '';
}

function render(){
  const q = $('#q').value.trim(), t = $('#fTipo').value, m = $('#fMod').value, n = $('#fNivel').value, e = $('#fEstado').value;
  const list = ordenarPor(rows.filter(r => match(r,q,['nombre','codigo','categoria'])
    && (!t||r.tipo===t) && (!m||r.modalidad===m) && (!n||r.nivel===n) && (!e||r.estado===e)), ordenCursos);
  $('#tb').innerHTML = list.length ? list.map(r => `<tr>
    <td class="wrap" data-col="Curso"><b>${esc(r.nombre)}</b>
      <div class="tiny muted">${esc(r.codigo||'')}${r.categoria?' · '+esc(r.categoria):''}
        · ${esc(etiqueta(r.tipo))} · ${esc(etiqueta(r.modalidad))} · ${r.horas||0} h</div></td>
    <td class="num" data-col="Alumnos">${num(r._alumnos)}</td>
    <td data-col="Avance" style="min-width:110px">${r._alumnos
      ? `${bar(r._avance)}<span class="tiny muted">${pct(r._avance)}</span>`
      : '<span class="tiny muted">—</span>'}</td>
    <td class="num" data-col="Precio">${money(r.precio)}</td>
    <td data-col="Estado">${chipEstado(r.estado)}${estadoStripe(r)}</td>
    <td class="nowrap" data-col="">
      <a class="btn ghost sm" href="contenido.html?curso=${r.id}" title="Ver y editar sus contenidos"><span class="material-symbols-outlined">import_contacts</span></a>
      <a class="btn ghost sm" href="cohortes.html?curso=${r.id}" title="Ver sus cohortes"><span class="material-symbols-outlined">groups</span></a>
      ${editable?`<button class="btn ghost sm" data-edit="${r.id}" title="Editar los datos del programa"><span class="material-symbols-outlined">edit</span></button>`:''}
    </td></tr>`).join('')
    : emptyRow(6, q||t||m||n||e ? 'Ningún programa coincide con lo que buscas.' : 'Todavía no hay programas.',
               editable && !(q||t||m||n||e) ? {texto:'Crear el primero', id:'vacioNuevo', icono:'add'} : null);
  /* El mismo listado, con cara. Un programa sin portada no se disimula con un
     degradado bonito: se dice, porque es justo lo que hay que arreglar antes
     de publicarlo. */
  $('#catalogo').innerHTML = list.length ? `<div class="grid g3">${list.map(r => `
    <div class="course-card">
      ${r.imagen_url
        ? `<img src="${esc(r.imagen_url)}" alt="Portada de ${esc(r.nombre)}" loading="lazy">`
        : `<div class="previa sin-previa" style="height:148px">
             <span class="material-symbols-outlined">add_photo_alternate</span></div>`}
      <div class="body">
        <div class="row between" style="gap:8px">
          ${chipEstado(r.estado)}${estadoStripe(r)}
          ${r.imagen_url ? '' : '<span class="chip warn">Sin portada</span>'}
        </div>
        <h3>${esc(r.nombre)}</h3>
        <div class="tiny muted">${esc(r.codigo||'')}${r.categoria?' · '+esc(r.categoria):''}
          · ${esc(etiqueta(r.tipo))} · ${esc(etiqueta(r.modalidad))}</div>
        <div class="row between" style="margin-top:auto">
          <b>${money(r.precio)}</b>
          <span class="tiny muted">${num(r._alumnos)} alumno(s)${r._alumnos?` · ${pct(r._avance)}`:''}</span>
        </div>
        <div class="row">
          <a class="btn ghost sm" href="contenido.html?curso=${r.id}" title="Ver y editar sus contenidos"><span class="material-symbols-outlined">import_contacts</span></a>
          <a class="btn ghost sm" href="cohortes.html?curso=${r.id}" title="Ver sus cohortes"><span class="material-symbols-outlined">groups</span></a>
          ${editable?`<button class="btn ghost sm" data-edit="${r.id}" title="Editar los datos del programa"><span class="material-symbols-outlined">edit</span></button>`:''}
        </div>
      </div>
    </div>`).join('')}</div>`
    : `<p class="muted tiny">${q||t||m||n||e ? 'Ningún programa coincide con lo que buscas.' : 'Todavía no hay programas.'}</p>`;

  $$('[data-edit]').forEach(b => b.onclick = () => edit(rows.find(x => x.id === b.dataset.edit)));

  // Cuántos filtros hay puestos, para saberlo sin desplegarlos.
  const puestos = [t,m,n,e].filter(Boolean).length;
  const señal = $('#nFiltros');
  señal.hidden = !puestos;
  señal.textContent = puestos;

  ordenable('#tabla', ordenCursos, render);
}

/** Por qué columna se está ordenando la lista. */
const ordenCursos = { campo:null, asc:true };

['#q','#fTipo','#fMod','#fNivel','#fEstado'].forEach(s => { const el=$(s); el.oninput = render; el.onchange = render; });

/* Tabla o catálogo. Se guarda la elección: quien trabaja con el contenido casi
   siempre quiere lo mismo cada vez que entra. */
function ponerVista(cual){
  const catalogo = cual === 'catalogo';
  $('#catalogo').hidden = !catalogo;
  $('#zonaTabla').hidden = catalogo;
  $('#btnCatalogo').setAttribute('aria-pressed', String(catalogo));
  $('#btnTabla').setAttribute('aria-pressed', String(!catalogo));
  localStorage.setItem('cemVistaCursos', cual);
}
$('#btnTabla').onclick = () => ponerVista('tabla');
$('#btnCatalogo').onclick = () => ponerVista('catalogo');
ponerVista(localStorage.getItem('cemVistaCursos') === 'catalogo' ? 'catalogo' : 'tabla');
$('#btnClear').onclick = () => { ['#q','#fTipo','#fMod','#fNivel','#fEstado'].forEach(s=>$(s).value=''); render(); };
$('#btnExport').onclick = () => {
  // Antes sacaba TODO, dijera lo que dijera el filtro puesto, y no avisaba de
  // cuántas filas iban a salir: se abría el Excel para descubrirlo.
  const q = $('#q').value.trim(), t = $('#fTipo').value, m = $('#fMod').value,
        n = $('#fNivel').value, e = $('#fEstado').value;
  const list = rows.filter(r => match(r,q,['nombre','codigo','categoria'])
    && (!t||r.tipo===t) && (!m||r.modalidad===m) && (!n||r.nivel===n) && (!e||r.estado===e));
  download('cursos_cem.csv', toCSV(list.map(({_alumnos,_avance,...r})=>({...r, alumnos:_alumnos}))));
  ok(`${list.length} programa(s) exportados${list.length < rows.length ? ' (los que deja ver el filtro)' : ''}`);
};

function edit(c){
  const portada = campoArchivo({
    id:'ePort', tipo:'imagen', valor: c.imagen_url || '', subir: subirImagenCurso,
    etiquetaSubir:'Elegir la imagen de portada',
  });
  const m = modal({ title:`Editar: ${c.nombre}`, wide:true, body:`
    <div class="row"><div class="field largo"><label>Nombre</label><input id="eNombre" value="${esc(c.nombre)}"></div>
      <div class="field corto"><label>Código</label><input id="eCodigo" value="${esc(c.codigo||'')}" placeholder="CEM-DIP-009"></div></div>
    <div class="field"><label>Subtítulo</label><input id="eSub" value="${esc(c.subtitulo||'')}"></div>
    <div class="field"><label>Descripción corta</label><textarea id="eDesc" style="min-height:60px">${esc(c.descripcion_corta||'')}</textarea></div>
    <div class="row">
      <div class="field medio"><label>Tipo</label><select id="eTipo">
        ${opciones(['masterclass','curso','programa','diplomado','maestria'], c.tipo)}</select></div>
      <div class="field medio"><label>Modalidad</label><select id="eMod">
        ${opciones(['online','en_vivo','presencial','hibrido'], c.modalidad)}</select></div>
      <div class="field corto"><label>Nivel</label><select id="eNivel">
        ${opciones(['basico','intermedio','avanzado'], c.nivel)}</select></div>
    </div>
    <div class="row">
      <div class="field corto"><label>Horas</label><input type="number" id="eHoras" value="${c.horas||0}"></div>
      <div class="field corto"><label>Precio</label><input type="number" step="0.01" id="ePrecio" value="${c.precio||0}"></div>
      <div class="field medio"><label>Categoría</label><select id="eCat">
        ${categorias.map(cat=>`<option value="${esc(cat.nombre)}" ${c.categoria===cat.nombre?'selected':''}>${esc(cat.nombre)}</option>`).join('') || `<option value="${esc(c.categoria||'')}">${esc(c.categoria||'Sin categorías definidas')}</option>`}</select></div>
      <div class="field medio"><label>Estado</label><select id="eEstado">
        ${opciones(['borrador','en_revision','publicado','pausado','archivado'], c.estado)}</select></div>
    </div>
    <div class="field"><label>Imagen de portada</label>${portada.html}</div>
    <!-- La portada convence a medias; lo que convence es alguien contando en
         dos minutos qué se aprende. Se pega la dirección que uno copia del
         navegador y se guarda sólo el identificador: una dirección de «ver en
         YouTube» no se deja incrustar y dejaría la ficha en negro. -->
    <div class="field"><label for="eIntro">Vídeo de presentación
        <button type="button" class="ayuda-btn" data-ayuda="Un vídeo corto donde se explica de qué va el programa. Sale en la ficha pública, encima del temario. Pega la dirección de YouTube tal como la copiaste.">?</button></label>
      <input id="eIntro" value="${esc(c.video_intro ? `https://youtu.be/${c.video_intro}` : '')}"
        placeholder="https://www.youtube.com/watch?v=…">
      <span class="tiny muted" id="notaIntro"></span></div>
    <label class="check"><input type="checkbox" id="eDest" ${c.destacado?'checked':''}> Destacado en el catálogo</label>
    <h2 class="sec sep-mucho">Descuentos y facilidades de pago</h2>
    <div class="row">
      <div class="field medio"><label>Descuento general (%)</label><input type="number" step="0.1" min="0" max="100" id="eDescPct" value="${c.descuento_pct??''}" placeholder="0"></div>
      <div class="field medio"><label>Código de descuento</label><input id="eCodigoDesc" value="${esc(c.codigo_descuento||'')}" placeholder="Ej. CEM10"></div>
      <div class="field largo"><label>Condición del descuento</label><input id="eDescNota" value="${esc(c.descuento_nota||'')}" placeholder="Pago de contado, pronto pago, alianza…"></div>
    </div>
    <label class="check" style="margin-bottom:12px"><input type="checkbox" id="eCuotasHab" ${c.cuotas_habilitadas?'checked':''}> Se acepta pago en cuotas</label>
    <div class="row" id="eCuotasCantidadWrap" style="display:${c.cuotas_habilitadas?'flex':'none'}">
      <div class="field medio"><label>Cantidad de cuotas</label><input type="number" min="2" id="eCuotasCantidad" value="${c.cuotas_cantidad||3}"></div>
    </div>
    <div class="field"><label>Métodos / pasarelas de pago aceptados</label>
      <div class="metodos-pago" id="eMetodosPago" style="display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:6px">
        ${METODOS_PAGO.map(mp=>`<label class="check"><input type="checkbox" data-metodo="${esc(mp)}" ${(c.metodos_pago||[]).includes(mp)?'checked':''}> ${esc(mp)}</label>`).join('')}
      </div>
    </div>`,
    footer:`<button class="btn outline" data-c>Cancelar</button><button class="btn" data-s>Guardar el programa</button>` });
  mejorarSelects(m);
  $('#eCuotasHab',m).onchange = () => { $('#eCuotasCantidadWrap',m).style.display = $('#eCuotasHab',m).checked ? 'flex' : 'none'; };
  $('[data-c]',m).onclick = m.close;
  portada.conectar(m);

  /* Se avisa mientras se escribe, no al guardar: pegar una dirección que no es
     de YouTube y enterarse tres pantallas después es cómo se acaba con una
     ficha en negro que nadie sabe por qué está en negro. */
  const notaIntro = () => {
    const v = $('#eIntro',m).value.trim();
    $('#notaIntro',m).textContent = !v ? ''
      : idDeYoutube(v) ? `Se guardará el vídeo ${idDeYoutube(v)}.`
      : 'Eso no parece una dirección de YouTube: pega la que copiaste del navegador.';
    $('#notaIntro',m).style.color = v && !idDeYoutube(v) ? 'var(--error)' : '';
  };
  $('#eIntro',m).oninput = notaIntro;
  notaIntro();

  $('[data-s]',m).onclick = async () => {
    const intro = $('#eIntro',m).value.trim();
    if (intro && !idDeYoutube(intro)){
      fail('El vídeo de presentación no es una dirección de YouTube válida.');
      return;
    }
    const metodosPago = $$('[data-metodo]',m).filter(x=>x.checked).map(x=>x.dataset.metodo);
    await run(sb.from('cem_courses').update({
      nombre:$('#eNombre',m).value.trim(), codigo:$('#eCodigo',m).value.trim()||null, subtitulo:$('#eSub',m).value.trim(),
      descripcion_corta:$('#eDesc',m).value.trim(), tipo:$('#eTipo',m).value, modalidad:$('#eMod',m).value,
      nivel:$('#eNivel',m).value, horas:Number($('#eHoras',m).value)||0, precio:Number($('#ePrecio',m).value)||0,
      categoria:$('#eCat',m).value.trim(), estado:$('#eEstado',m).value, imagen_url:portada.valor()||null,
      video_intro: intro ? idDeYoutube(intro) : null,
      destacado:$('#eDest',m).checked, updated_at:new Date().toISOString(),
      descuento_pct:$('#eDescPct',m).value?Number($('#eDescPct',m).value):null, descuento_nota:$('#eDescNota',m).value.trim()||null,
      codigo_descuento:$('#eCodigoDesc',m).value.trim().toUpperCase()||null,
      cuotas_habilitadas:$('#eCuotasHab',m).checked, cuotas_cantidad:$('#eCuotasHab',m).checked?Number($('#eCuotasCantidad',m).value)||null:null,
      metodos_pago:metodosPago.length?metodosPago:null,
    }).eq('id',c.id), 'No se pudo guardar');
    await audit('curso_actualizado','cem_courses',c.id,'medio',{nombre:$('#eNombre',m).value});
    m.close(); ok('Curso actualizado'); load();
  };
}
</script>
</body>
</html>
