<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Cursos y programas</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-14">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Cursos y programas</h1><p>Gestiona la oferta académica, contenidos y estado de publicación.</p></div>
    <div class="actions">
      <button class="btn outline" id="btnExport"><span class="material-symbols-outlined">download</span> Exportar</button>
      <a class="btn" href="curso-nuevo.html"><span class="material-symbols-outlined">add</span> Nuevo programa</a>
    </div>
  </div>

  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Nombre o código…"></div>
      <div class="field"><label>Tipo</label><select id="fTipo"><option value="">Todos</option>
        <option value="masterclass">Masterclass</option><option value="curso">Curso</option>
        <option value="programa">Programa</option><option value="diplomado">Diplomado</option><option value="maestria">Maestría</option></select></div>
      <div class="field"><label>Modalidad</label><select id="fMod"><option value="">Todas</option>
        <option value="online">Online</option><option value="en_vivo">En vivo</option>
        <option value="presencial">Presencial</option><option value="hibrido">Híbrido</option></select></div>
      <div class="field"><label>Nivel</label><select id="fNivel"><option value="">Todos</option>
        <option value="basico">Básico</option><option value="intermedio">Intermedio</option><option value="avanzado">Avanzado</option></select></div>
      <div class="field"><label>Estado</label><select id="fEstado"><option value="">Todos</option>
        <option value="publicado">Publicado</option><option value="borrador">Borrador</option>
        <option value="en_revision">En revisión</option><option value="pausado">Pausado</option><option value="archivado">Archivado</option></select></div>
      <button class="btn ghost" id="btnClear">Limpiar</button>
    </div>
    <div class="table-wrap">
      <table><thead><tr><th>Curso</th><th>Tipo</th><th>Modalidad</th><th>Nivel</th><th>Horas</th><th>Precio</th>
        <th>Alumnos</th><th>Avance prom.</th><th>Estado</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table>
    </div>
  </div>
</div>

<script type="module">
import { sb, mount, $, $$, esc, chip, bar, money, num, pct, emptyRow, match, toCSV, download, ok, fail, modal, confirmDialog, run, audit, mejorarSelects, subirImagenCurso } from '../assets/app.js?v=2026-08-14';

const p = await mount({ require:['coordinador','admin','superadmin','auditor'], active:'cursos.html', area:'admin' });
const editable = p && ['coordinador','admin','superadmin'].includes(p.rol);
const METODOS_PAGO = ['Transferencia bancaria','Tarjeta de crédito/débito','Zelle','PayPal','Pago móvil','Efectivo'];
let rows = [], categorias = [];
if (p) { load(); sb.from('cem_categorias').select('nombre').eq('activo',true).order('orden').then(({data})=>categorias=data||[]); }

async function load(){
  const { data } = await sb.from('cem_courses').select('*').order('created_at',{ascending:false});
  const { data: ens } = await sb.from('cem_enrollments').select('course_id,progreso').limit(500);
  const agg = {};
  (ens||[]).forEach(e => { (agg[e.course_id] ||= { n:0, s:0 }); agg[e.course_id].n++; agg[e.course_id].s += Number(e.progreso)||0; });
  rows = (data||[]).map(c => ({ ...c, _alumnos: agg[c.id]?.n||0, _avance: agg[c.id]? agg[c.id].s/agg[c.id].n : 0 }));
  render();
}

function render(){
  const q = $('#q').value.trim(), t = $('#fTipo').value, m = $('#fMod').value, n = $('#fNivel').value, e = $('#fEstado').value;
  const list = rows.filter(r => match(r,q,['nombre','codigo','categoria'])
    && (!t||r.tipo===t) && (!m||r.modalidad===m) && (!n||r.nivel===n) && (!e||r.estado===e));
  $('#tb').innerHTML = list.length ? list.map(r => `<tr>
    <td class="wrap"><b>${esc(r.nombre)}</b><div class="tiny muted">${esc(r.codigo||'')} · ${esc(r.categoria||'')}</div></td>
    <td>${chip(r.tipo,'neutral')}</td><td>${esc(r.modalidad.replace('_',' '))}</td><td>${esc(r.nivel)}</td>
    <td>${r.horas||0} h</td><td>${money(r.precio)}</td><td>${num(r._alumnos)}</td>
    <td style="min-width:110px">${bar(r._avance)}<span class="tiny muted">${pct(r._avance)}</span></td>
    <td>${chip(r.estado)}</td>
    <td style="white-space:nowrap">
      <a class="btn ghost sm" href="contenido.html?curso=${r.id}" title="Contenidos"><span class="material-symbols-outlined">import_contacts</span></a>
      <a class="btn ghost sm" href="cohortes.html?curso=${r.id}" title="Cohortes"><span class="material-symbols-outlined">groups</span></a>
      ${editable?`<button class="btn ghost sm" data-edit="${r.id}" title="Editar"><span class="material-symbols-outlined">edit</span></button>`:''}
    </td></tr>`).join('') : emptyRow(10);
  $$('[data-edit]').forEach(b => b.onclick = () => edit(rows.find(x => x.id === b.dataset.edit)));
}

['#q','#fTipo','#fMod','#fNivel','#fEstado'].forEach(s => { const el=$(s); el.oninput = render; el.onchange = render; });
$('#btnClear').onclick = () => { ['#q','#fTipo','#fMod','#fNivel','#fEstado'].forEach(s=>$(s).value=''); render(); };
$('#btnExport').onclick = () => download('cursos_cem.csv', toCSV(rows.map(({_alumnos,_avance,...r})=>({...r, alumnos:_alumnos}))));

function edit(c){
  const m = modal({ title:`Editar: ${c.nombre}`, wide:true, body:`
    <div class="row"><div class="field" style="flex:2;min-width:220px"><label>Nombre</label><input id="eNombre" value="${esc(c.nombre)}"></div>
      <div class="field" style="flex:1;min-width:120px"><label>Código</label><input id="eCodigo" value="${esc(c.codigo||'')}"></div></div>
    <div class="field"><label>Subtítulo</label><input id="eSub" value="${esc(c.subtitulo||'')}"></div>
    <div class="field"><label>Descripción corta</label><textarea id="eDesc" style="min-height:60px">${esc(c.descripcion_corta||'')}</textarea></div>
    <div class="row">
      <div class="field" style="flex:1;min-width:140px"><label>Tipo</label><select id="eTipo">
        ${['masterclass','curso','programa','diplomado','maestria'].map(v=>`<option ${c.tipo===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field" style="flex:1;min-width:140px"><label>Modalidad</label><select id="eMod">
        ${['online','en_vivo','presencial','hibrido'].map(v=>`<option ${c.modalidad===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field" style="flex:1;min-width:120px"><label>Nivel</label><select id="eNivel">
        ${['basico','intermedio','avanzado'].map(v=>`<option ${c.nivel===v?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1;min-width:110px"><label>Horas</label><input type="number" id="eHoras" value="${c.horas||0}"></div>
      <div class="field" style="flex:1;min-width:110px"><label>Precio</label><input type="number" step="0.01" id="ePrecio" value="${c.precio||0}"></div>
      <div class="field" style="flex:1;min-width:130px"><label>Categoría</label><select id="eCat">
        ${categorias.map(cat=>`<option value="${esc(cat.nombre)}" ${c.categoria===cat.nombre?'selected':''}>${esc(cat.nombre)}</option>`).join('') || `<option value="${esc(c.categoria||'')}">${esc(c.categoria||'Sin categorías definidas')}</option>`}</select></div>
      <div class="field" style="flex:1;min-width:140px"><label>Estado</label><select id="eEstado">
        ${['borrador','en_revision','publicado','pausado','archivado'].map(v=>`<option ${c.estado===v?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Imagen de portada</label>
      <div class="row" style="gap:8px;align-items:center">
        <input id="eImg" value="${esc(c.imagen_url||'')}" style="flex:1">
        <button type="button" class="btn outline sm" id="eBtnImg"><span class="material-symbols-outlined">add_photo_alternate</span> Subir foto</button>
        <input type="file" id="eImgArchivo" accept="image/*" class="hidden">
      </div>
      <img loading="lazy" decoding="async" id="eImgPreview" src="${esc(c.imagen_url||'')}" style="margin-top:8px;width:160px;height:90px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--outline-variant);${c.imagen_url?'':'display:none'}">
    </div>
    <label class="check"><input type="checkbox" id="eDest" ${c.destacado?'checked':''}> Destacado en el catálogo</label>
    <h2 class="sec" style="margin-top:18px">Descuentos y facilidades de pago</h2>
    <div class="row">
      <div class="field" style="flex:1;min-width:150px"><label>Descuento general (%)</label><input type="number" step="0.1" min="0" max="100" id="eDescPct" value="${c.descuento_pct??''}" placeholder="0"></div>
      <div class="field" style="flex:1;min-width:150px"><label>Código de descuento</label><input id="eCodigoDesc" value="${esc(c.codigo_descuento||'')}" placeholder="Ej. CEM10"></div>
      <div class="field" style="flex:2;min-width:220px"><label>Condición del descuento</label><input id="eDescNota" value="${esc(c.descuento_nota||'')}" placeholder="Pago de contado, pronto pago, alianza…"></div>
    </div>
    <label class="check" style="margin-bottom:12px"><input type="checkbox" id="eCuotasHab" ${c.cuotas_habilitadas?'checked':''}> Se acepta pago en cuotas</label>
    <div class="row" id="eCuotasCantidadWrap" style="display:${c.cuotas_habilitadas?'flex':'none'}">
      <div class="field" style="flex:1;min-width:150px"><label>Cantidad de cuotas</label><input type="number" min="2" id="eCuotasCantidad" value="${c.cuotas_cantidad||3}"></div>
    </div>
    <div class="field"><label>Métodos / pasarelas de pago aceptados</label>
      <div class="metodos-pago" id="eMetodosPago" style="display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:6px">
        ${METODOS_PAGO.map(mp=>`<label class="check"><input type="checkbox" data-metodo="${esc(mp)}" ${(c.metodos_pago||[]).includes(mp)?'checked':''}> ${esc(mp)}</label>`).join('')}
      </div>
    </div>`,
    footer:`<button class="btn outline" data-c>Cancelar</button><button class="btn" data-s>Guardar</button>` });
  mejorarSelects(m);
  $('#eCuotasHab',m).onchange = () => { $('#eCuotasCantidadWrap',m).style.display = $('#eCuotasHab',m).checked ? 'flex' : 'none'; };
  $('[data-c]',m).onclick = m.close;
  $('#eBtnImg',m).onclick = () => $('#eImgArchivo',m).click();
  $('#eImgArchivo',m).onchange = async () => {
    const file = $('#eImgArchivo',m).files[0];
    if (!file) return;
    try {
      const url = await subirImagenCurso(file);
      $('#eImg',m).value = url; $('#eImgPreview',m).src = url; $('#eImgPreview',m).style.display = 'block';
      ok('Imagen subida');
    } catch (e) { fail(e.message || 'No se pudo subir la imagen.'); }
  };
  $('[data-s]',m).onclick = async () => {
    const metodosPago = $$('[data-metodo]',m).filter(x=>x.checked).map(x=>x.dataset.metodo);
    await run(sb.from('cem_courses').update({
      nombre:$('#eNombre',m).value.trim(), codigo:$('#eCodigo',m).value.trim()||null, subtitulo:$('#eSub',m).value.trim(),
      descripcion_corta:$('#eDesc',m).value.trim(), tipo:$('#eTipo',m).value, modalidad:$('#eMod',m).value,
      nivel:$('#eNivel',m).value, horas:Number($('#eHoras',m).value)||0, precio:Number($('#ePrecio',m).value)||0,
      categoria:$('#eCat',m).value.trim(), estado:$('#eEstado',m).value, imagen_url:$('#eImg',m).value.trim()||null,
      destacado:$('#eDest',m).checked, updated_at:new Date().toISOString(),
      descuento_pct:$('#eDescPct',m).value?Number($('#eDescPct',m).value):null, descuento_nota:$('#eDescNota',m).value.trim()||null,
      codigo_descuento:$('#eCodigoDesc',m).value.trim().toUpperCase()||null,
      cuotas_habilitadas:$('#eCuotasHab',m).checked, cuotas_cantidad:$('#eCuotasHab',m).checked?Number($('#eCuotasCantidad',m).value)||null:null,
      metodos_pago:metodosPago.length?metodosPago:null,
    }).eq('id',c.id), 'No se pudo guardar');
    await audit('curso_actualizado','cem_courses',c.id,'medio',{nombre:$('#eNombre',m).value});
    m.close(); ok('Curso actualizado'); load();
  };
}
</script>
</body>
</html>
