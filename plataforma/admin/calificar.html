<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Calificar entregas</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-16">
<style>
  .grader{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;align-items:start;}
  @media(max-width:900px){ .grader{grid-template-columns:1fr;} }
  .sub-item{display:flex;gap:10px;align-items:center;padding:10px;border-radius:var(--r);cursor:pointer;}
  .sub-item:hover{background:var(--hueco);}
  .sub-item.on{background:var(--secondary-container);}
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Calificar entregas <button type="button" class="ayuda-btn" data-ayuda="Las de opción múltiple se corrigen solas; aquí llegan las que hay que leer. Al poner la nota, el estudiante la ve al instante y su avance se recalcula.">?</button></h1><p id="sub">Revisa y califica las entregas de los estudiantes.</p></div>
    <div class="actions">
      <div class="field" style="margin:0;min-width:220px"><select id="fAssess"><option value="">Todas las evaluaciones</option></select></div>
    </div>
  </div>
  <div class="grader">
    <div class="card" style="max-height:78vh;overflow:auto">
      <div class="tabs" style="margin-bottom:10px">
        <button class="active" data-f="pend">Por calificar (<span id="nPend">0</span>)</button>
        <button data-f="done">Calificadas</button>
      </div>
      <div id="lista"></div>
    </div>
    <div id="detalle"></div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, fdatetime, initials, ok, run, qs, audit, modal, mensajeError, chipEstado, avisar } from '../assets/app.js?v=2026-08-16';
const p = await mount({ require:['coordinador','admin','superadmin','profesor','auditor'], active:'calificar.html', area:'admin' });
const puede = p && ['coordinador','admin','superadmin','profesor'].includes(p.rol);
let subs=[], filtro='pend', sel=null;
if (p) load();

async function load(){
  const { data: as } = await sb.from('cem_assessments').select('id,nombre').order('nombre');
  $('#fAssess').innerHTML = '<option value="">Todas las evaluaciones</option>' +
    (as||[]).map(a=>`<option value="${a.id}">${esc(a.nombre)}</option>`).join('');
  if (qs('assessment')) $('#fAssess').value = qs('assessment');
  await fetchSubs();
}
$('#fAssess').onchange = fetchSubs;

async function fetchSubs(){
  let q = sb.from('cem_submissions')
    .select('*,cem_assessments(nombre,tipo,puntaje_max,nota_aprobatoria,cem_courses(nombre)),cem_enrollments(profile_id,cem_profiles!cem_enrollments_profile_id_fkey(nombre,apellido,email))')
    .in('estado',['entregada','calificada']).order('entregado_en',{ascending:false});
  const a = $('#fAssess').value; if (a) q = q.eq('assessment_id',a);
  const { data } = await q;
  subs = data||[];
  sel = null;
  render();
}

$$('[data-f]').forEach(b=>b.onclick=()=>{ $$('[data-f]').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  filtro=b.dataset.f; sel=null; render(); });

function render(){
  const pend = subs.filter(s=>s.estado==='entregada');
  $('#nPend').textContent = pend.length;
  const list = filtro==='pend'? pend : subs.filter(s=>s.estado==='calificada');
  $('#sub').textContent = `${pend.length} entrega(s) por calificar · ${subs.length} en total`;
  $('#lista').innerHTML = list.length ? list.map(s=>{
    const pr = s.cem_enrollments?.cem_profiles;
    return `<div class="sub-item ${sel?.id===s.id?'on':''}" data-s="${s.id}">
      <span class="avatar">${initials(pr?.nombre,pr?.apellido)}</span>
      <div class="crece">
        <div style="font-weight:600;font-size:13px">${esc((pr?.nombre||'')+' '+(pr?.apellido||''))}</div>
        <div class="tiny muted">${esc(s.cem_assessments?.nombre||'')}</div>
        <div class="tiny muted">${fdatetime(s.entregado_en)}</div>
      </div>
      ${s.estado==='calificada'? `<span class="chip ${s.puntaje>=(s.cem_assessments?.nota_aprobatoria||70)?'ok':'err'}">${s.puntaje}</span>`
        : s.tarde? chip('tarde','err') : chip('pendiente','warn')}</div>`;
  }).join('') : '<p class="muted tiny">Nada por aquí.</p>';
  $$('[data-s]').forEach(el=>el.onclick=()=>{ sel = subs.find(s=>s.id===el.dataset.s); render(); });
  detalle();
}

function detalle(){
  const D=$('#detalle');
  if (!sel){ D.innerHTML = `<div class="card" style="text-align:center;padding:44px">
    <span class="material-symbols-outlined" style="font-size:42px;color:var(--outline)">grading</span>
    <h3>Selecciona una entrega</h3><p class="muted tiny">Elige un estudiante de la lista para revisar su entrega.</p></div>`; return; }
  const s=sel, pr=s.cem_enrollments?.cem_profiles, a=s.cem_assessments;
  const resp = s.respuestas||{};
  D.innerHTML = `<div class="card">
    <div class="row between">
      <div><h2 class="sec" style="margin:0 0 3px">${esc((pr?.nombre||'')+' '+(pr?.apellido||''))}</h2>
        <div class="tiny muted">${esc(pr?.email||'')} · ${esc(a?.nombre||'')} · intento ${s.intento}</div></div>
      <div class="row">${chipEstado(s.estado)}${s.tarde?chip('entrega tardía','err'):''}</div>
    </div>
    <div class="tiny muted sep-poco">${esc(a?.cem_courses?.nombre||'')} · entregado ${fdatetime(s.entregado_en)}</div>

    ${Object.keys(resp).length? `<div class="card" style="background:var(--surface-container);box-shadow:none;margin-top:14px">
      <b class="tiny">Respuestas del estudiante</b>
      <div id="respWrap" style="margin-top:8px"></div></div>`
      : '<p class="muted tiny sep">Esta entrega no tiene respuestas registradas (posible entrega de archivo).</p>'}
    ${s.archivo_url? `<a class="btn outline sm" href="${esc(s.archivo_url)}" target="_blank" style="margin-top:10px">
      <span class="material-symbols-outlined">attach_file</span> Ver archivo entregado</a>`:''}

    ${puede? `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--outline-variant)">
      <div class="row">
        <div class="field medio"><label>Puntaje (máx. ${a?.puntaje_max||100}) *</label>
          <input type="number" id="gP" min="0" max="${a?.puntaje_max||100}" value="${s.puntaje??''}" required></div>
        <div class="field medio"><label>Referencia</label>
          <div class="tiny muted" style="padding-top:8px">Nota aprobatoria: <b>${a?.nota_aprobatoria||70}</b></div></div>
      </div>
      <div class="field"><label>Retroalimentación para el estudiante</label><textarea id="gF">${esc(s.feedback||'')}</textarea></div>
      <div class="row"><button class="btn" id="btnG"><span class="material-symbols-outlined">save</span>
        ${s.estado==='calificada'?'Actualizar calificación':'Guardar calificación'}</button>
        <button class="btn outline" id="btnSig">Guardar y siguiente <span class="material-symbols-outlined">arrow_forward</span></button>
        <button class="btn ghost" id="btnReabrir" style="color:var(--error)">
          <span class="material-symbols-outlined">undo</span> Devolver para corregir</button></div>
    </div>` : (s.feedback? `<div class="card sep"><b class="tiny">Retroalimentación</b>
        <p class="tiny" style="margin:6px 0 0">${esc(s.feedback)}</p></div>` : '')}
  </div>`;

  if (Object.keys(resp).length){
    (async () => {
      const { data: aq } = await sb.from('cem_assessment_questions')
        .select('orden,puntaje,cem_questions(id,enunciado,tipo,respuesta_correcta)')
        .eq('assessment_id',s.assessment_id).order('orden');
      $('#respWrap').innerHTML = (aq||[]).map((x,i)=>{
        const q=x.cem_questions, dada=resp[q.id];
        const objetiva = ['multiple','verdadero_falso'].includes(q.tipo);
        const correcta = objetiva && String(dada)===String(q.respuesta_correcta).replace(/^"|"$/g,'');
        return `<div style="padding:8px 0;border-bottom:1px solid var(--outline-variant)">
          <div class="tiny negrita">${i+1}. ${esc(q.enunciado)}</div>
          <div class="tiny" style="margin-top:3px">Respuesta: <b>${esc(String(dada??'— sin responder'))}</b>
            ${objetiva? (correcta? '<span class="chip ok">correcta</span>'
              : `<span class="chip err">incorrecta</span> <span class="muted">esperada: ${esc(String(q.respuesta_correcta).replace(/^"|"$/g,''))}</span>`) : '<span class="chip info">abierta</span>'}</div>
        </div>`;
      }).join('');
    })();
  }

  if (puede){
    const guardar = async () => {
      const v=Number($('#gP').value);
      if (isNaN(v)) return null;
      await run(sb.rpc('cem_grade_submission',{ p_submission_id:s.id, p_puntaje:v, p_feedback:$('#gF').value.trim()||null }),'No se pudo calificar');
      await audit('entrega_calificada','cem_submissions',s.id,'medio',{puntaje:v});
      return true;
    };
    $('#btnG').onclick = async () => { if (await guardar()){ ok('Calificación guardada'); await fetchSubs(); } };

    /* Devolver una entrega para que la corrijan. Antes esto sólo se podía
       hacer tocando la base a mano, así que en la práctica no se hacía.
       No tiene sentido ofrecerlo sobre algo que todavía no se entregó. */
    $('#btnReabrir').hidden = !s.entregado_en;
    $('#btnReabrir').onclick = () => {
      const m = modal({ title:'Devolver la entrega para corregir', body:`
        <p>Vuelve a quedar abierta y el estudiante puede enviarla de nuevo.
           El puntaje actual se borra y él recibe un aviso con tu motivo.</p>
        <div class="field"><label>¿Por qué la devuelves? *</label>
          <textarea id="rMotivo" rows="3" placeholder="Ej.: se envió sin el archivo adjunto." required></textarea></div>
        <div id="rMsg"></div>`,
        footer:`<button class="btn outline" data-x>Cancelar</button>
                <button class="btn" data-s>Devolver</button>` });
      $('[data-s]',m).onclick = async () => {
        const motivo = $('#rMotivo',m).value.trim();
        if (motivo.length < 10) {
          avisar($('#rMsg', m), 'Escribe el motivo con una frase completa.', 'err');
          return;
        }
        const { error } = await sb.rpc('cem_reabrir_entrega',{ p_submission_id:s.id, p_motivo:motivo });
        if (error) { avisar($('#rMsg', m), mensajeError(error), 'err'); return; }
        m.close(); ok('Entrega devuelta. El estudiante ya recibió el aviso.'); await fetchSubs();
      };
    };
    $('#btnSig').onclick = async () => {
      if (!await guardar()) return;
      const pend = subs.filter(x=>x.estado==='entregada' && x.id!==s.id);
      ok('Calificación guardada');
      await fetchSubs();
      if (pend.length){ sel = subs.find(x=>x.id===pend[0].id) || null; render(); }
    };
  }
}
</script>
</body>
</html>
