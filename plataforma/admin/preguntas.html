<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Banco de preguntas</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-14">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Banco de preguntas</h1><p>Gestiona y reutiliza preguntas para evaluaciones y cuestionarios.</p></div>
    <div class="actions"><button class="btn" id="btnNueva"><span class="material-symbols-outlined">add_circle</span> Crear pregunta</button></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Texto de la pregunta…"></div>
      <div class="field"><label>Curso relacionado</label><select id="fCurso"><option value="">Todos</option></select></div>
      <div class="field"><label>Tipo</label><select id="fTipo"><option value="">Todos</option>
        <option value="multiple">Selección múltiple</option><option value="verdadero_falso">Verdadero/Falso</option>
        <option value="corta">Respuesta corta</option><option value="ensayo">Ensayo</option></select></div>
      <div class="field"><label>Dificultad</label><select id="fDif"><option value="">Todas</option>
        <option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select></div>
      <button class="btn ghost" id="btnClear">Limpiar</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Pregunta</th><th>Tipo</th><th>Curso</th><th>Dificultad</th><th>Usos</th><th>% acierto</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table></div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, num, emptyRow, match, kpi, modal, ok, run, audit, confirmDialog, opciones, chipEstado, accionVacio } from '../assets/app.js?v=2026-08-14';
const p = await mount({ require:['coordinador','admin','superadmin','profesor','auditor'], active:'preguntas.html', area:'admin' });
const puede = p && ['coordinador','admin','superadmin','profesor'].includes(p.rol);
let rows=[], cursos=[];
if (p) load();

async function load(){
  const [{data},{data:cs}] = await Promise.all([
    sb.from('cem_questions').select('*,cem_courses(nombre)').order('created_at',{ascending:false}),
    sb.from('cem_courses').select('id,nombre').order('nombre'),
  ]);
  rows=data||[]; cursos=cs||[];
  $('#fCurso').innerHTML='<option value="">Todos</option>'+cursos.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
  const conUso = rows.filter(r=>r.usos>0);
  $('#kpis').innerHTML = [
    kpi('Preguntas', num(rows.length),'help_center','en el banco'),
    kpi('Selección múltiple', num(rows.filter(r=>r.tipo==='multiple').length),'radio_button_checked','objetivas'),
    kpi('Abiertas', num(rows.filter(r=>['corta','ensayo'].includes(r.tipo)).length),'edit_note','calificación manual'),
    kpi('Acierto promedio', conUso.length? Math.round(conUso.reduce((a,r)=>a+(100*r.aciertos/Math.max(r.usos,1)),0)/conUso.length)+'%':'—','target','en preguntas usadas'),
  ].join('');
  render();
}

function render(){
  const q=$('#q').value.trim(), c=$('#fCurso').value, t=$('#fTipo').value, d=$('#fDif').value;
  const list = rows.filter(r=>match(r,q,['enunciado','ayuda','cem_courses.nombre'])
    && (!c||r.course_id===c) && (!t||r.tipo===t) && (!d||r.dificultad===d));
  $('#tb').innerHTML = list.length ? list.map(r=>{
    const ac = r.usos? Math.round(100*r.aciertos/r.usos) : null;
    return `<tr>
      <td class="wrap" style="max-width:420px"><b>${esc(r.enunciado)}</b>
        ${(r.opciones||[]).length?`<div class="tiny muted">${(r.opciones||[]).length} opciones · correcta: ${esc(String(r.respuesta_correcta??'—').replace(/"/g,''))}</div>`:''}</td>
      <td>${chip(r.tipo.replace('_','/'),'neutral')}</td>
      <td class="wrap">${esc(r.cem_courses?.nombre||'—')}</td>
      <td>${chipEstado(r.dificultad)}</td><td>${num(r.usos)}</td>
      <td>${ac!=null?`<span class="chip ${ac>=70?'ok':ac>=40?'warn':'err'}">${ac}%</span>`:'—'}</td>
      <td style="white-space:nowrap">
        ${puede?`<button class="btn ghost sm" data-e="${r.id}" title="Editar la pregunta"><span class="material-symbols-outlined">edit</span></button>
        <button class="btn ghost sm" data-dup="${r.id}" title="Duplicar"><span class="material-symbols-outlined">content_copy</span></button>
        <button class="btn ghost sm" data-d="${r.id}" style="color:var(--error)" title="Borrar la pregunta"><span class="material-symbols-outlined">delete</span></button>`:''}
      </td></tr>`;
  }).join('') : emptyRow(7, 'El banco de preguntas está vacío. Las preguntas se reutilizan entre evaluaciones.', {texto:'Crear la primera pregunta', id:'vacioPreg', icono:'help_center'});
  $$('[data-e]').forEach(b=>b.onclick=()=>form(rows.find(r=>r.id===b.dataset.e)));
  $$('[data-dup]').forEach(b=>b.onclick=()=>{ const r=rows.find(x=>x.id===b.dataset.dup);
    form({...r, id:null, enunciado:r.enunciado+' (copia)', usos:0, aciertos:0}); });
  $$('[data-d]').forEach(b=>b.onclick=async()=>{
    if (!await confirmDialog('¿Eliminar esta pregunta del banco? Se quitará de las evaluaciones que la usen.')) return;
    await run(sb.from('cem_questions').delete().eq('id',b.dataset.d),'No se pudo eliminar');
    await audit('pregunta_eliminada','cem_questions',b.dataset.d,'medio',{}); ok('Pregunta eliminada'); load();
  });
}
['#q','#fCurso','#fTipo','#fDif'].forEach(s=>{const el=$(s); el.oninput=render; el.onchange=render;});
$('#btnClear').onclick=()=>{['#q','#fCurso','#fTipo','#fDif'].forEach(s=>$(s).value=''); render();};
$('#btnNueva').onclick=()=>form(null);
accionVacio('vacioPreg', () => form(null));

function form(q){
  const isNew=!q?.id;
  const opts = (q?.opciones||['','','','']);
  const dlg = modal({ title:isNew?'Crear pregunta':'Editar pregunta', wide:true, body:`
    <div class="field"><label>Enunciado *</label><textarea id="qE" style="min-height:70px" required>${esc(q?.enunciado||'')}</textarea></div>
    <div class="field"><label>Texto de ayuda (opcional)</label><input id="qA" value="${esc(q?.ayuda||'')}"></div>
    <div class="row">
      <div class="field" style="flex:2;min-width:200px"><label>Curso relacionado</label><select id="qC"><option value="">Sin curso</option>
        ${cursos.map(c=>`<option value="${c.id}" ${q?.course_id===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
      <div class="field" style="flex:1;min-width:160px"><label>Tipo *</label><select id="qT" required>
        ${['multiple','verdadero_falso','corta','ensayo'].map(v=>`<option value="${v}" ${q?.tipo===v?'selected':''}>${v.replace('_','/')}</option>`).join('')}</select></div>
      <div class="field" style="flex:1;min-width:130px"><label>Dificultad</label><select id="qD">
        ${opciones(['baja','media','alta'], q?.dificultad)}</select></div>
    </div>
    <div id="opcWrap"></div>
    <div class="field"><label>Explicación de la respuesta</label><textarea id="qX" style="min-height:60px">${esc(q?.explicacion||'')}</textarea></div>`,
    footer:`<button class="btn outline" data-x>Cancelar</button><button class="btn" data-s>Guardar la pregunta</button>` });

  const renderOpts = () => {
    const t = $('#qT',dlg).value;
    const W = $('#opcWrap',dlg);
    if (t==='multiple'){
      W.innerHTML = `<label class="tiny" style="font-weight:600;color:var(--on-surface-variant)">Opciones y respuesta correcta *</label>
        <div class="stack" style="margin-top:6px">${[0,1,2,3].map(i=>`<div class="row" style="gap:8px;flex-wrap:nowrap">
          <input type="radio" name="corr" data-corr="${i}" ${String(q?.respuesta_correcta??'').replace(/"/g,'')===opts[i]?'checked':''}>
          <input class="inp" data-o="${i}" value="${esc(opts[i]||'')}" placeholder="Opción ${i+1}"></div>`).join('')}</div>`;
    } else if (t==='verdadero_falso'){
      const cv = String(q?.respuesta_correcta??'').replace(/"/g,'');
      W.innerHTML = `<div class="field"><label>Respuesta correcta *</label><select id="qVF" required>
        <option value="Verdadero" ${cv==='Verdadero'?'selected':''}>Verdadero</option>
        <option value="Falso" ${cv==='Falso'?'selected':''}>Falso</option></select></div>`;
    } else {
      W.innerHTML = `<p class="tiny muted">Las preguntas abiertas las califica manualmente un profesor.</p>`;
    }
  };
  renderOpts(); $('#qT',dlg).onchange = renderOpts;

  $('[data-x]',dlg).onclick=dlg.close;
  $('[data-s]',dlg).onclick=async()=>{
    const t=$('#qT',dlg).value;
    let opciones=[], correcta=null;
    if (t==='multiple'){
      opciones = $$('[data-o]',dlg).map(i=>i.value.trim()).filter(Boolean);
      const ci = $$('[data-corr]',dlg).findIndex(r=>r.checked);
      if (opciones.length<2){ return; }
      if (ci<0){ return; }
      correcta = $$('[data-o]',dlg)[ci].value.trim();
    } else if (t==='verdadero_falso'){
      opciones=['Verdadero','Falso']; correcta=$('#qVF',dlg).value;
    }
    const payload = { enunciado:$('#qE',dlg).value.trim(), ayuda:$('#qA',dlg).value.trim()||null,
      course_id:$('#qC',dlg).value||null, tipo:t, dificultad:$('#qD',dlg).value,
      opciones, respuesta_correcta: correcta!=null? correcta : null,
      explicacion:$('#qX',dlg).value.trim()||null };
    if (!payload.enunciado) return;
    if (isNew) await run(sb.from('cem_questions').insert(payload),'No se pudo crear');
    else await run(sb.from('cem_questions').update(payload).eq('id',q.id),'No se pudo guardar');
    await audit(isNew?'pregunta_creada':'pregunta_actualizada','cem_questions',q?.id,'bajo',{});
    dlg.close(); ok(isNew?'Pregunta creada':'Pregunta actualizada'); load();
  };
}
</script>
</body>
</html>
