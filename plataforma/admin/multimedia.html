<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Biblioteca multimedia</title>
<!-- El logotipo, para cada quien lo pida: .ico para Google y lo viejo,
     PNG para todo lo demás, SVG para quien prefiera un vector, y el de 180
     para el iPhone. Ver herramientas/iconos.mjs. -->
<link rel="icon" href="/favicon.ico?v=2026-09-03" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="../assets/favicon-96.png?v=2026-09-03">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2026-09-03">
<link rel="apple-touch-icon" href="../assets/icono-180.png?v=2026-09-03">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d2440">
<!-- Los cuatro servidores de fuera, avisados de golpe y no en fila.
     Sin esto el navegador descubre cada uno cuando le toca, y paga el
     DNS y el saludo TLS de cada cual por separado, con la pantalla en
     blanco mientras tanto. Ver herramientas/acelerar-cabeceras.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://vajbsfgojtunamhrzrpf.supabase.co" crossorigin>
<link rel="modulepreload" href="../assets/app.js?v=2026-09-03-7">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-09-03-7">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Gestor multimedia</h1><p>Material que se reparte entre programas: se sube una vez aquí y se engancha a la lección que lo necesite.</p></div>
    <div class="actions">
      <div class="row" style="gap:4px">
        <button class="btn ghost sm" id="vGrid" title="Cuadrícula" aria-label="Cuadrícula"><span class="material-symbols-outlined" aria-hidden="true">grid_view</span></button>
        <button class="btn ghost sm" id="vList" title="Lista" aria-label="Lista"><span class="material-symbols-outlined" aria-hidden="true">view_list</span></button>
      </div>
      <button class="btn" id="btnNuevo"><span class="material-symbols-outlined" aria-hidden="true">cloud_upload</span> Agregar recurso</button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Nombre del archivo…"></div>
    </div>
    <details class="filtros-plegables" id="masFiltros">
      <summary><span class="material-symbols-outlined">tune</span> Filtrar por programa, formato o visibilidad
        <span class="chip neutral" id="nFiltros" hidden></span></summary>
      <div class="filters">
        <div class="field"><label>Curso</label><select id="fCurso"><option value="">Todos</option></select></div>
        <div class="field"><label>Formato</label><select id="fTipo"><option value="">Todos</option>
        <option value="pdf">PDF</option><option value="excel">Excel</option><option value="video">Video</option>
        <option value="imagen">Imagen</option><option value="enlace">Enlace</option></select></div>
        <div class="field"><label>Visibilidad</label><select id="fPub"><option value="">Todas</option>
        <option value="1">Pública</option><option value="0">Restringida</option></select></div>
      </div>
    </details>
  </div>
  <div id="cont"></div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, num, fdate, emptyRow, match, kpi, modal, ok, fail, run, audit,
         confirmDialog, abrirSubidaVideo, campoArchivo, subirDocumentoLeccion, opciones, etiqueta,
         chipEstado, ayuda, montarAyudas, mejorarSelects, accionVacio,
         previaDeMaterial, iconoDeMaterial, conectarFiltros } from '../assets/app.js?v=2026-09-03-7';
const p = await mount({ require:['coordinador','admin','superadmin','profesor','auditor'], active:'multimedia.html', area:'admin' });
const puede = p && ['coordinador','admin','superadmin','profesor'].includes(p.rol);
let rows=[], cursos=[], mods=[], lecciones=[], vista='grid';
if (p) load();

async function load(){
  const [{data},{data:cs},{data:ms},{data:ls}] = await Promise.all([
    sb.from('cem_media').select('*,cem_courses(nombre)').order('created_at',{ascending:false}).limit(500),
    sb.from('cem_courses').select('id,nombre').order('nombre'),
    sb.from('cem_modules').select('id,course_id,titulo').order('orden'),
    sb.from('cem_lessons').select('id,module_id,titulo').order('orden'),
  ]);
  rows=data||[]; cursos=cs||[]; mods=ms||[]; lecciones=ls||[];
  $('#fCurso').innerHTML='<option value="">Todos</option>'+cursos.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
  const totalMB = rows.reduce((a,r)=>a+Number(r.tamano_bytes||0),0)/1048576;
  $('#kpis').innerHTML = [
    kpi('Archivos', num(rows.length),'perm_media','en la biblioteca'),
    kpi('Almacenamiento', totalMB>1024?(totalMB/1024).toFixed(1)+' GB':totalMB.toFixed(0)+' MB','cloud','uso estimado'),
    kpi('Videos', num(rows.filter(r=>r.tipo==='video').length),'play_circle','material audiovisual'),
    kpi('Públicos', num(rows.filter(r=>r.publico).length),'public','sin restricción'),
  ].join('');
  render();
}

/* Los iconos de material los decide app.js, para que la biblioteca del equipo
   y la del estudiante no acaben poniéndole dos iconos distintos al mismo
   archivo. Aquí sólo se le pasa además la dirección, que muchas veces sabe
   más que el tipo guardado —«.xlsx» es una hoja aunque nadie lo marcara—. */
const ico = (t, url) => iconoDeMaterial(t, url);
const ubicacion = m => [m.cem_courses?.nombre, mods.find(x=>x.id===m.module_id)?.titulo, lecciones.find(x=>x.id===m.lesson_id)?.titulo]
  .filter(Boolean).join(' › ') || 'Sin curso';

/* item 17 · los filtros secundarios están plegados; esto dice cuántos hay
   puestos para no tener que abrirlos a mirar. */
function contarFiltros(valores){
  const n = valores.filter(Boolean).length;
  const señal = $('#nFiltros');
  if (!señal) return;
  señal.hidden = !n;
  señal.textContent = n;
}

function render(){
  const q=$('#q').value.trim(), c=$('#fCurso').value, t=$('#fTipo').value, pu=$('#fPub').value;
  contarFiltros([c,t,pu]);
  const list = rows.filter(r=>match(r,q,['nombre','descripcion','cem_courses.nombre'])
    && (!c||r.course_id===c) && (!t||r.tipo===t) && (pu===''||String(r.publico?1:0)===pu));

  if (vista==='grid'){
    $('#cont').innerHTML = `<div class="grid g3">${list.length? list.map(m=>`
      <div class="card sin-margen">
        ${previaDeMaterial({ tipo:m.tipo, url:m.url, nombre:m.nombre })}
        <div class="row between" style="align-items:flex-start">
          <span class="tiny muted">${esc(m.tipo||'archivo')}</span>
          ${m.publico?chip('pública','ok'):chip('restringida','warn')}</div>
        <div style="font-weight:600;margin-top:8px">${esc(m.nombre)}</div>
        <div class="tiny muted">${esc(ubicacion(m))} · ${(Number(m.tamano_bytes||0)/1048576).toFixed(1)} MB</div>
        <div class="row sep">
          ${m.url?`<a class="btn outline sm" href="${esc(m.url)}" target="_blank" title="Abrir el archivo" aria-label="Abrir el archivo"><span class="material-symbols-outlined" aria-hidden="true">open_in_new</span></a>`:''}
          ${puede?`<button class="btn ghost sm" data-e="${m.id}" title="Editar o mover el recurso" aria-label="Editar o mover el recurso"><span class="material-symbols-outlined" aria-hidden="true">edit</span></button>
          <button class="btn ghost sm" data-d="${m.id}" style="color:var(--error)" title="Borrar el recurso" aria-label="Borrar el recurso"><span class="material-symbols-outlined" aria-hidden="true">delete</span></button>`:''}
        </div></div>`).join('') : '<div class="card" style="grid-column:1/-1"><p class="muted">Sin archivos.</p></div>'}</div>`;
  } else {
    $('#cont').innerHTML = `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Archivo</th><th>Ubicación</th><th>Formato</th><th>Tamaño</th><th>Visibilidad</th><th>Subido</th><th></th></tr></thead>
      <tbody>${list.length? list.map(m=>`<tr>
        <td class="wrap"><div class="row" style="gap:8px;flex-wrap:nowrap">
          <span class="material-symbols-outlined">${ico(m.tipo, m.url)}</span><b>${esc(m.nombre)}</b></div></td>
        <td class="wrap">${esc(ubicacion(m))}</td><td>${esc(m.tipo)}</td>
        <td>${(Number(m.tamano_bytes||0)/1048576).toFixed(1)} MB</td>
        <td>${m.publico?chip('pública','ok'):chip('restringida','warn')}</td>
        <td class="muted">${fdate(m.created_at)}</td>
        <td class="nowrap">
          ${m.url?`<a class="btn ghost sm" href="${esc(m.url)}" target="_blank" title="Abrir el archivo" aria-label="Abrir el archivo"><span class="material-symbols-outlined" aria-hidden="true">open_in_new</span></a>`:''}
          ${puede?`<button class="btn ghost sm" data-e="${m.id}" title="Editar el recurso" aria-label="Editar el recurso"><span class="material-symbols-outlined" aria-hidden="true">edit</span></button>
          <button class="btn ghost sm" data-d="${m.id}" style="color:var(--error)" title="Borrar el recurso" aria-label="Borrar el recurso"><span class="material-symbols-outlined" aria-hidden="true">delete</span></button>`:''}
        </td></tr>`).join('') : emptyRow(7, 'La biblioteca está vacía. Aquí van los materiales que se reparten entre programas.', {texto:'Subir el primer recurso', id:'vacioMedia', icono:'upload_file'})}</tbody></table></div></div>`;
  }
  $$('[data-e]').forEach(b=>b.onclick=()=>form(rows.find(r=>r.id===b.dataset.e)));
  $$('[data-d]').forEach(b=>b.onclick=async()=>{
    if (!await confirmDialog('¿Eliminar este recurso de la biblioteca?')) return;
    await run(sb.from('cem_media').delete().eq('id',b.dataset.d),'No se pudo eliminar');
    await audit('media_eliminado','cem_media',b.dataset.d,'medio',{}); ok('Recurso eliminado'); load();
  });
}
conectarFiltros(['#q','#fCurso','#fTipo','#fPub'], render);
$('#vGrid').onclick=()=>{vista='grid';render();};
$('#vList').onclick=()=>{vista='list';render();};
$('#btnNuevo').onclick=()=>form(null);
accionVacio('vacioMedia', () => form(null));

function form(m){
  const isNew=!m;
  /* El formato y el tamaño los sabe el propio archivo: pedirlos a mano era
     pedir un dato que el programa tiene delante, y que además podía quedar mal. */
  let tamanoBytes = Number(m?.tamano_bytes) || 0;
  const archivo = campoArchivo({
    id:'rArch', tipo:'documento', valor: m?.url || '',
    subir: async (f) => {
      const r = await subirDocumentoLeccion(f);
      tamanoBytes = r.tamanoBytes;
      const dlgAhora = document.querySelector('.modal');
      if (dlgAhora) {
        const t = dlgAhora.querySelector('#rT'); if (t) t.value = r.tipo;
        const sz = dlgAhora.querySelector('#rS'); if (sz) sz.value = (r.tamanoBytes/1048576).toFixed(1)+' MB';
        const n = dlgAhora.querySelector('#rN'); if (n && !n.value.trim()) n.value = r.nombre.replace(/\.[^.]+$/,'');
      }
      return r.url;
    },
    etiquetaSubir:'Subir el archivo',
  });
  const dlg = modal({ title:isNew?'Agregar recurso':`Editar: ${m.nombre}`, body:`
    <div class="field"><label>Nombre *</label><input id="rN" value="${esc(m?.nombre||'')}" required></div>
    <div class="field"><label>Descripción</label><input id="rD" value="${esc(m?.descripcion||'')}"></div>
    <div class="field"><label>Archivo del recurso *</label>${archivo.html}
      <div class="row" style="margin-top:8px;align-items:center;gap:10px">
        <p class="tiny muted grow sin-margen">El formato y el tamaño se sacan del archivo: no hay que escribirlos.</p>
        <button class="btn outline sm" id="btnSubirVideoYT" type="button">
          <span class="material-symbols-outlined" aria-hidden="true">smart_display</span> Subir a YouTube</button>
      </div></div>
    <div class="row">
      <div class="field medio"><label>Formato</label><select id="rT">
        ${opciones(['pdf','excel','video','imagen','enlace'], m?.tipo)}</select></div>
      <div class="field medio"><label>Tamaño</label>
        <input id="rS" readonly value="${m?.tamano_bytes ? ((Number(m.tamano_bytes))/1048576).toFixed(1)+' MB' : '—'}"></div>
    </div>
    <div class="row">
      <div class="field medio"><label>Curso asociado</label><select id="rC"><option value="">Sin curso</option>
        ${cursos.map(c=>`<option value="${c.id}" ${m?.course_id===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
      <div class="field medio"><label>Módulo (opcional)</label><select id="rM"><option value="">Todo el curso</option></select></div>
      <div class="field medio"><label>Lección (opcional)</label><select id="rL"><option value="">Sin lección específica</option></select></div>
    </div>
    <p class="tiny muted" style="margin-top:-8px">Mueve o adjunta este recurso a un curso, módulo o lección específica; déjalos vacíos para que quede libre en la biblioteca.</p>
    <label class="check"><input type="checkbox" id="rP" ${m?.publico?'checked':''}> Visible para todos los estudiantes del curso</label>`,
    footer:`<button class="btn outline" data-x>Cancelar</button><button class="btn" data-s>Guardar el recurso</button>` });
  $('[data-x]',dlg).onclick=dlg.close;
  function pobM(){
    const list = mods.filter(x=>x.course_id===$('#rC',dlg).value);
    $('#rM',dlg).innerHTML = '<option value="">Todo el curso</option>' + list.map(x=>`<option value="${x.id}">${esc(x.titulo)}</option>`).join('');
    $('#rM',dlg).value = list.some(x=>x.id===m?.module_id) ? m.module_id : '';
  }
  function pobL(){
    const list = lecciones.filter(x=>x.module_id===$('#rM',dlg).value);
    $('#rL',dlg).innerHTML = '<option value="">Sin lección específica</option>' + list.map(x=>`<option value="${x.id}">${esc(x.titulo)}</option>`).join('');
    $('#rL',dlg).value = list.some(x=>x.id===m?.lesson_id) ? m.lesson_id : '';
  }
  pobM(); pobL();
  $('#rC',dlg).onchange = () => { pobM(); pobL(); };
  $('#rM',dlg).onchange = pobL;
  archivo.conectar(dlg);
  mejorarSelects(dlg);
  const btnYT = $('#btnSubirVideoYT',dlg);
  if (btnYT) btnYT.onclick=async()=>{
    const resultado = await abrirSubidaVideo({ tituloDefault: $('#rN',dlg).value.trim() });
    if (!resultado) return;
    archivo.fijar(resultado.embedUrl);
    tamanoBytes = resultado.tamanoBytes;
    $('#rT',dlg).value = 'video';
    $('#rS',dlg).value = (resultado.tamanoBytes/1048576).toFixed(1)+' MB';
    if (!$('#rN',dlg).value.trim()) $('#rN',dlg).value = resultado.nombreArchivo.replace(/\.[^.]+$/,'');
    ok('Vídeo subido a YouTube. Revisa y guarda el recurso.');
  };
  $('[data-s]',dlg).onclick=async()=>{
    const payload={ nombre:$('#rN',dlg).value.trim(), descripcion:$('#rD',dlg).value.trim(),
      tipo:$('#rT',dlg).value, tamano_bytes:tamanoBytes,
      url:archivo.valor(), course_id:$('#rC',dlg).value||null,
      module_id:$('#rM',dlg).value||null, lesson_id:$('#rL',dlg).value||null,
      publico:$('#rP',dlg).checked, subido_por:p.id };
    if (!payload.nombre) { fail('Ponle un nombre al recurso.'); return; }
    if (!payload.url) { fail('Sube el archivo o pega su dirección.'); return; }
    if (isNew) await run(sb.from('cem_media').insert(payload),'No se pudo agregar');
    else await run(sb.from('cem_media').update(payload).eq('id',m.id),'No se pudo guardar');
    await audit(isNew?'media_creado':'media_actualizado','cem_media',m?.id,'bajo',{nombre:payload.nombre});
    dlg.close(); ok(isNew?'Recurso agregado':'Recurso actualizado'); load();
  };
}
</script>
</body>
</html>
