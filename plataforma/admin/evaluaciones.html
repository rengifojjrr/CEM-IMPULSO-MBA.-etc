<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Gestión de evaluaciones</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-20">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Gestión de evaluaciones</h1><p>Los exámenes y tareas de cada programa: cuántos intentos permiten, con cuánto se aprueba y quién ya los rindió.</p></div>
    <div class="actions">
      <button class="btn outline" id="btnExport"><span class="material-symbols-outlined">download</span> Exportar</button>
      <a class="btn outline" href="preguntas.html"><span class="material-symbols-outlined">help_center</span> Banco de preguntas</a>
      <a class="btn" href="evaluacion-nueva.html"><span class="material-symbols-outlined">add</span> Nueva evaluación</a>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar por nombre <button type="button" class="ayuda-btn" data-ayuda="Busca por el nombre de la evaluación o el del programa al que pertenece.">?</button></label><input type="search" id="q"></div>
      <button class="btn ghost" id="btnClear">Limpiar los filtros</button>
    </div>
    <details class="filtros-plegables" id="masFiltros">
      <summary><span class="material-symbols-outlined">tune</span> Filtrar por programa, tipo o estado
        <span class="chip neutral" id="nFiltros" hidden></span></summary>
      <div class="filters">
        <div class="field"><label>Programa</label><select id="fCurso"><option value="">Todos</option></select></div>
        <div class="field"><label>Tipo</label><select id="fTipo"><option value="">Todos</option>
          <option value="examen">Examen</option><option value="quiz">Prueba rápida</option>
          <option value="practica">Actividad práctica</option><option value="ensayo">Ensayo</option></select></div>
        <div class="field"><label>Estado</label><select id="fEstado"><option value="">Todos</option>
          <option value="publicado">Publicado</option><option value="borrador">Borrador</option><option value="archivado">Archivado</option></select></div>
      </div>
    </details>
    <div class="table-wrap"><table id="tabla">
      <!-- De diez columnas a seis. Intentos, tiempo y tipo casi nunca deciden
           qué vas a hacer con una evaluación: viven en su ficha. -->
      <thead><tr><th data-ord="nombre">Evaluación</th><th data-ord="_curso">Programa</th>
        <th class="num" data-ord="_nq">Preguntas</th><th class="num" data-ord="_subs">Entregas</th>
        <th class="num" data-ord="_avg">Promedio</th><th data-ord="estado">Estado</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table></div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, num, emptyRow, match, kpi, ok, fail, run, audit, toCSV, download, confirmDialog, chipEstado, accionVacio, etiqueta, ordenable, ordenarPor, mensajeError } from '../assets/app.js?v=2026-08-20';
const p = await mount({ require:['coordinador','admin','superadmin','profesor','auditor'], active:'evaluaciones.html', area:'admin' });
accionVacio('vacioEval', () => location.href = 'evaluacion-nueva.html');
const puede = p && ['coordinador','admin','superadmin','profesor'].includes(p.rol);
let rows=[];
if (p) load();

async function load(){
  const [{data:as},{data:cs},{data:aq},{data:subs}] = await Promise.all([
    sb.from('cem_assessments').select('*,cem_courses(nombre)').order('created_at',{ascending:false}),
    sb.from('cem_courses').select('id,nombre').order('nombre'),
    sb.from('cem_assessment_questions').select('assessment_id'),
    sb.from('cem_submissions').select('assessment_id,puntaje,estado').limit(500),
  ]);
  $('#fCurso').innerHTML='<option value="">Todos</option>'+(cs||[]).map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
  const nq={}; (aq||[]).forEach(x=>nq[x.assessment_id]=(nq[x.assessment_id]||0)+1);
  const st={}; (subs||[]).forEach(s=>{ (st[s.assessment_id] ||= {n:0,sum:0,c:0,pend:0});
    st[s.assessment_id].n++; if(s.puntaje!=null){st[s.assessment_id].sum+=Number(s.puntaje); st[s.assessment_id].c++;}
    if(s.estado==='entregada') st[s.assessment_id].pend++; });
  rows = (as||[]).map(a=>({ ...a, _nq:nq[a.id]||0, _subs:st[a.id]?.n||0,
    _avg: st[a.id]?.c? st[a.id].sum/st[a.id].c : null, _pend: st[a.id]?.pend||0 }));
  $('#kpis').innerHTML = [
    kpi('Evaluaciones', num(rows.length),'quiz',`${rows.filter(r=>r.estado==='publicado').length} publicadas`),
    kpi('Entregas totales', num((subs||[]).length),'assignment_turned_in','histórico'),
    kpi('Por calificar', num((subs||[]).filter(s=>s.estado==='entregada').length),'grade','requieren revisión'),
    kpi('Promedio global', (()=>{ const c=(subs||[]).filter(s=>s.puntaje!=null);
      return c.length? (c.reduce((a,s)=>a+Number(s.puntaje),0)/c.length).toFixed(1) : '—'; })(),'trending_up','de todas las entregas'),
  ].join('');
  render();
}

/** item 26 · por qué columna se ordena la lista de evaluaciones. */
const ordenEvals = { campo:null, asc:true };

function render(){
  const q=$('#q').value.trim(), c=$('#fCurso').value, t=$('#fTipo').value, e=$('#fEstado').value;
  const list = ordenarPor(rows.filter(r=>match(r,q,['nombre','cem_courses.nombre'])
    && (!c||r.course_id===c) && (!t||r.tipo===t) && (!e||r.estado===e))
    .map(r=>({ ...r, _curso: r.cem_courses?.nombre||'' })), ordenEvals);
  const puestos = [c,t,e].filter(Boolean).length;
  $('#nFiltros').hidden = !puestos; $('#nFiltros').textContent = puestos;
  $('#tb').innerHTML = list.length ? list.map(r=>`<tr>
    <td class="wrap"><b>${esc(r.nombre)}</b>${r._pend?` <span class="chip warn">${r._pend} por calificar</span>`:''}
      <div class="tiny muted">${esc(etiqueta(r.tipo))} · ${r.intentos||1} intento(s) · ${r.tiempo_min?r.tiempo_min+' min':'sin límite de tiempo'}</div></td>
    <td class="wrap">${esc(r._curso)}</td>
    <td class="num">${num(r._nq)}</td>
    <td class="num">${num(r._subs)}</td><td class="num">${r._avg!=null?r._avg.toFixed(1):'—'}</td><td>${chipEstado(r.estado)}</td>
    <td class="nowrap">
      <a class="btn ghost sm" href="evaluacion-nueva.html?id=${r.id}" title="Editar las preguntas"><span class="material-symbols-outlined">edit</span></a>
      <a class="btn ghost sm" href="evaluacion-nueva.html?id=${r.id}#respuestas" title="Ver las respuestas y sus métricas"><span class="material-symbols-outlined">insights</span></a>
      <a class="btn ghost sm" href="calificar.html?assessment=${r.id}" title="Calificar"><span class="material-symbols-outlined">grade</span></a>
      ${puede?`<button class="btn ghost sm" data-pub="${r.id}" title="${r.estado==='publicado'?'Despublicar':'Publicar'}">
        <span class="material-symbols-outlined">${r.estado==='publicado'?'unpublished':'publish'}</span></button>`:''}
    </td></tr>`).join('') : emptyRow(7, 'Todavía no hay evaluaciones.', {texto:'Crear la primera evaluación', id:'vacioEval', icono:'quiz'});
  ordenable('#tabla', ordenEvals, render);
  $$('[data-pub]').forEach(b=>b.onclick=async()=>{
    const r=rows.find(x=>x.id===b.dataset.pub);
    const nuevo = r.estado==='publicado'?'borrador':'publicado';
    /* Publicar desde la lista tiene que pasar por la misma regla que publicar
       desde el constructor: si los puntajes no suman el total declarado, no
       sale. Antes este botón era la puerta de atrás. */
    if (nuevo==='publicado'){
      const { data: p, error: e } = await sb.rpc('cem_puntaje_evaluacion',{ p_assessment_id:r.id });
      if (e){ fail(mensajeError(e)); return; }
      if (!Number(p?.preguntas)){ fail('Esta evaluación no tiene preguntas todavía.'); return; }
      if (!p?.cuadra){
        fail(`Los puntajes suman ${p.total} y la evaluación es sobre ${p.maximo}. Ábrela y cuádralos antes de publicar.`);
        return;
      }
    }
    await run(sb.from('cem_assessments').update({estado:nuevo}).eq('id',r.id),'No se pudo actualizar');
    await audit('evaluacion_estado','cem_assessments',r.id,'medio',{estado:nuevo}); ok('Estado actualizado'); load();
  });
}
['#q','#fCurso','#fTipo','#fEstado'].forEach(s=>{const el=$(s); el.oninput=render; el.onchange=render;});
$('#btnClear').onclick=()=>{['#q','#fCurso','#fTipo','#fEstado'].forEach(s=>$(s).value=''); render();};
$('#btnExport').onclick=()=>download('evaluaciones_cem.csv', toCSV(rows.map(r=>({
  nombre:r.nombre, curso:r.cem_courses?.nombre, tipo:r.tipo, preguntas:r._nq,
  intentos:r.intentos, tiempo_min:r.tiempo_min, entregas:r._subs, promedio:r._avg, estado:r.estado }))));
</script>
</body>
</html>
