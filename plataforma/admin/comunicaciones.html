<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Comunicaciones</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-23-9">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Comunicaciones y anuncios</h1><p>Los avisos que ven los estudiantes al entrar. Se escriben aquí, se eligen a quiénes les llega y cuándo se publican.</p></div>
    <div class="actions"><button class="btn" id="btnNuevo"><span class="material-symbols-outlined">campaign</span> Nuevo anuncio</button></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs">
    <button class="active" data-t="">Todos</button>
    <button data-t="enviado">Enviados</button>
    <button data-t="programado">Programados</button>
    <button data-t="borrador">Borradores</button>
  </div>
  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Título o contenido…"></div>
      <div class="field"><label>Canal</label><select id="fCanal"><option value="">Todos</option>
        <option value="plataforma">Plataforma</option><option value="email">Correo</option><option value="ambos">Ambos</option></select></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Anuncio</th><th>Audiencia</th><th>Canal</th><th>Estado</th><th>Fecha</th><th>Autor</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table></div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, num, fdate, fdatetime, emptyRow, match, kpi, modal, ok, fail, run, audit, confirmDialog, opciones, chipEstado, accionVacio, mensajeError } from '../assets/app.js?v=2026-08-23-9';
const p = await mount({ require:['coordinador','admin','superadmin','profesor','auditor'], active:'comunicaciones.html', area:'admin' });
const puede = p && ['coordinador','admin','superadmin','profesor'].includes(p.rol);
let rows=[], cohortes=[], cursos=[], perfiles={}, filtro='';
if (p) load();

async function load(){
  const [{data},{data:cos},{data:cs},{data:ps}] = await Promise.all([
    sb.from('cem_announcements').select('*').order('created_at',{ascending:false}),
    sb.from('cem_cohorts').select('id,nombre,cem_courses(nombre)').order('nombre'),
    sb.from('cem_courses').select('id,nombre').order('nombre'),
    sb.from('cem_profiles').select('id,nombre,apellido').limit(500),
  ]);
  rows=data||[]; cohortes=cos||[]; cursos=cs||[];
  perfiles = Object.fromEntries((ps||[]).map(x=>[x.id,`${x.nombre} ${x.apellido||''}`.trim()]));
  $('#kpis').innerHTML = [
    kpi('Anuncios', num(rows.length),'campaign','en total'),
    kpi('Enviados', num(rows.filter(r=>r.estado==='enviado').length),'send','publicados'),
    kpi('Programados', num(rows.filter(r=>r.estado==='programado').length),'schedule','pendientes de envío'),
    kpi('Borradores', num(rows.filter(r=>r.estado==='borrador').length),'draft','sin publicar'),
  ].join('');
  render();
}
$$('#tabs button').forEach(b=>b.onclick=()=>{ $$('#tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); filtro=b.dataset.t; render(); });

function render(){
  const q=$('#q').value.trim(), c=$('#fCanal').value;
  const list = rows.filter(r=>match(r,q,['titulo','cuerpo']) && (!filtro||r.estado===filtro) && (!c||r.canal===c));
  $('#tb').innerHTML = list.length ? list.map(r=>{
    const dest = r.cohort_id? (cohortes.find(x=>x.id===r.cohort_id)?.nombre||'Cohorte')
      : r.course_id? (cursos.find(x=>x.id===r.course_id)?.nombre||'Curso') : (r.audiencia||'todos');
    return `<tr>
      <td class="wrap" style="max-width:340px"><b>${esc(r.titulo)}</b>
        <div class="tiny muted">${esc((r.cuerpo||'').slice(0,110))}${(r.cuerpo||'').length>110?'…':''}</div></td>
      <td class="wrap">${esc(dest)}</td><td>${chip(r.canal,'neutral')}</td><td>${chipEstado(r.estado)}</td>
      <td class="muted">${r.enviado_en? fdatetime(r.enviado_en) : r.programado_para? fdatetime(r.programado_para) : fdate(r.created_at)}</td>
      <td>${esc(perfiles[r.autor_id]||'—')}</td>
      <td class="nowrap">
        <button class="btn ghost sm" data-v="${r.id}" title="Ver el mensaje"><span class="material-symbols-outlined">visibility</span></button>
        ${puede?`<button class="btn ghost sm" data-e="${r.id}" title="Editar el mensaje"><span class="material-symbols-outlined">edit</span></button>
        ${r.estado!=='enviado'?`<button class="btn ghost sm" data-send="${r.id}" style="color:var(--ok)" title="Enviar ahora">
          <span class="material-symbols-outlined">send</span></button>`:''}
        <button class="btn ghost sm" data-d="${r.id}" style="color:var(--error)" title="Borrar el mensaje"><span class="material-symbols-outlined">delete</span></button>`:''}
      </td></tr>`;
  }).join('') : emptyRow(7, 'Todavía no has publicado ningún anuncio.', {texto:'Escribir el primer anuncio', id:'vacioAnuncio', icono:'campaign'});

  $$('[data-v]').forEach(b=>b.onclick=()=>{ const r=rows.find(x=>x.id===b.dataset.v);
    modal({ title:r.titulo, body:`<div class="row" style="gap:8px;margin-bottom:12px">${chipEstado(r.estado)}${chip(r.canal,'neutral')}
      <span class="chip neutral">${esc(r.audiencia||'todos')}</span></div>
      <p style="white-space:pre-wrap">${esc(r.cuerpo||'')}</p>` }); });
  $$('[data-e]').forEach(b=>b.onclick=()=>form(rows.find(x=>x.id===b.dataset.e)));
  $$('[data-send]').forEach(b=>b.onclick=async()=>{
    if (!await confirmDialog('¿Enviar este anuncio ahora a la audiencia seleccionada?')) return;
    await run(sb.from('cem_announcements').update({estado:'enviado', enviado_en:new Date().toISOString()}).eq('id',b.dataset.send),'No se pudo enviar');
    await audit('anuncio_enviado','cem_announcements',b.dataset.send,'medio',{}); ok('Anuncio enviado'); load();
  });
  $$('[data-d]').forEach(b=>b.onclick=async()=>{
    if (!await confirmDialog('¿Eliminar este anuncio?')) return;
    await run(sb.from('cem_announcements').delete().eq('id',b.dataset.d),'No se pudo eliminar');
    ok('Anuncio eliminado'); load();
  });
}
['#q','#fCanal'].forEach(s=>{const el=$(s); el.oninput=render; el.onchange=render;});
$('#btnNuevo').onclick=()=>form(null);
accionVacio('vacioAnuncio', () => form(null));

function form(r){
  const isNew=!r;
  // Se carga en cuanto se abre: son cinco filas y no merecen otro clic.
  setTimeout(() => montarPlantillas(), 0);
  const m = modal({ title:isNew?'Nuevo anuncio':'Editar anuncio', wide:true, body:`
    <!-- Mejora 27: los mismos cinco mensajes se reescribían cada vez, y cada
         vez distinto. Una plantilla no obliga a nada —se pega y se edita— pero
         hace que el punto de partida sea siempre el mismo. -->
    <div class="row between sep-poco" id="filaPlantillas">
      <span class="tiny muted">Plantillas</span>
      <button type="button" class="btn ghost sm" id="btnGuardarPlantilla" hidden>
        <span class="material-symbols-outlined">bookmark_add</span> Guardar esto como plantilla</button>
    </div>
    <div class="row sep-poco" style="gap:6px;flex-wrap:wrap" id="plantillas"></div>

    <div class="field"><label>Título *</label><input id="aT" value="${esc(r?.titulo||'')}" required></div>
    <div class="field"><label>Mensaje</label><textarea id="aB" style="min-height:120px">${esc(r?.cuerpo||'')}</textarea>
      <span class="tiny muted">Lo que va entre llaves —{nombre}, {programa}, {fecha}— hay que
        cambiarlo a mano antes de enviar: la plataforma no lo rellena sola.</span></div>
    <div class="row">
      <div class="field medio"><label>Audiencia</label><select id="aA">
        ${opciones(['todos','estudiantes','profesores','administrativos'], r?.audiencia)}</select></div>
      <div class="field medio"><label>Canal</label><select id="aC">
        ${opciones(['plataforma','email','ambos'], r?.canal)}</select></div>
    </div>
    <div class="row">
      <div class="field medio"><label>Cohorte específica (opcional)</label><select id="aCoh">
        <option value="">— todas —</option>
        ${cohortes.map(c=>`<option value="${c.id}" ${r?.cohort_id===c.id?'selected':''}>${esc(c.nombre)} — ${esc(c.cem_courses?.nombre||'')}</option>`).join('')}</select></div>
      <div class="field medio"><label>Programa específico (opcional)</label><select id="aCur">
        <option value="">— todos —</option>
        ${cursos.map(c=>`<option value="${c.id}" ${r?.course_id===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Programar para (opcional)</label>
      <input type="datetime-local" id="aP" value="${r?.programado_para? String(r.programado_para).slice(0,16):''}"></div>`,
    footer:`<button class="btn outline" data-x>Cancelar</button>
      <button class="btn outline" data-draft>Guardar borrador</button>
      <button class="btn" data-send>Enviar ahora</button>` });
  $('[data-x]',m).onclick=m.close;
  const build = (estado) => ({
    titulo:$('#aT',m).value.trim(), cuerpo:$('#aB',m).value.trim(), audiencia:$('#aA',m).value,
    canal:$('#aC',m).value, cohort_id:$('#aCoh',m).value||null, course_id:$('#aCur',m).value||null,
    programado_para:$('#aP',m).value? new Date($('#aP',m).value).toISOString() : null,
    estado, enviado_en: estado==='enviado'? new Date().toISOString() : null, autor_id:p.id,
  });
  const guardar = async (estado) => {
    const payload = build(estado);
    if (!payload.titulo) return;
    if (payload.programado_para && estado==='borrador') payload.estado='programado';
    if (isNew) await run(sb.from('cem_announcements').insert(payload),'No se pudo guardar');
    else await run(sb.from('cem_announcements').update(payload).eq('id',r.id),'No se pudo guardar');
    await audit(estado==='enviado'?'anuncio_enviado':'anuncio_guardado','cem_announcements',r?.id,'bajo',{titulo:payload.titulo});
    m.close(); ok(estado==='enviado'?'Anuncio enviado':'Anuncio guardado'); load();
  };
  $('[data-draft]',m).onclick=()=>guardar('borrador');
  $('[data-send]',m).onclick=()=>guardar('enviado');
}

/* ============ plantillas de comunicación (mejora 27) ============
   Se ordenan por uso, así que a los dos meses las tres primeras son las tres
   que de verdad se mandan. Pegar una NO envía nada: rellena el título y el
   cuerpo para que se editen. */
async function montarPlantillas(){
  const host = $('#plantillas');
  if (!host) return;
  const { data } = await sb.from('cem_plantillas_mensaje')
    .select('id,nombre,asunto,cuerpo,usos').order('usos', { ascending:false }).limit(12);
  const lista = data || [];
  host.innerHTML = lista.length
    ? lista.map(t => `<button type="button" class="chip chip-btn" data-plantilla="${esc(t.id)}"
        title="Pegar esta plantilla en el título y el mensaje">${esc(t.nombre)}</button>`).join('')
    : '<span class="tiny muted">Todavía no hay ninguna guardada.</span>';

  $$('[data-plantilla]', host).forEach(b => b.onclick = () => {
    const t = lista.find(x => x.id === b.dataset.plantilla);
    if (!t) return;
    const hayTexto = $('#aT').value.trim() || $('#aB').value.trim();
    if (hayTexto && !confirm('Vas a reemplazar lo que hay escrito. ¿Seguimos?')) return;
    $('#aT').value = t.asunto;
    $('#aB').value = t.cuerpo;
    sb.rpc('cem_plantilla_usada', { p_id: t.id }).then(() => {}, () => {});
    ok('Plantilla pegada. Cambia lo que va entre llaves antes de enviar.');
  });

  const guardar = $('#btnGuardarPlantilla');
  if (guardar && puede) {
    guardar.hidden = false;
    guardar.onclick = async () => {
      const asunto = $('#aT').value.trim(), cuerpo = $('#aB').value.trim();
      if (!asunto || !cuerpo) { fail('Escribe primero el título y el mensaje.'); return; }
      const nombre = prompt('¿Cómo se llama esta plantilla?', asunto.slice(0, 40));
      if (!nombre) return;
      const { error } = await sb.from('cem_plantillas_mensaje')
        .insert({ nombre: nombre.trim(), asunto, cuerpo, creada_por: p.id });
      if (error) { fail(mensajeError(error)); return; }
      ok('Guardada. Sale en la lista la próxima vez.');
      montarPlantillas();
    };
  }
}
</script>
</body>
</html>
