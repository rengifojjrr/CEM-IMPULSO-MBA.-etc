<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Calendario académico</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-14">
<style>
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--outline-variant);
    border:1px solid var(--outline-variant);border-radius:var(--radius);overflow:hidden;}
  .cal .dow{background:var(--surface-container);padding:8px 6px;text-align:center;font-size:11px;font-weight:700;
    text-transform:uppercase;color:var(--on-surface-variant);}
  .cal .day{background:var(--surface-lowest);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;}
  .cal .day.out{background:var(--surface);opacity:.55;}
  .cal .day.today .num{background:var(--primary);color:#fff;border-radius:50%;}
  .cal .num{font-size:12px;font-weight:700;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
  .ev{font-size:10.8px;padding:3px 6px;border-radius:6px;background:var(--secondary-container);color:var(--secondary);
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .ev.presencial{background:var(--tertiary-fixed);color:var(--tertiary);}
  .ev.dictada{background:var(--surface-highest);color:var(--on-surface-variant);}
  @media(max-width:760px){ .cal .day{min-height:78px;} .ev{font-size:11.5px;padding:3px 5px;} }
</style>
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Calendario académico</h1><p>Programa clases, sesiones en vivo y actividades por cohorte.</p></div>
    <div class="actions">
      <button class="btn outline" id="btnHoy">Hoy</button>
      <button class="btn" id="btnNueva"><span class="material-symbols-outlined">add</span> Nueva sesión</button>
    </div>
  </div>

  <div class="card">
    <div class="row between" style="margin-bottom:12px">
      <div class="row">
        <button class="icon-btn" id="prev"><span class="material-symbols-outlined">chevron_left</span></button>
        <h2 class="sec" id="mesLbl" style="margin:0;min-width:170px;text-align:center"></h2>
        <button class="icon-btn" id="next"><span class="material-symbols-outlined">chevron_right</span></button>
      </div>
      <div class="field" style="margin:0;min-width:220px"><select id="fCohorte"><option value="">Todas las cohortes</option></select></div>
    </div>
    <div class="cal" id="cal"></div>
  </div>

  <div class="card">
    <h2 class="sec">Sesiones del mes</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Fecha</th><th>Hora</th><th>Sesión</th><th>Cohorte</th><th>Modalidad</th><th>Salón</th><th>Profesor</th><th>Estado</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table></div>
  </div>
</div>

<script type="module">
import { sb, mount, $, $$, esc, chip, fdate, emptyRow, modal, ok, run, audit, qs, confirmDialog,
         campoArchivo, subirDocumentoLeccion, opciones, etiqueta, chipEstado, ayuda, montarAyudas,
         mejorarSelects } from '../assets/app.js?v=2026-08-14';

const p = await mount({ require:['coordinador','admin','superadmin','auditor'], active:'calendario.html', area:'admin' });
const editable = p && ['coordinador','admin','superadmin'].includes(p.rol);
let cur = new Date(), clases = [], cohortes = [], profes = [];
if (p) load();

async function load(){
  const [{ data: cos }, { data: ps }] = await Promise.all([
    sb.from('cem_cohorts').select('id,nombre,codigo,course_id,cem_courses(nombre)').order('nombre'),
    sb.from('cem_profiles').select('id,nombre,apellido').eq('rol','profesor').limit(500),
  ]);
  cohortes = cos||[]; profes = ps||[];
  $('#fCohorte').innerHTML = '<option value="">Todas las cohortes</option>' +
    cohortes.map(c=>`<option value="${c.id}">${esc(c.nombre)} — ${esc(c.cem_courses?.nombre||'')}</option>`).join('');
  if (qs('cohorte')) $('#fCohorte').value = qs('cohorte');
  await fetchMonth();
}

async function fetchMonth(){
  const ini = new Date(cur.getFullYear(), cur.getMonth(), 1).toISOString().slice(0,10);
  const fin = new Date(cur.getFullYear(), cur.getMonth()+1, 0).toISOString().slice(0,10);
  let q = sb.from('cem_classes').select('*,cem_cohorts(nombre,cem_courses(nombre))').gte('fecha',ini).lte('fecha',fin).order('fecha');
  const coh = $('#fCohorte').value; if (coh) q = q.eq('cohort_id',coh);
  const { data } = await q;
  clases = data||[];
  render();
}

function render(){
  $('#mesLbl').textContent = cur.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  const y=cur.getFullYear(), mo=cur.getMonth();
  const first = new Date(y,mo,1); const startDow = (first.getDay()+6)%7; // lunes=0
  const daysInMonth = new Date(y,mo+1,0).getDate();
  const prevDays = new Date(y,mo,0).getDate();
  const today = new Date().toISOString().slice(0,10);
  const byDay = {}; clases.forEach(c => (byDay[c.fecha] ||= []).push(c));

  let cells = '';
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d => cells += `<div class="dow">${d}</div>`);
  for (let i=startDow; i>0; i--) cells += `<div class="day out"><div class="num">${prevDays-i+1}</div></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = (byDay[iso]||[]).map(c => `<div class="ev ${c.estado==='dictada'?'dictada':(c.modalidad==='presencial'?'presencial':'')}"
      data-ev="${c.id}" title="${esc(c.titulo)}">${(c.hora_inicio||'').slice(0,5)} ${esc(c.titulo)}</div>`).join('');
    cells += `<div class="day ${iso===today?'today':''}" data-day="${iso}"><div class="num">${d}</div>${evs}</div>`;
  }
  const rest = (7 - ((startDow + daysInMonth) % 7)) % 7;
  for (let i=1; i<=rest; i++) cells += `<div class="day out"><div class="num">${i}</div></div>`;
  $('#cal').innerHTML = cells;

  $$('[data-ev]').forEach(e => e.onclick = (ev) => { ev.stopPropagation(); form(clases.find(c=>c.id===e.dataset.ev)); });
  if (editable) $$('[data-day]').forEach(d => d.ondblclick = () => form(null, d.dataset.day));

  $('#tb').innerHTML = clases.length ? clases.map(c => `<tr>
    <td>${fdate(c.fecha)}</td><td>${(c.hora_inicio||'').slice(0,5)}–${(c.hora_fin||'').slice(0,5)}</td>
    <td class="wrap"><b>${esc(c.titulo)}</b></td>
    <td class="wrap">${esc(c.cem_cohorts?.nombre||'')}<div class="tiny muted">${esc(c.cem_cohorts?.cem_courses?.nombre||'')}</div></td>
    <td>${esc(c.modalidad.replace('_',' '))}</td><td>${esc(c.salon||'—')}</td>
    <td>${esc(profes.find(x=>x.id===c.teacher_id)?.nombre||'—')}</td>
    <td>${chip(c.estado)}</td>
    <td style="white-space:nowrap">
      ${c.url_sesion?`<a class="btn ghost sm" href="${esc(c.url_sesion)}" target="_blank" title="Abrir sesión"><span class="material-symbols-outlined">videocam</span></a>`:''}
      ${editable?`<button class="btn ghost sm" data-edit="${c.id}"><span class="material-symbols-outlined">edit</span></button>`:''}
    </td></tr>`).join('') : emptyRow(9,'No hay sesiones programadas este mes.');
  $$('[data-edit]').forEach(b => b.onclick = () => form(clases.find(c=>c.id===b.dataset.edit)));
}

$('#prev').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth()-1, 1); fetchMonth(); };
$('#next').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1); fetchMonth(); };
$('#btnHoy').onclick = () => { cur = new Date(); fetchMonth(); };
$('#fCohorte').onchange = fetchMonth;
$('#btnNueva').onclick = () => form(null);

function form(c, fecha){
  const isNew = !c;
  /* La grabación de una clase es un archivo que suele estar en el equipo de
     quien la dictó. Antes sólo se podía pegar un enlace: si el vídeo no estaba
     ya publicado en algún sitio, no había forma de guardarlo. */
  const grabacion = campoArchivo({
    id:'sGrab', tipo:'video', valor: c?.grabacion_url || '',
    subir: async (f) => (await subirDocumentoLeccion(f)).url,
    etiquetaSubir:'Subir la grabación',
  });
  const m = modal({ title: isNew?'Nueva sesión':`Editar: ${c.titulo}`, wide:true, body:`
    <div class="field"><label>Cohorte *</label><select id="sCoh">
      ${cohortes.map(x=>`<option value="${x.id}" ${c&&c.cohort_id===x.id?'selected':''}>${esc(x.nombre)} — ${esc(x.cem_courses?.nombre||'')}</option>`).join('')}</select></div>
    <div class="field"><label>Título *</label><input id="sTit" value="${esc(c?.titulo||'')}" placeholder="Sesión 1: Marco conceptual"></div>
    <div class="row">
      <div class="field" style="flex:1;min-width:140px"><label>Fecha *</label><input type="date" id="sFecha" value="${c?.fecha||fecha||''}"></div>
      <div class="field" style="flex:1;min-width:110px"><label>Inicio</label><input type="time" id="sIni" value="${(c?.hora_inicio||'18:30').slice(0,5)}"></div>
      <div class="field" style="flex:1;min-width:110px"><label>Fin</label><input type="time" id="sFin" value="${(c?.hora_fin||'20:30').slice(0,5)}"></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1;min-width:140px"><label>Modalidad</label><select id="sMod">
        ${opciones(['online','en_vivo','presencial','hibrido'], c?.modalidad)}</select></div>
      <div class="field" style="flex:1;min-width:130px"><label>Salón</label><input id="sSalon" value="${esc(c?.salon||'')}"></div>
      <div class="field" style="flex:1;min-width:150px"><label>Estado</label><select id="sEstado">
        ${opciones(['programada','dictada','cancelada','reprogramada'], c?.estado)}</select></div>
    </div>
    <div class="field"><label>Profesor</label><select id="sProf"><option value="">Sin asignar</option>
      ${profes.map(x=>`<option value="${x.id}" ${c&&c.teacher_id===x.id?'selected':''}>${esc(x.nombre)} ${esc(x.apellido||'')}</option>`).join('')}</select></div>
    <div class="field"><label>Enlace de sesión</label><input id="sUrl" value="${esc(c?.url_sesion||'')}" placeholder="https://meet.google.com/…"></div>
    <div class="field"><label>Grabación de la clase</label>${grabacion.html}</div>`,
    footer:`${isNew?'':'<button class="btn danger" data-del>Eliminar</button>'}
      <button class="btn outline" data-c>Cancelar</button><button class="btn" data-s>Guardar</button>` });
  grabacion.conectar(m);
  montarAyudas(m);
  mejorarSelects(m);
  $('[data-c]',m).onclick = m.close;
  const delBtn = $('[data-del]',m);
  if (delBtn) delBtn.onclick = async () => {
    if (!await confirmDialog('¿Eliminar esta sesión del calendario?')) return;
    await run(sb.from('cem_classes').delete().eq('id',c.id),'No se pudo eliminar');
    await audit('clase_eliminada','cem_classes',c.id,'medio',{titulo:c.titulo});
    m.close(); ok('Sesión eliminada'); fetchMonth();
  };
  $('[data-s]',m).onclick = async () => {
    const payload = {
      cohort_id:$('#sCoh',m).value, titulo:$('#sTit',m).value.trim(), fecha:$('#sFecha',m).value,
      hora_inicio:$('#sIni',m).value||null, hora_fin:$('#sFin',m).value||null, modalidad:$('#sMod',m).value,
      salon:$('#sSalon',m).value.trim(), estado:$('#sEstado',m).value,
      teacher_id:$('#sProf',m).value||null, url_sesion:$('#sUrl',m).value.trim()||null,
      grabacion_url:grabacion.valor()||null,
    };
    if (!payload.titulo || !payload.fecha) return;
    if (isNew) await run(sb.from('cem_classes').insert(payload),'No se pudo crear');
    else await run(sb.from('cem_classes').update(payload).eq('id',c.id),'No se pudo guardar');
    await audit(isNew?'clase_creada':'clase_actualizada','cem_classes',c?.id,'bajo',{titulo:payload.titulo});
    m.close(); ok(isNew?'Sesión creada':'Sesión actualizada'); fetchMonth();
  };
}
</script>
</body>
</html>
