<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Revisión de contenidos</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-21-2">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Revisión y publicación <button type="button" class="ayuda-btn" data-ayuda="Nada de lo que está aquí lo ven todavía los estudiantes. Al aprobarlo pasa a publicado y aparece en el aula; al devolverlo, quien lo escribió recibe el motivo.">?</button></h1><p>Contenido que alguien escribió y espera visto bueno antes de que lo vean los estudiantes.</p></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Elemento o autor…"></div>
      <div class="field"><label>Estado</label><select id="fEstado"><option value="">Todos</option>
        <option value="pendiente">Pendiente</option><option value="requiere_cambios">Requiere cambios</option>
        <option value="aprobado">Aprobado</option></select></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Elemento</th><th>Tipo</th><th>Autor</th><th>Revisor</th><th>Versión</th><th>Estado</th><th>Actualizado</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table></div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, fdate, emptyRow, match, kpi, num, modal, ok, run, audit, chipEstado} from '../assets/app.js?v=2026-08-21-2';
const p = await mount({ require:['coordinador','admin','superadmin','profesor','auditor'], active:'revision.html', area:'admin' });
const puede = p && ['coordinador','admin','superadmin'].includes(p.rol);
let rows=[], perfiles={};
if (p) load();

async function load(){
  const [{data},{data:ps}] = await Promise.all([
    sb.from('cem_content_reviews').select('*,cem_lessons(id,titulo,estado,tipo)').order('created_at',{ascending:false}),
    sb.from('cem_profiles').select('id,nombre,apellido').limit(500),
  ]);
  perfiles = Object.fromEntries((ps||[]).map(x=>[x.id,`${x.nombre} ${x.apellido||''}`.trim()]));
  rows = data||[];

  /* Lo que hay que revisar es justo lo que la base dejó de entregar en abierto
     —el enlace y el cuerpo—, así que se pide aparte. Quien revisa tiene
     derecho; quien no ha pagado el curso, no. */
  const ids = rows.map(r=>r.cem_lessons?.id).filter(Boolean);
  if (ids.length){
    const { data: material } = await sb.rpc('cem_material_lecciones',{ p_ids: ids });
    rows.forEach(r=>{
      if (!r.cem_lessons) return;
      r.cem_lessons.url = material?.[r.cem_lessons.id]?.url ?? null;
      r.cem_lessons.contenido = material?.[r.cem_lessons.id]?.contenido ?? null;
    });
  }
  const hoy = new Date().toISOString().slice(0,10);
  $('#kpis').innerHTML = [
    kpi('Pendientes de revisión', num(rows.filter(r=>r.estado==='pendiente').length),'pending_actions','en cola'),
    kpi('Requieren cambios', num(rows.filter(r=>r.estado==='requiere_cambios').length),'assignment_return','devueltos al autor'),
    kpi('Aprobados hoy', num(rows.filter(r=>r.estado==='aprobado' && String(r.actualizado_en||'').slice(0,10)===hoy).length),'check_circle','publicados'),
    kpi('Total en bandeja', num(rows.length),'inventory_2','histórico'),
  ].join('');
  render();
}

function render(){
  const q=$('#q').value.trim(), e=$('#fEstado').value;
  const list = rows.filter(r=>match({...r,_a:perfiles[r.autor_id]||''},q,['titulo','_a']) && (!e||r.estado===e));
  $('#tb').innerHTML = list.length ? list.map(r=>`<tr>
    <td class="wrap"><b>${esc(r.titulo)}</b></td>
    <td>${chip(r.tipo,'neutral')}</td>
    <td>${esc(perfiles[r.autor_id]||'—')}</td>
    <td>${esc(perfiles[r.revisor_id]||'Sin asignar')}</td>
    <td>${esc(r.version||'v1')}</td>
    <td>${chipEstado(r.estado)}</td>
    <td class="muted">${fdate(r.actualizado_en||r.created_at)}</td>
    <td class="nowrap">
      <button class="btn ghost sm" data-ver="${r.id}" title="Ver"><span class="material-symbols-outlined">visibility</span></button>
      ${puede && r.estado!=='aprobado' ? `<button class="btn ghost sm" data-ap="${r.id}" title="Aprobar y publicar" style="color:var(--ok)"><span class="material-symbols-outlined">check_circle</span></button>
      <button class="btn ghost sm" data-dev="${r.id}" title="Devolver" style="color:var(--warn)"><span class="material-symbols-outlined">assignment_return</span></button>`:''}
    </td></tr>`).join('') : emptyRow(8, 'La bandeja está vacía: no hay contenido esperando revisión.');

  $$('[data-ver]').forEach(b=>b.onclick=()=>ver(rows.find(r=>r.id===b.dataset.ver)));
  $$('[data-ap]').forEach(b=>b.onclick=()=>resolver(rows.find(r=>r.id===b.dataset.ap), true));
  $$('[data-dev]').forEach(b=>b.onclick=()=>resolver(rows.find(r=>r.id===b.dataset.dev), false));
}
['#q','#fEstado'].forEach(s=>{const el=$(s); el.oninput=render; el.onchange=render;});

function ver(r){
  const l = r.cem_lessons;
  modal({ title:r.titulo, wide:true, body:`
    <div class="row" style="gap:8px;margin-bottom:12px">${chipEstado(r.estado)}${chip(r.tipo,'neutral')}
      <span class="chip neutral">${esc(r.version||'v1')}</span></div>
    ${l?.url? (l.tipo==='video'
      ? `<div style="aspect-ratio:16/9;margin-bottom:12px"><iframe src="${esc(l.url)}" style="width:100%;height:100%;border:0"></iframe></div>`
      : `<a class="btn outline sm" href="${esc(l.url)}" target="_blank" style="margin-bottom:12px">Abrir recurso</a>`) : ''}
    <p class="muted">${esc(l?.contenido || 'Sin contenido escrito en la lección.')}</p>
    ${r.comentario? `<div class="card" style="background:var(--warn-container);margin-top:12px">
      <b class="tiny">Comentario del revisor</b><p class="tiny" style="margin:6px 0 0">${esc(r.comentario)}</p></div>`:''}` });
}

function resolver(r, aprobar){
  const m = modal({ title: aprobar?'Aprobar y publicar':'Devolver para cambios', body:`
    <p class="tiny muted" style="margin-top:0">${esc(r.titulo)}</p>
    <div class="field"><label>Comentario ${aprobar?'(opcional)':'*'}</label>
      <textarea id="cm" placeholder="${aprobar?'Observaciones de la aprobación…':'Indica qué debe corregirse…'}" required></textarea></div>`,
    footer:`<button class="btn outline" data-x>Cancelar</button>
      <button class="btn ${aprobar?'':'danger'}" data-s>${aprobar?'Aprobar y publicar':'Devolver'}</button>` });
  $('[data-x]',m).onclick=m.close;
  $('[data-s]',m).onclick=async()=>{
    const cm=$('#cm',m).value.trim();
    if (!aprobar && !cm) return;
    await run(sb.from('cem_content_reviews').update({
      estado: aprobar?'aprobado':'requiere_cambios', comentario:cm||null,
      revisor_id:p.id, actualizado_en:new Date().toISOString(),
    }).eq('id',r.id),'No se pudo actualizar');
    if (r.lesson_id) await sb.from('cem_lessons').update({ estado: aprobar?'publicado':'borrador' }).eq('id',r.lesson_id);
    await audit(aprobar?'contenido_aprobado':'contenido_devuelto','cem_content_reviews',r.id,'medio',{titulo:r.titulo});
    m.close(); ok(aprobar?'Contenido publicado':'Devuelto al autor'); load();
  };
}
</script>
</body>
</html>
