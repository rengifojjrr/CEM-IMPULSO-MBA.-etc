<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM Admin · Revisión de contenidos</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2026-08-25-22">
</head>
<body>
<div id="page" class="hidden">
  <div class="page-head">
    <div><h1>Revisión y publicación <button type="button" class="ayuda-btn" data-ayuda="Nada de lo que está aquí lo ven todavía los estudiantes. Al aprobarlo pasa a publicado y aparece en el aula; al devolverlo, quien lo escribió recibe el motivo.">?</button></h1><p>Contenido que alguien escribió y espera visto bueno antes de que lo vean los estudiantes.</p></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <div class="filters">
      <div class="field grow"><label>Buscar</label><input type="search" id="q" placeholder="Elemento o autor…"></div>
      <div class="field"><label>Estado</label><select id="fEstado"><option value="">Todos</option>
        <option value="pendiente">Pendiente</option><option value="requiere_cambios">Requiere cambios</option>
        <option value="aprobado">Aprobado</option></select></div>
      <!-- Quién lo subió es la primera pregunta de quien revisa: la cola de un
           profesor se mira entera, no elemento a elemento. -->
      <div class="field"><label>Autor</label><select id="fAutor"><option value="">Todos</option></select></div>
      <div class="field"><label>Tipo</label><select id="fTipo"><option value="">Todos</option></select></div>
      <button class="btn ghost" id="btnClear">Limpiar los filtros</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Elemento</th><th>Tipo</th><th>Autor</th><th>Revisor</th><th>Versión</th><th>Estado</th><th>Actualizado</th><th></th></tr></thead>
      <tbody id="tb"></tbody></table></div>
  </div>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, fdate, emptyRow, match, kpi, num, modal, ok, run, audit, chipEstado, filtrosEnLaDireccion, idDeYoutube, previaDeMaterial } from '../assets/app.js?v=2026-08-25-22';
import { crearReproductor } from '../assets/reproductor.js?v=2026-08-25-22';
const p = await mount({ require:['coordinador','admin','superadmin','profesor','auditor'], active:'revision.html', area:'admin' });
const puede = p && ['coordinador','admin','superadmin'].includes(p.rol);
let rows=[], perfiles={};
if (p) load();

async function load(){
  const [{data},{data:ps}] = await Promise.all([
    sb.from('cem_content_reviews').select('*,cem_lessons(id,titulo,estado,tipo)').order('created_at',{ascending:false}),
    sb.from('cem_profiles').select('id,nombre,apellido').limit(500),
  ]);
  perfiles = Object.fromEntries((ps||[]).map(x=>[x.id,`${x.nombre} ${x.apellido||''}`.trim()]));
  rows = data||[];

  /* Lo que hay que revisar es justo lo que la base dejó de entregar en abierto
     —el enlace y el cuerpo—, así que se pide aparte. Quien revisa tiene
     derecho; quien no ha pagado el curso, no. */
  const ids = rows.map(r=>r.cem_lessons?.id).filter(Boolean);
  if (ids.length){
    const { data: material } = await sb.rpc('cem_material_lecciones',{ p_ids: ids });
    rows.forEach(r=>{
      if (!r.cem_lessons) return;
      r.cem_lessons.url = material?.[r.cem_lessons.id]?.url ?? null;
      // El vídeo que el aula reproduce de verdad, que no siempre coincide con
      // el enlace pegado: revisar hay que revisar el que se va a ver.
      r.cem_lessons.video_id = material?.[r.cem_lessons.id]?.video_id ?? null;
      r.cem_lessons.contenido = material?.[r.cem_lessons.id]?.contenido ?? null;
      r.cem_lessons.adjuntos = material?.[r.cem_lessons.id]?.adjuntos ?? [];
    });
  }
  const hoy = new Date().toISOString().slice(0,10);
  $('#kpis').innerHTML = [
    kpi('Pendientes de revisión', num(rows.filter(r=>r.estado==='pendiente').length),'pending_actions','en cola'),
    kpi('Requieren cambios', num(rows.filter(r=>r.estado==='requiere_cambios').length),'assignment_return','devueltos al autor'),
    kpi('Aprobados hoy', num(rows.filter(r=>r.estado==='aprobado' && String(r.actualizado_en||'').slice(0,10)===hoy).length),'check_circle','publicados'),
    kpi('Total en bandeja', num(rows.length),'inventory_2','histórico'),
  ].join('');
  render();
}

/* Las opciones de autor y tipo no existen hasta que la bandeja está cargada,
   y para entonces `filtrosEnLaDireccion` ya intentó poner lo que traía la
   dirección en un desplegable vacío. Se guarda lo que pedía y se aplica en
   cuanto hay dónde aplicarlo, una sola vez —después manda la persona. */
let pedidoEnLaUrl = null, primeraVez = true;

function render(){
  /* Las dos listas salen de lo que hay en la bandeja, no de una lista escrita
     a mano: si mañana sube contenido un profesor nuevo, aparece solo. */
  const autores = [...new Set(rows.map(r=>r.autor_id).filter(Boolean))]
    .map(id=>({ id, n: perfiles[id] || '—' })).sort((x,y)=>x.n.localeCompare(y.n));
  const sel = (v, actual) => `<option value="${esc(v)}"${v===actual?' selected':''}>`;
  const aAhora = $('#fAutor').value, tAhora = $('#fTipo').value;
  $('#fAutor').innerHTML = '<option value="">Todos</option>'
    + autores.map(x=>`${sel(x.id, aAhora)}${esc(x.n)}</option>`).join('');
  $('#fTipo').innerHTML = '<option value="">Todos</option>'
    + [...new Set(rows.map(r=>r.tipo).filter(Boolean))].sort()
        .map(x=>`${sel(x, tAhora)}${esc(x)}</option>`).join('');
  if (primeraVez && pedidoEnLaUrl && rows.length){
    primeraVez = false;
    if (pedidoEnLaUrl.autor) $('#fAutor').value = pedidoEnLaUrl.autor;
    if (pedidoEnLaUrl.tipo) $('#fTipo').value = pedidoEnLaUrl.tipo;
  }

  const q=$('#q').value.trim(), e=$('#fEstado').value, a=$('#fAutor').value, t=$('#fTipo').value;
  const list = rows.filter(r=>match({...r,_a:perfiles[r.autor_id]||''},q,['titulo','_a'])
    && (!e||r.estado===e) && (!a||r.autor_id===a) && (!t||r.tipo===t));
  $('#tb').innerHTML = list.length ? list.map(r=>`<tr>
    <td class="wrap"><b>${esc(r.titulo)}</b></td>
    <td>${chip(r.tipo,'neutral')}</td>
    <td>${esc(perfiles[r.autor_id]||'—')}</td>
    <td>${esc(perfiles[r.revisor_id]||'Sin asignar')}</td>
    <td>${esc(r.version||'v1')}</td>
    <td>${chipEstado(r.estado)}</td>
    <td class="muted">${fdate(r.actualizado_en||r.created_at)}</td>
    <td class="nowrap">
      <button class="btn ghost sm" data-ver="${r.id}" title="Ver"><span class="material-symbols-outlined">visibility</span></button>
      ${puede && r.estado!=='aprobado' ? `<button class="btn ghost sm" data-ap="${r.id}" title="Aprobar y publicar" style="color:var(--ok)"><span class="material-symbols-outlined">check_circle</span></button>
      <button class="btn ghost sm" data-dev="${r.id}" title="Devolver" style="color:var(--warn)"><span class="material-symbols-outlined">assignment_return</span></button>`:''}
    </td></tr>`).join('') : emptyRow(8, 'La bandeja está vacía: no hay contenido esperando revisión.');

  $$('[data-ver]').forEach(b=>b.onclick=()=>ver(rows.find(r=>r.id===b.dataset.ver)));
  $$('[data-ap]').forEach(b=>b.onclick=()=>resolver(rows.find(r=>r.id===b.dataset.ap), true));
  $$('[data-dev]').forEach(b=>b.onclick=()=>resolver(rows.find(r=>r.id===b.dataset.dev), false));
}
const CAMPOS = ['#q','#fEstado','#fAutor','#fTipo'];
CAMPOS.forEach(s=>{const el=$(s); el.oninput=render; el.onchange=render;});
$('#btnClear').onclick=()=>{ CAMPOS.forEach(s=>$(s).value=''); render(); };
/* Con el filtro en la dirección, «la cola de Elena» es un enlace que se pega
   en un mensaje y le llega a alguien ya filtrada. */
pedidoEnLaUrl = filtrosEnLaDireccion({ q:'#q', est:'#fEstado', autor:'#fAutor', tipo:'#fTipo' }, render);

/* ============ ver lo que se está aprobando ============
   Esto enseñaba un cuadrado gris con el icono de imagen rota y, debajo, «sin
   contenido escrito en la lección»: o sea, nada. La causa era que metía la
   dirección guardada —`youtube.com/watch?v=…`— dentro de un <iframe>, y una
   dirección de «ver en YouTube» no se deja enmarcar; hace falta la de
   incrustar. Es el mismo fallo que ya se arregló en el aula.

   Ahora monta el reproductor de la casa, igual que el aula: así quien aprueba
   ve exactamente lo que va a ver el estudiante —misma portada, mismos mandos,
   misma marca de agua— y no una aproximación. Aprobar a ciegas era el riesgo
   de verdad de esta pantalla. */
async function ver(r){
  const l = r.cem_lessons;
  const id = idDeYoutube(l?.video_id ? `https://youtu.be/${l.video_id}` : l?.url);
  const adjuntos = Array.isArray(l?.adjuntos) ? l.adjuntos : [];
  const m = modal({ title:r.titulo, wide:true, body:`
    <div class="row" style="gap:8px;margin-bottom:12px">${chipEstado(r.estado)}${chip(r.tipo,'neutral')}
      <span class="chip neutral">${esc(r.version||'v1')}</span></div>
    ${id ? '<div id="previaVideo" style="margin-bottom:12px"></div>' : ''}
    ${!id && l?.url ? `<a class="btn outline sm" href="${esc(l.url)}" target="_blank" style="margin-bottom:12px">
      <span class="material-symbols-outlined">open_in_new</span> Abrir el recurso</a>` : ''}
    ${!id && !l?.url && !adjuntos.length ? `<p class="tiny muted">Esta lección no lleva vídeo ni archivo adjunto.</p>` : ''}
    <p class="muted">${esc(l?.contenido || 'Sin contenido escrito en la lección.')}</p>
    ${adjuntos.length ? `<b class="tiny sep">Material que se lleva la lección</b>
      <div class="sep-poco" style="display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,220px))">${adjuntos.map(d=>`<div class="card sin-margen">
        ${previaDeMaterial({ tipo:d.tipo, url:d.url, nombre:d.nombre, alto:110 })}
        <div class="tiny negrita">${esc(d.nombre)}</div>
        <div class="tiny muted">${esc(d.tipo||'archivo')} · ${(Number(d.bytes||0)/1048576).toFixed(1)} MB</div>
      </div>`).join('')}</div>` : ''}
    ${r.comentario? `<div class="card" style="background:var(--warn-container);margin-top:12px">
      <b class="tiny">Comentario del revisor</b><p class="tiny" style="margin:6px 0 0">${esc(r.comentario)}</p></div>`:''}` });

  if (!id) return;
  const repro = await crearReproductor($('#previaVideo', m), { videoId: id, marca: 'Revisión · CEM' });
  // El vídeo se queda sonando debajo del diálogo si nadie lo apaga al cerrar.
  m.addEventListener('close', () => repro?.destruir(), { once: true });
}

function resolver(r, aprobar){
  const m = modal({ title: aprobar?'Aprobar y publicar':'Devolver para cambios', body:`
    <p class="tiny muted" style="margin-top:0">${esc(r.titulo)}</p>
    <div class="field"><label>Comentario ${aprobar?'(opcional)':'*'}</label>
      <textarea id="cm" placeholder="${aprobar?'Observaciones de la aprobación…':'Indica qué debe corregirse…'}" required></textarea></div>`,
    footer:`<button class="btn outline" data-x>Cancelar</button>
      <button class="btn ${aprobar?'':'danger'}" data-s>${aprobar?'Aprobar y publicar':'Devolver'}</button>` });
  $('[data-x]',m).onclick=m.close;
  $('[data-s]',m).onclick=async()=>{
    const cm=$('#cm',m).value.trim();
    if (!aprobar && !cm) return;
    await run(sb.from('cem_content_reviews').update({
      estado: aprobar?'aprobado':'requiere_cambios', comentario:cm||null,
      revisor_id:p.id, actualizado_en:new Date().toISOString(),
    }).eq('id',r.id),'No se pudo actualizar');
    if (r.lesson_id) await sb.from('cem_lessons').update({ estado: aprobar?'publicado':'borrador' }).eq('id',r.lesson_id);
    await audit(aprobar?'contenido_aprobado':'contenido_devuelto','cem_content_reviews',r.id,'medio',{titulo:r.titulo});
    m.close(); ok(aprobar?'Contenido publicado':'Devuelto al autor'); load();
  };
}
</script>
</body>
</html>
