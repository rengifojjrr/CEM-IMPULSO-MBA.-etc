<!doctype html>
<html lang="es" data-publico="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apúntate | CEM International</title>
<!-- El logotipo, para cada quien lo pida: .ico para Google y lo viejo,
     PNG para todo lo demás, SVG para quien prefiera un vector, y el de 180
     para el iPhone. Ver herramientas/iconos.mjs. -->
<link rel="icon" href="/favicon.ico?v=2026-09-03" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96.png?v=2026-09-03">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2026-09-03">
<link rel="apple-touch-icon" href="assets/icono-180.png?v=2026-09-03">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d2440">
<!-- Los cuatro servidores de fuera, avisados de golpe y no en fila.
     Sin esto el navegador descubre cada uno cuando le toca, y paga el
     DNS y el saludo TLS de cada cual por separado, con la pantalla en
     blanco mientras tanto. Ver herramientas/acelerar-cabeceras.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://vajbsfgojtunamhrzrpf.supabase.co" crossorigin>
<link rel="modulepreload" href="assets/app.js?v=2026-09-03-4">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=2026-09-03-4">
<meta name="description" content="Apúntate a la lista de la próxima convocatoria del CEM y te avisamos en cuanto abra.">
<!-- Cada lista es una dirección distinta con la misma página, así que no hay un
     canonical que valga para todas y ninguna debe indexarse: son enlaces que se
     pegan en una historia de Instagram, no páginas que se busquen en Google.
     Igual que en recurso.html, y por lo mismo. -->
<meta name="robots" content="noindex,follow">
<style>
  .lista{max-width:560px;margin:0 auto;}

  /* Las preguntas, separadas entre sí con aire y no con rayas: una lista de
     ocho campos con línea divisoria en cada uno parece un formulario de
     Hacienda, y esto se rellena en el móvil y de pie. */
  .campos{display:flex;flex-direction:column;gap:var(--e2);margin-top:var(--e2);}
  .campo > label{display:block;font-weight:var(--peso-fuerte);margin-bottom:6px;}
  .campo .ayuda{font-size:var(--t-xs);color:var(--tinta-3);margin:-2px 0 6px;}
  /* La marca de obligatorio va al lado de la etiqueta y en el color de aviso,
     no un asterisco suelto que nadie sabe qué significa hasta que falla. */
  .campo .obliga{color:var(--peligro,#c0392b);font-weight:700;}
  .campo .opcional{font-weight:400;color:var(--tinta-3);font-size:var(--t-xs);}

  /* Opción única y múltiple como pastillas de dedo, no como radios de 13 px.
     En un móvil, un radio nativo se falla la mitad de las veces. */
  .opciones{display:flex;flex-direction:column;gap:8px;}
  .opciones label{display:flex;align-items:center;gap:10px;min-height:44px;
    padding:8px 12px;border:1px solid var(--filete);border-radius:var(--r);
    cursor:pointer;background:var(--fondo);}
  .opciones label:hover{border-color:var(--primary);}
  .opciones input{width:20px;height:20px;flex:none;}
  .opciones label:has(input:checked){border-color:var(--primary);
    background:color-mix(in srgb, var(--primary) 8%, transparent);}

  .enviar{min-height:56px;font-size:var(--t-md);width:100%;margin-top:var(--e3);}

  /* El «ya estabas apuntado» no es un error: es información. Va en el tono de
     algo que salió bien, porque salió bien. */
  .hecho{text-align:center;}
  .hecho .marca{width:64px;height:64px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;margin:0 auto var(--e2);
    overflow:hidden;background:color-mix(in srgb, var(--exito,#2e7d32) 14%, transparent);
    color:var(--exito,#2e7d32);}
  .hecho .marca .material-symbols-outlined{font-size:34px;line-height:1;}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card lista" id="tarjeta">
    <div class="brand-badge"><img src="assets/favicon.svg" alt="" width="26" height="26"></div>
    <div id="cuerpo"><p class="tiny muted">Un momento…</p></div>
  </div>
</div>

<script type="module">
/* La lista de espera de una convocatoria, para pegar en redes.
   ═══════════════════════════════════════════════════════════════════════════
   Hermana de recurso.html y con las mismas reglas, porque le llega la misma
   persona: alguien que viene de una historia de Instagram, en el móvil, sin
   cuenta y sin paciencia.

   La diferencia está en quién decide qué se pregunta. En recurso.html los
   cuatro campos están escritos en el código y no se pueden cambiar; aquí la
   pantalla no sabe de antemano ni qué campos hay ni cuáles son obligatorios:
   se lo dice la base al abrir. Por eso todo lo de abajo se dibuja en bucle y
   no hay ni un <input> escrito a mano en el HTML.

   Y lo que valida esta pantalla es cortesía, no seguridad. Quien quiera puede
   llamar a `cem_formulario_enviar` sin pasar por aquí, así que las mismas
   reglas están otra vez dentro de la función, que es donde cuentan. */
import { sb, $, esc, qs, mensajeError, sinRomperNada } from './assets/app.js?v=2026-09-03-4';

const codigo = (qs('f') || '').trim().toLowerCase();

/* Contar la visita. Esta pantalla no llama a `mount()` —no hay sesión que
   comprobar— y `mount()` es quien lo hace en las demás públicas, así que sin
   esta línea la lista no aparecería en ningún informe: se sabría cuánta gente
   se apuntó, pero no cuánta la abrió y se fue. Que es la mitad interesante. */
sinRomperNada(sb.rpc('cem_visita_anotar', {
  p_pantalla: `lista/${codigo || 'sin-codigo'}`,
  p_canal: (qs('o') || '').trim() || null,
}));   // contar no puede romperle la página a nadie: ver sinRomperNada
/* De dónde viene, para saber qué publicación trae gente. El enlace que se pega
   en una historia puede llevar `?o=historia-septiembre`. */
const origen = (qs('o') || '').trim() || null;
const LLAVE = 'cem_mis_datos';
const cuerpo = $('#cuerpo');

/* Los mismos datos que recuerda recurso.html, y a propósito la misma llave:
   quien pidió un PDF la semana pasada no tiene por qué volver a teclear su
   teléfono para apuntarse a una lista. */
const recordado = () => {
  try { return JSON.parse(localStorage.getItem(LLAVE) || 'null'); } catch { return null; }
};
const recordar = (d) => {
  try { localStorage.setItem(LLAVE, JSON.stringify(d)); } catch { /* incógnito */ }
};

const aviso = (t, clase = 'err') => `<div class="nota ${clase} sep">${t}</div>`;

/* Los campos de siempre, con su nombre en castellano y el teclado que le toca
   a cada uno en el móvil. `orden` es el que se usa al dibujar: el que declaró
   la escuela en el jsonb no tiene por qué venir ordenado, y pedir el país
   antes que el nombre queda raro. */
const PREDETERMINADOS = {
  nombre:           { et:'Nombre',            tipo:'text',  auto:'given-name',   orden:1 },
  apellido:         { et:'Apellido',          tipo:'text',  auto:'family-name',  orden:2 },
  email:            { et:'Correo',            tipo:'email', auto:'email',        orden:3 },
  telefono:         { et:'Teléfono / WhatsApp', tipo:'tel', auto:'tel',          orden:4 },
  cedula:           { et:'Cédula',            tipo:'text',  auto:'off',          orden:5 },
  pais:             { et:'País',              tipo:'text',  auto:'country-name', orden:6 },
  ciudad:           { et:'Ciudad',            tipo:'text',  auto:'address-level2', orden:7 },
  edad:             { et:'Edad',              tipo:'number', auto:'off',         orden:8 },
  ocupacion:        { et:'¿A qué te dedicas?', tipo:'text', auto:'organization-title', orden:9 },
  empresa:          { et:'Empresa',           tipo:'text',  auto:'organization', orden:10 },
  instagram:        { et:'Instagram',         tipo:'text',  auto:'off',          orden:11 },
  como_nos_conocio: { et:'¿Cómo nos conociste?', tipo:'text', auto:'off',        orden:12 },
};

function campoPredeterminado(clave, cfg, previo) {
  const d = PREDETERMINADOS[clave];
  if (!d) return '';
  const obliga = !!cfg.obligatorio;
  return `<div class="campo">
    <label for="c_${clave}">${esc(d.et)}
      ${obliga ? '<span class="obliga" aria-hidden="true">*</span>'
               : '<span class="opcional">(opcional)</span>'}</label>
    <input id="c_${clave}" name="${clave}" type="${d.tipo}" autocomplete="${d.auto}"
      ${obliga ? 'required' : ''} value="${esc(previo || '')}">
  </div>`;
}

function pregunta(q) {
  const obliga = q.obligatoria;
  const marca = obliga ? '<span class="obliga" aria-hidden="true">*</span>'
                       : '<span class="opcional">(opcional)</span>';
  const ayuda = q.ayuda ? `<p class="ayuda">${esc(q.ayuda)}</p>` : '';
  const ops = Array.isArray(q.opciones) ? q.opciones : [];

  if (q.tipo === 'opcion' || q.tipo === 'varias') {
    const t = q.tipo === 'opcion' ? 'radio' : 'checkbox';
    return `<div class="campo" role="group" aria-labelledby="t_${q.id}">
      <label id="t_${q.id}" as="span">${esc(q.etiqueta)} ${marca}</label>${ayuda}
      <div class="opciones" data-pregunta="${q.id}" data-tipo="${q.tipo}">
        ${ops.map((o, i) => `<label><input type="${t}" name="q_${q.id}"
          value="${esc(o)}" ${obliga && t === 'radio' ? 'required' : ''}>
          <span>${esc(o)}</span></label>`).join('')}
      </div></div>`;
  }
  if (q.tipo === 'si_no') {
    return `<div class="campo" role="group" aria-labelledby="t_${q.id}">
      <label id="t_${q.id}" as="span">${esc(q.etiqueta)} ${marca}</label>${ayuda}
      <div class="opciones" data-pregunta="${q.id}" data-tipo="opcion">
        ${['Sí', 'No'].map(o => `<label><input type="radio" name="q_${q.id}"
          value="${o}" ${obliga ? 'required' : ''}><span>${o}</span></label>`).join('')}
      </div></div>`;
  }
  if (q.tipo === 'parrafo') {
    return `<div class="campo"><label for="q_${q.id}">${esc(q.etiqueta)} ${marca}</label>${ayuda}
      <textarea id="q_${q.id}" data-pregunta="${q.id}" rows="3"
        ${obliga ? 'required' : ''}></textarea></div>`;
  }
  const tipo = q.tipo === 'numero' ? 'number' : q.tipo === 'fecha' ? 'date' : 'text';
  return `<div class="campo"><label for="q_${q.id}">${esc(q.etiqueta)} ${marca}</label>${ayuda}
    <input id="q_${q.id}" data-pregunta="${q.id}" type="${tipo}"
      ${obliga ? 'required' : ''}></div>`;
}

function gracias(titulo, texto, repetido) {
  cuerpo.innerHTML = `<div class="hecho">
    <div class="marca"><span class="material-symbols-outlined" aria-hidden="true">check</span></div>
    <h1>${repetido ? 'Ya estabas en la lista' : '¡Listo!'}</h1>
    <div class="sub">${esc(texto)}</div>
    ${repetido ? `<p class="tiny muted sep">Actualizamos tus datos con lo que acabas
      de poner, pero no te apuntamos dos veces.</p>` : ''}
    <div class="demo-list sep">
      <a href="inicio.html">Ver los programas del CEM</a>
      <a href="verificar.html">Verificar un certificado</a>
    </div>
  </div>`;
}

async function arrancar() {
  if (!codigo) {
    cuerpo.innerHTML = `<h1>Falta el enlace</h1>
      <div class="sub">Esta dirección tiene que llevar el código de la lista.
        Si llegaste desde un enlace nuestro, vuelve a abrirlo; si lo copiaste a
        mano, seguramente se perdió un trozo.</div>
      <div class="demo-list"><a href="inicio.html">Ir a la portada del CEM</a></div>`;
    return;
  }

  const { data: f, error } = await sb.rpc('cem_formulario_ficha', { p_codigo: codigo });
  if (error) { cuerpo.innerHTML = aviso(esc(mensajeError(error))); return; }
  if (!f) {
    cuerpo.innerHTML = `<h1>Ese enlace no existe</h1>
      <div class="sub">No encontramos ninguna lista con ese código. Puede que se
        haya escrito mal al copiarlo.</div>
      <div class="demo-list"><a href="inicio.html">Ir a la portada del CEM</a></div>`;
    return;
  }
  document.title = `${f.titulo} | CEM International`;

  if (!f.abierto) {
    cuerpo.innerHTML = `<h1>${esc(f.titulo)}</h1>
      ${aviso(esc(f.cerrado_porque || 'Esta lista está cerrada.'), 'info')}
      <div class="demo-list sep">
        <a href="inicio.html">Ver los programas abiertos</a>
      </div>`;
    return;
  }

  const previo = recordado() || {};
  const campos = Object.entries(f.campos || {})
    .filter(([k, c]) => c && c.activo && PREDETERMINADOS[k])
    .sort((a, b) => PREDETERMINADOS[a[0]].orden - PREDETERMINADOS[b[0]].orden);

  cuerpo.innerHTML = `
    <h1>${esc(f.titulo)}</h1>
    ${f.curso ? `<div class="sub">${esc(f.curso)}</div>` : ''}
    ${f.descripcion ? `<p class="sep">${esc(f.descripcion)}</p>` : ''}
    <form id="frm" novalidate>
      <div class="campos">
        ${campos.map(([k, c]) => campoPredeterminado(k, c, previo[k])).join('')}
        ${(f.preguntas || []).map(pregunta).join('')}
      </div>
      <div id="err"></div>
      <button class="btn enviar" type="submit" id="btnEnviar">Apuntarme</button>
      <p class="tiny muted sep">Usamos tus datos sólo para avisarte de esta
        convocatoria. Nada de listas de terceros.</p>
    </form>`;

  $('#frm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#btnEnviar');
    const err = $('#err');
    err.innerHTML = '';

    const datos = {};
    for (const [k] of campos) {
      const v = ($(`#c_${k}`)?.value || '').trim();
      if (v) datos[k] = v;
    }

    /* Las respuestas se recogen por el id de la pregunta, que es lo que espera
       la función. Las de varias opciones se juntan con coma: se guardan para
       leerlas, no para operar con ellas. */
    const respuestas = {};
    for (const q of (f.preguntas || [])) {
      const grupo = document.querySelector(`[data-pregunta="${q.id}"]`);
      if (!grupo) continue;
      if (grupo.classList.contains('opciones')) {
        const marcadas = [...grupo.querySelectorAll('input:checked')].map(i => i.value);
        if (marcadas.length) respuestas[q.id] = marcadas.join(', ');
      } else {
        const v = (grupo.value || '').trim();
        if (v) respuestas[q.id] = v;
      }
    }

    /* Lo que falta, dicho de una vez y con el nombre que se lee en la pantalla.
       Antes de mandar, para no gastar un viaje al servidor en algo que ya se
       sabe aquí — pero el servidor lo vuelve a comprobar igual. */
    const faltan = [];
    for (const [k, c] of campos) {
      if (c.obligatorio && !datos[k]) faltan.push(PREDETERMINADOS[k].et);
    }
    for (const q of (f.preguntas || [])) {
      if (q.obligatoria && !respuestas[q.id]) faltan.push(q.etiqueta);
    }
    if (faltan.length) {
      err.innerHTML = aviso(`Falta${faltan.length > 1 ? 'n' : ''}: ${esc(faltan.join(', '))}.`);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Apuntando…';
    const { data, error: e2 } = await sb.rpc('cem_formulario_enviar', {
      p_codigo: codigo, p_datos: datos, p_respuestas: respuestas, p_origen: origen,
    });
    if (e2) {
      err.innerHTML = aviso(esc(mensajeError(e2)));
      btn.disabled = false;
      btn.textContent = 'Apuntarme';
      return;
    }
    recordar({ ...previo, ...datos });
    gracias(f.titulo, data?.gracias, data?.repetido);
  });
}

arrancar().catch((e) => { cuerpo.innerHTML = aviso(esc(mensajeError(e))); });
</script>
</body>
</html>
