<style>body.ini-oscura{--fondo:#050a14;--papel:#0b1426;--hueco:#101c33;--tinta:#eaf1fb;--tinta-2:#a3b3cb;--filete:rgba(148,190,255,.14);--primary:#9fc1ff;--on-primary:#06101f;--secondary:#3ee6d2;background:#050a14;color:#eaf1fb;}body.ini-clara{--fondo:#f4f7fc;--papel:#ffffff;--hueco:#edf2fa;--tinta:#0b1630;--tinta-2:#46546e;--filete:rgba(13,36,64,.1);--primary:#0d2440;--on-primary:#fff;--secondary:#087a6f;background:#f4f7fc;color:#0b1630;}::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal;}</style>

<style>
  .rec-pagina{max-width:760px;margin:0 auto;padding:var(--e2) var(--e2) var(--e5)}
  .rec-saludo{margin:var(--e3) 0}
  .rec-saludo h1{font-family:var(--n-display);font-weight:600;font-size:clamp(28px,5vw,40px);
    line-height:1.1;letter-spacing:-.01em;margin:12px 0 10px;text-wrap:balance}
  .rec-saludo p{color:var(--tinta-2);font-size:17px;line-height:1.55;margin:0;max-width:62ch}
  .rec-saludo .btn{margin-top:var(--e2)}
  .rec-bloques{display:grid;gap:var(--e3)}
  .rec-ficha-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--e2);flex-wrap:wrap}
  .rec-producto{margin:0 0 6px;font-family:var(--n-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--secondary)}
  .rec-monto{margin:0;display:flex;align-items:baseline;gap:8px}
  .rec-monto b{font-family:var(--n-display);font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1;
    font-variant-numeric:tabular-nums}
  .rec-monto span{color:var(--tinta-2);font-size:15px}
  .rec-datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--e2) var(--e3);
    margin:var(--e3) 0 0;padding-top:var(--e3);border-top:1px solid var(--filete)}
  .rec-datos dt{font-family:var(--n-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-2);margin:0 0 4px}
  .rec-datos dd{margin:0;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .rec-aviso{margin:var(--e2) 0 0;color:var(--tinta-2);font-size:14px;line-height:1.55}
  .rec-bloques h2{font-family:var(--n-display);font-weight:600;font-size:20px;margin:0 0 var(--e2)}
  .rec-cobros{list-style:none;margin:0;padding:0}
  .rec-cobros li{display:flex;align-items:center;justify-content:space-between;gap:var(--e2);padding:12px 0;
    border-bottom:1px solid var(--filete)}
  .rec-cobros li:last-child{border-bottom:0}
  .rec-cobros .mes{font-weight:600}
  .rec-cobros .cifra{font-variant-numeric:tabular-nums;color:var(--tinta-2);font-size:14px}
  .rec-cobros a{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--tinta);white-space:nowrap}
  .rec-cobros .material-symbols-outlined{font-size:18px}
  .rec-vacio{margin:0;color:var(--tinta-2);font-size:15px;line-height:1.55}
  .rec-cancelar p{margin:0 0 var(--e2);color:var(--tinta-2);font-size:15px;line-height:1.55}
  .rec-cancelar .botones{display:flex;flex-wrap:wrap;gap:var(--e1)}
  .rec-otra{margin:var(--e3) 0 0;text-align:center;font-size:15px}
  .rec-otra a{color:var(--tinta);font-weight:600}
  @media (max-width:640px){
    .rec-monto b{font-size:36px}
    .rec-cancelar .botones .btn{flex:1 1 auto}
  }
</style>

<body class="ini-portada ini-clara">
<script>try{var t=localStorage.getItem('cemPortadaTema');if(t==='clara'||t==='oscura'){document.body.classList.remove('ini-oscura','ini-clara');document.body.classList.add('ini-'+t);}}catch(e){}</script>
<header class="auth-arriba" id="autArriba">
  <a class="marca" href="../"><img src="assets/favicon.svg" alt="" width="28" height="28"> CEM International</a>
</header>
<main class="rec-pagina">
  <section class="rec-saludo" id="saludo" aria-live="polite"><span class="cargando"></span></section>
  <div class="rec-bloques" id="bloques" hidden>
    <article class="card" aria-labelledby="fProducto">
      <div class="rec-ficha-cab">
        <div><p class="rec-producto" id="fProducto"></p>
          <p class="rec-monto"><b id="fMonto"></b><span id="fAlMes"></span></p></div>
        <span id="fEstado"></span>
      </div>
      <dl class="rec-datos" id="fDatos"></dl>
      <p class="rec-aviso" id="fAviso" hidden></p>
    </article>
    <section class="card" aria-labelledby="tCobros">
      <h2 id="tCobros"></h2>
      <div id="cobros"></div>
    </section>
    <section class="card rec-cancelar" id="cancelar" aria-labelledby="tCancelar" hidden>
      <h2 id="tCancelar"></h2>
      <p id="cancelarTexto"></p>
      <div class="botones" id="cancelarBotones"></div>
      <div id="cancelarMsg"></div>
    </section>
  </div>
  <p class="rec-otra"><a id="otraEnlace" href="becas.html"></a></p>
</main>

<script type="module">
/* La ayuda recurrente de quien la paga: su estado, sus cobros con su recibo y
   cancelarla.
   ═══════════════════════════════════════════════════════════════════════════
   Llega aquí quien vuelve de darse de alta en Stripe (?s=…&gracias=1), quien
   abre el enlace de su correo (?s=…) y el equipo desde «Abrir su página».

   El enlace ES la llave: con él se ve la ayuda y se cancela. Por eso la página
   se porta como recibo.html y beca.html: no llama a mount() —ni Google, ni
   Meta, ni Cemi—, quita la llave de la barra de direcciones en cuanto la lee
   (se guarda sólo en esta pestaña) y no manda la dirección a ningún sitio
   (`referrer` no-referrer).

   El nombre con el que la ve quien la paga («Services Fee») y el monto vienen
   de la base: son los de su alta. */
import { sb, $, esc, chip, ponerBotonDeVersion, SUPABASE_URL, SUPABASE_KEY } from './assets/app.js?v=2026-11-06-2';

ponerBotonDeVersion($('#autArriba'));

const T = {
  es: {
    rotulo: 'Fondo de becas CEM', cargando: 'Cargando tu ayuda recurrente…',
    gracias: (n) => (n ? `¡Gracias, ${n}!` : '¡Gracias!'),
    graciasTexto: (p, x, correo) => `Tu ${p} quedó activo: ${x} al mes para el fondo de becas. El primer cobro por ACH tarda unos días hábiles en confirmarse, y cada mes te mandamos su recibo${correo ? ' al correo' : ''}.`,
    tuAyuda: 'Tu ayuda recurrente', tuAyudaTexto: 'Aquí ves tus cobros y sus recibos, y puedes cancelarla cuando quieras.',
    alMes: 'al mes',
    estados: { activa: ['Activa', 'ok'], impagada: ['Falta un cobro', 'warn'], cancelada: ['Cancelada', 'neutral'], iniciada: ['Confirmando el alta', 'neutral'] },
    desde: 'Desde', proximo: 'Próximo cobro', forma: 'Forma de pago', ach: 'Cuenta bancaria (ACH)', aportado: 'Aportado',
    aportadoX: (x, n) => `${x} en ${n} ${n === 1 ? 'cobro' : 'cobros'}`, canceladaEl: 'Cancelada el',
    impagadaAviso: 'El último cobro no se pudo hacer desde tu cuenta bancaria. Stripe lo volverá a intentar en unos días. Si prefieres usar otra cuenta, cancela ésta y empieza otra desde la página de becas.',
    canceladaAviso: 'Ya no se te cobra nada. Gracias por todo lo que aportaste.',
    cobros: 'Tus cobros', sinCobros: 'Todavía no hay cobros: el primero por ACH tarda unos días hábiles en confirmarse. En cuanto entre, sale aquí con su recibo.',
    verRecibo: 'Ver recibo', anulado: 'Anulado',
    cancelarTitulo: 'Cancelar', cancelarTexto: 'Si la cancelas, se cancela en Stripe al momento y no se te cobra más. Los recibos de lo que ya aportaste siguen aquí.',
    cancelar: 'Cancelar mi ayuda recurrente', seguro: '¿Seguro? No se te cobrará más.', siCancelar: 'Sí, cancelarla', noCancelar: 'No, seguir ayudando',
    cancelando: 'Cancelando…', cancelada: 'Listo: tu ayuda recurrente quedó cancelada.', noSePudo: 'No se pudo cancelar. Prueba otra vez en un momento.',
    confirmando: 'Confirmando tu alta…', confirmandoTexto: 'Stripe nos está avisando. Suele tardar unos segundos.',
    tarda: 'Tu alta se está confirmando', tardaTexto: 'Stripe todavía no nos ha avisado. Vuelve a comprobarlo en un minuto.', comprobar: 'Volver a comprobar',
    noExiste: 'No encontramos esta ayuda recurrente', noExisteTexto: 'Puede que el enlace esté incompleto: a veces el correo lo corta. Ábrelo otra vez desde el correo, o escríbenos desde la web.',
    error: 'No pudimos cargarla', errorTexto: 'Prueba otra vez en un momento.', reintentar: 'Reintentar',
    otraVez: 'Ayuda a alguien más a estudiar →',
  },
  en: {
    rotulo: 'CEM scholarship fund', cargando: 'Loading your recurring support…',
    gracias: (n) => (n ? `Thank you, ${n}!` : 'Thank you!'),
    graciasTexto: (p, x, correo) => `Your ${p} is active: ${x} a month for the scholarship fund. The first ACH charge takes a few business days to clear, and every month we send you its receipt${correo ? ' by email' : ''}.`,
    tuAyuda: 'Your recurring support', tuAyudaTexto: 'Here you can see your charges and their receipts, and cancel whenever you like.',
    alMes: 'a month',
    estados: { activa: ['Active', 'ok'], impagada: ['A charge is pending', 'warn'], cancelada: ['Canceled', 'neutral'], iniciada: ['Confirming sign-up', 'neutral'] },
    desde: 'Since', proximo: 'Next charge', forma: 'Payment method', ach: 'Bank account (ACH)', aportado: 'Given',
    aportadoX: (x, n) => `${x} in ${n} ${n === 1 ? 'charge' : 'charges'}`, canceladaEl: 'Canceled on',
    impagadaAviso: 'The last charge couldn’t be taken from your bank account. Stripe will try again in a few days. If you would rather use another account, cancel this one and start a new one from the scholarships page.',
    canceladaAviso: 'You are no longer being charged. Thank you for everything you gave.',
    cobros: 'Your charges', sinCobros: 'No charges yet: the first ACH charge takes a few business days to clear. As soon as it does, it shows up here with its receipt.',
    verRecibo: 'View receipt', anulado: 'Voided',
    cancelarTitulo: 'Cancel', cancelarTexto: 'If you cancel, it is canceled in Stripe right away and you won’t be charged again. The receipts for what you already gave stay here.',
    cancelar: 'Cancel my recurring support', seguro: 'Are you sure? You won’t be charged again.', siCancelar: 'Yes, cancel it', noCancelar: 'No, keep helping',
    cancelando: 'Canceling…', cancelada: 'Done: your recurring support has been canceled.', noSePudo: 'We couldn’t cancel it. Please try again in a moment.',
    confirmando: 'Confirming your sign-up…', confirmandoTexto: 'Stripe is letting us know. It usually takes a few seconds.',
    tarda: 'Your sign-up is being confirmed', tardaTexto: 'Stripe hasn’t let us know yet. Check again in a minute.', comprobar: 'Check again',
    noExiste: 'We couldn’t find this recurring support', noExisteTexto: 'The link may be incomplete: email apps sometimes cut it. Open it again from the email, or write to us from the website.',
    error: 'We couldn’t load it', errorTexto: 'Please try again in a moment.', reintentar: 'Try again',
    otraVez: 'Help someone else study →',
  },
};

/* La llave, fuera de la barra de direcciones en cuanto se lee. */
const pedido = new URLSearchParams(location.search);
let clave = pedido.get('s') || '';
let gracias = pedido.get('gracias') === '1';
let idiomaPedido = ['es', 'en'].includes(pedido.get('lang')) ? pedido.get('lang') : '';
if (clave) {
  try {
    sessionStorage.setItem('cemRecurrente', clave);
    sessionStorage.setItem('cemRecurrenteGracias', gracias ? '1' : '');
    sessionStorage.setItem('cemRecurrenteIdioma', idiomaPedido);
  } catch {}
  history.replaceState(null, '', location.pathname);
} else {
  try {
    clave = sessionStorage.getItem('cemRecurrente') || '';
    gracias = sessionStorage.getItem('cemRecurrenteGracias') === '1';
    idiomaPedido = sessionStorage.getItem('cemRecurrenteIdioma') || '';
  } catch {}
}

let idioma = idiomaPedido || 'es';
const t = (k, ...a) => { const v = T[idioma][k]; return typeof v === 'function' ? v(...a) : v; };
const usd = (n) => {
  const v = Number(n) || 0;
  const s = v.toLocaleString('en-US', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return '$' + (idioma === 'en' ? s : s.replace(/[.,]/g, (c) => (c === ',' ? '.' : ',')));
};
const dia = (iso) => (iso ? new Date(iso).toLocaleDateString(idioma === 'en' ? 'en-US' : 'es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) : '');
const mes = (iso) => {
  const [a, m] = String(iso || '').slice(0, 10).split('-').map(Number);
  return a ? new Date(a, m - 1, 1).toLocaleDateString(idioma === 'en' ? 'en-US' : 'es-ES', { month: 'long', year: 'numeric' }) : '';
};
const mayuscula = (x) => x.charAt(0).toUpperCase() + x.slice(1);
const pila = (n) => String(n || '').trim().split(/\s+/)[0] || '';
const espera = (ms) => new Promise((ok) => setTimeout(ok, ms));

const saludo = $('#saludo'), bloques = $('#bloques');

function ponerIdioma() {
  document.documentElement.lang = idioma;
  $('#otraEnlace').textContent = t('otraVez');
  $('#otraEnlace').href = idioma === 'en' ? 'becas.html?lang=en' : 'becas.html';
}

function pintarAviso(titulo, texto, boton) {
  bloques.hidden = true;
  saludo.innerHTML = `<p class="ini-rotulo">${esc(t('rotulo'))}</p><h1>${esc(titulo)}</h1>
    <p>${esc(texto)}</p>${boton ? `<button class="btn outline" type="button" id="bOtraVez">${esc(boton)}</button>` : ''}`;
  if (boton) $('#bOtraVez').onclick = arrancar;
}

function pintar(s) {
  document.title = `${s.producto} · CEM International`;
  saludo.innerHTML = gracias && s.estado !== 'cancelada'
    ? `<p class="ini-rotulo">${esc(t('rotulo'))}</p><h1>${esc(t('gracias', s.anonima ? '' : pila(s.nombre)))}</h1>
       <p>${esc(t('graciasTexto', s.producto, usd(s.monto), s.con_correo))}</p>`
    : `<p class="ini-rotulo">${esc(t('rotulo'))}</p><h1>${esc(t('tuAyuda'))}</h1><p>${esc(t('tuAyudaTexto'))}</p>`;

  $('#fProducto').textContent = s.producto;
  $('#fMonto').textContent = usd(s.monto);
  $('#fAlMes').textContent = t('alMes');
  $('#fEstado').innerHTML = chip(...(T[idioma].estados[s.estado] || [s.estado, 'neutral']));
  const datos = [
    [t('desde'), dia(s.desde)],
    s.cancelada_en ? [t('canceladaEl'), dia(s.cancelada_en)] : s.proximo_cobro ? [t('proximo'), dia(s.proximo_cobro)] : null,
    [t('forma'), t('ach')],
    [t('aportado'), t('aportadoX', usd(s.total), (s.cobros || []).filter((c) => c.estado === 'confirmada').length)],
  ].filter(Boolean);
  $('#fDatos').innerHTML = datos.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
  const aviso = s.estado === 'impagada' ? t('impagadaAviso') : s.estado === 'cancelada' ? t('canceladaAviso') : '';
  $('#fAviso').hidden = !aviso;
  $('#fAviso').textContent = aviso;

  $('#tCobros').textContent = t('cobros');
  const cobros = s.cobros || [];
  $('#cobros').innerHTML = cobros.length ? `<ul class="rec-cobros">${cobros.map((c) => `<li>
      <div><div class="mes">${esc(mayuscula(mes(c.periodo || c.fecha)))}</div><div class="cifra">${esc(c.numero)} · ${esc(usd(c.monto))}</div></div>
      ${c.recibo ? `<a href="recibo.html?r=${esc(encodeURIComponent(c.recibo))}"><span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>${esc(t('verRecibo'))}</a>`
        : chip(t('anulado'), 'neutral')}</li>`).join('')}</ul>`
    : `<p class="rec-vacio">${esc(t('sinCobros'))}</p>`;

  const sePuede = s.estado === 'activa' || s.estado === 'impagada' || s.estado === 'iniciada';
  $('#cancelar').hidden = !sePuede;
  if (sePuede) pintarCancelar(false);
  bloques.hidden = false;
}

/* Cancelar pide una confirmación: un toque no basta para dejar de ayudar. */
function pintarCancelar(confirmando) {
  $('#tCancelar').textContent = t('cancelarTitulo');
  $('#cancelarTexto').textContent = confirmando ? t('seguro') : t('cancelarTexto');
  $('#cancelarBotones').innerHTML = confirmando
    ? `<button class="btn danger" type="button" id="bSi">${esc(t('siCancelar'))}</button>
       <button class="btn outline" type="button" id="bNo">${esc(t('noCancelar'))}</button>`
    : `<button class="btn outline" type="button" id="bCancelar">${esc(t('cancelar'))}</button>`;
  if (!confirmando) { $('#bCancelar').onclick = () => pintarCancelar(true); return; }
  $('#bNo').onclick = () => pintarCancelar(false);
  $('#bSi').onclick = async () => {
    const boton = $('#bSi');
    boton.disabled = true; boton.textContent = t('cancelando');
    $('#cancelarMsg').innerHTML = '';
    try {
      const r = await fetch(`${SUPABASE_URL}/functions/v1/cem-donar`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
        body: JSON.stringify({ accion: 'cancelar', clave, idioma }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error(d.error || t('noSePudo'));
      gracias = false;
      try { sessionStorage.setItem('cemRecurrenteGracias', ''); } catch {}
      await arrancar();
      $('#cancelarMsg').innerHTML = '';
      saludo.querySelector('p:last-child').textContent = t('cancelada');
    } catch (e) {
      $('#cancelarMsg').innerHTML = `<p class="nota err">${esc(e.message || t('noSePudo'))}</p>`;
      boton.disabled = false; boton.textContent = t('siCancelar');
    }
  };
}

async function arrancar() {
  ponerIdioma();
  if (!clave) { pintarAviso(t('noExiste'), t('noExisteTexto')); return; }
  if (bloques.hidden) saludo.innerHTML = `<p class="ini-rotulo">${esc(t('rotulo'))}</p><h1>${esc(t('cargando'))}</h1>`;
  for (let vuelta = 0; ; vuelta++) {
    const { data: s, error } = await sb.rpc('cem_beca_recurrente_ver', { p_clave: clave });
    if (error) { pintarAviso(t('error'), t('errorTexto'), t('reintentar')); return; }
    if (!s?.hay) { pintarAviso(t('noExiste'), t('noExisteTexto')); return; }
    if (!idiomaPedido && T[s.idioma]) { idioma = s.idioma; ponerIdioma(); }
    /* Recién vuelto de Stripe, el aviso del alta puede llegar unos segundos
       después que la persona: se pregunta durante medio minuto. */
    if (s.estado !== 'iniciada' || !gracias) { pintar(s); return; }
    if (vuelta >= 11) { pintarAviso(t('tarda'), t('tardaTexto'), t('comprobar')); return; }
    saludo.innerHTML = `<p class="ini-rotulo">${esc(t('rotulo'))}</p><h1>${esc(t('confirmando'))}</h1><p>${esc(t('confirmandoTexto'))}</p>`;
    await espera(2500);
  }
}

arrancar();
</script>
</body>
</html>
