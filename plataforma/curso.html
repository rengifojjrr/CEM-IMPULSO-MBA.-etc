<title>CEM International · Detalle del curso</title>
<!-- El logotipo, para cada quien lo pida: .ico para Google y lo viejo,
     PNG para todo lo demás, SVG para quien prefiera un vector, y el de 180
     para el iPhone. Ver herramientas/iconos.mjs. -->
<link rel="icon" href="/favicon.ico?v=2026-09-03" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96.png?v=2026-09-03">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2026-09-03">
<link rel="apple-touch-icon" href="assets/icono-180.png?v=2026-09-03">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#f4f7fc">
<!-- Los cuatro servidores de fuera, avisados de golpe y no en fila.
     Sin esto el navegador descubre cada uno cuando le toca, y paga el
     DNS y el saludo TLS de cada cual por separado, con la pantalla en
     blanco mientras tanto. Ver herramientas/acelerar-cabeceras.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://vajbsfgojtunamhrzrpf.supabase.co" crossorigin>
<link rel="modulepreload" href="assets/app.js?v=2026-10-23-1">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<!-- Con el diseño de la portada desde el 22 de octubre de 2026: la versión
     clara u oscura, con sus colores desde la primera pintada (los mismos que
     PRIMERA_PINTADA en herramientas/generar-seo.mjs) y el botón del sol y la
     luna, que monta app.js en la cabecera. -->
<style>body.ini-oscura{--fondo:#050a14;--papel:#0b1426;--hueco:#101c33;--tinta:#eaf1fb;--tinta-2:#a3b3cb;--filete:rgba(148,190,255,.14);--primary:#9fc1ff;--on-primary:#06101f;--secondary:#3ee6d2;background:#050a14;color:#eaf1fb;}body.ini-clara{--fondo:#f4f7fc;--papel:#ffffff;--hueco:#edf2fa;--tinta:#0b1630;--tinta-2:#46546e;--filete:rgba(13,36,64,.1);--primary:#0d2440;--on-primary:#fff;--secondary:#087a6f;background:#f4f7fc;color:#0b1630;}::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal;}</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=2026-10-23-1">
<style>
  /* El encabezado con la portada del programa detrás.
     ─────────────────────────────────────────────────────────────────────
     Era una franja de color plano igual para los nueve programas: la ficha
     de una maestría de 2.400 € se veía idéntica a la de una masterclass de
     45. La portada va de fondo y encima un velo oscuro, porque el título
     tiene que leerse sobre CUALQUIER imagen que suban —y las que suben
     traen texto blanco, cielos claros y logotipos—. Sin portada se queda el
     degradado de siempre, que sigue estando bien. */
  .hero{background:linear-gradient(120deg,
    color-mix(in oklab, var(--primary) 88%, #000),
    color-mix(in oklab, var(--primary) 62%, var(--secondary)));
    padding:36px 0;position:relative;background-size:cover;background-position:center;
    /* Blanco fijo, NO `--on-primary`.
       ─────────────────────────────────────────────────────────────────────
       Aquí estuvo el fallo. `--on-primary` es el color que se lee sobre el
       color de marca, y en modo noche ese token vale AZUL OSCURO —porque en
       noche la marca se aclara y encima va tinta oscura—. Pero debajo de este
       encabezado no hay color de marca: hay una foto con un velo oscuro, que
       es oscuro en los dos temas. Así que en noche el título salía azul
       oscuro sobre azul oscuro y no se leía nada.
       El suelo aquí siempre es oscuro por construcción, así que la tinta
       siempre es clara. */
    color:#fff;}

  /* Y que lo hereden TODOS. Un `color` en el contenedor no llega a un hijo
     que trae el suyo, y aquí los traen el título, el precio y los iconos. */
  .hero, .hero h1, .hero p, .hero b, .hero span, .hero div{color:#fff;}
  .hero .btn, .hero .chip{color:unset;}

  /* El velo.
     ─────────────────────────────────────────────────────────────────────
     Tiene que funcionar sobre CUALQUIER foto que suban, y las que suben traen
     texto blanco, cielos claros y logotipos. Dos capas: una que oscurece
     entero —el mínimo garantizado— y otra más densa por la izquierda y por
     abajo, que es donde cae el texto. Con una sola capa, o el texto no se lee
     sobre una foto clara, o la foto desaparece bajo un gris. */
  .hero.con-foto::before{content:'';position:absolute;inset:0;
    background:
      linear-gradient(100deg, rgba(10,12,26,.93) 0%, rgba(10,12,26,.80) 42%,
                              rgba(10,12,26,.58) 100%),
      linear-gradient(0deg,   rgba(10,12,26,.55) 0%, rgba(10,12,26,.18) 60%);}
  /* Última línea de defensa: una sombra corta y densa. No se ve como sombra,
     pero despega la letra de un detalle claro que caiga justo detrás. */
  .hero.con-foto h1, .hero.con-foto .precio{text-shadow:0 1px 12px rgba(6,8,18,.8);}
  .hero .in{position:relative;}

  /* Con el diseño de la portada.
     ─────────────────────────────────────────────────────────────────────
     El degradado de arriba sale de --primary, y en la versión oscura
     --primary es azul claro: la letra blanca no se leía. Aquí el suelo es de
     noche en las dos versiones, como el cierre de la portada, con un brillo
     cian en la esquina. La foto, cuando la hay, va encima en línea y manda. */
  body.ini-portada .hero{background-color:#071224;background-image:
      radial-gradient(55% 120% at 92% 0%, rgba(62,230,210,.20), transparent 62%),
      linear-gradient(120deg, #0a1a33 0%, #0b2740 55%, #0b3a44 100%);
    border-bottom:1px solid var(--filete);}
  body.ini-portada .hero h1{font-family:var(--n-display);font-weight:600;}
  /* «Premium» era dorado claro con letra blanca: invisible en la clara. */
  body.ini-portada .hero .chip.gold{background:rgba(230,189,92,.16);color:#f3d58a;
    border:1px solid rgba(230,189,92,.4);}
  /* El botón, el de la portada. El dorado con letra blanca no llegaba al
     contraste en ninguna de las dos. */
  body.ini-portada .hero .btn{background:var(--n-boton);color:var(--n-sobre-boton);
    border-color:transparent;border-radius:12px;box-shadow:0 10px 30px -14px rgba(62,230,210,.6);}
  body.ini-portada .hero .btn span{color:inherit;}
  body.ini-portada .hero .precio{font-family:var(--n-display);font-weight:600;letter-spacing:-.02em;}

  /* El vídeo de presentación, encima del temario: es lo primero que quiere
     ver quien está decidiendo si paga. */
  .intro-curso{margin-bottom:var(--aire);}
  .intro-curso .repro{border-radius:var(--r);}
  .hero .in{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:26px;flex-wrap:wrap;align-items:center;}
  .mod-h{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;border-bottom:1px solid var(--filete);}
  .mod-h b{flex:1;}
  .les{display:flex;align-items:center;gap:10px;padding:9px 0 9px 30px;border-bottom:1px solid var(--filete);font-size:var(--t-sm);}
  .les:last-child{border-bottom:none;}
  #side h2.sec.sep-mucho{margin-top:var(--e3);}
</style>
<meta name="description" content="Ficha de un programa del CEM: temario, profesor, modalidad, precio y certificación.">
<!-- Sin texto en el HTML: lo pinta JavaScript. La versión que un
     buscador puede leer vive en /programas/, así que esta se aparta
     para no competir consigo misma con la peor de las dos. -->
<meta name="robots" content="noindex,follow">
</head>
<body class="ini-portada ini-clara">
<script>try{var t=localStorage.getItem('cemPortadaTema');if(t==='clara'||t==='oscura'){document.body.classList.remove('ini-oscura','ini-clara');document.body.classList.add('ini-'+t);}}catch(e){}</script>
<div id="page" class="hidden">
  <div class="hero" id="hero"></div>
  <main class="pub-main">
    <div class="grid dos-columnas" id="cols">
      <div>
        <!-- Antes del temario porque es lo primero que decide: dos minutos de
             alguien contándolo pesan más que una lista de módulos. -->
        <div class="intro-curso" id="introCurso" hidden></div>
        <div class="tabs" id="tabs">
          <button class="active" data-t="temario">Temario</button>
          <button data-t="profesor">Profesor</button>
          <button data-t="cert">Certificación</button>
        </div>
        <div id="panel"></div>
      </div>
      <div>
        <div class="card pegajosa" id="side" style="top:80px"></div>
      </div>
    </div>
  </main>
</div>
<script type="module">
import { sb, mount, $, $$, esc, chip, money, fdate, qs, profile, chipEstado, etiqueta } from './assets/app.js?v=2026-10-23-1';
import { crearReproductor } from './assets/reproductor.js?v=2026-10-23-1';
const me = await mount({ pub:true });
const id = qs('id');
/* `nota` va aquí y no dentro de load(): la usa render(), que es otra función, y
   declararla dentro dejaba la ficha entera en blanco con «nota is not defined». */
let curso, mods=[], cohortes=[], profe=null, miInscripcion=null, nota=null;
if (!id) location.href='catalogo.html'; else load();

async function load(){
  const { data: c } = await sb.from('cem_courses').select('*').eq('id',id).maybeSingle();
  if (!c) { document.body.innerHTML='<div class="pub-main"><div class="card">Curso no encontrado.</div></div>'; return; }
  curso = c;
  const [{data:ms},{data:cs},{data:tas},{data:notas}] = await Promise.all([
    sb.from('cem_modules').select('*,cem_lessons(id,titulo,tipo,duracion_min,orden)').eq('course_id',id).order('orden'),
    sb.from('cem_cohorts').select('*').eq('course_id',id).in('estado',['inscripciones_abiertas','en_curso','planificada']).order('fecha_inicio'),
    sb.from('cem_teacher_assignments').select('teacher_id,cem_profiles(nombre,apellido,bio,avatar_url)').eq('course_id',id).limit(1),
      /* La nota de quienes ya lo hicieron. Es lo que más pesa a la hora de
       decidir, así que va arriba, al lado del precio. */
    sb.rpc('cem_valoracion_cursos', { p_minimo: 5 }),
  ]);
  nota = (notas || {})[id] || null;
  mods = ms||[]; cohortes = cs||[]; profe = tas?.[0]?.cem_profiles || null;
  if (me) {
    const { data: e } = await sb.from('cem_enrollments').select('id,estado').eq('profile_id',me.id).eq('course_id',id).maybeSingle();
    miInscripcion = e;
  }
  render();
}

function render(){
  const horas = mods.reduce((a,m)=>a+(m.cem_lessons||[]).reduce((x,l)=>x+(l.duracion_min||0),0),0);
  const heroEl = $('#hero');
  if (curso.imagen_url){
    heroEl.classList.add('con-foto');
    heroEl.style.backgroundImage = `url("${curso.imagen_url.replace(/"/g, '%22')}")`;
  }
  $('#hero').innerHTML = `<div class="in">
    <div style="flex:2;min-width:280px">
      ${curso.destacado?'<span class="chip gold">Premium</span>':''}
      <h1 style="font-size:29px;margin:10px 0 6px">${esc(curso.nombre)}</h1>
      <p style="opacity:.85;margin:0 0 14px">${esc(curso.subtitulo||curso.descripcion_corta||'')}</p>
      <div class="row" style="gap:16px;font-size:13px;opacity:.9">
        <span><span class="material-symbols-outlined">calendar_today</span> ${esc(curso.duracion_texto||curso.horas+' horas')}</span>
        <span><span class="material-symbols-outlined">language</span> ${esc(etiqueta(curso.modalidad||''))}</span>
        <span><span class="material-symbols-outlined">signal_cellular_alt</span> ${esc(etiqueta(curso.nivel||''))}</span>
        ${nota ? `<span title="Media de claridad, utilidad y ritmo">
          <span class="material-symbols-outlined">star</span>
          <b>${String(nota.nota).replace('.', ',')}</b> · ${nota.respuestas} respuestas</span>` : ''}
      </div>
    </div>
    <div style="flex:1;min-width:220px;text-align:right">
      <div class="precio" style="font-size:34px;font-weight:700">${money(curso.precio, curso.moneda)}</div>
      ${/* A dónde lleva el botón según quién mira.
            ─────────────────────────────────────────────────────────────────
            Antes llevaba SIEMPRE a estudiante/inscripcion.html, que exige
            sesión. Para quien ya entró está bien; para un visitante era un
            rebote al login: tenía que registrarse, confirmar el correo y
            volver a buscar el programa antes de poder pagar. Cuatro paradas
            entre decidir comprar y comprar, y cada parada es gente que se cae.

            Ahora quien no ha entrado va a comprar.html: nombre, correo y a la
            pasarela. La cuenta se crea cuando el pago entra. */''}
      ${miInscripcion
        ? `<a class="btn gold" href="estudiante/panel.html" style="margin-top:10px">Ya estás inscrito · Ir a mi panel</a>`
        : me
          ? `<a class="btn gold" href="estudiante/inscripcion.html?curso=${curso.id}" style="margin-top:10px">Inscribirme <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></a>`
          : `<a class="btn gold" href="comprar.html?curso=${curso.id}" style="margin-top:10px">Inscribirme <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></a>`}
    </div></div>`;

  /* Se monta con el reproductor de la casa, igual que el aula: aquí todavía
     no hay sesión, así que la marca de agua va sin nombre — no hay a quién
     nombrar y poner «invitado» encima del vídeo sólo estorba. */
  const hueco = $('#introCurso');
  if (curso.video_intro && hueco){
    hueco.hidden = false;
    crearReproductor(hueco, { videoId: curso.video_intro, marca: '' });
  }

  tab('temario');
  $('#side').innerHTML = `
    <h2 class="sec">Este programa incluye</h2>
    <div class="stack tiny">
      <div class="row"><span class="material-symbols-outlined">play_circle</span> ${mods.reduce((a,m)=>a+(m.cem_lessons||[]).length,0)} lecciones</div>
      <div class="row"><span class="material-symbols-outlined">schedule</span> ${Math.round(horas/60)} horas de contenido</div>
      <div class="row"><span class="material-symbols-outlined">workspace_premium</span> ${esc(curso.certificado_nombre||'Certificado oficial')}</div>
      <div class="row"><span class="material-symbols-outlined">all_inclusive</span> Acceso durante todo el programa</div>
      <div class="row"><span class="material-symbols-outlined">groups</span> Clases con cohorte y profesor</div>
    </div>
    <h2 class="sec sep-mucho">Cohortes disponibles</h2>
    ${cohortes.length? cohortes.map(c=>`<div class="list-item"><div class="grow">
        <div class="t">${esc(c.nombre)}</div>
        <div class="s">${c.fecha_inicio?'Inicia '+fdate(c.fecha_inicio):'Fecha por definir'} · ${esc(c.horario||'')}</div></div>
      ${chipEstado(c.estado)}</div>`).join('') : '<p class="muted tiny">Próximamente nuevas cohortes.</p>'}`;
}

$$('#tabs button').forEach(b=>b.onclick=()=>{ $$('#tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); tab(b.dataset.t); });

function tab(t){
  const P=$('#panel');
  if (t==='temario'){
    P.innerHTML = `<div class="card">
      <h2 class="sec">Contenido del programa</h2>
      ${mods.length? mods.map((m,i)=>`
        <div><div class="mod-h" data-m="${i}">
          <span class="material-symbols-outlined">folder</span><b>${esc(m.titulo)}</b>
          <span class="tiny muted">${(m.cem_lessons||[]).length} lecciones</span>
          <span class="material-symbols-outlined" data-ic="${i}">expand_more</span></div>
          <div data-body="${i}" class="hidden">${(m.cem_lessons||[]).sort((a,b)=>a.orden-b.orden).map(l=>`
            <div class="les"><span class="material-symbols-outlined" style="font-size:17px;color:var(--on-surface-variant)">
              ${l.tipo==='video'?'play_circle':l.tipo==='pdf'?'description':l.tipo==='quiz'?'quiz':'article'}</span>
              <span class="crece">${esc(l.titulo)}</span>
              <span class="tiny muted">${l.duracion_min||0} min</span></div>`).join('')}</div></div>`).join('')
        : '<p class="muted tiny">El temario se publicará próximamente.</p>'}
      ${curso.descripcion? `<div class="sep-mucho"><h2 class="sec">Descripción</h2><p class="muted">${esc(curso.descripcion)}</p></div>`:''}
    </div>`;
    $$('[data-m]').forEach(h=>h.onclick=()=>{
      const i=h.dataset.m, b=$(`[data-body="${i}"]`), ic=$(`[data-ic="${i}"]`);
      b.classList.toggle('hidden'); ic.textContent = b.classList.contains('hidden')?'expand_more':'expand_less';
    });
    const first = $('[data-body="0"]'); if (first){ first.classList.remove('hidden'); $('[data-ic="0"]').textContent='expand_less'; }
  }
  if (t==='profesor'){
    P.innerHTML = `<div class="card">${profe? `
      <div class="row" style="gap:16px;align-items:flex-start">
        <span class="avatar lg">${esc((profe.nombre||'?')[0])}</span>
        <div><h3 style="margin:0 0 4px">${esc(profe.nombre)} ${esc(profe.apellido||'')}</h3>
          <div class="tiny muted">Docente titular · CEM International</div>
          <p class="muted sep">${esc(profe.bio||'Profesional con amplia trayectoria internacional en el área del programa, responsable de las sesiones en vivo y del acompañamiento académico de la cohorte.')}</p>
        </div></div>` : '<p class="muted tiny">El equipo docente se anunciará próximamente.</p>'}</div>`;
  }
  if (t==='cert'){
    P.innerHTML = `<div class="card">
      <div class="row" style="gap:14px;align-items:flex-start">
        <span class="material-symbols-outlined" style="font-size:40px;color:var(--tertiary-container)">workspace_premium</span>
        <div><h3 style="margin:0 0 6px">${esc(curso.certificado_nombre||'Certificado oficial CEM')}</h3>
        <p class="muted sin-margen">Al completar el programa y aprobar las evaluaciones recibirás un certificado
        digital con código único y código QR de verificación pública, emitido por CEM International Education.</p></div>
      </div>
      <div class="stack tiny sep-mucho">
        <div class="row"><span class="material-symbols-outlined">check_circle</span> Verificación pública en línea</div>
        <div class="row"><span class="material-symbols-outlined">check_circle</span> Descarga en PDF</div>
        <div class="row"><span class="material-symbols-outlined">check_circle</span> Insignias digitales por competencias</div>
      </div></div>`;
  }
}
</script>
</body>
</html>
