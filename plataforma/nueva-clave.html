<!doctype html>
<html lang="es" data-publico="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEM International · Nueva contraseña</title>
<!-- El logotipo, para cada quien lo pida: .ico para Google y lo viejo,
     PNG para todo lo demás, SVG para quien prefiera un vector, y el de 180
     para el iPhone. Ver herramientas/iconos.mjs. -->
<link rel="icon" href="/favicon.ico?v=2026-09-03" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96.png?v=2026-09-03">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2026-09-03">
<link rel="apple-touch-icon" href="assets/icono-180.png?v=2026-09-03">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0d2440">
<!-- Los cuatro servidores de fuera, avisados de golpe y no en fila.
     Sin esto el navegador descubre cada uno cuando le toca, y paga el
     DNS y el saludo TLS de cada cual por separado, con la pantalla en
     blanco mientras tanto. Ver herramientas/acelerar-cabeceras.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://vajbsfgojtunamhrzrpf.supabase.co" crossorigin>
<link rel="modulepreload" href="assets/app.js?v=2026-09-03">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=2026-09-03">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" id="card">
    <div class="brand-badge"><span class="material-symbols-outlined">lock_reset</span></div>
    <h1>Define tu contraseña</h1>
    <div class="sub" id="sub">Comprobando el enlace…</div>

    <form id="form" class="hidden">
      <div class="field"><label for="p1">Contraseña nueva</label>
        <input type="password" id="p1" required minlength="8" autocomplete="new-password"></div>
      <div class="field"><label for="p2">Repítela</label>
        <input type="password" id="p2" required minlength="8" autocomplete="new-password"></div>
      <div class="medida-clave" id="fuerza" aria-live="polite"></div>
      <button class="btn block" type="submit">Guardar y entrar
        <span class="material-symbols-outlined" aria-hidden="true">check</span></button>
    </form>

    <div id="msg"></div>
    <div style="margin-top:14px;text-align:center">
      <a class="btn ghost sm" href="index.html">Volver a la entrada</a>
    </div>
  </div>
</div>

<script type="module">
import { sb, $, esc, mensajeError, homeForRoot,
         medidorDeClave } from './assets/app.js?v=2026-09-03';

const msg = $('#msg'), sub = $('#sub'), form = $('#form');
const aviso = (t, clase = 'err') =>
  msg.innerHTML = `<div class="nota ${clase} sep">${esc(t)}</div>`;

/* El enlace del correo trae el token en el fragmento (#access_token=…) o como
   ?code=… según el tipo de flujo. La librería lo canjea sola al arrancar y
   deja una sesión de recuperación: si no hay sesión, el enlace no sirve. */
async function comprobarEnlace() {
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('error_description')) {
    sub.textContent = 'El enlace ya no sirve.';
    aviso(hash.get('error_description').replace(/\+/g, ' '));
    return false;
  }
  const codigo = new URLSearchParams(location.search).get('code');
  if (codigo) {
    const { error } = await sb.auth.exchangeCodeForSession(codigo);
    if (error) { sub.textContent = 'El enlace ya no sirve.'; aviso(mensajeError(error)); return false; }
  }
  // Da un respiro a que la librería procese el fragmento antes de preguntar.
  for (let i = 0; i < 12; i++) {
    const { data: { session } } = await sb.auth.getSession();
    if (session) return true;
    await new Promise(r => setTimeout(r, 250));
  }
  return false;
}

(async () => {
  if (!(await comprobarEnlace())) {
    if (!msg.innerHTML) {
      sub.textContent = 'Este enlace no es válido o ya caducó.';
      aviso('Pide uno nuevo desde "Olvidé mi contraseña" en la pantalla de entrada.');
    }
    return;
  }
  const { data: { user } } = await sb.auth.getUser();
  sub.innerHTML = `Estás cambiando la contraseña de <b>${esc(user?.email || 'tu cuenta')}</b>.`;
  form.classList.remove('hidden');
  $('#p1').focus();
})();

/* El medidor y la comprobación de que las dos coinciden viven en app.js: los
   piden esta pantalla y el registro, y con dos copias basta un descuido para que
   una exija ocho caracteres y la otra seis. */
const claveLista = medidorDeClave({ clave: '#p1', repetir: '#p2', donde: '#fuerza' });

form.onsubmit = async (e) => {
  e.preventDefault();
  msg.innerHTML = '';
  const p1 = $('#p1').value;
  const problema = claveLista();
  if (problema) { aviso(problema); return; }

  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { btn.disabled = false; aviso(mensajeError(error, 'No se pudo guardar la contraseña.')); return; }

  aviso('Contraseña actualizada. Entrando…', 'ok');
  const { data } = await sb.rpc('cem_my_profile');
  const perfil = Array.isArray(data) ? data[0] : data;
  setTimeout(() => {
    location.href = (perfil && perfil.id) ? homeForRoot(perfil.rol) : 'index.html';
  }, 900);
};
</script>
</body>
</html>
