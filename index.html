<head>

<title>CEM · Centro de Estudios de Marketing</title>
<link rel="icon" href="plataforma/assets/favicon.svg" type="image/svg+xml">
<meta name="description" content="Formación en marketing, negocios, IA y tecnología. Programas con certificado verificable.">

<!-- La puerta de escuelacem.com.
     ═══════════════════════════════════════════════════════════════════════
     Quien escribe el dominio a secas viene a ver la escuela, así que aquí no
     hay nada que leer: se pasa de largo hacia la portada.

     Antes en esta dirección vivía el tablero de proyectos, que se quedó en la
     raíz de cuando esto era un repositorio de herramientas sueltas. Al conectar
     el dominio, la primera página que veía cualquiera era una gestión de tareas
     vacía. El tablero sigue existiendo, ahora en `proyectos.html`.

     Y por eso esto no es un `meta refresh` a secas: los tableros se guardan
     como `escuelacem.com/?p=<identificador>` —el propio tablero dice «guarda
     esta URL, es tu acceso directo»—, así que mandar todo a la portada
     rompería cada enlace guardado. Si viene un `?p=`, se reenvía al tablero
     con su identificador intacto. -->

<script>
  (function () {
    var busca = location.search || '';
    var esTablero = /[?&]p=/.test(busca);
    /* `replace` y no `href`: así el botón de volver del navegador lleva a donde
       la persona estaba antes, y no otra vez a esta página, que la devolvería
       hacia adelante en un bucle. */
    location.replace(esTablero ? 'proyectos.html' + busca
                               : 'plataforma/inicio.html');
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=plataforma/inicio.html"></noscript>

<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;

  a{color:#1b7f76;}
  @media (prefers-color-scheme:dark){ body{background:#111417;color:#e6e8ea;} }
</style>
</head>
<body>
  <!-- Sólo se ve si el reenvío no ocurre: sin guion y con el `refresh`
       desactivado, o si algo falla. Un enlace es mejor que una página en
       blanco. -->
  <p>Estamos llevándote a la portada del CEM.<br>
    Si no ocurre solo, <a href="plataforma/inicio.html">entra aquí</a>.</p>
</body>
