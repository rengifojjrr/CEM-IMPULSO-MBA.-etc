<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generar Certificados · CEM</title>
<!-- El logotipo, para cada quien lo pida: .ico para Google y lo viejo,
     PNG para todo lo demás, SVG para quien prefiera un vector, y el de 180
     para el iPhone. Ver herramientas/iconos.mjs. -->
<link rel="icon" href="/favicon.ico?v=2026-09-03" sizes="32x32">
<link rel="icon" type="image/png" sizes="96x96" href="../plataforma/assets/favicon-96.png?v=2026-09-03">
<link rel="icon" type="image/svg+xml" href="../plataforma/assets/favicon.svg?v=2026-09-03">
<link rel="apple-touch-icon" href="../plataforma/assets/icono-180.png?v=2026-09-03">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=EB+Garamond:wght@400;700&family=Merriweather:wght@400;700&family=Lora:wght@400;700&family=PT+Serif:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Cinzel:wght@400;700&family=Marcellus&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Raleway:wght@400;700&family=Poppins:wght@400;700&family=Roboto+Slab:wght@400;700&family=Great+Vibes&family=Dancing+Script&family=Pacifico&family=Sacramento&family=Alex+Brush&family=Allura&family=Parisienne&family=UnifrakturMaguntia&family=UnifrakturCook:wght@700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  /* Esta página se abre fuera del portal, así que la hoja compartida no está y
     con ella no están sus colores. El motor los pide por su nombre del portal
     (--fondo, --papel, --primary…), de modo que basta con declararlos aquí para
     que la herramienta suelta se vea igual que dentro — y cambie de día a noche
     como el resto. Lo demás (body, header, main) ya lo pone el motor: repetirlo
     era lo que hacía falta cambiar dos veces cada vez. */
  :root{
    --fondo:#f4f6f8; --papel:#ffffff; --hueco:#eef0f3;
    --filete:#dde3ea; --filete-fuerte:#c2c8d0;
    --tinta:#1f2937; --tinta-2:#6b7280;
    --primary:#132743; --on-primary:#ffffff;
    --secondary:#1b7f76; --secondary-container:#d6f2ee;
    --gold:#c9a227;    --on-gold:#20200a;
    --ok:#065f46;      --ok-suave:#e7f7f0;
    --warn:#92400e;    --warn-suave:#fef3c7;
    --error:#b91c1c;   --error-suave:#fdecec;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --fondo:#111418; --papel:#181b20; --hueco:#212630;
      --filete:#2a2f38; --filete-fuerte:#3d4450;
      --tinta:#e9ecef; --tinta-2:#a6adb8;
      --primary:#a9c6ec; --on-primary:#0d2440;
      --secondary:#5ecfc2; --secondary-container:#12332f;
      --gold:#d9b154;    --on-gold:#231a04;
      --ok:#6cc98a;      --ok-suave:#122a1a;
      --warn:#e0a955;    --warn-suave:#332612;
      --error:#f08a86;   --error-suave:#331a1a;
      color-scheme:dark;
    }
  }
</style>
</head>
<body>
<header>
  <h1>CEM · Generador de Certificados</h1>
  <p>Digitalización de certificados de graduación — desde datos de Google Sheets/Excel hasta PDF verificable con QR.</p>
</header>
<main id="host"></main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script type="module">
/* Esta página es un envoltorio: el motor del generador vive en generador.js y
   lo comparte con la pantalla equivalente del portal institucional. */
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { montarGenerador, ESTILOS_GENERADOR } from './generador.js?v=2026-09-03-7';

const SUPABASE_URL = 'https://vajbsfgojtunamhrzrpf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Xljd7Ep1GxBXSPp5F4A1hg_Qg-iESzl';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* Esta pantalla emite documentos oficiales: pide cuenta.
   Hasta hace poco funcionaba sin entrar, y con eso cualquiera que diera con la
   dirección podía emitir un certificado a nombre de quien quisiera, revocar el
   de un graduado real o leer los datos de todos los emitidos. El servidor ya no
   lo permite; aquí se avisa con claridad en vez de dejar que la pantalla se
   llene de errores de permiso.

   La sesión es la misma del portal: si ya entraste allí, esto abre directo. */
const { data: { session } } = await supabase.auth.getSession();

if (!session) {
  document.getElementById('host').innerHTML = `
    <div style="max-width:560px;margin:40px auto;background:var(--papel);
                border:1px solid var(--filete);border-radius:12px;padding:26px 24px;">
      <h2 style="margin:0 0 8px;font-size:19px;color:var(--primary);">Hay que entrar para usar el generador</h2>
      <p style="margin:0 0 6px;color:var(--tinta);line-height:1.6;">
        Desde aquí se emiten certificados que después cualquiera puede verificar por su
        código QR. Por eso la herramienta pide una cuenta del equipo.</p>
      <p style="margin:0 0 18px;color:var(--tinta-2);font-size:13.5px;line-height:1.6;">
        Si ya entraste al portal en este navegador, vuelve a cargar esta página y abrirá sola.</p>
      <a href="../plataforma/index.html?next=admin%2Fcertificados-plantillas.html"
         style="display:inline-block;background:var(--primary);color:var(--on-primary);
                text-decoration:none;padding:11px 20px;border-radius:8px;font-weight:600;">Entrar</a>
      <p style="margin:18px 0 0;color:var(--tinta-2);font-size:13px;">
        Para verificar un certificado que ya tienes no hace falta cuenta:
        <a href="verificar.html" style="color:var(--secondary);">verificar un certificado</a>.</p>
    </div>`;
} else {
  document.head.insertAdjacentHTML('beforeend', '<style>' + ESTILOS_GENERADOR + '</style>');
  montarGenerador({ supabase, contenedor: document.getElementById('host'), rutaVerificar: 'verificar.html' });
}
</script>
</body>
</html>
