<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=EB+Garamond:wght@400;700&family=Merriweather:wght@400;700&family=Lora:wght@400;700&family=PT+Serif:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Cinzel:wght@400;700&family=Marcellus&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Raleway:wght@400;700&family=Poppins:wght@400;700&family=Roboto+Slab:wght@400;700&family=Great+Vibes&family=Dancing+Script&family=Pacifico&family=Sacramento&family=Alex+Brush&family=Allura&family=Parisienne&family=UnifrakturMaguntia&family=UnifrakturCook:wght@700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132743; --navy-2:#1c3a5e; --teal:#1b7f76; --gold:#c9a227;
    --bg:#f4f6f8; --card:#ffffff; --border:#dde3ea; --text:#1f2937; --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--navy);color:#fff;padding:14px 18px;}
  header h1{font-size:16px;margin:0;}
  header p{margin:4px 0 0;font-size:12.5px;color:#cfe0ea;}
  main{max-width:1150px;margin:0 auto;padding:20px 16px 60px;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
  .panel h2{margin-top:0;font-size:15px;color:var(--navy);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .panel-head h2{margin:0;flex:1 1 auto;min-width:0;}
  .panel-head .btn{flex:0 0 auto;}
  .panel-body.collapsed{display:none;}
